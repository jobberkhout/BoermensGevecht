<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -6 126 92" data-rig="static">
  <title>De vlag van de straat: een theeglas en een trouwlint</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; fill: none; }
  </style>
  <!-- Tile blue, a golden tea glass on its saucer, and a wedding ribbon across the corner: the flag of the street,
       of no country. It has no direction, so it mirrors without help. Cut into the same eight strips as the other flags. -->
  <defs>
    <clipPath id="strip"><rect x="0" y="-1" width="16.2" height="82"/></clipPath>
    <g id="flag">
      <rect width="120" height="80" fill="#2c6aa0"/>
      <path fill="none" stroke="#4a86ba" stroke-width="1" d="M0 20 H120 M0 40 H120 M0 60 H120 M20 0 V80 M40 0 V80 M60 0 V80 M80 0 V80 M100 0 V80"/>
      <g fill="#7aaad3"><circle cx="20" cy="20" r="1.8"/><circle cx="40" cy="20" r="1.8"/><circle cx="60" cy="20" r="1.8"/><circle cx="80" cy="20" r="1.8"/><circle cx="100" cy="20" r="1.8"/><circle cx="20" cy="40" r="1.8"/><circle cx="40" cy="40" r="1.8"/><circle cx="80" cy="40" r="1.8"/><circle cx="100" cy="40" r="1.8"/><circle cx="20" cy="60" r="1.8"/><circle cx="40" cy="60" r="1.8"/><circle cx="80" cy="60" r="1.8"/><circle cx="100" cy="60" r="1.8"/></g>
      <!-- The wedding ribbon across the corner at the pole, with a knot. -->
      <path fill="#fbf8f1" stroke="#d9d2c4" stroke-width="1" d="M0 17 L17 0 L31 0 L0 31 Z"/>
      <path fill="none" stroke="#e6dfd2" stroke-width="1" d="M0 21 L21 0 M0 27 L27 0"/>
      <path fill="#fbf8f1" stroke="#d9d2c4" stroke-width="1" stroke-linejoin="round" d="M12 13 Q6 8 8 3 Q13 4 15 11 Z M17 16 Q22 22 27 20 Q26 15 19 13 Z"/>
      <circle cx="15.5" cy="14.5" r="3" fill="#fbf8f1" stroke="#d9d2c4" stroke-width="1"/>
      <!-- A tulip tea glass on its saucer, in gold. -->
      <path fill="none" stroke="#f4ead8" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round" d="M60 18 Q57 14 60 10 Q63 6 60 2 M68 18 Q65 14 68 10 Q71 7 69 3"/>
      <ellipse cx="64" cy="61" rx="21" ry="5" fill="#c9951a"/>
      <ellipse cx="64" cy="59.5" rx="21" ry="4.6" fill="#e6b422"/>
      <ellipse cx="64" cy="59" rx="9" ry="2" fill="#c9951a"/>
      <path fill="#b2451b" d="M55 26 L73 26 Q72.5 35 67.8 42 Q70.4 46 70.4 51 Q70 57 64 57.2 Q58 57 57.6 51 Q57.6 46 60.2 42 Q55.5 35 55 26 Z"/>
      <path fill="#d9692c" d="M57 28 L60.5 28 Q61 35 62 40 Q58.5 36 57 28 Z"/>
      <path fill="none" stroke="#f2c53d" stroke-width="2.2" stroke-linejoin="round" d="M53.5 22 Q54.5 34 60 42 Q57 46 57 51 Q57.5 57.5 64 58 Q70.5 57.5 71 51 Q71 46 68 42 Q73.5 34 74.5 22"/>
      <path fill="none" stroke="#f2c53d" stroke-width="2.6" stroke-linecap="round" d="M52.5 22 L75.5 22"/>
      <path fill="#fff6dc" fill-opacity="0.55" d="M66.5 45 Q69 48 68.6 53 L67.2 53 Q67 48 65.6 45 Z"/>
    </g>
  </defs>

  <g id="s0" transform="translate(0 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="0"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80 M0 0 L0 80"/>
  </g>
  <g id="s1" transform="translate(15 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-15"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s2" transform="translate(30 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-30"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s3" transform="translate(45 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-45"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s4" transform="translate(60 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-60"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s5" transform="translate(75 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-75"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s6" transform="translate(90 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-90"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s7" transform="translate(105 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-105"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80 M15 0 L15 80"/>
  </g>
</svg>
