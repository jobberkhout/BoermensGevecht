<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -6 126 92" data-rig="static">
  <title>Huisvlag van Krijtstreep &amp; Zn., voor de rechterkant van het veld</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; fill: none; }
  </style>
  <!-- Navy pinstripe, and a gold line that only goes up. Cut into the same eight strips as the other flags. -->
  <defs>
    <clipPath id="strip"><rect x="0" y="-1" width="16.2" height="82"/></clipPath>
    <g id="flag">
      <!-- The same design, drawn in mirror image: the game mirrors everything on the right-hand side, and this flag has to read the same there. -->
      <g transform="translate(120 0) scale(-1 1)">
        <rect width="120" height="80" fill="#1f2f55"/>
        <path fill="none" stroke="#5f74a6" stroke-width="1.1" d="M3.75 0 V80 M11.25 0 V80 M18.75 0 V80 M26.25 0 V80 M33.75 0 V80 M41.25 0 V80 M48.75 0 V80 M56.25 0 V80 M63.75 0 V80 M71.25 0 V80 M78.75 0 V80 M86.25 0 V80 M93.75 0 V80 M101.25 0 V80 M108.75 0 V80 M116.25 0 V80"/>
        <path fill="none" stroke="#e6b422" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M9 70 L26 62 L40 55 L56 44 L70 38 L86 24 L100 13.8"/>
        <path fill="#e6b422" stroke="#e6b422" stroke-width="2" stroke-linejoin="round" d="M110 6.4 L104.4 19.4 L96 7.8 Z"/>
      </g>
    </g>
  </defs>

  <g id="s0" transform="translate(0 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="0"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80 M0 0 L0 80"/>
  </g>
  <g id="s1" transform="translate(15 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-15"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s2" transform="translate(30 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-30"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s3" transform="translate(45 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-45"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s4" transform="translate(60 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-60"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s5" transform="translate(75 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-75"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s6" transform="translate(90 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-90"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80"/>
  </g>
  <g id="s7" transform="translate(105 0)">
    <g clip-path="url(#strip)"><use href="#flag" x="-105"/></g>
    <path class="o" d="M0 0 L15 0 M0 80 L15 80 M15 0 L15 80"/>
  </g>
</svg>
