<svg xmlns="http://www.w3.org/2000/svg" viewBox="-86 -128 176 134" data-rig="vehicle">
  <title>De Fatbike</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .tube { stroke: #2b1b16; stroke-width: 9; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .frame { stroke: #3a3a42; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; fill: none; }
  </style>

  <g id="chassis" transform="translate(0 0)"/>

  <!-- His far arm, reaching for the bar. The only hand on it. Joint at the far shoulder. -->
  <g id="arm_back" data-parent="rider" transform="translate(-19 -87)">
    <g transform="translate(19 87)">
      <path class="o" fill="#b9c1cc" d="M-23 -90 Q-14 -92 -4 -86 L19 -84 L19 -76 L-5 -77 Q-17 -80 -23 -84 Z"/>
      <circle class="o" fill="#a9734f" cx="21" cy="-80" r="4.4"/>
    </g>
  </g>

  <!-- Tyres as fat as a sofa cushion. -->
  <g id="wheel_back" data-parent="chassis" transform="translate(-48 -21)">
    <circle class="o" fill="#2a2a2e" cx="0" cy="0" r="21"/>
    <path class="n" fill="#44444c" d="M-3 -20.5 L3 -20.5 L3 -17.5 L-3 -17.5 Z M-3 17.5 L3 17.5 L3 20.5 L-3 20.5 Z M-20.5 -3 L-17.5 -3 L-17.5 3 L-20.5 3 Z M17.5 -3 L20.5 -3 L20.5 3 L17.5 3 Z M10.5 -16 L14.8 -12 L12.6 -10 L8.6 -14 Z M-14.8 12 L-10.5 16 L-8.6 14 L-12.6 10 Z M-14.8 -12 L-10.5 -16 L-8.6 -14 L-12.6 -10 Z M10.5 16 L14.8 12 L12.6 10 L8.6 14 Z"/>
    <circle class="o" style="stroke-width:2" fill="#8a9096" cx="0" cy="0" r="11.5"/>
    <circle class="n" fill="#5f656b" cx="0" cy="0" r="8"/>
    <path class="t" style="stroke:#c3c8cc;stroke-width:1.4" d="M0 -8 L0 8 M-8 0 L8 0 M-5.6 -5.6 L5.6 5.6 M-5.6 5.6 L5.6 -5.6"/>
    <circle class="o" style="stroke-width:1.8" fill="#6fd0ae" cx="0" cy="0" r="3.4"/>
  </g>

  <g id="wheel_front" data-parent="chassis" transform="translate(50 -21)">
    <circle class="o" fill="#2a2a2e" cx="0" cy="0" r="21"/>
    <path class="n" fill="#44444c" d="M-3 -20.5 L3 -20.5 L3 -17.5 L-3 -17.5 Z M-3 17.5 L3 17.5 L3 20.5 L-3 20.5 Z M-20.5 -3 L-17.5 -3 L-17.5 3 L-20.5 3 Z M17.5 -3 L20.5 -3 L20.5 3 L17.5 3 Z M10.5 -16 L14.8 -12 L12.6 -10 L8.6 -14 Z M-14.8 12 L-10.5 16 L-8.6 14 L-12.6 10 Z M-14.8 -12 L-10.5 -16 L-8.6 -14 L-12.6 -10 Z M10.5 16 L14.8 12 L12.6 10 L8.6 14 Z"/>
    <circle class="o" style="stroke-width:2" fill="#8a9096" cx="0" cy="0" r="11.5"/>
    <circle class="n" fill="#5f656b" cx="0" cy="0" r="8"/>
    <path class="t" style="stroke:#c3c8cc;stroke-width:1.4" d="M0 -8 L0 8 M-8 0 L8 0 M-5.6 -5.6 L5.6 5.6 M-5.6 5.6 L5.6 -5.6"/>
    <circle class="o" style="stroke-width:1.8" fill="#6fd0ae" cx="0" cy="0" r="3.4"/>
  </g>

  <!-- The bike: a black frame, a battery the size of a lunchbox, a bench of a saddle. Joint in the middle. -->
  <g id="body" data-parent="chassis" transform="translate(0 -40)">
    <g transform="translate(0 40)">
      <!-- mudguards -->
      <path fill="none" stroke="#2b1b16" stroke-width="6.5" stroke-linecap="round" d="M-74 -26 Q-68 -48 -46 -48 Q-30 -47 -24 -38"/>
      <path fill="none" stroke="#3a3a42" stroke-width="3" stroke-linecap="round" d="M-74 -26 Q-68 -48 -46 -48 Q-30 -47 -24 -38"/>
      <path fill="none" stroke="#2b1b16" stroke-width="6.5" stroke-linecap="round" d="M34 -38 Q42 -48 54 -47 Q70 -44 74 -28"/>
      <path fill="none" stroke="#3a3a42" stroke-width="3" stroke-linecap="round" d="M34 -38 Q42 -48 54 -47 Q70 -44 74 -28"/>
      <!-- frame tubes -->
      <path class="tube" d="M-48 -21 L-2 -24 L-16 -52 L-48 -21 M-2 -24 L34 -54 M34 -54 L50 -21 M32 -60 L36 -46"/>
      <path class="frame" d="M-48 -21 L-2 -24 L-16 -52 L-48 -21 M-2 -24 L34 -54 M34 -54 L50 -21 M32 -60 L36 -46"/>
      <!-- the battery on the down tube, with its charge lights -->
      <path class="o" fill="#2f2f36" d="M2 -30 L29 -53 L36 -45 L9 -22 Z"/>
      <path class="n" fill="#6fd0ae" d="M7 -29 L28 -47 L30 -45 L9 -27 Z"/>
      <circle class="n" fill="#7dff9a" cx="13" cy="-31" r="1.2"/>
      <circle class="n" fill="#7dff9a" cx="16.5" cy="-34" r="1.2"/>
      <circle class="n" fill="#7dff9a" cx="20" cy="-37" r="1.2"/>
      <!-- the crank and the pedal he does not use much -->
      <circle class="o" fill="#5f656b" cx="-2" cy="-24" r="5.5"/>
      <path class="t" style="stroke-width:3" d="M-2 -24 L2 -15"/>
      <rect class="o" fill="#2a2a2e" x="-3" y="-15.5" width="10" height="3.4" rx="1.4"/>
      <!-- seat post and the long bench saddle -->
      <path class="t" style="stroke-width:4" d="M-16 -52 L-18 -56"/>
      <path class="o" fill="#1d1d21" d="M-46 -57 Q-46 -62 -40 -62 L-8 -61 Q-3 -60 -4 -56 L-44 -55 Q-46 -55 -46 -57 Z"/>
      <path fill="none" stroke="#55555e" stroke-width="1.1" stroke-dasharray="2 2" d="M-42 -59 L-8 -58.5"/>
      <!-- a red light at the back -->
      <rect class="o" style="stroke-width:1.8" fill="#ff4a3d" x="-56" y="-52" width="6" height="4" rx="1.2"/>
      <!-- stem, bars swept back, grip -->
      <path class="tube" style="stroke-width:7" d="M32 -60 L30 -78 L20 -80"/>
      <path class="frame" style="stroke-width:3.4" d="M32 -60 L30 -78 L20 -80"/>
      <rect class="o" fill="#1d1d21" x="15" y="-83" width="9" height="6" rx="2.5"/>
      <!-- headlight -->
      <path class="o" fill="#e9edf2" d="M35 -66 L42 -68 Q46 -64 42 -60 L35 -61 Z"/>
      <path class="n" fill="#fff6b0" d="M41 -67 Q44 -64 41 -61 Z"/>
    </g>
  </g>

  <!-- Fifteen, a grey hoodie, a crossbody bag. Joint at his hip on the saddle. -->
  <g id="rider" data-parent="body" transform="translate(-22 -60)">
    <g transform="translate(22 60)">
      <path class="o" fill="#d9dee5" d="M-33 -60 Q-35 -74 -31 -86 Q-26 -92 -16 -92 Q-6 -91 -4 -84 Q-2 -72 -8 -58 Z"/>
      <path class="n" fill="#bcc4ce" d="M-31 -62 Q-33 -74 -30 -84 Q-26 -74 -26 -62 Z"/>
      <!-- the hood, bunched at the back of his neck -->
      <path class="o" fill="#c9d0d9" d="M-32 -84 Q-36 -92 -28 -95 Q-21 -96 -18 -91 Q-24 -88 -32 -84 Z"/>
      <path class="t" style="stroke:#ffffff;stroke-width:1.4" d="M-10 -87 L-9 -78 M-7 -86 L-6 -79"/>
      <!-- the bag across his chest -->
      <path fill="none" stroke="#2b1b16" stroke-width="4.2" stroke-linecap="round" d="M-27 -88 L-9 -67"/>
      <path fill="none" stroke="#d8a25a" stroke-width="2" stroke-linecap="round" d="M-27 -88 L-9 -67"/>
      <path class="o" fill="#232327" d="M-15 -72 L-3 -73 Q0 -72 0 -68 L-1 -63 L-14 -62 Q-16 -66 -15 -72 Z"/>
      <path class="t" style="stroke:#55555e" d="M-13 -69 L-2 -70"/>
    </g>
  </g>

  <!-- Black track trousers with one stripe, and chunky white trainers. Thigh: joint at the hip. -->
  <g id="leg" data-parent="body" transform="translate(-22 -60)">
    <g transform="translate(22 60)">
      <path class="o" fill="#2b2d33" d="M-30 -62 Q-26 -68 -18 -66 L1 -57 Q5 -52 1 -48 L-3 -46 L-26 -54 Q-32 -56 -30 -62 Z"/>
      <path fill="none" stroke="#f4f4f4" stroke-width="1.6" stroke-linecap="round" d="M-24 -60.5 L-2 -51"/>
    </g>
  </g>

  <!-- Shin and trainer. Joint at the knee. -->
  <g id="shin" data-parent="leg" transform="translate(-2 -52)">
    <g transform="translate(2 52)">
      <path class="o" fill="#2b2d33" d="M-6 -56 L3 -53 L-1 -22 L-9 -22 Z"/>
      <path fill="none" stroke="#f4f4f4" stroke-width="1.6" stroke-linecap="round" d="M1 -52 L-3.5 -24"/>
      <path class="o" fill="#fafafa" d="M-11 -18 Q-11 -23 -6 -23 L0 -23 Q8 -22 10 -17 L10 -14 L-11 -14 Z"/>
      <path class="n" fill="#d6d6d6" d="M-10 -16 L9.5 -16 L9.5 -14.6 L-10 -14.6 Z"/>
      <path class="t" style="stroke:#6fd0ae" d="M-3 -20.5 L3 -19"/>
    </g>
  </g>

  <!-- A fade with a curl on top, and the look of a boy who knows you are looking. Joint at the neck. -->
  <g id="head" data-parent="rider" transform="translate(-17 -89)">
    <g transform="translate(17 89)">
      <rect class="o" fill="#a9734f" x="-21" y="-95" width="8" height="8" rx="2"/>
      <circle class="o" fill="#c99069" cx="-15" cy="-105" r="15.5"/>
      <ellipse class="o" fill="#c99069" cx="-24" cy="-103" rx="3" ry="4.2"/>
      <!-- the fade: dark on top, nearly shaved at the sides -->
      <path class="n" fill="#4a3c36" fill-opacity="0.45" d="M-29 -104 Q-30 -112 -26 -116 L-18 -113 L-21 -102 Z"/>
      <path class="o" fill="#1f1a18" d="M-28 -110 Q-30 -124 -15 -125 Q-1 -125 1 -113 Q-6 -117 -14 -116 Q-22 -115 -28 -110 Z"/>
      <path class="o" fill="#1f1a18" d="M-12 -123 Q-6 -127 -1.5 -123.5 Q-5 -124.5 -7 -121 Z"/>
      <!-- one eyebrow up -->
      <path class="t" style="stroke-width:2.2" d="M-12 -111 Q-9 -114 -6 -112 M-3.5 -112.5 Q-1.5 -113 0 -111"/>
      <circle class="n" fill="#2b1b16" cx="-8.5" cy="-106" r="1.8"/>
      <circle class="n" fill="#2b1b16" cx="-2" cy="-106" r="1.6"/>
      <path class="o" fill="#c99069" d="M0.5 -104 Q4.5 -101 0.6 -98.8"/>
      <!-- the smirk -->
      <path class="t" style="stroke-width:1.9" d="M-9 -96 Q-5 -94 -1.5 -97.5"/>
    </g>
  </g>

  <!-- His near arm: the phone in his hand, the helmet on his elbow. Joint at the shoulder. -->
  <g id="arm_front" data-parent="rider" transform="translate(-14 -86)">
    <g transform="translate(14 86)">
      <path class="o" fill="#d9dee5" d="M-19 -88 Q-12 -91 -9 -84 L-5 -73 Q-6 -67 -12 -69 L-17 -78 Q-20 -84 -19 -88 Z"/>
      <path class="o" fill="#d9dee5" d="M-11 -74 L2 -88 L8 -83 L-6 -68 Z"/>
      <rect class="o" fill="#e3e8ee" x="-1" y="-89" width="7" height="5" rx="1.6" transform="rotate(-45 2.5 -86.5)"/>
      <circle class="o" fill="#c99069" cx="6" cy="-90" r="4.2"/>
      <!-- the phone, screen towards him -->
      <rect class="o" style="stroke-width:2" fill="#1d1d21" x="4" y="-103" width="7" height="13" rx="1.8" transform="rotate(12 7.5 -96.5)"/>
      <rect class="n" fill="#9fd8ff" x="5.4" y="-101.4" width="4.2" height="9.6" rx="0.8" transform="rotate(12 7.5 -96.5)"/>
    </g>
  </g>

  <!-- The helmet, hanging off his elbow by its strap. Not on his head. Joint at the elbow. -->
  <g id="helmet" data-parent="arm_front" transform="translate(-8 -70)">
    <g transform="translate(8 70)">
      <path class="t" style="stroke-width:1.4" d="M-9 -70 L-14 -60 M-7 -70 L-4 -60"/>
      <path class="o" fill="#fafafa" d="M-19 -54 Q-19 -64 -9 -64 Q1 -64 1 -54 Z"/>
      <path class="n" fill="#6fd0ae" d="M-15 -55 Q-15 -61 -9 -62 L-7 -62 Q-12 -60 -12 -55 Z"/>
      <path class="t" style="stroke-width:1.4" d="M-12 -63 L-11 -59 M-6 -63.5 L-6 -59 M-1 -61 L-2 -58"/>
    </g>
  </g>
</svg>
