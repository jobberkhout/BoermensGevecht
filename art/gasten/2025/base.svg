    <path fill="none" stroke="#2b1b16" stroke-width="7" stroke-linecap="round" d="M-288 -448 L-288 -552"/>
    <path fill="none" stroke="#d5d8de" stroke-width="2.6" stroke-linecap="round" d="M-288 -448 L-288 -552"/>
    <circle class="o" fill="#e6b422" cx="-288" cy="-556" r="4.6"/>

