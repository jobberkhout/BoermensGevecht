    <path class="n" fill="#e9dfcb" d="M-294 -440 L-282 -440 L-282 -4 L-294 -4 Z M-18 -440 L-6 -440 L-6 -4 L-18 -4 Z"/>
    <path class="t" style="stroke:#d9a63a;stroke-width:3" d="M-282 -440 L-282 -6 M-18 -440 L-18 -6"/>
    <rect class="o" fill="#fbf6ea" x="-302" y="-456" width="304" height="12" rx="3"/>
