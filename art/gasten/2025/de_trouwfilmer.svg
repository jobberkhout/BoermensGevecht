<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -130 104 136" data-rig="humanoid">
  <title>De Trouwfilmer</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(-20 -38)"/>

  <!-- The far arm holds the camera on his shoulder; only the sleeve shows. -->
  <g id="arm_back" data-parent="torso" transform="translate(-26 -72)">
    <path class="o" fill="#33343b" d="M-6 -3 Q-8 9 -5 19 L6 19 Q8 9 6 -3 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-25 -38)">
    <path class="o" fill="#22232a" d="M-7 -3 L7 -3 L5.5 32 L-5.5 32 Z"/>
    <path class="o" fill="#e9e9e9" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(-15 -38)">
    <path class="o" fill="#2c2d35" d="M-7 -3 L7 -3 L5.5 32 L-5.5 32 Z"/>
    <path class="o" fill="#fafafa" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
    <path class="n" fill="#d6d6d6" d="M-6 36 L12.5 36 L12.5 37.6 L-6 37.6 Z"/>
  </g>

  <!-- All black, as the crew wears it, under a grey vest full of pockets for batteries. -->
  <g id="torso" data-parent="hips" transform="translate(-20 -40)">
    <path class="o" fill="#2c2d35" d="M-14.5 8 Q-17 -14 -14 -30 Q-11 -37 0 -37 Q12 -37 15 -30 Q18 -14 14.5 8 Z"/>
    <path class="o" fill="#5a606b" d="M-15 4 Q-17 -14 -14 -29 Q-10 -36 -3 -36 L-1 -8 L12 -8 L13 -32 Q16 -24 16 -12 Q16 -2 14 4 Z"/>
    <rect class="o" style="stroke-width:1.8" fill="#6c7380" x="-11" y="-20" width="8" height="9" rx="1.4"/>
    <rect class="o" style="stroke-width:1.8" fill="#6c7380" x="2" y="-4" width="9" height="8" rx="1.4"/>
    <rect class="o" style="stroke-width:1.8" fill="#6c7380" x="-12" y="-6" width="9" height="8" rx="1.4"/>
    <rect class="n" fill="#ffd21f" x="-9.5" y="-18.5" width="2.4" height="3.5" rx="0.6"/>
  </g>

  <!-- The light panel: as big as a door, on a stand, shining at the enemy. Joint at the foot of the stand. -->
  <g id="panel" data-parent="torso" transform="translate(15 -2)">
    <g transform="translate(-15 2)">
      <!-- the stand -->
      <path class="t" style="stroke-width:3.4" d="M15 -20 L15 -5 M15 -5 L5 0 M15 -5 L25 0 M15 -5 L15 0"/>
      <!-- the handle on his side -->
      <path fill="none" stroke="#2b1b16" stroke-width="5.6" stroke-linecap="round" d="M-8 -68 Q-14.5 -68 -14.5 -61 Q-14.5 -54 -8 -54"/>
      <path fill="none" stroke="#8a8f99" stroke-width="2.4" stroke-linecap="round" d="M-8 -68 Q-14.5 -68 -14.5 -61 Q-14.5 -54 -8 -54"/>
      <!-- barn doors, top and bottom -->
      <path class="o" fill="#2f3138" d="M-6 -88 L38 -88 L44 -95 L-2 -95 Z"/>
      <path class="o" fill="#2f3138" d="M-6 -20 L38 -20 L44 -13 L-2 -13 Z"/>
      <rect class="o" fill="#2f3138" x="-9" y="-90" width="48" height="72" rx="3"/>
      <rect class="o" style="stroke-width:1.8" fill="#fff6d6" x="-4" y="-85" width="38" height="62" rx="1.5"/>
      <!-- the rows of little lamps -->
      <g fill="#ffe28a">
        <circle cx="2" cy="-79" r="1.8"/><circle cx="10" cy="-79" r="1.8"/><circle cx="18" cy="-79" r="1.8"/><circle cx="26" cy="-79" r="1.8"/>
        <circle cx="2" cy="-69" r="1.8"/><circle cx="10" cy="-69" r="1.8"/><circle cx="18" cy="-69" r="1.8"/><circle cx="26" cy="-69" r="1.8"/>
        <circle cx="2" cy="-59" r="1.8"/><circle cx="10" cy="-59" r="1.8"/><circle cx="18" cy="-59" r="1.8"/><circle cx="26" cy="-59" r="1.8"/>
        <circle cx="2" cy="-49" r="1.8"/><circle cx="10" cy="-49" r="1.8"/><circle cx="18" cy="-49" r="1.8"/><circle cx="26" cy="-49" r="1.8"/>
        <circle cx="2" cy="-39" r="1.8"/><circle cx="10" cy="-39" r="1.8"/><circle cx="18" cy="-39" r="1.8"/><circle cx="26" cy="-39" r="1.8"/>
        <circle cx="2" cy="-29" r="1.8"/><circle cx="10" cy="-29" r="1.8"/><circle cx="18" cy="-29" r="1.8"/><circle cx="26" cy="-29" r="1.8"/>
      </g>
      <path class="n" fill="#ffffff" fill-opacity="0.8" d="M-3 -84 L6 -84 L-3 -70 Z"/>
      <!-- a white wedding ribbon tied round the frame: it is a wedding, after all -->
      <path fill="none" stroke="#2b1b16" stroke-width="4" stroke-linecap="round" d="M39 -46 L-9 -46"/>
      <path fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" d="M39 -46 L-9 -46"/>
      <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M39 -46 L44 -52 L46 -45 Z M39 -46 L45 -40 L41 -38 Z"/>
    </g>
  </g>

  <!-- What the panel throws at the enemy: light. It flickers, and flares when something hits. Joint at the panel's face. -->
  <g id="rays" data-parent="panel" transform="translate(42 -56)">
    <path fill="none" stroke="#ffd65a" stroke-width="2.6" stroke-linecap="round" d="M2 -24 L9 -27 M3 -8 L11 -8 M2 8 L9 11"/>
  </g>

  <!-- Beard trimmed for the occasion, hair with gel. Joint at the neck. -->
  <g id="head" data-parent="torso" transform="translate(-19 -76)">
    <rect class="o" fill="#b5805a" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#cf9a72" cx="2" cy="-21" rx="17.5" ry="17.5"/>
    <ellipse class="o" fill="#cf9a72" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <path class="o" fill="#1f1a18" d="M-15.5 -22 Q-20 -42 0 -43.5 Q16 -45 20 -33 Q14 -38 6 -35.5 Q-4 -33 -8 -26 Q-11 -20 -15.5 -22 Z"/>
    <path class="o" fill="#1f1a18" d="M2 -42 Q12 -50 21 -40 Q14 -42 9 -38 Z"/>
    <path class="o" fill="#2a2220" d="M-7 -13 Q-7 -1 4 -1 Q16 -1 19 -10 Q14 -7 9 -8 Q1 -8 -7 -13 Z"/>
    <!-- one eye shut tight; the other is at the viewfinder -->
    <path class="t" style="stroke-width:2.2" d="M5 -28 Q8.5 -30.5 12 -28.5"/>
    <path class="t" style="stroke-width:2" d="M6 -21.5 Q8.5 -19.5 11 -21.5"/>
    <path class="t" d="M8 -9.5 L13 -10"/>
  </g>

  <!-- The camera, on his eye, over the top of the panel. It never stops recording. Joint at the eyepiece. -->
  <g id="camera" data-parent="head" transform="translate(-4 -98)">
    <rect class="o" fill="#1d1d21" x="0" y="-6" width="5" height="9" rx="2"/>
    <path class="o" fill="#2f3138" d="M4 -9 L26 -9 L26 6 L4 6 Z"/>
    <path class="n" fill="#4a4d56" d="M6 -7 L24 -7 L24 -4 L6 -4 Z"/>
    <path class="o" fill="#2f3138" d="M26 -6 L34 -6 L34 3 L26 3 Z"/>
    <path class="o" fill="#1d1d21" d="M34 -8 L39 -10 L39 7 L34 5 Z"/>
    <path class="t" style="stroke-width:3" d="M8 -9 L9 -15 L22 -15 L23 -9"/>
    <circle class="n" fill="#ff3b30" cx="19" cy="-1.5" r="2.2"/>
  </g>

  <!-- The near arm, its hand round the handle. -->
  <g id="arm_front" data-parent="torso" transform="translate(-14 -72)">
    <path class="o" fill="#3a3b44" d="M-6 -3 Q-8.5 8 -7.5 15 Q-6 21.5 0 20.5 L6 17.5 L3.5 9 Q5.6 3 6 -3 Z"/>
    <path class="n" fill="#4a4b55" d="M1 -1 L4.2 -1 Q4 4 2.4 9 L0 9 Z"/>
    <path class="o" fill="#cf9a72" d="M3 12 Q2 7.6 6.6 7 Q11 6.6 11.4 11 Q11.8 15.6 7.4 16 Q3.6 16.2 3 12 Z"/>
  </g>
</svg>
