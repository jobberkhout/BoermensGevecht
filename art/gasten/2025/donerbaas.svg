<svg xmlns="http://www.w3.org/2000/svg" viewBox="-46 -134 110 140" data-rig="humanoid">
  <title>De Dönerbaas</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm holds the knife up, out in front of him. Short white sleeve. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#e9edf0" d="M-6.5 -3 Q-7 6 2 14 L10 8 Q4 2 6.5 -3 Z"/>
    <path class="o" fill="#b98757" d="M3 9 L37 -1 L40 6 L7 16 Z"/>
    <circle class="o" fill="#b98757" cx="39" cy="2" r="4.4"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#3a3d46" d="M-7 -3 L7 -3 L6 32 L-6 32 Z"/>
    <path class="o" fill="#1d1d21" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#474b55" d="M-7 -3 L7 -3 L6 32 L-6 32 Z"/>
    <path class="o" fill="#26262b" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
    <path class="n" fill="#4a4a52" d="M3 33.2 Q8 33.4 10.6 35.4 L5 35 Z"/>
  </g>

  <!-- A white shirt and a long white apron with the day's sauce on it. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#f4f6f7" d="M-15 6 Q-18 -14 -15 -30 Q-12 -37 0 -37 Q13 -37 16 -30 Q19 -14 15 6 Z"/>
    <path class="n" fill="#dfe4e8" d="M-14 5 Q-16.5 -14 -14 -29 Q-10 -20 -9 5 Z"/>
    <path class="o" fill="#ffffff" d="M2 -36.8 L9.5 -34.5 L6.5 -29 Z"/>
    <path class="o" fill="#ffffff" d="M2 -36.8 L-3 -35 L-0.5 -30.5 Z"/>
    <path class="o" fill="#ffffff" d="M-3 -24 L13 -24 Q16 -6 17 22 L-6 22 Q-5 -6 -3 -24 Z"/>
    <path class="t" d="M-3 -24 L-9 -36 M13 -24 L10 -36"/>
    <path class="t" style="stroke:#c9ced4" d="M-4 -8 L14.5 -8"/>
    <!-- Sauce and a bit of lettuce, never red: with a knife in his hand red would read as something else. -->
    <circle class="n" fill="#e8a23a" cx="4" cy="-14" r="1.6"/>
    <circle class="n" fill="#7fae3e" cx="9" cy="2" r="1.3"/>
    <circle class="n" fill="#e8a23a" cx="1" cy="10" r="1.5"/>
    <circle class="n" fill="#d9b25a" cx="12" cy="14" r="1.2"/>
  </g>

  <!-- A thick moustache, the hair going at the front. -->
  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#a8774c" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#d6a37c" cx="2" cy="-21" rx="18" ry="18"/>
    <ellipse class="o" fill="#d6a37c" cx="-8.5" cy="-18.5" rx="3.4" ry="4.8"/>
    <path class="o" fill="#2a2220" d="M-15.5 -20 Q-21 -38 -6 -40 Q2 -41 5 -38 Q-3 -36 -6 -30 Q-9 -23 -12 -19 Q-14 -17 -15.5 -20 Z"/>
    <path class="n" fill="#8f8781" d="M-14.5 -22 Q-15 -26 -12.5 -28 Q-12 -25 -11.5 -22.5 Z"/>
    <path class="n" fill="#b98757" fill-opacity="0.35" d="M-4 -10 Q-4 -2 4 -1.5 Q15 -1.5 19 -9 Q14 -6 8 -7 Q1 -7 -4 -10 Z"/>
    <path class="t" style="stroke-width:2.2" d="M5 -28 Q9 -30.5 13 -28.5 M15.5 -29 Q18 -30.5 20.5 -28.5"/>
    <circle class="n" fill="#2b1b16" cx="9.5" cy="-22" r="2"/>
    <circle class="n" fill="#2b1b16" cx="17.5" cy="-22" r="1.8"/>
    <path class="o" fill="#d6a37c" d="M20 -19.5 Q24.5 -16.5 20.2 -14.2"/>
    <path class="o" fill="#2a2220" d="M6 -11 Q12 -16 21 -12.5 Q22 -9.5 19.5 -8 Q14 -11 8.5 -8 Q5 -8.5 6 -11 Z"/>
    <path class="t" style="stroke-width:1.9" d="M10 -5.5 Q14 -3.5 18 -6"/>
  </g>

  <!-- The long knife, held upright like a salute. Never pointed at anyone. Joint in his far hand. -->
  <g id="knife" data-parent="arm_back" transform="translate(30 -70)">
    <g transform="translate(-30 70)">
      <rect class="o" fill="#8a5a3a" x="27" y="-74" width="6" height="15" rx="2"/>
      <circle class="n" fill="#e9c08a" cx="30" cy="-70" r="1"/>
      <circle class="n" fill="#e9c08a" cx="30" cy="-64" r="1"/>
      <rect class="o" style="stroke-width:2" fill="#8a9096" x="25.5" y="-77" width="9" height="3.5" rx="1.2"/>
      <!-- a kitchen knife, not a sword: straight back, curved edge, a few shavings still on it -->
      <path class="o" fill="#d9dee3" d="M27 -77 L27 -113 Q27 -117 29.5 -117 Q35.5 -110 35.5 -98 L34 -77 Z"/>
      <path class="n" fill="#ffffff" d="M31.5 -80 L33.4 -80 Q34 -96 32 -108 Q31.5 -96 31.5 -80 Z"/>
      <path class="o" style="stroke-width:1.6" fill="#a8582e" d="M26 -96 Q29 -99 33 -97 Q30 -94 26 -96 Z"/>
    </g>
  </g>

  <!-- The pita he is about to throw. Joint in his near hand. -->
  <g id="pita" data-parent="arm_front" transform="translate(27 -52)">
    <ellipse class="o" fill="#efc988" cx="2" cy="0" rx="11" ry="5"/>
    <path class="n" fill="#d9a55a" d="M-6 0.5 Q2 3.5 10 0.5 Q2 2 -6 0.5 Z"/>
    <path class="n" fill="#f7deb0" d="M-5 -2 Q2 -4.5 8 -2 Q2 -3 -5 -2 Z"/>
  </g>

  <!-- The near arm, short white sleeve, a pita in his hand. -->
  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#f4f6f7" d="M-6.5 -3 Q-8.5 6 -6 13 L6.5 13 Q8 6 6.5 -3 Z"/>
    <path class="o" fill="#d6a37c" d="M-4 11 L-3 19 L15 24 L17 16 Z"/>
    <circle class="o" fill="#d6a37c" cx="17" cy="20" r="4.6"/>
    <circle data-mount="hand" fill="none" cx="19" cy="19" r="1"/>
  </g>
</svg>
