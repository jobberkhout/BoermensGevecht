<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" data-rig="static">
  <title>De Gasten: een straat met een fabriek erachter, de kapper en de feestzaal</title>

  <!--
    A faction's half of the backdrop. It is drawn for the left side of the screen and mirrored when the
    faction plays on the right. There is no sky in it. The skyline thins out before the middle (x = 960);
    the ground runs on to x = 1100, because the other half fades in over the stretch from 860 to 1060.

    Mirrored, the stretch from x = 662 to 818 lies under the sun of the shared sky, so nothing there
    reaches above y = 250. The paving joints and the road markings are placed so that they meet their own
    mirror image, for a match of De Gasten against itself.
  -->
