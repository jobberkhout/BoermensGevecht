  <!-- Factory smoke, drifting off. Joint at the top of the chimney. -->
  <g id="smoke" data-parent="building" transform="translate(-32 -562)">
    <path class="k" fill="#d8d4ca" d="M-6 -2 Q-12 -6 -8 -11 Q-8 -18 -1 -17 Q4 -23 10 -17 Q17 -17 16 -10 Q20 -4 13 -2 Q7 2 1 -1 Q-3 2 -6 -2 Z"/>
