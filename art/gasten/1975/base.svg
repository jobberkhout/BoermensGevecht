    <path class="w" d="M-262 -420 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-222 -420 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-182 -420 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-142 -420 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-102 -420 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-62 -420 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-30 -420 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-242 -392 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-202 -392 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-162 -392 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-122 -392 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-82 -392 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-42 -392 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-270 -392 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0"/>
