<svg xmlns="http://www.w3.org/2000/svg" viewBox="-312 -596 328 602" data-rig="static">
  <title>Het Pension: een smal bakstenen huis bij de fabriekspoort, te veel bedden achter elk raam, koffers op de kasten en de was over de bovenste verdieping</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .k { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .j { stroke: #8e4630; stroke-width: 1.4; stroke-linecap: round; fill: none; }
    .w { stroke: #6b5242; stroke-width: 1.6; fill: none; }
  </style>

  <!-- (0,0) is the foot of the doorway, where units come out. The house stands behind it, to the left. -->
  <g id="building" transform="translate(0 0)">
    <!-- behind the house: the factory chimney, brick with two white bands -->
    <path class="o" fill="#9a4a33" d="M-46 -452 L-42.8 -556 L-21.2 -556 L-18 -452 Z"/>
    <path class="n" fill="#efe6d2" d="M-43.6 -524 L-20.4 -524 L-20.2 -516 L-43.8 -516 Z M-42.6 -545 L-21.4 -545 L-21.2 -538 L-42.8 -538 Z"/>
