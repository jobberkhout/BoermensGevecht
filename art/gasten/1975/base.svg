    <rect class="k" fill="#7a5a3e" x="-190" y="-84" width="44" height="56"/>
    <path class="t" style="stroke:#5a3f2a;stroke-width:1.4" d="M-168 -84 L-168 -28"/>
    <circle class="n" fill="#e0b84a" cx="-171" cy="-58" r="1.4"/>
    <circle class="n" fill="#e0b84a" cx="-165" cy="-58" r="1.4"/>
    <rect class="k" fill="#c48a4a" x="-188" y="-98" width="40" height="14" rx="2"/>
