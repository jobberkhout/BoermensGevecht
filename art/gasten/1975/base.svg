    <rect class="o" style="stroke-width:2.4" fill="#7d3a28" x="-45" y="-562" width="26" height="7" rx="1.5"/>

    <!-- the roof: red tiles, a dormer with yet another bunk in it, the television aerial of 1975 -->
    <path class="o" fill="#b5533a" d="M-306 -450 L-252 -500 L-62 -500 L2 -450 Z"/>
    <path class="t" style="stroke:#8e3a26;stroke-width:1.6" d="M-292 -463 L-8 -463 M-278 -476 L-24 -476 M-265 -488 L-41 -488"/>
    <path class="t" style="stroke:#8e3a26;stroke-width:1.2" d="M-270 -463 L-268 -450 M-240 -463 L-239 -450 M-210 -463 L-210 -450 M-180 -463 L-180 -450 M-90 -463 L-90 -450 M-60 -463 L-61 -450 M-30 -463 L-32 -450 M-255 -476 L-253 -463 M-225 -476 L-224 -463 M-195 -476 L-195 -463 M-75 -476 L-75 -463 M-45 -476 L-46 -463 M-240 -488 L-238 -476 M-210 -488 L-209 -476 M-90 -488 L-90 -476 M-60 -488 L-61 -476"/>
    <path class="t" style="stroke-width:2.6" d="M-112 -500 L-112 -538 M-126 -530 L-98 -530 M-122 -522 L-102 -522 M-118 -515 L-106 -515"/>
    <rect class="o" fill="#efe6d2" x="-168" y="-492" width="40" height="38" rx="2"/>
    <path class="o" style="stroke-width:2.4" fill="#9a4a33" d="M-173 -490 L-148 -506 L-123 -490 Z"/>
    <rect class="k" fill="#3c3530" x="-162" y="-486" width="28" height="28"/>
