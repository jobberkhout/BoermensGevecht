<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -24 50 48" data-rig="static">
  <title>Eerst thee: een dienblaadje met een tulpglas Turkse thee en een glas muntthee naast elkaar</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <g id="tray" transform="translate(0 0)">
    <!-- the tray: a round brass one, seen a little from above -->
    <ellipse class="o" fill="#d9a826" cx="0" cy="13" rx="22" ry="7.5"/>
    <ellipse class="n" fill="#f2c94a" cx="0" cy="11.6" rx="18" ry="4.8"/>
    <path class="t" style="stroke:#a87e16;stroke-width:1.1" d="M-16 14 Q0 18.5 16 14"/>
    <!-- the tulip glass of Turkish tea, on its little saucer -->
    <ellipse class="o" style="stroke-width:1.8" fill="#f4f0e6" cx="-9" cy="10.5" rx="8.5" ry="2.6"/>
    <path class="o" fill="#c4452a" d="M-13.5 -11 Q-17 -6 -14 -1 Q-16.5 3.5 -14 9 L-4 9 Q-1.5 3.5 -4 -1 Q-1 -6 -4.5 -11 Z"/>
    <path class="n" fill="#e98a5e" d="M-12 -9 Q-14.3 -6 -12.5 -3 L-11 -3 Q-12.3 -6 -10.5 -9 Z"/>
    <path class="t" style="stroke:#f6ead0;stroke-width:1.3" d="M-13.5 -10.5 L-4.5 -10.5"/>
    <!-- the glass of mint tea, with its painted band and a sprig sticking out -->
    <path class="o" style="stroke-width:1.6" fill="#5fae5a" d="M6 -12 Q3 -17 7.5 -19 Q8.5 -15 8 -12 Z M10 -12 Q11 -17.5 15 -17 Q13.5 -14 12 -12 Z"/>
    <path class="o" fill="#d8b04a" d="M3.5 -12 L16.5 -12 L14.8 9 L5.2 9 Z"/>
    <path class="n" fill="#2e7f8f" d="M4 -6 L16 -6 L15.6 -1 L4.4 -1 Z"/>
    <path fill="none" stroke="#f2d06a" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="0.1 2.4" d="M5 -3.5 L15.2 -3.5"/>
    <path class="n" fill="#f6e3a0" d="M6 -10 L8 -10 L7.6 6.6 L6.4 6.6 Z"/>
    <!-- steam -->
    <path fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" d="M-9 -13.5 Q-12 -17 -9 -20.5 M-5.5 -14 Q-8 -17 -5.5 -19.5"/>
  </g>
</svg>
