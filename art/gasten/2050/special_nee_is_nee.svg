<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" data-rig="static">
  <title>Nee is nee: één blik over de leesbril, één wenkbrauw omhoog. Nee.</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <!-- A mother's face in a tile-blue ring, looking over her reading glasses, one eyebrow up. Origin = its middle. -->
  <g id="look" transform="translate(0 0)">
    <circle class="o" fill="#2f6fb3" cx="0" cy="0" r="55"/>
    <circle class="o" style="stroke-width:2.4" fill="#fbf8f0" cx="0" cy="0" r="47"/>
    <circle class="n" fill="#a8ead0" cx="0" cy="0" r="43"/>
    <g transform="translate(5 2)">
    <!-- the bun and the hair -->
    <circle class="o" fill="#2b2422" cx="-6" cy="-36" r="11"/>
    <path class="o" fill="#2b2422" d="M-34 4 Q-38 -30 -6 -31 Q24 -30 22 0 Q14 -16 -6 -18 Q-26 -16 -34 4 Z"/>
    <!-- the face -->
    <path class="o" fill="#c98e62" d="M-30 0 Q-32 -18 -6 -19 Q18 -18 18 0 Q18 26 -6 30 Q-30 26 -30 0 Z"/>
    <path class="n" fill="#2b2422" d="M-31 -2 Q-30 -17 -16 -19 Q-26 -12 -28 4 Z M17 -2 Q16 -15 6 -18.6 Q14 -10 15 2 Z"/>
    <!-- gold earrings -->
    <circle class="t" style="stroke:#c9971c;stroke-width:2.2" cx="-30.6" cy="9" r="3.4"/>
    <circle class="t" style="stroke:#c9971c;stroke-width:2.2" cx="18.6" cy="9" r="3.4"/>
    <!-- one eyebrow flat, the other all the way up -->
    <path class="t" style="stroke-width:4.4" d="M-22 -5.6 L-11 -6.4"/>
    <path class="t" style="stroke-width:4.4" d="M-1 -8 Q4 -19 12 -11.6"/>
    <!-- eyes, looking at you over the glasses -->
    <circle class="n" fill="#2b1b16" cx="-15" cy="1.4" r="2.6"/>
    <circle class="n" fill="#2b1b16" cx="5.4" cy="-0.6" r="3.2"/>
    <circle class="n" fill="#ffffff" cx="6.4" cy="-1.6" r="1"/>
    <!-- reading glasses, down her nose -->
    <rect class="t" style="stroke-width:2" x="-21.6" y="6" width="12.4" height="7.4" rx="3"/>
    <rect class="t" style="stroke-width:2" x="-1.6" y="6" width="12.4" height="7.4" rx="3"/>
    <path class="t" style="stroke-width:1.8" d="M-9.2 9 L-1.6 9"/>
    <path class="t" style="stroke-width:2" d="M-4 2 Q-2.4 7 -6 9.6"/>
    <!-- lips pressed together: the answer is already given -->
    <path class="t" style="stroke-width:3" d="M-13 21 L0 20.4"/>
    </g>
    <!-- ping: the eyebrow has gone up -->
    <path class="t" style="stroke-width:3" d="M31 -15 L39 -19 M30 -23 L35 -30 M32 -7 L40 -7"/>
  </g>
</svg>
