<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -14 40 29" data-rig="static">
  <title>Een spraakbericht van een hologramneef, gloeiend</title>
  <style>
    .o { stroke: #17687e; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #17687e; stroke-width: 1.8; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <!-- A voice message, sent from the sofa and on its way: a speech bubble of hologram light with a play
       button and the sound wave of a cousin who talks for four minutes. Origin = the middle of the bubble. -->
  <g id="bericht" transform="translate(0 0)">
    <!-- the glow it flies in -->
    <rect class="n" fill="#9feeff" fill-opacity="0.32" x="-19" y="-13" width="38" height="25" rx="10"/>
    <!-- the bubble, with its tail at the bottom left -->
    <path class="o" fill="#d9f8ff" d="M-12 -9 L12 -9 Q16 -9 16 -5 L16 4 Q16 8 12 8 L-6 8 L-11.5 12.6 L-10.4 8 L-12 8 Q-16 8 -16 4 L-16 -5 Q-16 -9 -12 -9 Z"/>
    <!-- a scanline: it is a hologram too -->
    <path class="n" fill="#ffffff" fill-opacity="0.7" d="M-13 -6.6 L13 -6.6 L13 -5.4 L-13 -5.4 Z"/>
    <!-- the play button -->
    <circle class="n" fill="#2a8fae" cx="-9.4" cy="-0.6" r="4.4"/>
    <path class="n" fill="#effdff" d="M-10.8 -3 L-6.8 -0.6 L-10.8 1.8 Z"/>
    <!-- the sound wave -->
    <path class="t" d="M-2.6 -1.6 L-2.6 0.4 M0 -4 L0 2.8 M2.6 -2.6 L2.6 1.4 M5.2 -5 L5.2 3.8 M7.8 -2 L7.8 0.8 M10.4 -3.6 L10.4 2.4 M13 -1.2 L13 0"/>
  </g>
</svg>
