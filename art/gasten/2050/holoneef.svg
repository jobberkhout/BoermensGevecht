<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -138 118 144" data-rig="humanoid">
  <title>De Hologramneef: komt via de familie-app, als hologram. Fris geknipt, telefoon op een selfiestick</title>
  <style>
    .o { stroke: #17687e; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #17687e; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .scan { stroke: #effdff; stroke-width: 1.2; stroke-linecap: round; fill: none; opacity: 0.55; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The light he is made of, rising from the projector at his feet. Behind everything. -->
  <g id="beam" transform="translate(0 0)">
    <path class="n" fill="#9feeff" fill-opacity="0.16" d="M-20 -2 L20 -2 L32 -126 L-28 -126 Z"/>
    <path class="n" fill="#c9f7ff" fill-opacity="0.14" d="M-9 -2 L9 -2 L14 -126 L-12 -126 Z"/>
  </g>

  <!-- The projector: a small disc that floats along over the road under him. -->
  <g id="disc" transform="translate(0 -1)">
    <ellipse class="n" fill="#7fe6ff" fill-opacity="0.35" cx="0" cy="0" rx="27" ry="6.5"/>
    <ellipse class="o" style="stroke-width:2" fill="#2a8fae" cx="0" cy="0" rx="19" ry="4.4"/>
    <ellipse class="n" fill="#bff4ff" cx="0" cy="-0.8" rx="12" ry="2.2"/>
    <circle class="n" fill="#ffffff" cx="-12" cy="0.6" r="1.1"/>
    <circle class="n" fill="#ffffff" cx="12" cy="0.6" r="1.1"/>
  </g>

  <g id="arm_back" data-parent="torso" transform="translate(-8 -72)">
    <g transform="translate(8 72)" opacity="0.86">
      <path class="o" fill="#3f9fc6" d="M-14 -75 Q-17.5 -62 -13.5 -50 L-4.5 -50 Q-2.5 -63 -3 -75 Z"/>
      <rect class="o" style="stroke-width:2" fill="#2f86ab" x="-14.4" y="-52.4" width="10.6" height="5" rx="2"/>
      <circle class="o" fill="#86d8ee" cx="-9" cy="-44" r="4.6"/>
    </g>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <g transform="translate(5 38)" opacity="0.86">
      <path class="o" fill="#2779a0" d="M-12.5 -41 L2.5 -41 L1 -9 L-10.5 -9 Z"/>
      <rect class="o" style="stroke-width:2" fill="#20698c" x="-11" y="-11" width="12.4" height="4" rx="1.6"/>
      <!-- chunky sneakers, of course -->
      <path class="o" fill="#bfeef9" d="M-13 -2.5 Q-13 -10 -6.5 -10 L1 -10 Q9.5 -9 11 -3 L11 0 L-13 0 Z"/>
      <path class="n" fill="#ffffff" d="M-12.4 -3.2 L10.4 -3.2 L10.4 -0.8 L-12.4 -0.8 Z"/>
    </g>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <g transform="translate(-5 38)" opacity="0.86">
      <path class="o" fill="#3a95bd" d="M-2.5 -41 L12.5 -41 L11 -9 L-0.5 -9 Z"/>
      <!-- the stripe down the side of the joggers -->
      <path class="t" style="stroke:#d9f8ff;stroke-width:1.8" d="M8.6 -39 L8 -12"/>
      <rect class="o" style="stroke-width:2" fill="#2f86ab" x="-1" y="-11" width="12.4" height="4" rx="1.6"/>
      <path class="o" fill="#d9f8ff" d="M-3 -2.5 Q-3 -10 3.5 -10 L11 -10 Q19.5 -9 21 -3 L21 0 L-3 0 Z"/>
      <path class="n" fill="#ffffff" d="M-2.4 -3.2 L20.4 -3.2 L20.4 -0.8 L-2.4 -0.8 Z"/>
      <path class="t" style="stroke-width:1.3" d="M5 -8.4 L8 -6.4 M8 -8.8 L11 -6.8"/>
    </g>
  </g>

  <!-- A zip-up hoodie, hood down, drawstrings out, and the lines a cheap projector leaves. Joint at the waist. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <g transform="translate(0 40)" opacity="0.86">
      <!-- the hood, lying on his back -->
      <path class="o" fill="#3f9fc6" d="M-15 -76 Q-21 -86 -12 -90 Q-3 -92 3 -86 L-2 -78 Z"/>
      <path class="o" fill="#5cc8ea" d="M-16.5 -37 Q-19.5 -56 -16 -72 Q-11 -81 1 -81 Q13 -81 17 -72 Q20 -56 16 -37 Z"/>
      <path class="n" fill="#43a9cf" d="M-15.4 -39 Q-18 -56 -15 -70 Q-11 -60 -10 -39 Z"/>
      <rect class="o" fill="#43a9cf" x="-16.5" y="-42" width="33" height="6" rx="2.4"/>
      <!-- the zip, and the drawstrings -->
      <path class="t" style="stroke-width:1.8" d="M4 -80 L4.6 -42"/>
      <path class="t" style="stroke:#effdff;stroke-width:1.6" d="M0.6 -78.6 L0 -66 M7.6 -78.4 L8.4 -66.6"/>
      <circle class="n" fill="#effdff" cx="0" cy="-65" r="1.4"/>
      <circle class="n" fill="#effdff" cx="8.4" cy="-65.6" r="1.4"/>
      <!-- the front pocket -->
      <path class="t" style="stroke-width:1.8" d="M-9 -55 L-11.4 -44.6 M13 -55 L15 -44.6 M-9 -55 L13 -55"/>
      <!-- scanlines -->
      <path class="scan" d="M-15 -73 L15.4 -73 M-17 -66 L17.4 -66 M-17.6 -59 L17.8 -59 M-17.6 -52 L17.6 -52 M-17 -45 L16.8 -45"/>
    </g>
  </g>

  <!-- A fresh fade with a line shaved in, a grin, an earbud in. Joint at the neck. -->
  <g id="head" data-parent="torso" transform="translate(1 -78)">
    <g transform="translate(-1 78)" opacity="0.88">
      <rect class="o" fill="#86d8ee" x="-3.5" y="-84" width="9" height="8" rx="2"/>
      <ellipse class="o" fill="#a6ecfa" cx="3" cy="-98" rx="16" ry="17"/>
      <!-- the fade: dark on top, lighter towards the ears -->
      <path class="n" fill="#5fb9d4" d="M-12.6 -96 Q-14.6 -106 -10 -110 L-6 -101 Q-8 -97 -9 -92 Q-11.6 -92.6 -12.6 -96 Z"/>
      <path class="o" fill="#1f7a94" d="M-11 -106 Q-12 -117.6 4 -118 Q17 -118 18.8 -107 Q12 -111 4 -110.4 Q-4 -110 -7 -104 Q-9.4 -103 -11 -106 Z"/>
      <!-- the line the barber shaved in -->
      <path class="t" style="stroke:#d9f8ff;stroke-width:1.5" d="M-11.6 -100.4 L-5.4 -104.4"/>
      <ellipse class="o" fill="#a6ecfa" cx="-6.4" cy="-95.4" rx="3.4" ry="4.6"/>
      <!-- the earbud -->
      <circle class="o" style="stroke-width:1.4" fill="#ffffff" cx="-6" cy="-93.4" r="2"/>
      <path class="t" style="stroke-width:2.4" d="M8.4 -105.6 Q11.6 -107.6 15 -105.8"/>
      <ellipse class="n" fill="#0f4f61" cx="12" cy="-100" rx="1.9" ry="2.2"/>
      <path class="o" fill="#a6ecfa" d="M18.4 -99.4 Q23 -95.6 18.8 -92.6"/>
      <!-- the grin: he made it, didn't he -->
      <path class="o" style="stroke-width:1.8" fill="#effdff" d="M9.6 -88.6 Q14 -86.4 18.6 -89 Q17.6 -84.4 13.6 -84.2 Q10.4 -84.6 9.6 -88.6 Z"/>
      <path class="scan" d="M-12 -110 L18 -110 M-14.6 -103 L18.6 -103 M-14.6 -96 L19 -96 M-12.6 -89 L17 -89"/>
    </g>
  </g>

  <!-- The near arm holds the selfie stick up. Joint at the shoulder. -->
  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <g transform="translate(-10 72)" opacity="0.86">
      <path class="o" fill="#5cc8ea" d="M4 -77 Q2 -64 6 -54 L15 -55 Q17 -66 16 -77 Z"/>
      <path class="o" fill="#5cc8ea" d="M7 -58 L20 -68 L26 -62 L13 -51 Z"/>
      <rect class="o" style="stroke-width:2" fill="#43a9cf" x="17.4" y="-70" width="6" height="9" rx="2" transform="rotate(-40 20.4 -65.5)"/>
      <circle class="o" fill="#a6ecfa" cx="25.6" cy="-64" r="4.8"/>
    </g>
  </g>

  <!-- The selfie stick, short, the phone on the end: everyone has to see he came. Joint in his hand. -->
  <g id="stick" data-parent="arm_front" transform="translate(26 -64)">
    <g transform="translate(-26 64)" opacity="0.9">
      <path class="t" style="stroke-width:5" d="M26 -64 L38 -90"/>
      <path fill="none" stroke="#bfeef9" stroke-width="2.4" stroke-linecap="round" d="M26 -64 L38 -90"/>
      <g transform="rotate(24 39 -95)">
        <rect class="o" style="stroke-width:2" fill="#2a8fae" x="33.6" y="-104" width="11" height="18" rx="2.6"/>
        <rect class="n" fill="#e8fdff" x="35.4" y="-101.6" width="7.4" height="12.6" rx="1.4"/>
        <circle class="n" fill="#17687e" cx="39.1" cy="-87.8" r="0.9"/>
        <!-- on the screen: himself, of course -->
        <circle class="n" fill="#7fd8f0" cx="39.1" cy="-97.4" r="2.2"/>
        <path class="n" fill="#7fd8f0" d="M35.6 -89.4 Q36.4 -94 39.1 -94 Q41.8 -94 42.6 -89.4 Z"/>
      </g>
    </g>
  </g>

  <!-- Two slices of him, a little out of place: the connection is not great. Drawn last, on top. -->
  <g id="glitch" transform="translate(4 -74)">
    <g transform="translate(-4 74)">
      <rect class="n" fill="#bff4ff" fill-opacity="0.75" x="12" y="-63.4" width="12" height="2.6" rx="1.2"/>
      <rect class="n" fill="#effdff" fill-opacity="0.7" x="-22" y="-86" width="9" height="2" rx="1"/>
    </g>
  </g>
</svg>
