<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -152 222 156" data-rig="static">
  <title>Livestream: een influencer gaat live, de assistent houdt de reflector vast</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- The set: a pastel backdrop with fairy lights, on a low stage. Origin = middle of the floor. -->
  <g id="set" transform="translate(0 0)">
    <rect class="o" fill="#e9defa" x="-100" y="-104" width="134" height="98" rx="15"/>
    <circle class="n" fill="#ffd1e6" cx="-30" cy="-58" r="35"/>
    <path class="n" fill="#ffffff" d="M-84 -78 l2.6 -6.4 l2.6 6.4 l6.4 2.6 l-6.4 2.6 l-2.6 6.4 l-2.6 -6.4 l-6.4 -2.6 Z M16 -46 l1.8 -4.6 l1.8 4.6 l4.6 1.8 l-4.6 1.8 l-1.8 4.6 l-1.8 -4.6 l-4.6 -1.8 Z"/>
    <path class="t" style="stroke:#8f84a6" d="M-90 -96 Q-70 -90 -48 -96 Q-26 -90 -4 -96 Q8 -92 14 -95"/>
    <circle class="o" style="stroke-width:1.4" fill="#ffd84d" cx="-80" cy="-91.4" r="2.8"/>
    <circle class="o" style="stroke-width:1.4" fill="#5ef2c4" cx="-59" cy="-91.6" r="2.8"/>
    <circle class="o" style="stroke-width:1.4" fill="#ff9ec4" cx="-37" cy="-91.6" r="2.8"/>
    <circle class="o" style="stroke-width:1.4" fill="#ffd84d" cx="-15" cy="-91.6" r="2.8"/>
    <circle class="o" style="stroke-width:1.4" fill="#5ef2c4" cx="6" cy="-92" r="2.8"/>
    <rect class="o" fill="#f6efe2" x="-104" y="-8" width="204" height="8" rx="3"/>
    <path class="n" fill="#e2d6c1" d="M-100 -3 L96 -3 L96 -1.4 L-100 -1.4 Z"/>
  </g>

  <!-- The beam of the ring light. It flares when the turret fires. Joint at the lamp. -->
  <g id="glow" transform="translate(66 -74)">
    <path class="n" fill="#fff6c9" fill-opacity="0.55" d="M0 -20 L-62 -33 L-62 37 L0 20 Z"/>
  </g>

  <!-- The assistant: worn out, holding up a reflector that gets heavier by the minute. Joint at his feet. -->
  <g id="asst_body" transform="translate(-82 -8)">
    <g transform="translate(82 8)">
      <path class="o" fill="#f4f1fa" d="M-92 -8 L-92 -11.5 L-86 -11.5 Q-82 -11 -81 -8 Z"/>
      <path class="o" fill="#f4f1fa" d="M-80 -8 L-80 -11.5 L-74 -11.5 Q-70 -11 -69 -8 Z"/>
      <path class="o" fill="#3d4f7a" d="M-93 -10 L-92 -34 Q-91 -45 -82 -46 Q-72 -45 -71 -34 L-69.5 -10 L-79 -10 L-81.5 -25 L-84 -10 Z"/>
      <path class="t" d="M-85.5 -45 L-82 -35 L-78.5 -45"/>
      <rect class="o" style="stroke-width:1.5" fill="#ffffff" x="-85.5" y="-35" width="7" height="8.5" rx="1.3"/>
    </g>
  </g>

  <g id="asst_head" data-parent="asst_body" transform="translate(-82 -46)">
    <g transform="translate(82 46)">
      <circle class="o" fill="#f0c19a" cx="-80" cy="-58.5" r="12"/>
      <path class="o" fill="#2f6bff" d="M-92 -55 Q-96 -73.5 -80 -72.5 Q-66 -72.5 -68 -62 Q-75 -67 -83 -64 Q-87.5 -60.5 -88.5 -52 Q-92 -51.5 -92 -55 Z"/>
      <path class="n" fill="#79a6ff" d="M-88 -67 Q-81 -71 -73 -68.5 Q-80 -68 -86 -64 Z"/>
      <!-- half-shut eyes with bags under them -->
      <path class="t" style="stroke-width:2" d="M-77.5 -58.4 L-72.5 -58.4"/>
      <path class="t" style="stroke-width:1.2" d="M-77.6 -55.6 Q-75 -54.2 -72.6 -55.6"/>
      <path class="o" fill="#f0c19a" d="M-68.6 -58 Q-65.4 -56 -68.6 -54.2"/>
      <path class="t" d="M-75 -50.6 L-70.4 -51"/>
      <path class="t" style="stroke-width:2.6" d="M-90 -68 Q-80 -77 -70 -68.5"/>
      <rect class="o" style="stroke-width:1.8" fill="#2a2536" x="-88.5" y="-64" width="6.6" height="10.5" rx="3"/>
      <path class="t" d="M-85 -54 Q-80 -47.5 -73 -48.6"/>
    </g>
  </g>

  <g id="asst_arms" data-parent="asst_body" transform="translate(-80 -40)">
    <g transform="translate(80 40)">
      <path class="t" style="stroke-width:3.4" d="M-66 -34 L-55 -60"/>
      <g transform="rotate(16 -50 -72)">
        <ellipse class="o" fill="#ffd84d" cx="-50" cy="-72" rx="14.5" ry="25"/>
        <ellipse class="n" fill="#fff3b8" cx="-48" cy="-74" rx="8.5" ry="18"/>
        <path class="n" fill="#ffffff" d="M-52 -90 Q-46 -92 -43 -84 Q-48 -88 -52 -86 Z"/>
      </g>
      <path class="o" fill="#4a5f8f" d="M-85 -43 L-66 -41 L-65 -33.5 L-85 -35.5 Z"/>
      <circle class="o" fill="#f0c19a" cx="-65" cy="-36.6" r="3.8"/>
    </g>
  </g>

  <!-- The influencer. First her ponytail and the arm on her hip, which go behind her. -->
  <g id="star_tail" data-parent="star_head" transform="translate(-8 -93)">
    <g transform="translate(8 93)">
      <path class="o" fill="#2f6bff" d="M-5 -97 Q-22 -102 -28 -85 Q-31 -70 -22 -57 Q-17.5 -64 -19 -74 Q-19.5 -84 -7 -88 Z"/>
      <path class="n" fill="#79a6ff" d="M-23.5 -86 Q-19 -95.5 -10 -95.5 Q-17.5 -93 -20.5 -84 Z"/>
    </g>
  </g>

  <g id="star_arm_back" data-parent="star_body" transform="translate(-9 -64)">
    <g transform="translate(9 64)">
      <path class="o" fill="#e6bd3a" d="M-11 -67 L-23.5 -56 L-14.5 -45 L-9 -49.5 L-14.5 -56 L-6 -62 Z"/>
    </g>
  </g>

  <g id="star_body" transform="translate(-1 -8)">
    <g transform="translate(1 8)">
      <path class="o" fill="#fafafa" d="M-13.5 -8 L-13.5 -12.5 L-4 -12.5 L-2 -8 Z"/>
      <path class="o" fill="#fafafa" d="M1 -8 L1 -12.5 L10.5 -12.5 L13.5 -8 Z"/>
      <path class="o" fill="#c8a8f0" d="M-14 -11 L-11.5 -46 L8.5 -46 L12.5 -11 L1.5 -11 L-1 -33 L-3.5 -11 Z"/>
      <path class="t" style="stroke:#a584d6" d="M-8.5 -40 L-9.5 -14 M6 -40 L7.5 -14"/>
      <path class="o" fill="#ffd84d" d="M-13 -42 Q-15.5 -54 -18.5 -66 L-10 -70.5 L8 -70.5 L15.5 -66 Q13.5 -54 10.5 -42 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M-5 -70.5 L1 -57 L7 -70.5 Z"/>
      <path class="t" d="M1 -57 L-0.5 -42"/>
      <circle class="n" fill="#2b1b16" cx="2.6" cy="-51" r="1.3"/>
    </g>
  </g>

  <g id="star_head" data-parent="star_body" transform="translate(0 -70)">
    <g transform="translate(0 70)">
      <rect class="o" fill="#e9b796" x="-3" y="-75.5" width="7.5" height="7.5" rx="2"/>
      <ellipse class="o" fill="#f3c9a5" cx="1" cy="-85" rx="13.5" ry="13"/>
      <path class="o" fill="#2f6bff" d="M-11.5 -80 Q-16 -99.5 1 -99 Q15 -98.5 15.5 -89 Q8 -94 0 -92 Q-5.5 -90.5 -7 -84 L-8 -77 Q-10.5 -77 -11.5 -80 Z"/>
      <path class="n" fill="#79a6ff" d="M-7 -94 Q0 -97.6 8 -95.4 Q1 -94.6 -5 -91 Z"/>
      <circle class="t" style="stroke:#e6b422;stroke-width:2" cx="-5.5" cy="-76.5" r="3.6"/>
      <circle class="n" fill="#2b1b16" cx="7.6" cy="-85.4" r="1.8"/>
      <circle class="n" fill="#2b1b16" cx="13" cy="-85.4" r="1.5"/>
      <path class="t" style="stroke-width:1.5" d="M5.8 -86.6 L3.6 -88.8 M4.6 -90.6 Q7.6 -92.2 10.4 -90.6"/>
      <path class="o" style="stroke-width:2" fill="#f3c9a5" d="M14 -84 Q17.6 -82 14 -80"/>
      <ellipse class="n" fill="#f29b8e" fill-opacity="0.6" cx="4.6" cy="-80.6" rx="2.8" ry="1.7"/>
    </g>
  </g>

  <g id="star_mouth" data-parent="star_head" transform="translate(10 -77.6)">
    <ellipse class="o" style="stroke-width:1.6" fill="#5a1f2a" cx="0" cy="0" rx="3.6" ry="3.3"/>
    <path class="n" fill="#ff8f9a" d="M-2 1.2 Q0 3.2 2 1.2 Q0 0.3 -2 1.2 Z"/>
  </g>

  <!-- The arm she holds out to the camera. -->
  <g id="star_arm" data-parent="star_body" transform="translate(7 -64)">
    <g transform="translate(-7 64)">
      <path class="o" fill="#ffd84d" d="M4 -69 L30 -75 L32 -67.5 L7.5 -59.5 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M27 -74.4 L30.6 -75.2 L32.4 -67.6 L29 -66.6 Z"/>
    </g>
  </g>

  <!-- Her hand: thumb up for the camera. Turned half a circle it is a thumb down. Joint in the fist. -->
  <g id="star_hand" data-parent="star_arm" transform="translate(37 -71)">
    <path class="o" style="stroke-width:2" fill="#f3c9a5" d="M-4.6 -4 L-4.2 -13 Q-1.8 -15.6 0.8 -13 L1.2 -4 Z"/>
    <rect class="o" style="stroke-width:2" fill="#f3c9a5" x="-5.5" y="-5" width="13" height="11" rx="3.6"/>
    <path class="t" style="stroke-width:1.2" d="M1.6 -1.6 L7 -1.6 M1.6 1.6 L7 1.6"/>
  </g>

  <!-- The ring light on its tripod, with the phone in the middle. Joint at the foot of the tripod. -->
  <g id="ring" transform="translate(74 -8)">
    <g transform="translate(-74 8)">
      <path class="t" style="stroke-width:3.2" d="M74 -36 L62 -8 M74 -36 L86 -8 M74 -46 L74 -8"/>
      <path class="o" fill="#fffbe6" fill-rule="evenodd" d="M59 -76 a15 29 0 1 0 30 0 a15 29 0 1 0 -30 0 Z M65.5 -76 a8.5 21.5 0 1 0 17 0 a8.5 21.5 0 1 0 -17 0 Z"/>
      <path class="n" fill="#ffffff" d="M62.6 -90 Q66 -101 74 -102.4 Q68.6 -98 66.4 -88.4 Z"/>
      <path class="t" style="stroke-width:2.4" d="M74 -47 L74 -62"/>
      <rect class="o" fill="#c8a8f0" x="68.6" y="-89" width="11" height="25" rx="2.6"/>
      <rect class="n" fill="#2a2536" x="70.6" y="-87" width="6" height="7.6" rx="1.6"/>
      <circle class="n" fill="#8f84a6" cx="72.4" cy="-85" r="1.1"/>
      <circle class="n" fill="#8f84a6" cx="74.8" cy="-82" r="1.1"/>
    </g>
    <circle data-mount="muzzle" fill="none" cx="17" cy="-68" r="1"/>
  </g>

  <!-- The light on the phone that says she is live. -->
  <g id="live" data-parent="ring" transform="translate(74 -93)">
    <circle class="o" style="stroke-width:1.6" fill="#ff3b4a" cx="0" cy="0" r="3.2"/>
  </g>

  <!-- What the followers send: hearts when she is sweet, something else when she is not. -->
  <g id="heart_a" transform="translate(52 -114)">
    <path class="o" style="stroke-width:1.9" fill="#ff5d8f" d="M0 5.4 Q-8.6 -1 -6.2 -5.2 Q-3 -8.6 0 -4 Q3 -8.6 6.2 -5.2 Q8.6 -1 0 5.4 Z"/>
  </g>
  <g id="heart_b" transform="translate(68 -134)">
    <path class="o" style="stroke-width:2" fill="#ff8fb5" d="M0 6.8 Q-10.8 -1.2 -7.8 -6.6 Q-3.8 -10.8 0 -5 Q3.8 -10.8 7.8 -6.6 Q10.8 -1.2 0 6.8 Z"/>
  </g>
  <g id="chat_a" transform="translate(90 -114)">
    <path class="o" style="stroke-width:1.9" fill="#ffffff" d="M-10 -5 Q-10 -10 -5 -10 L6 -10 Q11 -10 11 -5 L11 0 Q11 5 6 5 L-1 5 L-7 9.6 L-5.6 5 Q-10 5 -10 0 Z"/>
    <path class="t" style="stroke-width:2" d="M-5 -6.4 L-5.4 -1.6"/>
    <circle class="n" fill="#2b1b16" cx="-5.6" cy="1.4" r="1.2"/>
    <path class="t" style="stroke-width:1.8" d="M0.4 -6 Q2.6 -8.4 4.6 -6 Q5 -3.4 2.6 -2.6 L2.6 -1.4"/>
    <circle class="n" fill="#2b1b16" cx="2.6" cy="1.4" r="1.2"/>
  </g>
  <g id="chat_b" transform="translate(96 -136)">
    <path class="o" style="stroke-width:1.9" fill="#ffffff" d="M-9 -4.6 Q-9 -9 -4.6 -9 L5 -9 Q9.6 -9 9.6 -4.6 L9.6 -0.4 Q9.6 4 5 4 L-1 4 L-6 8 L-5 4 Q-9 4 -9 -0.4 Z"/>
    <path class="t" style="stroke-width:1.8" d="M-5.4 -4 q1.8 -2.6 3.6 0 t3.6 0 t3.6 0 M-5.4 0.2 q1.8 -2.6 3.6 0 t3.6 0"/>
  </g>
</svg>
