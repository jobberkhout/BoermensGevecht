    <path class="o" fill="#ffffff" d="M-12 -19 L11 -19 Q21 -19 21 -10 L21 -4 Q21 6 11 6 L8 6 L9.5 15 Q11 27.5 1.5 27.5 Q-7.5 27.5 -8 18.5 L-9 6 L-12 6 Z"/>
    <path class="t" d="M3 -11.5 L19.5 -11.5 M3 -3.5 L19.5 -3.5"/>
  </g>
</svg>
