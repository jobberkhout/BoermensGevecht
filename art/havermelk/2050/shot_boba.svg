<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17 -12 34 24" data-rig="static">
  <title>Drie tapiocaparels uit het rietje van Boba-Bibi</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <g id="pearls" transform="translate(0 0)">
    <!-- a splash of taro milk tea trailing behind -->
    <path class="o" fill="#d9bdf2" d="M-15 2 Q-11 -3 -6 0 Q-10 5 -15 2 Z"/>
    <circle class="o" fill="#6b4630" cx="-3.5" cy="-5" r="4.6"/>
    <circle class="o" fill="#5a3a26" cx="-2" cy="5.2" r="4.2"/>
    <circle class="o" fill="#7a5238" cx="8" cy="-0.5" r="5.4"/>
    <path class="n" fill="#c99a72" d="M5 -3.2 Q7.5 -5.2 10 -4 Q7.5 -3.6 6 -1.6 Z"/>
    <circle class="n" fill="#c99a72" cx="-5" cy="-6.6" r="1.3"/>
    <circle class="n" fill="#b98a62" cx="-3.4" cy="3.8" r="1.2"/>
  </g>
</svg>
