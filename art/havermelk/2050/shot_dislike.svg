<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 36 36" data-rig="static">
  <title>Een duimpje omlaag uit de livestream</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <g id="bubble" transform="translate(0 0)">
    <circle class="o" fill="#ff5d73" cx="0" cy="0" r="14.5"/>
    <path class="n" fill="#ff8d9c" d="M-10 -5 Q-7 -11.5 0 -12.5 Q-5 -9 -7.5 -3.5 Z"/>
    <!-- the cuff, the fist and the thumb pointing down -->
    <rect class="o" style="stroke-width:1.8" fill="#2f6bff" x="-10" y="-7.5" width="4.6" height="9.5" rx="1.4"/>
    <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M-5 -8 L5 -8 Q9 -8 9 -4 L9 -1.5 Q9 2.5 5 2.5 L3 2.5 L3.6 7 Q4 11 0.8 11 Q-2 11 -2.2 8 L-2.6 2.5 L-5 2.5 Z"/>
    <path class="t" style="stroke-width:1.3" d="M1.5 -4.6 L8.4 -4.6 M1.5 -1.2 L8.4 -1.2"/>
  </g>
</svg>
