<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -138 118 144" data-rig="humanoid">
  <title>Boba-Bibi</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The giant bubble tea she wears as a backpack: taro, with a face on the cup. Joint where the straps hold it. -->
  <g id="cup" data-parent="torso" transform="translate(-14 -58)">
    <path class="o" fill="#eaf6ff" fill-opacity="0.7" d="M-28 -26 Q-28 -39 -12.5 -39 Q3 -39 3 -26 Z"/>
    <path class="o" fill="#f6f1fb" d="M-27.5 -24 L2.5 -24 L-1.5 21 Q-1.7 24 -4.5 24 L-20.5 24 Q-23.3 24 -23.5 21 Z"/>
    <path class="n" fill="#cfa9ee" d="M-25.9 -14 L1 -14 L-2.6 20.4 Q-2.8 22.6 -5 22.6 L-20 22.6 Q-22.2 22.6 -22.4 20.4 Z"/>
    <path class="n" fill="#e3c9f7" d="M-25.9 -14 L1 -14 L0.7 -10.5 L-25.6 -10.5 Z"/>
    <circle class="n" fill="#5a3a26" cx="-19" cy="18.5" r="3.1"/>
    <circle class="n" fill="#6b4630" cx="-12.5" cy="19" r="3.1"/>
    <circle class="n" fill="#5a3a26" cx="-6.2" cy="18.5" r="3.1"/>
    <circle class="n" fill="#6b4630" cx="-16" cy="13.2" r="3.1"/>
    <circle class="n" fill="#5a3a26" cx="-9.4" cy="13.4" r="3.1"/>
    <circle class="n" fill="#6b4630" cx="-20.6" cy="9" r="2.8"/>
    <circle class="n" fill="#5a3a26" cx="-4.6" cy="9.4" r="2.8"/>
    <circle class="n" fill="#6b4630" cx="-12.6" cy="7.6" r="2.8"/>
    <path class="n" fill="#ffffff" fill-opacity="0.55" d="M-24.4 -21 L-20.4 -21 L-18.6 19 L-21.6 19 Z"/>
    <!-- the cup looks pleased with itself -->
    <circle class="n" fill="#2b1b16" cx="-15.5" cy="-4" r="1.5"/>
    <circle class="n" fill="#2b1b16" cx="-7.5" cy="-4" r="1.5"/>
    <path class="t" style="stroke-width:1.4" d="M-13.5 -0.6 Q-11.5 1.6 -9.5 -0.6"/>
    <path fill="none" stroke="#2b1b16" stroke-width="2.5" stroke-linejoin="round" d="M-27.5 -24 L2.5 -24 L-1.5 21 Q-1.7 24 -4.5 24 L-20.5 24 Q-23.3 24 -23.5 21 Z"/>
    <rect class="o" fill="#ffffff" x="-29.5" y="-27.5" width="34" height="4.6" rx="2"/>
  </g>

  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#dcdce6" d="M-6 -3 Q-8 12 -5 22 L5 22 Q7 10 6 -3 Z"/>
    <path class="o" fill="#dea888" d="M-4 22 L-3.5 30 Q0 36 3.5 30 L4 22 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#dea888" d="M-5 -3 L5 -3 L4.5 12 L-4.5 12 Z"/>
    <path class="o" fill="#dcdce6" d="M-5 9 L5 9 L4.4 30 L-4.4 30 Z"/>
    <path class="o" fill="#e77fae" d="M-7 31 Q-7 28 -4 28 L4 28 Q11 28.5 13 32.5 L13 34.5 L-7 34.5 Z"/>
    <rect class="o" fill="#dcdce6" x="-7.4" y="33.6" width="20.8" height="4.4" rx="1.4"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#f3c9a5" d="M-5 -3 L5 -3 L4.5 12 L-4.5 12 Z"/>
    <path class="o" fill="#fafafa" d="M-5 9 L5 9 L4.4 30 L-4.4 30 Z"/>
    <path fill="none" stroke="#a584d6" stroke-width="1.8" d="M-4.8 12.4 L4.8 12.4 M-4.7 15.6 L4.7 15.6"/>
    <path class="o" fill="#ff9ec4" d="M-7 31 Q-7 28 -4 28 L4 28 Q11 28.5 13 32.5 L13 34.5 L-7 34.5 Z"/>
    <rect class="o" fill="#fafafa" x="-7.4" y="33.6" width="20.8" height="4.4" rx="1.4"/>
  </g>

  <!-- A pink puffer vest over a pleated skirt. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#c8a8f0" d="M-13 -2 L13 -2 L18.5 12 L-17.5 12 Z"/>
    <path class="t" style="stroke:#a584d6" d="M-7 0 L-9.5 11 M0 0 L0.5 11 M7 0 L10.5 11"/>
    <path class="o" fill="#ff9ec4" d="M-14 3 Q-17 -14 -14 -29 Q-11 -37 0 -37 Q12 -37 15 -29 Q18 -14 14 3 Z"/>
    <path fill="none" stroke="#e87aa8" stroke-width="1.8" stroke-linecap="round" d="M-15.2 -22 Q0 -19 16 -22 M-16 -12.5 Q0 -9.5 16.6 -12.5 M-15.4 -3.5 Q0 -0.5 15.4 -3.5"/>
    <path class="o" style="stroke-width:1.8" fill="#f4f1fa" d="M-9 -36.5 L-4 -37.5 Q-7.5 -24 -9 -9 L-13.8 -10 Q-12.5 -25 -9 -36.5 Z"/>
    <path class="o" fill="#ffffff" d="M-6 -39 Q1 -43 9 -39 L8.5 -32.5 Q1 -35.5 -5.5 -32.5 Z"/>
    <circle class="o" style="stroke-width:1.4" fill="#5ef2c4" cx="8" cy="-27" r="2.6"/>
  </g>

  <!-- Two blue buns; this is the far one. -->
  <g id="bun_back" data-parent="head" transform="translate(-8 -115)">
    <circle class="o" fill="#1f49c4" cx="0" cy="-3" r="8"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#dea888" x="-4" y="-6" width="9" height="9" rx="2"/>
    <path class="o" fill="#1f49c4" d="M-18 -24 Q-23 -8 -14 -2 L-5 -9 Z"/>
    <ellipse class="o" fill="#f3c9a5" cx="2" cy="-21" rx="18.5" ry="18"/>
    <ellipse class="o" fill="#f3c9a5" cx="-8.5" cy="-17.5" rx="3.4" ry="4.8"/>
    <path class="o" fill="#2f6bff" d="M-17 -15 Q-23 -40 2 -41.5 Q22 -41.5 22.5 -29 Q15 -34 7 -32 Q-3 -30.5 -7.5 -24 Q-10.5 -16 -13 -8 Q-18 -9.5 -17 -15 Z"/>
    <path class="n" fill="#79a6ff" d="M-9 -36 Q0 -40 10 -37.5 Q2 -36.5 -7 -32.5 Z"/>
    <circle class="n" fill="#2b1b16" cx="10" cy="-20.5" r="2"/>
    <circle class="n" fill="#2b1b16" cx="18.4" cy="-20.5" r="1.8"/>
    <path class="t" style="stroke-width:1.3" d="M7.6 -23.4 L6 -25.2 M10 -24 L9.6 -26.2"/>
    <!-- the visor: you can look through it, and she can look at her feed -->
    <path class="o" style="stroke-width:1.9" fill="#7fe9ff" fill-opacity="0.42" d="M-1 -27 L24 -28 Q27 -21.5 24.5 -15 L-1 -16 Q-3 -21.5 -1 -27 Z"/>
    <path class="n" fill="#ffffff" fill-opacity="0.6" d="M2 -25.6 L7 -25.8 L3.4 -17.4 L0.4 -17.5 Q-0.6 -21.5 2 -25.6 Z"/>
    <path class="t" d="M-2 -21.5 L-8 -19.5"/>
    <path class="o" fill="#f3c9a5" d="M21 -15 Q25 -12.5 21 -10.4"/>
    <path class="t" style="stroke-width:1.9" d="M11 -7.6 Q14.5 -5.6 18 -8"/>
  </g>

  <!-- She puffs this up before she blows. -->
  <g id="cheek" data-parent="head" transform="translate(8 -87)">
    <ellipse class="n" fill="#f29b8e" fill-opacity="0.7" cx="0" cy="0" rx="3.8" ry="2.4"/>
  </g>

  <g id="bun_front" data-parent="head" transform="translate(11 -116)">
    <circle class="o" fill="#2f6bff" cx="0" cy="-4" r="8.5"/>
    <path class="n" fill="#79a6ff" d="M-4.5 -7.5 Q-1 -10.5 3 -9 Q-0.5 -8.5 -3.5 -5.5 Z"/>
    <ellipse class="o" style="stroke-width:1.6" fill="#ff9ec4" cx="0" cy="3.4" rx="5.4" ry="2.3"/>
  </g>

  <!-- The arm that holds the straw to her lips. -->
  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#fafafa" d="M-6 -3 Q-8 8 -6 17 Q-1 23 5 19 Q7 8 6 -3 Z"/>
    <path class="o" fill="#fafafa" d="M-5.5 12.5 L11.5 -13.5 L18.5 -9.5 L3 21.5 Z"/>
    <path class="n" fill="#fafafa" d="M-4.4 13 L3 8.5 L5.6 16.5 L-1.6 20.4 Z"/>
    <circle class="o" fill="#f3c9a5" cx="16.5" cy="-13.5" r="4.6"/>
  </g>

  <!-- The fat straw, used as a blowpipe. Joint in her fist; the far end is where the pearls come out. -->
  <g id="prop" data-parent="arm_front" transform="translate(26.5 -85.5)">
    <path class="o" fill="#3fd9c0" d="M-9.5 -3.4 L29.5 -3.4 L34 3.4 L-9.5 3.4 Z"/>
    <path class="n" fill="#ffffff" d="M4 -2.2 L8 -2.2 L5 2.2 L1 2.2 Z M13 -2.2 L17 -2.2 L14 2.2 L10 2.2 Z M22 -2.2 L26 -2.2 L23 2.2 L19 2.2 Z"/>
    <path class="t" d="M29.5 -3.4 L34 3.4"/>
    <ellipse class="o" style="stroke-width:1.8" fill="#f3c9a5" cx="-0.5" cy="1" rx="2.6" ry="3.9"/>
    <circle data-mount="muzzle" fill="none" cx="35" cy="0" r="1"/>
  </g>
</svg>
