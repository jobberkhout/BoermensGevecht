<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -150 222 156" data-rig="free">
  <title>Kweekvleesblob: uit het lab ontsnapt, met de bioreactor nog op de rug</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .fat { stroke: #ffe3e6; stroke-width: 3; stroke-linecap: round; fill: none; }
  </style>

  <!-- Everything hangs from this, so one track can squash or shove the whole blob. -->
  <g id="blob" transform="translate(0 0)"/>

  <!-- The foot it oozes along on. Joint at the tail end, so it stretches forward. -->
  <g id="foot" data-parent="blob" transform="translate(-90 0)">
    <g transform="translate(90 0)">
      <ellipse class="o" fill="#d95a70" cx="-102" cy="-3.4" rx="4.4" ry="2.8"/>
      <path class="o" fill="#d95a70" d="M-93 -1 Q-98 -14 -82 -18 Q-40 -27 16 -25 Q64 -23 86 -13 Q96 -6 90 -1 Q40 3 -93 -1 Z"/>
      <path class="n" fill="#f07888" d="M-80 -14 Q-40 -22 6 -21 Q-40 -17.5 -80 -10.5 Z"/>
    </g>
  </g>

  <!-- The cracked glass bioreactor it carries like a snail shell. Joint where it rests on the foot. -->
  <g id="tank" data-parent="blob" transform="translate(-38 -20)">
    <g transform="rotate(-10)">
      <path class="t" style="stroke-width:4.6" d="M-42 -10 Q-58 -4 -52 8 Q-48 15 -57 19"/>
      <path fill="none" stroke="#c8a8f0" stroke-width="2" stroke-linecap="round" d="M-42 -10 Q-58 -4 -52 8 Q-48 15 -57 19"/>
      <path class="n" fill="#f7a3ad" d="M-34 -4 L36 -4 L36 -46 Q12 -54 -6 -40 Q-22 -30 -34 -35 Z"/>
      <path class="n" fill="#ffc7cf" d="M-30 -30 Q-20 -27 -8 -35 Q4 -44 20 -45 Q4 -40 -6 -31 Q-20 -22 -30 -26 Z"/>
      <rect class="o" fill="#cdeef7" fill-opacity="0.42" x="-36" y="-60" width="74" height="58" rx="9"/>
      <path class="n" fill="#ffffff" fill-opacity="0.6" d="M-28 -56 L-17 -56 L-25 -42 L-31 -42 Z M-13 -56 L-9 -56 L-17 -42 L-20 -42 Z"/>
      <path class="t" d="M12 -60 L7 -50 L15 -43 L9 -33 M7 -50 L-3 -47 M15 -43 L24 -46 M9 -33 L16 -27"/>
      <rect class="o" fill="#b9bec2" x="-9" y="-62" width="5.5" height="62" rx="2"/>
      <rect class="o" fill="#b9bec2" x="30" y="-63" width="9" height="64" rx="3"/>
      <rect class="o" fill="#9aa0a4" x="-47" y="-55" width="13" height="48" rx="3.5"/>
      <circle class="o" fill="#f4f1fa" cx="-41" cy="-40" r="6.5"/>
      <path class="t" style="stroke:#e5283f;stroke-width:1.8" d="M-41 -40 L-37 -44"/>
      <rect class="o" style="stroke-width:1.8" fill="#6f777c" x="-52" y="-24" width="6" height="9" rx="1.5"/>
      <circle class="o" style="stroke-width:1.8" fill="#ff4a3d" cx="-40.5" cy="-16" r="3"/>
    </g>
  </g>

  <!-- The far pseudopod, behind the body. -->
  <g id="arm_back" data-parent="front" transform="translate(78 -24)">
    <path class="o" fill="#d95a70" d="M-8 -6 Q8 -12 19 -4 Q27 4 22 14 Q17 21 10 16 Q14 8 7 5 Q-6 6 -8 -6 Z"/>
  </g>

  <!-- The body that pours out of the tank. Joint at the middle of its base, so it squashes onto the ground. -->
  <g id="front" data-parent="blob" transform="translate(40 0)">
    <g transform="translate(-40 0)">
      <path class="o" fill="#f07888" d="M88 -11 Q99 -10 97 -2 Q92 2.5 87 -2 Z"/>
      <path class="o" fill="#f07888" d="M-14 -8 Q-23 -44 -7 -74 Q9 -102 46 -101 Q82 -98 92 -64 Q99 -32 90 -8 Q40 2 -14 -8 Z"/>
      <path class="n" fill="#d95a70" d="M-12.6 -9.4 Q40 0.4 88.6 -9.4 Q92 -18 92.6 -27 Q40 -10 -15.6 -27 Q-15 -17 -12.6 -9.4 Z"/>
      <path class="n" fill="#fba9b3" d="M-2 -68 Q12 -94 42 -96 Q16 -88 4 -62 Z"/>
      <!-- marbled, like a good steak -->
      <path class="fat" d="M-8 -52 Q4 -61 16 -54 Q22 -51 28 -55 M0 -73 Q10 -81 21 -75 M30 -21 Q40 -27 50 -21 M66 -20 Q76 -26 86 -21 M-9 -21 Q-2 -26 6 -21"/>
      <path class="t" style="stroke:#c9506a" d="M-10 -34 Q-2 -38 4 -34 M76 -52 Q84 -50 88 -44"/>
      <!-- the label of the brand that made it: a green leaf, still stuck on -->
      <g transform="rotate(-14 14 -34)">
        <rect class="o" style="stroke-width:1.9" fill="#fffdf5" x="2" y="-45" width="24" height="22" rx="5"/>
        <path class="o" style="stroke-width:1.6" fill="#4bb167" d="M7 -27.5 Q5 -40.5 21 -41 Q22.5 -27 7 -27.5 Z"/>
        <path class="t" style="stroke:#2c7a40;stroke-width:1.4" d="M8 -28.5 Q13 -34 19.5 -39"/>
      </g>
    </g>
  </g>

  <g id="mouth" data-parent="front" transform="translate(57 -45)">
    <path class="o" style="stroke-width:2" fill="#7a1f33" d="M-13 -4 Q-1 11 13 -5 Q0 1 -13 -4 Z"/>
    <path class="n" fill="#ff8f9a" d="M-4.4 3.4 Q0.4 7.4 5.4 2.8 Q0.6 1.6 -4.4 3.4 Z"/>
  </g>

  <!-- Googly eyes: each pupil turns around the middle of its eye. -->
  <g id="eye_back" data-parent="front" transform="translate(40 -80)">
    <circle class="o" fill="#ffffff" cx="0" cy="0" r="10.5"/>
  </g>
  <g id="pupil_back" data-parent="eye_back" transform="translate(40 -80)">
    <circle class="n" fill="#2b1b16" cx="3.4" cy="2.6" r="4.6"/>
    <circle class="n" fill="#ffffff" cx="2" cy="1.2" r="1.3"/>
  </g>
  <g id="eye_front" data-parent="front" transform="translate(68 -72)">
    <circle class="o" fill="#ffffff" cx="0" cy="0" r="13"/>
  </g>
  <g id="pupil_front" data-parent="eye_front" transform="translate(68 -72)">
    <circle class="n" fill="#2b1b16" cx="4.4" cy="1.6" r="5.8"/>
    <circle class="n" fill="#ffffff" cx="2.6" cy="-0.2" r="1.6"/>
  </g>

  <!-- A sprig of parsley, for presentation. Joint where the stem goes in. -->
  <g id="parsley" data-parent="front" transform="translate(47 -100)">
    <path class="t" style="stroke:#2c7a40;stroke-width:2.6" d="M0 1 Q-1.5 -7 1.5 -13 M-0.4 -4 Q-6 -6 -8.5 -11 M0.4 -6.5 Q6.5 -8 9 -12"/>
    <path class="o" style="stroke-width:1.8" fill="#3f9b57" d="M-9 -9 q-5 0 -4.6 -4.4 q-1.6 -4.4 3.4 -4.6 q2 -4 5.4 -1 q5 -0.4 3.6 4.2 q2 4.4 -3.4 5 q-1.6 2.4 -4.4 0.8 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#3f9b57" d="M9.6 -10 q-4.6 0.4 -4.4 -3.8 q-1.8 -4 2.8 -4.6 q1.8 -3.8 5 -1.2 q4.8 -0.6 3.6 3.8 q2.2 4 -2.8 4.8 q-1.4 2.4 -4.2 1 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#4bb167" d="M2 -12.5 q-6.4 -0.6 -5.4 -6.2 q-2.4 -5.4 4 -5.8 q2.2 -5.4 6.6 -1.6 q6.4 -1.2 4.6 5 q3.2 5.2 -3.8 6.4 q-2.2 3.4 -6 2.2 Z"/>
  </g>

  <!-- The near pseudopod: this is the one it slaps with. -->
  <g id="arm" data-parent="front" transform="translate(89 -30)">
    <path class="o" fill="#f07888" d="M-8 -7 Q6 -13 16 -5 Q24 4 19 15 Q14 23 6 18 Q10 9 3 6 Q-8 6 -8 -7 Z"/>
    <path class="n" fill="#fba9b3" d="M-3 -6 Q6 -9.5 12.5 -4.5 Q5 -6 -1.5 -3 Z"/>
  </g>
</svg>
