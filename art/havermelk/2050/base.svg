    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .g1 { fill: #3f9b57; stroke: #2b1b16; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
    .g2 { fill: #56b96e; stroke: #2b1b16; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
