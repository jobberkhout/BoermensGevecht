<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -136 112 142" data-rig="humanoid">
  <title>VR-Vik</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .glow { stroke: #5ef2c4; stroke-width: 2; stroke-linecap: round; fill: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#2f2a3a" d="M-6 -3 Q-8 10 -5.5 21 L5.5 21 Q7 10 6 -3 Z"/>
    <path class="o" fill="#c9c2da" d="M-6.5 19 L6.5 19 L7.5 29 Q7.5 37 0 37 Q-7.5 37 -7.5 29 Z"/>
    <path class="o" fill="#3fcfa6" d="M-6.8 19 L6.8 19 L7.2 23.5 L-7.2 23.5 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#3d3852" d="M-7.5 -3 L7.5 -3 L6.5 29 L-6.5 29 Z"/>
    <rect class="o" fill="#2a2536" x="-7" y="26" width="14" height="5" rx="1.5"/>
    <path class="o" fill="#d9d9e0" d="M-7 33.5 Q-7 30.5 -4 30.5 L4 30.5 Q11 31.5 13 35 L13 38 L-7 38 Z"/>
    <path class="n" fill="#3fcfa6" d="M-6 36 L12.5 36 L12.5 37.6 L-6 37.6 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#4a4560" d="M-7.5 -3 L7.5 -3 L6.5 29 L-6.5 29 Z"/>
    <path class="n" fill="#5d5778" d="M1 -1 L5.5 -1 L5 25 L1.5 25 Z"/>
    <!-- a strap for nothing in particular: it is techwear -->
    <path class="o" style="stroke-width:1.8" fill="#c8a8f0" d="M-7.6 7 L7.6 7 L7.4 11.5 L-7.4 11.5 Z"/>
    <rect class="n" fill="#2b1b16" x="0.5" y="7.8" width="3.4" height="3" rx="0.8"/>
    <rect class="o" fill="#2f2a3a" x="-7" y="26" width="14" height="5" rx="1.5"/>
    <path class="o" fill="#fafafa" d="M-7 33.5 Q-7 30.5 -4 30.5 L4 30.5 Q11 31.5 13 35 L13 38 L-7 38 Z"/>
    <path class="n" fill="#5ef2c4" d="M-6 36 L12.5 36 L12.5 37.6 L-6 37.6 Z"/>
    <path class="glow" style="stroke-width:1.7" d="M2 32.5 L6 34.6"/>
  </g>

  <!-- An oversized hoodie with a chest strap and a zip that glows. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#2f2a3a" d="M-15 -27 Q-24 -40 -9 -44 Q0 -45 3 -37 Z"/>
    <path class="o" fill="#3a3550" d="M-16 7 Q-19 -14 -16 -30 Q-12 -38 0 -38 Q13 -38 17 -30 Q20 -14 16 7 Z"/>
    <path class="n" fill="#2f2a3a" d="M-15 6 Q-17.5 -14 -15 -29 Q-11 -20 -10 6 Z"/>
    <path class="glow" d="M5 -36 L5 2"/>
    <path class="o" style="stroke-width:1.8" fill="#c8a8f0" d="M-13.5 -33 L-8.5 -36 L17.5 -12 L16.5 -6 Z"/>
    <rect class="o" style="stroke-width:1.5" fill="#2a2536" x="-1.5" y="-25.5" width="7" height="6" rx="1.4" transform="rotate(42 2 -22.5)"/>
    <path class="t" d="M-7 -3 Q3 -7 13 -3"/>
    <rect class="o" fill="#2a2536" x="-15.5" y="3" width="31" height="4.5" rx="1.6"/>
  </g>

  <!-- The blue hair that the headset strap pushes up. Joint where it leaves his crown. -->
  <g id="tuft" data-parent="head" transform="translate(-1 -112)">
    <path class="o" fill="#2f6bff" d="M-10 3 L-15 -11 L-6.5 -5 L-4 -18 L2 -6.5 L9.5 -14 L9 4 Z"/>
    <path class="n" fill="#79a6ff" d="M-3.8 -13 L-0.5 -6 L-4.6 -3.4 Z"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#a06c45" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#bd8759" cx="2" cy="-21" rx="18" ry="17.5"/>
    <ellipse class="o" fill="#bd8759" cx="-8.5" cy="-17" rx="3.4" ry="4.8"/>
    <path class="o" fill="#2f6bff" d="M-16 -14 Q-22 -40 2 -40.5 Q16 -41 21 -31 L5 -31 Q-6 -31 -9.5 -22 Q-11 -14 -12.5 -8 Q-17 -9 -16 -14 Z"/>
    <path class="n" fill="#79a6ff" d="M-9 -35.5 Q0 -39.5 10 -37 Q2 -36 -7 -32 Z"/>
    <!-- the headset: a strap round the back, one over the top, and the box that hides his eyes -->
    <path class="t" style="stroke-width:3.6" d="M-11 -34.5 Q2 -45.5 14 -33"/>
    <path class="o" fill="#2a2536" d="M-18 -27.5 L7 -29.5 L7 -21 L-17.5 -18.5 Z"/>
    <path class="o" fill="#3a3550" d="M3.5 -31.5 L9 -32.5 L9 -12.5 L3.5 -13.5 Z"/>
    <path class="o" fill="#f4f1fa" d="M8 -34 L21 -34 Q29 -34 29 -26.5 L29 -18 Q29 -11 21 -11 L8 -11 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#2a2536" d="M21.5 -34 Q29 -34 29 -26.5 L29 -18 Q29 -11 21.5 -11 Z"/>
    <path class="n" fill="#ffffff" d="M10 -32 L18.5 -32 L18.5 -30.4 L10 -30.4 Z"/>
    <path class="glow" style="stroke-width:2.6" d="M11.5 -21 L18 -21"/>
    <circle class="n" fill="#c8a8f0" cx="12.5" cy="-27" r="1.7"/>
    <circle class="n" fill="#2b1b16" cx="17" cy="-27" r="1.2"/>
    <path class="o" fill="#bd8759" d="M21 -12 Q25.5 -9.5 21.2 -7.2"/>
    <!-- a gamer's grin -->
    <path class="o" style="stroke-width:1.8" fill="#5a1f2a" d="M8 -7 Q13.5 1.5 19.5 -6.6 Q13.5 -8.6 8 -7 Z"/>
    <path class="n" fill="#ffffff" d="M10 -6.6 Q13.6 -7.8 17.6 -6.2 L16.8 -4.6 Q13.6 -5.6 10.8 -4.8 Z"/>
  </g>

  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#454063" d="M-6.5 -3 Q-8.5 10 -6 21 L6 21 Q7.5 10 6.5 -3 Z"/>
    <path class="glow" style="stroke-width:1.8" d="M0 1 L0 17"/>
    <!-- a haptic glove, two sizes too big -->
    <path class="o" fill="#f4f1fa" d="M5.5 25.5 Q11.5 25 11 30.5 Q9.5 34 6 32.5 Z"/>
    <path class="o" fill="#f4f1fa" d="M-7 19 L7 19 L8 29 Q8 38 0 38 Q-8 38 -8 29 Z"/>
    <path class="o" fill="#5ef2c4" d="M-7.2 19 L7.2 19 L7.6 23.5 L-7.6 23.5 Z"/>
    <circle class="n" fill="#5ef2c4" cx="-4" cy="32.5" r="1.4"/>
    <circle class="n" fill="#5ef2c4" cx="0" cy="33.8" r="1.4"/>
    <circle class="n" fill="#5ef2c4" cx="4" cy="32.5" r="1.4"/>
  </g>
</svg>
