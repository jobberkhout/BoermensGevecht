<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -128 112 134" data-rig="humanoid">
  <title>Padel-Pepijn</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#e3e3e3" d="M-6 -3 Q-8 4 -6 11 L5.5 11 Q7 4 6 -3 Z"/>
    <path class="o" fill="#dea888" d="M-4.5 11 L-3.5 28 Q0 34 3.5 28 L4.5 11 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#dea888" d="M-5 10 L5 10 L4 23 L-4 23 Z"/>
    <path class="o" fill="#c9b78f" d="M-7.5 -3 L7.5 -3 L7 13 L-7 13 Z"/>
    <path class="o" fill="#e9e9e9" d="M-4.5 21 L4.5 21 L4 32.5 L-4 32.5 Z"/>
    <path class="o" fill="#e9e9e9" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
    <path class="n" fill="#c9c9c9" d="M-6 36 L12.5 36 L12.5 37.6 L-6 37.6 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#f3c9a5" d="M-5 10 L5 10 L4 23 L-4 23 Z"/>
    <path class="o" fill="#d8c7a0" d="M-7.5 -3 L7.5 -3 L7 13 L-7 13 Z"/>
    <path class="n" fill="#e6d8b6" d="M1 -1 L5.5 -1 L5 11 L1.5 11 Z"/>
    <path class="o" fill="#fafafa" d="M-4.5 21 L4.5 21 L4 32.5 L-4 32.5 Z"/>
    <path fill="none" stroke="#27406b" stroke-width="1.7" d="M-4.2 23.5 L4.2 23.5 M-4.1 26.2 L4.1 26.2"/>
    <path class="o" fill="#fafafa" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
    <path class="n" fill="#d6d6d6" d="M-6 36 L12.5 36 L12.5 37.6 L-6 37.6 Z"/>
    <path fill="none" stroke="#2bb8a4" stroke-width="1.7" stroke-linecap="round" d="M2 32.5 L6 35"/>
  </g>

  <!-- White polo under a navy bodywarmer. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#fafafa" d="M-14 6 Q-17 -14 -14 -30 Q-11 -37 0 -37 Q12 -37 15 -30 Q18 -14 14 6 Z"/>
    <path class="o" fill="#27406b" d="M-15.5 3 Q-18.5 -14 -15.5 -29 Q-12 -37 -4 -37.5 L1 -22 L8 -37.5 Q13 -36.5 16.5 -29 Q19.5 -14 15.5 3 Z"/>
    <path fill="none" stroke="#3b5a91" stroke-width="1.8" stroke-linecap="round" d="M-16.5 -22 L-2 -22 M4.5 -22 L17.5 -22 M-17.5 -13 L18.5 -13 M-17.2 -4 L17.2 -4"/>
    <path class="t" d="M1 -22 L1 3"/>
    <path class="o" fill="#fafafa" d="M-4 -37.5 L1 -29 L7.5 -37.5 Q2 -40 -4 -37.5 Z"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#dea888" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#f3c9a5" cx="2" cy="-21" rx="18" ry="17.5"/>
    <ellipse class="o" fill="#f3c9a5" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <!-- swept-back hair above a white sweatband -->
    <path class="o" fill="#7a5236" d="M-15 -24 Q-20 -43 0 -43.5 Q13 -45 21 -36 Q14 -37 9 -33 Q-3 -36 -14 -27 Z"/>
    <path class="n" fill="#9a6e4d" d="M-9 -38 Q0 -42.5 12 -39.5 Q3 -39 -6 -34.5 Z"/>
    <path class="o" fill="#fafafa" d="M-15.5 -27 Q0 -37 20.5 -31 L20 -26 Q0 -32 -15 -22 Z"/>
    <path class="o" fill="#7a5236" d="M-16 -26 Q-18 -14 -12 -9 L-10.5 -22 Z"/>
    <circle class="n" fill="#2b1b16" cx="9.5" cy="-20" r="2"/>
    <circle class="n" fill="#2b1b16" cx="17.5" cy="-20" r="1.8"/>
    <path class="t" style="stroke-width:2" d="M5.5 -25.5 Q9.5 -28 13 -25.5 M15.5 -26 Q18 -27.5 20 -26"/>
    <path class="o" fill="#f3c9a5" d="M19.5 -18 Q24 -15 19.8 -12.8"/>
    <!-- a smug grin -->
    <path class="o" fill="#ffffff" d="M7 -10.5 Q13 -4 19 -11 Q13 -12.5 7 -10.5 Z"/>
    <path class="t" d="M5 -11.5 L7 -10.5"/>
  </g>

  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#fafafa" d="M-6 -3 Q-8 4 -6 11 L5.5 11 Q7 4 6 -3 Z"/>
    <path class="o" fill="#f3c9a5" d="M-4.5 11 L-3 27 Q0.5 30 4 27 L4.5 11 Z"/>
    <rect class="o" fill="#2b1b16" x="-4.4" y="20.5" width="8.6" height="4" rx="1.6"/>
    <circle class="o" fill="#f3c9a5" cx="1" cy="30.5" r="4.6"/>
  </g>

  <!-- The racket. Joint in his fist; it points forward and up when his arm hangs. -->
  <g id="prop" data-parent="arm_front" transform="translate(11 -41.5)">
    <g transform="rotate(60)">
      <path class="o" fill="#5a4636" d="M-2 3 L-2 -11 L2 -11 L2 3 Z"/>
      <path class="o" fill="#2bb8a4" d="M0 -10 Q-11 -14 -10 -27 Q-8 -37 0 -37 Q8 -37 10 -27 Q11 -14 0 -10 Z"/>
      <path class="n" fill="#57d6c4" d="M-5 -31.5 Q-1 -35.5 4 -33.5 Q0 -32.5 -3.5 -28 Z"/>
      <circle class="n" fill="#1a7f71" cx="-2.2" cy="-17.5" r="1.3"/>
      <circle class="n" fill="#1a7f71" cx="2.2" cy="-17.5" r="1.3"/>
      <circle class="n" fill="#1a7f71" cx="-4.3" cy="-22.5" r="1.3"/>
      <circle class="n" fill="#1a7f71" cx="0" cy="-22.5" r="1.3"/>
      <circle class="n" fill="#1a7f71" cx="4.3" cy="-22.5" r="1.3"/>
      <circle class="n" fill="#1a7f71" cx="-2.2" cy="-27.5" r="1.3"/>
      <circle class="n" fill="#1a7f71" cx="2.2" cy="-27.5" r="1.3"/>
    </g>
  </g>
</svg>
