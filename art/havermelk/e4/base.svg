    <path class="n" fill="#4b3d63" d="M-288 -156 L-12 -156 L-12 -144 L-288 -144 Z"/>
    <path class="t" style="stroke:#6f6289" d="M-150 -280 L-150 -254"/>
    <path class="o" fill="#ffe9a8" d="M-156 -254 L-144 -254 L-141 -244 L-159 -244 Z"/>
    <path class="o" fill="#8a7a9f" d="M-80 -144 L-80 -176 Q-66 -184 -52 -176 L-52 -144 Z"/>
