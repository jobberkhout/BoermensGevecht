<svg xmlns="http://www.w3.org/2000/svg" viewBox="-312 -596 328 602" data-rig="static">
  <title>De Broedplaats: een opgeknapt pakhuis vol flexplekken</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- (0,0) is the foot of the doorway, where units come out. The building stands behind it, to the left. -->
  <g id="building" transform="translate(0 0)">
    <!-- flagpole on the flat part of the roof -->
    <path class="t" style="stroke-width:5" d="M-288 -444 L-288 -552"/>
    <circle class="o" fill="#ffd21f" cx="-288" cy="-555" r="4.5"/>

    <!-- the clock gable with its hoisting beam -->
    <path class="o" fill="#b96a4c" d="M-196 -440 Q-194 -476 -160 -480 Q-152 -520 -112 -524 Q-72 -520 -64 -480 Q-30 -476 -28 -440 Z"/>
    <path class="t" style="stroke:#f4ecdc;stroke-width:5" d="M-190 -444 Q-186 -472 -158 -475 Q-148 -514 -112 -518 Q-76 -514 -66 -475 Q-38 -472 -34 -444"/>
    <circle class="o" fill="#34424b" cx="-112" cy="-474" r="13"/>
    <path class="t" style="stroke:#f4ecdc;stroke-width:2.4" d="M-112 -487 L-112 -461 M-125 -474 L-99 -474"/>
    <path class="o" fill="#5a4636" d="M-116 -512 L-60 -512 L-60 -505 L-116 -505 Z"/>
    <path class="t" d="M-66 -505 L-66 -486"/>
    <path class="t" style="stroke-width:2.4" d="M-66 -486 Q-60 -480 -66 -476 Q-71 -474 -71 -479"/>

    <!-- the front -->
    <rect class="o" fill="#b96a4c" x="-296" y="-440" width="292" height="440"/>
    <path class="t" style="stroke:#d08e70;stroke-width:2.4" d="M-284 -418 L-266 -418 M-240 -426 L-222 -426 M-60 -422 L-42 -422 M-26 -408 L-12 -408 M-288 -124 L-274 -124 M-104 -132 L-96 -132 M-20 -132 L-10 -132 M-288 -40 L-272 -40 M-104 -52 L-98 -52"/>
    <rect class="o" fill="#f4ecdc" x="-302" y="-450" width="304" height="12" rx="3"/>
    <rect class="o" fill="#9a958f" x="-298" y="-14" width="296" height="14"/>

    <!-- two upper floors: big openings, empty until someone moves in -->
    <rect class="o" fill="#3a2e4a" x="-290" y="-432" width="280" height="140"/>
    <path class="n" fill="#4b3d63" d="M-288 -306 L-12 -306 L-12 -294 L-288 -294 Z"/>
    <path class="t" style="stroke:#6f6289" d="M-150 -430 L-150 -404"/>
    <path class="o" fill="#ffe9a8" d="M-156 -404 L-144 -404 L-141 -394 L-159 -394 Z"/>
    <path class="o" fill="#8a7a9f" d="M-250 -294 L-246 -326 L-222 -326 L-218 -294 Z"/>
    <path class="t" style="stroke:#6f6289;stroke-width:3" d="M-70 -294 L-62 -350 M-40 -294 L-48 -350 M-66 -322 L-44 -322"/>
