    <path class="o" fill="#fffaf0" d="M-240 -52 L-238 -64 L-228 -64 L-226 -52 Z"/>
    <path class="o" fill="#3f9b57" d="M-214 -111 Q-222 -98 -214 -88 Q-206 -98 -214 -111 Z"/>
    <path class="o" fill="#3f9b57" d="M-198 -111 Q-204 -102 -198 -94 Q-192 -102 -198 -111 Z"/>
    <path class="o" fill="#ecdcb9" d="M-294 -132 L-102 -132 L-96 -112 L-300 -112 Z"/>
    <path class="n" fill="#ffffff" d="M-270 -131 L-246 -131 L-248 -113 L-274 -113 Z M-222 -131 L-198 -131 L-198 -113 L-224 -113 Z M-174 -131 L-150 -131 L-148 -113 L-174 -113 Z M-126 -131 L-104 -131 L-98 -113 L-124 -113 Z"/>
    <path class="t" style="stroke-width:3" d="M-294 -132 L-102 -132 L-96 -112 L-300 -112 Z"/>

    <!-- the doorway units come out of -->
    <path class="o" fill="#1f3d2b" d="M-98 0 L-98 -100 Q-98 -128 -52 -128 Q-6 -128 -6 -100 L-6 0 Z"/>
    <path class="o" fill="#241b26" d="M-88 0 L-88 -98 Q-88 -118 -52 -118 Q-16 -118 -16 -98 L-16 0 Z"/>

    <circle data-mount="turret0" cx="-150" cy="-144" r="1"/>
    <circle data-mount="turret1" cx="-150" cy="-294" r="1"/>
    <circle data-mount="flag" cx="-286" cy="-548" r="1"/>
  </g>
</svg>
