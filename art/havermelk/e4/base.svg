    <!-- ground floor: the coffee bar window under its awning -->
    <rect class="o" fill="#1f3d2b" x="-286" y="-118" width="176" height="104" rx="3"/>
    <rect class="o" fill="#cfe9f2" x="-279" y="-111" width="162" height="90"/>
    <path class="n" fill="#ffffff" fill-opacity="0.55" d="M-262 -111 L-240 -111 L-270 -60 L-279 -60 L-279 -82 Z"/>
    <rect class="o" fill="#8a6a4a" x="-279" y="-52" width="162" height="31"/>
    <path class="o" fill="#c9c9d2" d="M-176 -52 L-176 -78 L-140 -78 L-140 -52 Z"/>
    <path class="t" d="M-168 -66 L-148 -66 M-164 -52 L-164 -58 M-152 -52 L-152 -58"/>
