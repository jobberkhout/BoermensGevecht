<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -142 228 146" data-rig="static">
  <title>De Kraakradio: een illegale zender op zolder</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .f { stroke: #2b1b16; stroke-width: 1.5; stroke-linejoin: round; }
  </style>

  <!-- A home-made aerial: a broomstick, a coat hanger and a lot of hope. Joint where it goes through the roof. -->
  <g id="antenna" transform="translate(-80 -104)">
    <path class="t" style="stroke-width:5" d="M0 2 L-5 -24"/>
    <path class="t" style="stroke:#b98045;stroke-width:2.4" d="M0 2 L-5 -24"/>
    <path class="t" style="stroke-width:4.4" d="M-16 -19 L6 -19 L-5 -29 Z"/>
    <path class="t" style="stroke:#c9c9d2;stroke-width:2" d="M-16 -19 L6 -19 L-5 -29 Z"/>
    <path class="t" style="stroke:#c9c9d2;stroke-width:2" d="M-5 -29 q0.5 -4 3.5 -3.6"/>
  </g>

  <!-- What it sends out. Joint at the tip of the aerial. -->
  <g id="waves" transform="translate(-85 -128)">
    <path class="t" style="stroke-width:4.8" d="M-10 -6 Q-14 0 -10 6 M-16 -9 Q-22 0 -16 9 M10 -6 Q14 0 10 6 M16 -9 Q22 0 16 9"/>
    <path class="t" style="stroke:#ffd21f;stroke-width:2.4" d="M-10 -6 Q-14 0 -10 6 M-16 -9 Q-22 0 -16 9 M10 -6 Q14 0 10 6 M16 -9 Q22 0 16 9"/>
  </g>

  <!-- The attic: bare brick, a patch of old plaster, a roof beam. Origin = middle of the floor. -->
  <g id="room" transform="translate(0 0)">
    <rect class="o" fill="#a3654f" x="-100" y="-104" width="200" height="104" rx="3"/>
    <path class="t" style="stroke:#8a5240;stroke-width:2" d="M-94 -90 L-78 -90 M-40 -96 L-22 -96 M-8 -66 L8 -66 M40 -94 L56 -94 M-30 -78 L-16 -78 M84 -66 L96 -66 M-96 -60 L-86 -60 M60 -44 L74 -44 M-4 -84 L10 -84 M-46 -62 L-36 -62"/>
    <path class="o" style="stroke-width:1.8" fill="#e9dcc3" d="M60 -103 L98.5 -103 L98.5 -82 Q93 -78 88 -85 Q82 -81 78 -89 Q70 -89 68 -96 Q61 -97 60 -103 Z"/>
    <rect class="o" fill="#6b4a35" x="-104" y="-110" width="208" height="8" rx="2"/>
    <path class="t" style="stroke:#523726" d="M-96 -106 L-60 -106.5 M-20 -105.5 L30 -106 M56 -106.5 L96 -106"/>
  </g>

  <!-- A bare bulb on its wire. Joint at the beam. -->
  <g id="bulb" transform="translate(-6 -102)">
    <circle class="n" fill="#ffe9a8" fill-opacity="0.3" cx="0" cy="15" r="11"/>
    <path class="t" d="M0 0 L0 9"/>
    <rect class="o" style="stroke-width:1.6" fill="#3a3a3a" x="-2.4" y="8" width="4.8" height="4" rx="1"/>
    <circle class="o" style="stroke-width:1.8" fill="#ffe9a8" cx="0" cy="16.5" r="5"/>
  </g>

  <!-- The far arm of the lid-basher, with its pan lid. Joint at her shoulder. -->
  <g id="lid_back" data-parent="pan_body" transform="translate(-58 -49)">
    <path class="o" fill="#a8500f" d="M-3 -4 L18 -1.5 L18 6.5 L-3 5 Z"/>
    <ellipse class="o" fill="#aab0b8" cx="25" cy="2.5" rx="8" ry="11.5"/>
    <ellipse class="n" fill="#8a8f98" cx="25.6" cy="2.5" rx="5.2" ry="8.4"/>
    <circle class="o" fill="#e9b796" cx="19.5" cy="2.5" r="3.9"/>
  </g>

  <!-- She bashes pan lids together. Joint at the waist, behind the wall. -->
  <g id="pan_body" transform="translate(-64 -30)">
    <path class="o" fill="#c9631a" d="M-17 4 Q-19 -18 -12 -26 Q0 -31 12 -26 Q19 -18 17 4 Z"/>
    <path fill="none" stroke="#fff6e0" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" d="M-16 -10 l5.2 -5 l5.2 5 l5.2 -5 l5.2 5 l5.2 -5 l5.2 5"/>
    <path fill="none" stroke="#7a3a12" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M-16.6 -3 l5.3 -5 l5.3 5 l5.3 -5 l5.3 5 l5.3 -5 l5.3 5"/>
  </g>

  <g id="pan_head" data-parent="pan_body" transform="translate(-64 -57)">
    <rect class="o" fill="#e9b796" x="-3.5" y="-5" width="8" height="8" rx="2"/>
    <ellipse class="o" fill="#f3c9a5" cx="2" cy="-18" rx="15.5" ry="15"/>
    <!-- a cloud of red curls -->
    <path class="o" fill="#e0672f" d="M-12 -6 Q-20 -8 -17.5 -16 Q-23.5 -22 -17 -28.5 Q-18 -37 -9 -37 Q-4.5 -44 4 -39 Q12 -43 16 -35 Q23 -32 19.5 -24.5 Q12 -29 4 -27 Q-6 -26 -8.5 -17 Q-8 -8 -12 -6 Z"/>
    <path class="t" style="stroke:#b84a1a" d="M-13 -20 q3 -3 5 0 M-10 -30 q3 -3 5.5 0 M0 -35 q3 -3 5.5 0 M9 -33 q2.6 -2.6 5 0 M-14 -12 q2.6 -2.6 4.6 0"/>
    <circle fill="none" stroke="#e6b422" stroke-width="1.6" cx="-7" cy="-7.5" r="3"/>
    <path class="t" style="stroke-width:1.9" d="M5 -19 Q8 -22.5 11 -19 M14 -19.5 Q16.5 -22.5 19 -19.5"/>
    <path class="o" fill="#f3c9a5" d="M17 -16.5 Q21 -14 17 -12.2"/>
    <ellipse class="n" fill="#f29b8e" fill-opacity="0.55" cx="4.5" cy="-12.5" rx="3" ry="1.8"/>
    <ellipse class="o" style="stroke-width:1.8" fill="#5a1f2a" cx="11" cy="-8" rx="4.4" ry="3.9"/>
    <path class="n" fill="#ff8f9a" d="M8.4 -6.6 Q11 -4 13.6 -6.6 Q11 -7.8 8.4 -6.6 Z"/>
  </g>

  <!-- Her near arm with the other lid. -->
  <g id="lid_front" data-parent="pan_body" transform="translate(-62 -47)">
    <path class="o" fill="#c9631a" d="M-3.5 -4.5 L18 -4 L18 4 L-3.5 5 Z"/>
    <ellipse class="o" fill="#c9c9d2" cx="26" cy="-0.5" rx="8.5" ry="12"/>
    <path class="n" fill="#ffffff" fill-opacity="0.7" d="M22 -8 Q24.5 -11 28 -10 Q25 -8.5 23.6 -4.5 Z"/>
    <circle class="o" fill="#f3c9a5" cx="20" cy="0" r="4.1"/>
  </g>

  <!-- The DJ: army jacket, blue spikes, headphones. Joint at the waist. -->
  <g id="dj_body" transform="translate(22 -30)">
    <path class="o" fill="#5d6b3f" d="M-17 4 Q-19 -18 -12 -26 Q0 -31 12 -26 Q19 -18 17 4 Z"/>
    <path class="o" fill="#d9342b" d="M-6 -27.4 Q0 -31.5 7 -27.4 L1 -18 Z"/>
    <circle class="f" fill="#ffd21f" cx="-8.5" cy="-13" r="2.6"/>
    <circle class="f" fill="#fffdf5" cx="-3.5" cy="-8" r="2.2"/>
    <path fill="none" stroke="#d9d9e2" stroke-width="1.3" stroke-linecap="round" d="M8 -14 L12.5 -17.5 M12.5 -17.5 L13.3 -16 L9 -12.8"/>
  </g>

  <g id="dj_head" data-parent="dj_body" transform="translate(22 -57)">
    <rect class="o" fill="#dfb089" x="-3.5" y="-5" width="8" height="8" rx="2"/>
    <ellipse class="o" fill="#f0c19a" cx="2" cy="-18" rx="16" ry="15.5"/>
    <path class="o" fill="#2f6bff" d="M-14 -14 L-19.5 -21 L-14.5 -23.5 L-19 -32 L-11.5 -31.5 L-11 -41 L-3.5 -35 L2 -44.5 L6.5 -35 L13.5 -41 L13.5 -32 L20.5 -33 L17.5 -25 Q9 -30 0 -27.5 Q-8 -25.5 -10 -17 Q-12 -13 -14 -14 Z"/>
    <path class="n" fill="#79a6ff" d="M1.6 -39 L4 -33.5 L0.5 -33 Z M-9 -36 L-5.5 -32 L-8.5 -31 Z M11.5 -37 L11 -32.5 L8.5 -33.5 Z"/>
    <path class="t" style="stroke-width:3.8" d="M-12 -29.5 Q2 -46.5 16.5 -30.5"/>
    <rect class="o" fill="#d9342b" x="-16.5" y="-26" width="9" height="14.5" rx="4"/>
    <path class="t" style="stroke-width:2" d="M4.5 -25.5 L10.5 -23 M14.5 -23 L19 -25.6"/>
    <circle class="n" fill="#2b1b16" cx="8.2" cy="-18.6" r="1.7"/>
    <circle class="n" fill="#2b1b16" cx="15.6" cy="-18.6" r="1.5"/>
    <path class="o" fill="#f0c19a" d="M17.5 -16.5 Q21.5 -14 17.5 -12.2"/>
    <path fill="none" stroke="#b98e70" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0.1 2.6" d="M2 -5 Q9 -1.5 16 -4.5"/>
  </g>

  <g id="dj_mouth" data-parent="dj_head" transform="translate(34.5 -65.5)">
    <ellipse class="o" style="stroke-width:1.8" fill="#5a1f2a" cx="0" cy="0" rx="4.4" ry="3.8"/>
    <path class="n" fill="#ff8f9a" d="M-2.6 1.4 Q0 4 2.6 1.4 Q0 0.2 -2.6 1.4 Z"/>
  </g>

  <!-- His arm with the microphone, held just under his nose. Joint at the shoulder. -->
  <g id="dj_arm" data-parent="dj_body" transform="translate(36 -50)">
    <path class="o" fill="#5d6b3f" d="M-4 -2 L4 10.5 L10.5 8.5 L14 -5 L8 -7 L6.5 0.5 L1 -6.5 Z"/>
    <path class="t" style="stroke-width:3.4" d="M11 -7.5 L9 -12"/>
    <circle class="o" fill="#3a2e4a" cx="8.5" cy="-14.5" r="4.2"/>
    <path class="t" style="stroke:#8f84a6;stroke-width:1.2" d="M5.6 -16 L11.2 -13.2 M6.2 -13.2 L10.4 -16.4"/>
    <circle class="o" fill="#f0c19a" cx="11.2" cy="-7" r="4.1"/>
  </g>

  <!-- The front wall with everything that stands on it. Joint at the ledge; drawn in whole-scene coordinates. -->
  <g id="front" transform="translate(0 -30)">
    <g transform="translate(0 30)">
      <rect class="o" fill="#8f5644" x="-100" y="-30" width="200" height="30" rx="2"/>
      <path class="t" style="stroke:#77453a;stroke-width:2" d="M32 -20 L48 -20 M60 -10 L76 -10 M80 -22 L94 -22 M-96 -12 L-82 -12 M4 -8 L18 -8 M-90 -24 L-78 -24"/>
      <!-- a bed sheet with a flower and a note painted on it -->
      <path class="o" fill="#fffdf5" d="M-72 -31 L-6 -31 L-7 -7 Q-22 -2 -38 -7 Q-54 -11 -71 -5 Z"/>
      <circle class="n" fill="#ff7ac0" cx="-56" cy="-23.5" r="3.6"/>
      <circle class="n" fill="#ff7ac0" cx="-51.2" cy="-20" r="3.6"/>
      <circle class="n" fill="#ff7ac0" cx="-53" cy="-14.4" r="3.6"/>
      <circle class="n" fill="#ff7ac0" cx="-59" cy="-14.4" r="3.6"/>
      <circle class="n" fill="#ff7ac0" cx="-60.8" cy="-20" r="3.6"/>
      <circle class="n" fill="#ffd21f" cx="-56" cy="-18.6" r="3.2"/>
      <path fill="none" stroke="#2f6bff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M-33 -12 L-33 -25 L-22 -27 L-22 -14"/>
      <ellipse class="n" fill="#2f6bff" cx="-36" cy="-12" rx="3.6" ry="2.8"/>
      <ellipse class="n" fill="#2f6bff" cx="-25" cy="-14" rx="3.6" ry="2.8"/>
      <rect class="o" fill="#b98045" x="-104" y="-36.5" width="208" height="7.5" rx="2"/>
      <!-- a plant nobody waters -->
      <path class="o" fill="#c97b4a" d="M-97 -36.5 L-95 -47 L-83 -47 L-81 -36.5 Z"/>
      <path class="t" style="stroke:#8a7a3a;stroke-width:2.2" d="M-89 -47 Q-92 -56 -98 -58 M-89 -47 Q-87 -55 -81 -55"/>
      <!-- the tape recorder (the reels are parts of their own) -->
      <rect class="o" fill="#d9d4c8" x="-22" y="-63" width="28" height="27" rx="2.5"/>
      <rect class="n" fill="#8a5a3a" x="-20.7" y="-61.7" width="3.6" height="24.4"/>
      <rect class="n" fill="#b8b2a4" x="-17" y="-45.5" width="21.7" height="8.2"/>
      <circle class="n" fill="#2b1b16" cx="-12.5" cy="-41.3" r="2"/>
      <circle class="n" fill="#2b1b16" cx="-6" cy="-41.3" r="2"/>
      <rect class="n" fill="#ff4a3d" x="-1.4" y="-43" width="4" height="3.4" rx="0.8"/>
      <!-- the mixer -->
      <path class="o" fill="#3d3849" d="M10 -36.5 L12 -45.5 L36 -45.5 L38 -36.5 Z"/>
      <path class="t" style="stroke:#8f84a6;stroke-width:1.3" d="M16.5 -43.5 L16 -38.5 M22 -43.5 L21.8 -38.5 M27.5 -43.5 L27.7 -38.5 M33 -43.5 L33.5 -38.5"/>
      <rect class="n" fill="#ff4a3d" x="14.6" y="-42.6" width="3.6" height="2"/>
      <rect class="n" fill="#ffd21f" x="20.1" y="-40.4" width="3.6" height="2"/>
      <rect class="n" fill="#3fb8a8" x="25.8" y="-43.2" width="3.6" height="2"/>
      <rect class="n" fill="#ff7ac0" x="31.4" y="-41.2" width="3.6" height="2"/>
      <!-- the cable to the loudspeaker, and what the loudspeaker stands on -->
      <path class="t" style="stroke-width:2.2" d="M38 -39 Q45 -32.5 51 -39.5 Q55 -44 59 -40"/>
      <path class="o" fill="#5a6470" d="M57 -36.5 L59.5 -52 L66.5 -52 L69 -36.5 Z"/>
    </g>
  </g>

  <g id="reel_a" data-parent="front" transform="translate(-13.6 -54)">
    <circle class="o" style="stroke-width:1.8" fill="#f4ecdc" cx="0" cy="0" r="5.6"/>
    <circle class="n" fill="#8a5a3a" cx="0" cy="0" r="3.4"/>
    <circle class="n" fill="#2b1b16" cx="0" cy="-3.6" r="1.1"/>
    <circle class="n" fill="#2b1b16" cx="3.1" cy="1.8" r="1.1"/>
    <circle class="n" fill="#2b1b16" cx="-3.1" cy="1.8" r="1.1"/>
  </g>
  <g id="reel_b" data-parent="front" transform="translate(-1.8 -54)">
    <circle class="o" style="stroke-width:1.8" fill="#f4ecdc" cx="0" cy="0" r="5.6"/>
    <circle class="n" fill="#8a5a3a" cx="0" cy="0" r="2.2"/>
    <circle class="n" fill="#2b1b16" cx="0" cy="-3.6" r="1.1"/>
    <circle class="n" fill="#2b1b16" cx="3.1" cy="1.8" r="1.1"/>
    <circle class="n" fill="#2b1b16" cx="-3.1" cy="1.8" r="1.1"/>
  </g>

  <!-- The horn loudspeaker, borrowed from a football ground. Joint at its throat. -->
  <g id="horn" data-parent="front" transform="translate(63 -56)">
    <g transform="rotate(-8)">
      <rect class="o" fill="#5a6470" x="-11" y="-7.5" width="13" height="15" rx="3"/>
      <path class="o" fill="#b8c2c9" d="M0 -6 Q24 -8 44 -27 L44 27 Q24 8 0 6 Z"/>
      <path class="n" fill="#dfe6ea" d="M4 -4.6 Q24 -7 40 -21 L40 -15 Q24 -3 4 -1.5 Z"/>
      <ellipse class="o" fill="#3a2e4a" cx="44" cy="0" rx="7" ry="27"/>
      <ellipse class="n" fill="#241b26" cx="43" cy="0" rx="3.4" ry="16"/>
    </g>
    <circle data-mount="muzzle" fill="none" cx="46" cy="-6" r="1"/>
  </g>

  <!-- Noise, in two flavours. They pop out of the horn. -->
  <g id="noise_a" transform="translate(101 -94)">
    <path class="o" style="stroke-width:1.8" fill="#ffd21f" d="M5 -25 L-7 -9 L-1 -9 L-5 3 L8 -14 L2 -14 Z"/>
  </g>
  <g id="noise_b" transform="translate(84 -100)">
    <path class="o" style="stroke-width:1.8" fill="#ff7ac0" d="M2 -18 L5 -18 Q11.5 -16 10 -7.5 Q8.6 -11.5 5 -12.4 L5 1 Q5 5.2 0.2 5.2 Q-4.6 5.2 -4.6 1.6 Q-4.6 -2.2 0 -2.4 Q1.2 -2.4 2 -2 Z"/>
  </g>
</svg>
