<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -146 112 152" data-rig="humanoid">
  <title>Kraker Sjors</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .bar { stroke: #2b1b16; stroke-width: 6.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .paint { stroke: #d9342b; stroke-width: 3.4; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .stud { stroke: #d9d9e2; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 0.1 3.6; fill: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm: thumb hooked in his belt. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#2a2733" d="M-6 -3 Q-8 12 -5.5 23 L5.5 23 Q7 10 6 -3 Z"/>
    <rect class="o" fill="#18161d" x="-6.2" y="20.5" width="12.4" height="4.6" rx="1.5"/>
    <path class="o" fill="#dea888" d="M-4 25 L-3.5 30.5 Q0 35.5 3.5 30.5 L4 25 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#7592b8" d="M-7 -3 L7 -3 L5.5 23 L-5.5 23 Z"/>
    <path class="o" fill="#1f1d26" d="M-5.6 19 L5.6 19 L5 33 L-5 33 Z"/>
    <path class="o" fill="#1f1d26" d="M-7.5 33.5 Q-7.5 30.5 -4 30.5 L4 30.5 Q11.5 31 13.5 35 L13.5 38 L-7.5 38 Z"/>
    <path class="n" fill="#0f0e13" d="M-6.5 35.8 L13 35.8 L13 37.6 L-6.5 37.6 Z"/>
  </g>

  <!-- Stonewashed jeans, out at the knee, and boots with yellow stitching. -->
  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#8fb0d6" d="M-7 -3 L7 -3 L5.5 23 L-5.5 23 Z"/>
    <path class="n" fill="#a9c4e0" d="M1.5 -1 L5.2 -1 L4.2 18 L2 18 Z"/>
    <path class="o" style="stroke-width:1.6" fill="#f3c9a5" d="M-5 11.5 Q0 7.5 5 11.5 Q0 15.5 -5 11.5 Z"/>
    <path fill="none" stroke="#f4f7fb" stroke-width="1" stroke-linecap="round" d="M-3.6 10.4 L3.6 10.4 M-4.2 11.8 L4.2 11.8 M-3.4 13.2 L3.4 13.2"/>
    <path fill="none" stroke="#f4f7fb" stroke-width="1.3" stroke-linecap="round" d="M-5.4 1.5 L-1.5 3 M-5.5 4 L-2.5 5"/>
    <path class="o" fill="#2a2733" d="M-5.6 19 L5.6 19 L5 33 L-5 33 Z"/>
    <path fill="none" stroke="#f4ecdc" stroke-width="1.3" stroke-linecap="round" d="M0.5 21.8 L4.2 22.8 M0.5 24.8 L4.1 25.8 M0.5 27.8 L4 28.8"/>
    <path class="o" fill="#2a2733" d="M-7.5 33.5 Q-7.5 30.5 -4 30.5 L4 30.5 Q11.5 31 13.5 35 L13.5 38 L-7.5 38 Z"/>
    <path class="n" fill="#0f0e13" d="M-6.5 35.8 L13 35.8 L13 37.6 L-6.5 37.6 Z"/>
    <path fill="none" stroke="#ffd21f" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 1.7" d="M-6 34.9 L12.4 34.9"/>
  </g>

  <!-- A striped jumper under a leather jacket with badges, a safety pin and a studded belt. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#f4ecdc" d="M-13.5 6 Q-16.5 -14 -13.5 -30 Q-10.5 -37 0 -37 Q12 -37 15 -30 Q18 -14 14 6 Z"/>
    <path fill="none" stroke="#d9342b" stroke-width="3" d="M-5 -33.5 L10 -33.5 M-4 -27.5 L9 -27.5 M-2 -21.5 L7 -21.5 M0 -15.5 L4.5 -15.5"/>
    <path class="o" fill="#34303f" d="M-15.5 4 Q-18.5 -14 -15.5 -29 Q-12 -37 -5 -37.5 L2 -11 L9 -37.5 Q13.5 -36.5 16.5 -29 Q19.5 -14 15.5 4 Z"/>
    <path class="o" fill="#4d4860" d="M-5 -37.5 L2 -11 L-9 -23 Z"/>
    <path class="o" fill="#4d4860" d="M9 -37.5 L2 -11 L13 -24 Z"/>
    <path class="t" d="M2 -11 L2 2"/>
    <circle class="o" style="stroke-width:1.4" fill="#ffd21f" cx="-10.5" cy="-13.5" r="2.5"/>
    <circle class="o" style="stroke-width:1.4" fill="#ff4a3d" cx="-6" cy="-8.5" r="2.2"/>
    <circle class="o" style="stroke-width:1.4" fill="#f4ecdc" cx="-11.5" cy="-6.5" r="1.9"/>
    <path fill="none" stroke="#d9d9e2" stroke-width="1.3" stroke-linecap="round" d="M9.5 -15 L14 -18.5 M14 -18.5 L14.8 -17 L10.6 -13.8"/>
    <rect class="o" fill="#18161d" x="-15.2" y="1.2" width="30.6" height="5.2" rx="1.3"/>
    <path class="stud" d="M-12.5 3.8 L13.5 3.8"/>
    <rect class="o" style="stroke-width:1.4" fill="#d9d9e2" x="3" y="1.6" width="5" height="4.4" rx="0.8"/>
  </g>

  <!-- The crowbar rests on his shoulder, behind his neck. Joint in his fist. -->
  <g id="prop" data-parent="forearm" transform="translate(21.5 -72.8)">
    <path class="bar" d="M9 2 L-41 -9.3 Q-48.5 -11 -48 -18"/>
    <path class="paint" d="M9 2 L-41 -9.3 Q-48.5 -11 -48 -18"/>
    <path fill="none" stroke="#c9c9d2" stroke-width="3.4" stroke-linecap="round" d="M6.5 1.4 L9 2 M-48.3 -15.5 L-48 -18"/>
    <path fill="none" stroke="#ff8a7a" stroke-width="1.1" stroke-linecap="round" d="M-6 -2.4 L-36 -9.2"/>
  </g>

  <!-- Blue, and stiff with sugar water. Joint on top of his skull. -->
  <g id="mohawk" data-parent="head" transform="translate(2 -112)">
    <path class="o" fill="#2f6bff" d="M-13.7 11.9 L-30.2 -3 L-15.5 -1 L-20.2 -18.9 L-6.3 -6.8 L-2.7 -26.8 L4.4 -7.7 L16 -22.1 L14.2 -3.8 L27 -8.4 L14.4 8.2 Z"/>
    <path class="n" fill="#79a6ff" d="M-16.5 -12 L-9 -4.5 L-12.5 -3 Z M-2.3 -20 L1.6 -8 L-2.2 -7.5 Z M13.5 -17 L11.5 -6 L9 -8.5 Z M22 -6 L15 2 L14.5 -1.5 Z M-24.5 -1.5 L-15 4 L-17.5 0 Z"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#dea888" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#f3c9a5" cx="2" cy="-21" rx="18" ry="17.5"/>
    <!-- shaved sides -->
    <path class="n" fill="#dcae8c" d="M-13.5 -22 Q-12 -35 2 -37 Q12 -36.5 16.5 -31 Q6 -33 -2 -29 Q-8 -25 -9.5 -13 Q-12.5 -16 -13.5 -22 Z"/>
    <ellipse class="o" fill="#f3c9a5" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <circle fill="none" stroke="#c9c9d2" stroke-width="1.5" cx="-9.6" cy="-13.2" r="2"/>
    <circle class="n" fill="#2b1b16" cx="9.5" cy="-20" r="2"/>
    <circle class="n" fill="#2b1b16" cx="17.5" cy="-20" r="1.8"/>
    <path class="t" style="stroke-width:2.6" d="M5 -27.5 L12.5 -24.2 M15.5 -24.4 L20 -27"/>
    <path class="o" fill="#f3c9a5" d="M19.5 -18 Q24 -15 19.8 -12.8"/>
    <circle fill="none" stroke="#c9c9d2" stroke-width="1.4" cx="21.2" cy="-12.2" r="1.7"/>
    <!-- a sneer -->
    <path class="o" style="stroke-width:1.6" fill="#ffffff" d="M8 -10 Q13 -12.5 19 -11 L18.5 -7.2 Q13 -6 9 -7.2 Z"/>
    <path class="t" style="stroke-width:1.1" d="M11.5 -11.2 L11.8 -6.8 M14.8 -11.6 L15 -6.6"/>
    <path fill="none" stroke="#b98e70" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0.1 2.6" d="M4 -5.5 Q11 -2 18 -4.5"/>
  </g>

  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#3d3849" d="M-6.5 -3 Q-8.5 6 -6.5 17 Q0 20 6.5 17 Q8.5 6 6.5 -3 Q0 -6 -6.5 -3 Z"/>
    <path class="stud" d="M-3.6 -1.6 Q0 -3.4 3.6 -1.6"/>
  </g>

  <!-- Forearm and fist, folded up to hold the crowbar on his shoulder. Joint at the elbow. -->
  <g id="forearm" data-parent="arm_front" transform="translate(10 -57)">
    <g transform="rotate(36)">
      <path class="o" fill="#3d3849" d="M-5.8 3 L-5.2 -12 L5.2 -12 L5.8 3 Q0 6.5 -5.8 3 Z"/>
      <rect class="o" fill="#18161d" x="-6.2" y="-15.4" width="12.4" height="4.8" rx="1.5"/>
      <path class="stud" d="M-3.8 -13 L4 -13"/>
      <circle class="o" fill="#f3c9a5" cx="0" cy="-19.5" r="4.8"/>
      <path class="t" style="stroke-width:1.2" d="M-2.4 -21.6 L2.4 -21.6 M-2.8 -19.4 L2.8 -19.4"/>
    </g>
  </g>
</svg>
