<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -132 108 138" data-rig="humanoid">
  <title>Bloemenkind Fleur</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .f { stroke: #2b1b16; stroke-width: 1.4; stroke-linejoin: round; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The bunch she is about to throw. Joint in her far hand. -->
  <g id="prop" data-parent="arm_back" transform="translate(29 -62)">
    <path fill="none" stroke="#2c7a40" stroke-width="2.2" stroke-linecap="round" d="M-1 5 L-2 -12 M0.5 5 L5 -14 M2 5 L11 -9"/>
    <path class="f" fill="#4bb167" d="M-1.5 -4 Q-9 -6 -9.5 -12 Q-3 -11 -1.5 -4 Z"/>
    <path class="f" fill="#4bb167" d="M7 -3 Q15 -2 17 -7 Q10 -9 7 -3 Z"/>
    <circle class="f" fill="#ffb52e" cx="12.5" cy="-13" r="5.2"/>
    <circle class="n" fill="#c9631a" cx="12.5" cy="-13" r="1.9"/>
    <circle class="f" fill="#ff7ac0" cx="-2.5" cy="-17" r="5.6"/>
    <circle class="n" fill="#ffd21f" cx="-2.5" cy="-17" r="2"/>
    <circle class="f" fill="#fffdf5" cx="6" cy="-21" r="5.8"/>
    <circle class="n" fill="#ffd21f" cx="6" cy="-21" r="2.2"/>
  </g>

  <!-- The far arm, held out in front with the flowers. Joint at the shoulder. -->
  <g id="arm_back" data-parent="torso" transform="translate(-6 -72)">
    <g transform="rotate(15.5)">
      <path class="o" fill="#eadfc4" d="M-4 -5.5 L26 -8.5 Q29.5 0 26 8.5 L-4 5.5 Z"/>
      <path class="t" style="stroke:#d9534f;stroke-width:1.5" d="M22.5 -6.5 l2.2 3.2 l-2.2 3.2 l2.2 3.2 l-2.2 3.2"/>
      <circle class="o" fill="#e9b796" cx="33" cy="0" r="4.6"/>
    </g>
    <circle data-mount="hand" fill="none" cx="38" cy="-6" r="1"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#dea888" d="M-4 33.5 L7 33.5 Q12.5 34 13.5 37 L13.5 38 L-6 38 Z"/>
    <path class="o" fill="#7459a3" d="M-7 -3 L7 -3 L6 13 L11.5 33.5 L-9.5 33.5 L-6 13 Z"/>
    <path class="t" style="stroke:#5a4285" d="M-8.6 30 L10.6 30"/>
  </g>

  <!-- Bell-bottoms with a daisy on the knee, and sandals under them. -->
  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#f3c9a5" d="M-4 33.5 L7 33.5 Q12.5 34 13.5 37 L13.5 38 L-6 38 Z"/>
    <path class="n" fill="#8a5529" d="M-5.4 36.7 L13 36.7 L13 37.7 L-5.4 37.7 Z"/>
    <path class="t" style="stroke:#8a5529;stroke-width:2" d="M8.5 33.8 L10.5 36.6"/>
    <path class="o" fill="#8a6fb8" d="M-7 -3 L7 -3 L6 13 L11.5 33.5 L-9.5 33.5 L-6 13 Z"/>
    <path class="n" fill="#a48bd0" d="M1.5 -1 L5.2 -1 L4.6 12 L8 28 L4.5 28 L1.8 12 Z"/>
    <path class="t" style="stroke:#6a4f99" d="M-8.6 30 L10.6 30"/>
    <circle class="n" fill="#fffdf5" cx="-1" cy="5.4" r="1.7"/>
    <circle class="n" fill="#fffdf5" cx="1.5" cy="7.2" r="1.7"/>
    <circle class="n" fill="#fffdf5" cx="0.6" cy="10.1" r="1.7"/>
    <circle class="n" fill="#fffdf5" cx="-2.6" cy="10.1" r="1.7"/>
    <circle class="n" fill="#fffdf5" cx="-3.5" cy="7.2" r="1.7"/>
    <circle class="n" fill="#ffd21f" cx="-1" cy="8" r="1.6"/>
    <path class="n" fill="#ff7ac0" d="M2.5 21 q-1.8 -2.6 -3.5 -0.7 q-1.1 1.9 3.5 4.7 q4.6 -2.8 3.5 -4.7 q-1.7 -1.9 -3.5 0.7 Z"/>
  </g>

  <!-- A peasant blouse under a fringed suede waistcoat, and a string of beads. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#fff6e0" d="M-15 7 Q-17 -14 -14 -30 Q-11 -37 0 -37 Q12 -37 15 -30 Q18 -14 16.5 7 Z"/>
    <path class="t" style="stroke:#d9534f;stroke-width:1.5" d="M-13 3 l2.4 -2.6 l2.4 2.6 l2.4 -2.6 l2.4 2.6 l2.4 -2.6 l2.4 2.6 l2.4 -2.6 l2.4 2.6 l2.4 -2.6 l2.4 2.6 l2.4 -2.6 l2.2 2.6"/>
    <path class="o" fill="#b9783f" d="M-15.5 -6 Q-17.5 -17 -15 -29 Q-12 -37 -4 -37.5 L-1 -6 Z"/>
    <path class="o" fill="#c98a4d" d="M8.5 -37.3 Q13.5 -36 16 -29 Q18.5 -17 17.2 -6 L6.5 -6 Z"/>
    <path class="t" style="stroke:#8a5529;stroke-width:1.5" d="M-14 -6 L-14.4 0 M-11 -6 L-11.2 1 M-8 -6 L-8 0.4 M-5 -6 L-4.8 1 M-2 -6 L-1.7 0 M8 -6 L7.8 0.6 M11 -6 L11 1 M14 -6 L14.2 0.4 M16.5 -6 L16.9 0"/>
    <circle class="n" fill="#d9534f" cx="-1.5" cy="-31.5" r="1.5"/>
    <circle class="n" fill="#ffd21f" cx="0" cy="-28" r="1.5"/>
    <circle class="n" fill="#3fb8a8" cx="2.4" cy="-25.2" r="1.5"/>
    <circle class="n" fill="#ff7ac0" cx="5" cy="-27.6" r="1.5"/>
    <circle class="n" fill="#d9534f" cx="6.6" cy="-31" r="1.5"/>
  </g>

  <!-- Hair down to her waist. Joint at the nape, so it swings. -->
  <g id="hair" data-parent="head" transform="translate(-10 -92)">
    <path class="o" fill="#f0cf6a" d="M-2 -20 Q-12 -16 -12 -4 Q-15 12 -13 26 Q-14 40 -12 50 L-7 45 L-4 52 L1 46 Q5 40 4 30 Q7 16 6 6 Q9 -4 8 -12 Z"/>
    <path class="t" style="stroke:#d6ac45" d="M-7 -2 Q-9.5 20 -8 42 M-1.5 2 Q-2.5 22 -2 44"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#dea888" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#f3c9a5" cx="2" cy="-21" rx="18.5" ry="17.5"/>
    <!-- centre parting, a lock in front of her ear -->
    <path class="o" fill="#f0cf6a" d="M20 -29.5 Q15 -41 2 -41.5 Q-21 -41 -18.5 -20 Q-19 -10 -16 -3 L-9 -4 Q-9.5 -18 -6 -25 Q-1 -31 8 -31.5 Q15 -32 20 -29.5 Z"/>
    <path class="n" fill="#f8e29b" d="M-8 -36 Q0 -39.5 10 -37 Q2 -36 -6 -32 Z"/>
    <path class="t" style="stroke:#d6ac45" d="M-13 -22 Q-14 -12 -12.5 -5"/>
    <ellipse class="n" fill="#f29b8e" fill-opacity="0.6" cx="6.5" cy="-12" rx="3.6" ry="2.1"/>
    <!-- round blue shades -->
    <path class="t" d="M4.2 -21.5 L-7 -19.5"/>
    <circle class="t" style="fill:#6fa8ff" cx="9.5" cy="-21" r="5.5"/>
    <circle class="t" style="fill:#6fa8ff" cx="19" cy="-21" r="4.5"/>
    <path class="n" fill="#ffffff" fill-opacity="0.7" d="M6.5 -23.5 Q8.5 -25.5 11 -25 Q9 -24 7.6 -21.6 Z M16.8 -23 Q18.2 -24.6 20 -24.2 Q18.6 -23.4 17.6 -21.6 Z"/>
    <path class="o" fill="#f3c9a5" d="M20.8 -17.5 Q24.6 -15 20.6 -12.8"/>
    <path class="t" style="stroke-width:1.9" d="M8.5 -9.5 Q13 -4.8 18.5 -9.8"/>
    <!-- a crown of flowers -->
    <circle class="f" fill="#ff7ac0" cx="-15.5" cy="-30" r="3.9"/>
    <circle class="n" fill="#ffd21f" cx="-15.5" cy="-30" r="1.5"/>
    <circle class="f" fill="#fffdf5" cx="-8.5" cy="-36.5" r="3.9"/>
    <circle class="n" fill="#ffd21f" cx="-8.5" cy="-36.5" r="1.5"/>
    <circle class="f" fill="#ffb52e" cx="0.5" cy="-39.5" r="3.9"/>
    <circle class="n" fill="#c9631a" cx="0.5" cy="-39.5" r="1.5"/>
    <circle class="f" fill="#ff7ac0" cx="9.5" cy="-38" r="3.9"/>
    <circle class="n" fill="#ffd21f" cx="9.5" cy="-38" r="1.5"/>
    <circle class="f" fill="#fffdf5" cx="17" cy="-33" r="3.9"/>
    <circle class="n" fill="#ffd21f" cx="17" cy="-33" r="1.5"/>
  </g>

  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <circle class="o" fill="#f3c9a5" cx="0.5" cy="26.5" r="4.4"/>
    <path class="o" fill="#fff6e0" d="M-5.5 -3 Q-6.5 8 -7.8 21 Q0 24.5 7.8 21 Q6.5 8 5.5 -3 Q0 -5.5 -5.5 -3 Z"/>
    <path class="t" style="stroke:#d9534f;stroke-width:1.5" d="M-6.6 17.5 l2.2 -2.6 l2.2 2.6 l2.2 -2.6 l2.2 2.6 l2.2 -2.6 l2.2 2.6"/>
  </g>
</svg>
