<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -140 112 146" data-rig="humanoid">
  <title>Flitsblokje-Fien: zonnehoed, sokken in sandalen, en een camera met een flitsblokje erop</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .f { stroke: #2b1b16; stroke-width: 1.4; stroke-linejoin: round; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm, a little behind her, with a spare flash cube between finger and thumb. Joint at the shoulder. -->
  <g id="arm_back" data-parent="torso" transform="translate(-7 -72)">
    <path class="o" fill="#f2b49a" d="M-5 -3 Q0 -6.5 5 -3 L4 20 L-4 20 Z"/>
    <circle class="o" fill="#f3c9a5" cx="0" cy="22.5" r="4.5"/>
    <circle data-mount="hand" fill="none" cx="0" cy="24" r="1"/>
  </g>

  <!-- The spare cube. Joint in her far hand. -->
  <g id="cube" data-parent="arm_back" transform="translate(-6 -48)">
    <rect class="f" fill="#f4f8fb" x="-4.5" y="-1" width="9" height="9" rx="1.2"/>
    <rect class="n" fill="#9fd0f0" x="-3" y="0.6" width="6" height="5.8" rx="0.8"/>
    <path class="n" fill="#ffffff" d="M-2.4 1.2 L0.4 1.2 L-2.4 4 Z"/>
  </g>

  <!-- Bare shins, beige socks, white sandals. -->
  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#e8b08f" d="M-5 -2 L5 -2 L4.5 27 L-4.5 27 Z"/>
    <path class="o" fill="#d8ccb0" d="M-5 25 L5 25 L5 33 L-5 33 Z"/>
    <path class="o" fill="#d8ccb0" d="M-6.5 38 L-6.5 33 Q-6.5 30.5 -2 30.5 L6 30.5 Q12 31 14.5 34 Q15.5 38 12 38 Z"/>
    <path class="t" style="stroke:#e9e4da;stroke-width:2" d="M-6 36.8 L14 36.8"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#f3c2a0" d="M-5 -2 L5 -2 L4.5 27 L-4.5 27 Z"/>
    <path class="o" fill="#ece2c8" d="M-5 25 L5 25 L5 33 L-5 33 Z"/>
    <path class="t" style="stroke:#cfc2a2;stroke-width:1.1" d="M-4.4 27.4 L4.4 27.4"/>
    <path class="o" fill="#ece2c8" d="M-6.5 38 L-6.5 33 Q-6.5 30.5 -2 30.5 L6 30.5 Q12 31 14.5 34 Q15.5 38 12 38 Z"/>
    <path class="o" style="stroke-width:1.6" fill="#ffffff" d="M-6.5 35.6 L14.8 35.6 L14.4 38.4 L-6.5 38.4 Z"/>
    <path class="t" style="stroke:#ffffff;stroke-width:2.4" d="M1 31 L6 35"/>
    <path class="t" style="stroke-width:1" d="M0 30.2 L5.4 34.8"/>
  </g>

  <!-- A mint summer dress with white dots, flared, and sunburnt shoulders. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#8fd6bd" d="M-14 -4 Q-16 -18 -13.5 -30 Q-10.5 -37 0 -37 Q11.5 -37 14.5 -30 Q17 -18 15 -4 L22 22 Q1 27 -20 22 Z"/>
    <path class="n" fill="#76c2a8" d="M-13 -4 Q-15 -18 -12.6 -28 Q-9 -20 -8.6 -4 L-12 22 L-18.8 21.2 Z"/>
    <path class="t" style="stroke:#4f9a80;stroke-width:1.4" d="M-14 -4 Q1 -1 15 -4"/>
    <circle class="n" fill="#ffffff" cx="7" cy="-26" r="1.8"/>
    <circle class="n" fill="#ffffff" cx="-2" cy="-18" r="1.8"/>
    <circle class="n" fill="#ffffff" cx="9" cy="-12" r="1.8"/>
    <circle class="n" fill="#ffffff" cx="-6" cy="4" r="1.8"/>
    <circle class="n" fill="#ffffff" cx="6" cy="8" r="1.8"/>
    <circle class="n" fill="#ffffff" cx="15" cy="14" r="1.8"/>
    <circle class="n" fill="#ffffff" cx="-12" cy="15" r="1.8"/>
    <circle class="n" fill="#ffffff" cx="1" cy="18" r="1.8"/>
    <!-- sunburnt neckline and the strap of the camera -->
    <path class="n" fill="#f29a84" d="M-7 -36.4 Q1 -29 9 -36.4 Q1 -38 -7 -36.4 Z"/>
    <path class="t" style="stroke:#2b1b16;stroke-width:2.6" d="M-5 -36 L13 -18 M10 -36 L16 -20"/>
    <path class="t" style="stroke:#7a5236;stroke-width:1.2" d="M-5 -36 L13 -18 M10 -36 L16 -20"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#e8b08f" x="-4" y="-6" width="9" height="9" rx="2"/>
    <!-- a set perm, ash blonde, peeking out under the hat -->
    <path class="o" fill="#e3d2a8" d="M-18 -26 Q-24 -18 -19 -10 Q-15 -6 -10 -9 L-8 -24 Z"/>
    <ellipse class="o" fill="#f3c9a5" cx="2" cy="-21" rx="18" ry="17.5"/>
    <ellipse class="o" fill="#f0b496" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <circle class="o" style="stroke-width:1.4" fill="#ffd21f" cx="-9.6" cy="-12.6" r="1.9"/>
    <path class="t" style="stroke:#c9b27a;stroke-width:1.2" d="M-20 -17 q3 -2 4 1 M-19 -12 q3 -2 4 1"/>
    <!-- squinting into the sun, smiling politely -->
    <ellipse class="n" fill="#f29a84" fill-opacity="0.6" cx="6.5" cy="-12.6" rx="4" ry="2.4"/>
    <path class="t" style="stroke-width:2" d="M6.5 -20 Q9.5 -22.6 12.5 -20 M15 -20 Q17.6 -22.4 20.2 -20"/>
    <path class="t" style="stroke:#a88a5a;stroke-width:1.6" d="M6 -25 Q9 -26.4 12.4 -25.4 M15 -25.4 Q17.6 -26.2 20 -25"/>
    <path class="o" fill="#f7a88e" d="M19.5 -18.5 Q25 -15 20.4 -12"/>
    <path class="o" style="stroke-width:1.8" fill="#c93a3a" d="M10 -9.4 Q15 -7.4 19.4 -9.8 Q17.6 -5.2 14 -5.2 Q11 -5.6 10 -9.4 Z"/>
    <!-- the straw sun hat with a red ribbon -->
    <path class="o" fill="#ead08a" d="M-25 -29 Q-24 -36 2 -36.5 Q30 -37 34 -29 Q30 -26 2 -27 Q-22 -26 -25 -29 Z"/>
    <path class="o" fill="#ead08a" d="M-13 -33 Q-14 -49 2 -50 Q18 -50 17 -33 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#d9342b" d="M-13.4 -38.6 Q2 -36 17.2 -38.6 L17 -33.4 Q2 -31 -13.2 -33.4 Z"/>
    <path class="o" style="stroke-width:1.6" fill="#d9342b" d="M-12 -36 L-18 -28 L-14 -27.6 Z M-12 -36 L-12.4 -26 L-9 -28 Z"/>
    <path class="t" style="stroke:#c9a95a;stroke-width:1" d="M-6 -47 L-7 -40 M2 -48.6 L2 -40 M10 -47.6 L11 -40 M-18 -31 L-14 -33 M24 -31.6 L20 -33.6 M-6 -30.6 L-2 -33 M10 -30.4 L6 -33"/>
  </g>

  <!-- The near arm, bent, holding the camera at her chest. Joint at the shoulder. -->
  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#f2b49a" d="M-5 -3 Q0 -6.5 5 -2.5 L5.6 15 Q4 21 -1.6 19.4 L-4.6 16 Z"/>
    <path class="o" fill="#f3c9a5" d="M-1.6 13 L9.6 6 L13.6 11.6 L3 19.6 Q-2 20 -1.6 13 Z"/>
    <circle class="o" fill="#f3c9a5" cx="12.4" cy="9.6" r="4.4"/>
  </g>

  <!-- The camera: black and chrome, a flash cube on top. Joint in her hand. -->
  <g id="camera" data-parent="arm_front" transform="translate(23 -62)">
    <rect class="o" fill="#3a3a3a" x="-7" y="-6" width="20" height="12" rx="2"/>
    <rect class="n" fill="#c9ccd2" x="-6" y="-5" width="18" height="3.4"/>
    <rect class="o" style="stroke-width:1.8" fill="#2b2b2b" x="12" y="-4.5" width="4.6" height="9" rx="1.4"/>
    <circle class="n" fill="#6fa8d8" cx="14.4" cy="0" r="2"/>
    <rect class="f" fill="#e9e4da" x="-5" y="-1" width="5" height="3.6" rx="0.6"/>
    <path class="t" style="stroke-width:2" d="M-2 -6 L-2 -9 M3 -6 L3 -9"/>
    <rect class="f" fill="#f4f8fb" x="-4" y="-17" width="10" height="9" rx="1.2"/>
    <rect class="n" fill="#9fd0f0" x="-2.4" y="-15.4" width="6.8" height="5.8" rx="0.8"/>
    <path class="n" fill="#ffffff" d="M-1.8 -14.8 L1.2 -14.8 L-1.8 -11.8 Z"/>
  </g>

  <!-- The flash: hidden except for the moment it goes off. Joint at the flash cube. -->
  <g id="flash" data-parent="camera" transform="translate(24 -75)">
    <g transform="translate(5 -4) scale(0.6)">
    <path class="o" style="stroke-width:2" fill="#fff6a8" d="M0 -22 L5 -7 L20 -12 L9 -1 L22 8 L6 7 L4 22 L-3 8 L-17 16 L-8 1 L-22 -6 L-6 -6 Z"/>
    <path class="n" fill="#ffffff" d="M0 -12 L3 -4 L11 -6 L5 0 L12 5 L3 4 L2 12 L-2 4 L-9 8 L-4 0 L-12 -3 L-3 -3 Z"/>
    </g>
  </g>
</svg>
