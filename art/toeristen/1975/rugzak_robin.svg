<svg xmlns="http://www.w3.org/2000/svg" viewBox="-54 -142 110 148" data-rig="humanoid">
  <title>Rugzak-Robin: blootsvoets, een frame-rugzak met een gitaar erop, en zijn opgerolde slaapzak aan een riempje</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .f { stroke: #2b1b16; stroke-width: 1.4; stroke-linejoin: round; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The frame rucksack with the guitar strapped on. Joint between his shoulder blades; drawn in whole-body coordinates. -->
  <g id="pack" data-parent="torso" transform="translate(-12 -66)">
    <g transform="translate(12 66)">
      <!-- the guitar, neck up over his head -->
      <g transform="rotate(14 -30 -52)">
        <path class="o" fill="#6b4a35" d="M-33.5 -66 L-33 -128 L-27 -128 L-26.5 -66 Z"/>
        <path class="o" fill="#4a3226" d="M-35 -128 L-35.5 -140 L-24.5 -140 L-25 -128 Z"/>
        <circle class="n" fill="#e6e0d4" cx="-36.6" cy="-136" r="1.6"/>
        <circle class="n" fill="#e6e0d4" cx="-36.6" cy="-131" r="1.6"/>
        <circle class="n" fill="#e6e0d4" cx="-23.4" cy="-136" r="1.6"/>
        <circle class="n" fill="#e6e0d4" cx="-23.4" cy="-131" r="1.6"/>
        <path fill="none" stroke="#e6e0d4" stroke-width="0.7" d="M-31.5 -128 L-31.5 -66 M-28.5 -128 L-28.5 -66"/>
        <path class="o" fill="#e0a25a" d="M-30 -74 Q-42 -74 -42 -62 Q-42 -56 -38 -52 Q-45 -47 -45 -38 Q-45 -24 -30 -24 Q-15 -24 -15 -38 Q-15 -47 -22 -52 Q-18 -56 -18 -62 Q-18 -74 -30 -74 Z"/>
        <path class="n" fill="#f0bd7a" d="M-40 -60 Q-39 -70 -32 -72 Q-37 -66 -37 -58 Z"/>
        <circle class="o" style="stroke-width:1.8" fill="#3a2418" cx="-30" cy="-50" r="5.5"/>
        <rect class="o" style="stroke-width:1.6" fill="#4a3226" x="-35" y="-36" width="10" height="3.6" rx="1"/>
      </g>
      <!-- the aluminium frame -->
      <path class="t" style="stroke-width:5.2" d="M-14 -40 L-16 -122 M-34 -40 L-34 -116 M-34 -116 Q-26 -126 -16 -122"/>
      <path class="t" style="stroke:#c3ccd3;stroke-width:2.6" d="M-14 -40 L-16 -122 M-34 -40 L-34 -116 M-34 -116 Q-26 -126 -16 -122"/>
      <!-- the bag: orange nylon, a flap, and the patches he collected -->
      <path class="o" fill="#f08a24" d="M-38 -110 Q-38 -116 -32 -116 L-17 -116 Q-11 -116 -11 -110 L-10 -54 Q-10 -46 -18 -46 L-32 -46 Q-40 -46 -39 -54 Z"/>
      <path class="n" fill="#d9701a" d="M-37.5 -100 L-33 -100 L-32 -48 Q-38 -48 -38.4 -54 Z"/>
      <path class="o" fill="#e07a1c" d="M-38.5 -110 Q-38 -116 -32 -116 L-17 -116 Q-11 -116 -11 -110 L-11 -94 Q-24 -88 -38.5 -94 Z"/>
      <rect class="o" style="stroke-width:1.6" fill="#c9c9d2" x="-26.6" y="-95" width="5" height="6" rx="1"/>
      <path class="o" fill="#e07a1c" d="M-37 -72 L-28 -72 L-28 -54 Q-33 -52 -37.5 -54 Z"/>
      <!-- a sun, a mountain, a palm tree -->
      <circle class="f" fill="#ffd21f" cx="-17.5" cy="-78" r="4.6"/>
      <path class="f" fill="#ffffff" d="M-25 -58 L-19.5 -67 L-14 -58 Z"/>
      <path class="n" fill="#6fa8d8" d="M-21.4 -63.8 L-19.5 -67 L-17.6 -63.8 Z"/>
      <!-- the bedroll under the bag -->
      <rect class="o" fill="#4b7b3c" x="-42" y="-50" width="34" height="12" rx="6"/>
      <ellipse class="o" style="stroke-width:1.8" fill="#5f9a4c" cx="-8.5" cy="-44" rx="3.2" ry="6"/>
      <path class="t" style="stroke:#2b1b16;stroke-width:2" d="M-34 -50 L-34 -38 M-18 -50 L-18 -38"/>
    </g>
  </g>

  <!-- The far arm, holding the strap of the rucksack. -->
  <g id="arm_back" data-parent="torso" transform="translate(-8 -72)">
    <path class="o" fill="#8fc3e0" d="M-6 -4 Q0 -7 6 -3.5 L5 6 L-5 6 Z"/>
    <path class="o" fill="#f0a888" d="M-4.6 5 L4.6 5 L3.6 20 L-3.6 20 Z"/>
    <circle class="o" fill="#f0a888" cx="0" cy="22.5" r="4.6"/>
  </g>

  <!-- Bare legs under cut-off shorts, bare feet, a bit dusty. -->
  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#e8b08f" d="M-5 10 L5 10 L4.5 33 L-4.5 33 Z"/>
    <path class="o" fill="#e8b08f" d="M-6 38 L-6 33 Q-6 30.5 -2 30.5 L6 30.5 Q12 31 14.5 34 Q15.5 38 12 38 Z"/>
    <path class="o" fill="#b39a62" d="M-7.5 -3 L7.5 -3 L7 13 L-7.5 13 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#f3c2a0" d="M-5 10 L5 10 L4.5 33 L-4.5 33 Z"/>
    <path class="o" fill="#f3c2a0" d="M-6 38 L-6 33 Q-6 30.5 -2 30.5 L6 30.5 Q12 31 14.5 34 Q15.5 38 12 38 Z"/>
    <path class="t" style="stroke:#c98f6c;stroke-width:1.1" d="M8.5 34 L8.5 37 M11 34.4 L11 37"/>
    <path class="n" fill="#a08c6c" d="M-5.6 36.4 L13.6 36.4 L13.4 37.6 L-5.6 37.6 Z"/>
    <path class="o" fill="#c9b27a" d="M-7.5 -3 L7.5 -3 L7.5 13 L-7.5 13 Z"/>
    <path class="t" style="stroke:#f4ecdc;stroke-width:1.2" d="M-6.5 12.6 l1.5 2 l1.5 -2 l1.5 2 l1.5 -2 l1.5 2 l1.5 -2 l1.5 2 l1.5 -2 l1.2 1.6"/>
  </g>

  <!-- A faded T-shirt with a sun on it, and the straps of the rucksack. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#8fc3e0" d="M-15 7 Q-17 -14 -14 -30 Q-11 -37 0 -37 Q12 -37 15 -30 Q18 -14 16.5 7 Z"/>
    <path class="n" fill="#7ab0cf" d="M-14 6 Q-16 -14 -13.4 -28 Q-9.5 -19 -9 6 Z"/>
    <circle class="n" fill="#ffd21f" cx="6" cy="-14" r="5"/>
    <path fill="none" stroke="#ffd21f" stroke-width="1.6" stroke-linecap="round" d="M6 -22.5 L6 -21 M6 -7 L6 -5.5 M-2.5 -14 L-1 -14 M13 -14 L14.5 -14 M0 -20 L1 -19 M11 -9 L12 -8 M0 -8 L1 -9 M11 -19 L12 -20"/>
    <path class="o" style="stroke-width:1.6" fill="#2b5f8e" d="M-12 -36 L-7 -36 L-1 -2 L-6 -1 Z"/>
    <path class="t" style="stroke:#f4ecdc;stroke-width:1.2" d="M-10 -30 L-6 -30"/>
    <path class="o" fill="#c9b27a" d="M-15.5 1 L16.8 1 L16.6 8 L-15.4 8 Z"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#e8a888" x="-4" y="-6" width="9" height="9" rx="2"/>
    <!-- shaggy sandy hair at the back, over the collar -->
    <path class="o" fill="#c48a44" d="M-14 -30 Q-24 -24 -21 -10 Q-19 -2 -12 -1 Q-9 -6 -8 -12 Z"/>
    <ellipse class="o" fill="#f3c9a5" cx="2" cy="-21" rx="18" ry="17.5"/>
    <ellipse class="o" fill="#f0a888" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <path class="o" fill="#c48a44" d="M-17 -22 Q-20 -36 -8 -40.5 Q4 -45 15 -39.5 Q22 -35 20 -29 Q17 -33 12 -33 Q10 -29 6 -31 Q3 -27 -1 -30 Q-4 -26 -7 -28 L-9 -14 Q-17 -14 -17 -22 Z"/>
    <path class="t" style="stroke:#9a6a30;stroke-width:1.3" d="M-9 -37 Q1 -41 12 -38 M-14 -31 Q-8 -35 0 -36"/>
    <!-- sunburnt: red nose, pink cheeks, a white strip where the sunglasses were -->
    <ellipse class="n" fill="#f08a78" fill-opacity="0.65" cx="7" cy="-13" rx="5" ry="3"/>
    <circle class="n" fill="#2b1b16" cx="9.5" cy="-20.4" r="1.9"/>
    <circle class="n" fill="#2b1b16" cx="17.5" cy="-20.4" r="1.7"/>
    <path class="t" style="stroke:#9a6a30;stroke-width:2.2" d="M5.5 -25.2 Q8.5 -27 12 -25.6 M15 -25.6 Q17.6 -26.8 20 -25"/>
    <path class="o" fill="#ff6f5c" d="M19 -19.5 Q26.5 -16.5 21.5 -11.5 Q19.4 -11 18.6 -12.4"/>
    <!-- a big friendly grin -->
    <path class="o" style="stroke-width:1.8" fill="#fffdf5" d="M7.5 -9.5 Q13.5 -8 19 -10 Q17.5 -3.5 12.5 -3.5 Q8.5 -4 7.5 -9.5 Z"/>
    <path class="t" style="stroke:#c48a44;stroke-width:1.1;stroke-dasharray:0.1 2.2" d="M0 -6 Q6 -1 15 -1.2"/>
  </g>

  <!-- The near arm: down and a little forward, the strap of the sleeping bag in his fist. -->
  <g id="arm_front" data-parent="torso" transform="translate(9 -72)">
    <path class="o" fill="#8fc3e0" d="M-6 -4 Q0 -7.5 6 -3.5 L6.5 6 L-4.5 7 Z"/>
    <path class="o" fill="#f3c9a5" d="M-3.6 5.4 L5.6 5 L9.6 19.6 L1.6 21.8 Z"/>
    <circle class="o" fill="#f3c9a5" cx="6.6" cy="22.4" r="4.7"/>
  </g>

  <!-- The rolled-up sleeping bag on its strap. Joint in his fist, so it dangles and swings. -->
  <g id="bag" data-parent="arm_front" transform="translate(16 -50)">
    <path class="t" style="stroke:#2b1b16;stroke-width:3.4" d="M0 0 L2 9"/>
    <path class="t" style="stroke:#7a5236;stroke-width:1.8" d="M0 0 L2 9"/>
    <rect class="o" fill="#3e6fc9" x="-13" y="8" width="30" height="16" rx="8"/>
    <path class="n" fill="#5c8ae0" d="M-8 10 L10 10 Q13 11 12 13 L-8 13 Q-10 11.5 -8 10 Z"/>
    <path class="t" style="stroke-width:2" d="M-3 8.4 L-3 23.6 M8 8.4 L8 23.6"/>
    <ellipse class="o" style="stroke-width:1.8" fill="#5c8ae0" cx="16" cy="16" rx="4" ry="7.6"/>
    <path class="t" style="stroke:#2b4f99;stroke-width:1.2" d="M16 16 q1.6 -1.6 1.6 0.6 q0 3 -2.8 2.6 q-2.8 -0.6 -2.4 -4.6 q0.8 -3.6 3.6 -3.4"/>
  </g>
</svg>
