<svg xmlns="http://www.w3.org/2000/svg" viewBox="-312 -596 328 602" data-rig="static">
  <title>De Sleep-in: een gele jeugdherberg vol stapelbedden, een geschilderde zon op de gevel, en ervoor een kamp van tentjes voor wie geen bed meer kreeg</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .k { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .b { stroke: #4f6a7e; stroke-width: 2.4; stroke-linecap: round; fill: none; }
  </style>

  <!-- (0,0) is the foot of the doorway, where units come out. The hostel stands behind it, to the left. -->
  <g id="building" transform="translate(0 0)">
    <!-- the flagpole on the corner of the roof -->
    <path class="t" style="stroke-width:5" d="M-288 -446 L-288 -552"/>
    <circle class="o" fill="#e0b84a" cx="-288" cy="-555" r="4.5"/>

    <!-- on the flat roof: more tents, because the beds ran out on the first day -->
    <path class="t" style="stroke-width:1.2" d="M-160 -452 L-170 -446 M-92 -452 L-82 -446 M-60 -452 L-68 -446 M-14 -452 L-6 -446"/>
    <path class="o" style="stroke-width:2.4" fill="#d9342b" d="M-164 -452 L-126 -490 L-88 -452 Z"/>
    <path class="o" style="stroke-width:2.2" fill="#3a1f1a" d="M-134 -452 L-126 -476 L-118 -452 Z"/>
    <path class="n" fill="#a8201a" d="M-164 -452 L-126 -490 L-132 -452 Z"/>
    <path class="o" style="stroke-width:2.4" fill="#3e6fc9" d="M-66 -452 Q-66 -482 -38 -482 Q-10 -482 -10 -452 Z"/>
    <path class="t" style="stroke:#2b4f99;stroke-width:1.4" d="M-58 -452 Q-56 -476 -38 -478 Q-20 -476 -18 -452"/>
    <path class="o" style="stroke-width:2.2" fill="#2a2b3a" d="M-46 -452 Q-46 -466 -38 -466 Q-30 -466 -30 -452 Z"/>

    <!-- the front: sunny yellow, with an orange band under the roof -->
    <rect class="o" fill="#f5dc8e" x="-296" y="-444" width="292" height="444"/>
    <path class="n" fill="#ecca6c" d="M-294.5 -442.5 L-282 -442.5 L-282 -1.5 L-294.5 -1.5 Z"/>
    <rect class="o" fill="#f08a24" x="-302" y="-454" width="304" height="12" rx="3"/>
    <path class="t" style="stroke:#c96a14;stroke-width:1.4" d="M-296 -448 L-4 -448"/>

    <!-- upper floor: a dormitory, bunks to the ceiling -->
    <rect class="o" fill="#34495a" x="-290" y="-436" width="280" height="142"/>
    <path class="b" d="M-276 -430 L-276 -300 M-236 -430 L-236 -300 M-276 -396 L-236 -396 M-276 -350 L-236 -350 M-206 -430 L-206 -300 M-166 -430 L-166 -300 M-206 -396 L-166 -396 M-206 -350 L-166 -350 M-136 -430 L-136 -300 M-96 -430 L-96 -300 M-136 -396 L-96 -396 M-136 -350 L-96 -350 M-66 -430 L-66 -300 M-26 -430 L-26 -300 M-66 -396 L-26 -396 M-66 -350 L-26 -350"/>
    <path class="n" fill="#3e5568" d="M-274 -402 L-238 -402 L-238 -396 L-274 -396 Z M-274 -356 L-238 -356 L-238 -350 L-274 -350 Z M-204 -402 L-168 -402 L-168 -396 L-204 -396 Z M-204 -356 L-168 -356 L-168 -350 L-204 -350 Z M-134 -402 L-98 -402 L-98 -396 L-134 -396 Z M-134 -356 L-98 -356 L-98 -350 L-134 -350 Z M-64 -402 L-28 -402 L-28 -396 L-64 -396 Z M-64 -356 L-28 -356 L-28 -350 L-64 -350 Z"/>
    <path class="n" fill="#2c3d4b" d="M-288 -308 L-12 -308 L-12 -296 L-288 -296 Z"/>

    <!-- first floor: the same, a floor down -->
    <rect class="o" fill="#34495a" x="-290" y="-284" width="280" height="140"/>
    <path class="b" d="M-276 -278 L-276 -150 M-236 -278 L-236 -150 M-276 -244 L-236 -244 M-276 -198 L-236 -198 M-206 -278 L-206 -150 M-166 -278 L-166 -150 M-206 -244 L-166 -244 M-206 -198 L-166 -198 M-136 -278 L-136 -150 M-96 -278 L-96 -150 M-136 -244 L-96 -244 M-136 -198 L-96 -198 M-66 -278 L-66 -150 M-26 -278 L-26 -150 M-66 -244 L-26 -244 M-66 -198 L-26 -198"/>
    <path class="n" fill="#3e5568" d="M-274 -250 L-238 -250 L-238 -244 L-274 -244 Z M-274 -204 L-238 -204 L-238 -198 L-274 -198 Z M-204 -250 L-168 -250 L-168 -244 L-204 -244 Z M-204 -204 L-168 -204 L-168 -198 L-204 -198 Z M-134 -250 L-98 -250 L-98 -244 L-134 -244 Z M-134 -204 L-98 -204 L-98 -198 L-134 -198 Z M-64 -250 L-28 -250 L-28 -244 L-64 -244 Z M-64 -204 L-28 -204 L-28 -198 L-64 -198 Z"/>
    <path class="n" fill="#2c3d4b" d="M-288 -158 L-12 -158 L-12 -146 L-288 -146 Z"/>

    <!-- concrete floor slabs -->
    <rect class="o" fill="#d8ccb0" x="-300" y="-294" width="300" height="10" rx="3"/>
    <rect class="o" fill="#d8ccb0" x="-300" y="-144" width="300" height="10" rx="3"/>

    <!-- ground floor: a sun painted on the wall, sunglasses and all -->
    <circle class="n" fill="#ffd21f" cx="-200" cy="-98" r="40" fill-opacity="0.35"/>
    <path fill="none" stroke="#f08a24" stroke-width="5" stroke-linecap="round" d="M-200 -134 L-200 -128 M-236 -98 L-242 -98 M-164 -98 L-158 -98 M-225 -123 L-230 -128 M-175 -123 L-170 -128 M-225 -73 L-230 -68 M-175 -73 L-170 -68"/>
    <circle class="o" fill="#ffd21f" cx="-200" cy="-98" r="22"/>
    <path class="o" style="stroke-width:2.4" fill="#2b1b16" d="M-216 -104 L-203 -104 Q-202 -94 -210 -94 Q-216 -95 -216 -104 Z M-197 -104 L-184 -104 Q-184 -95 -190 -94 Q-198 -94 -197 -104 Z"/>
    <path class="t" style="stroke-width:2.4" d="M-203 -102 L-197 -102"/>
    <path class="t" style="stroke-width:2.6" d="M-210 -86 Q-200 -78 -190 -86"/>

    <!-- the noticeboard by the door: postcards from everywhere, pinned up -->
    <rect class="o" style="stroke-width:2.4" fill="#c98a4d" x="-142" y="-118" width="34" height="44" rx="2"/>
    <rect class="k" fill="#ffffff" x="-138" y="-114" width="12" height="9"/>
    <rect class="n" fill="#8fcbf0" x="-137" y="-113" width="10" height="4"/>
    <rect class="k" fill="#ffffff" x="-124" y="-110" width="12" height="9" transform="rotate(8 -118 -106)"/>
    <rect class="n" fill="#ffb52e" x="-123" y="-109" width="10" height="7" transform="rotate(8 -118 -106)"/>
    <rect class="k" fill="#ffffff" x="-139" y="-100" width="12" height="9" transform="rotate(-6 -133 -96)"/>
    <rect class="n" fill="#5fb85a" x="-138" y="-99" width="10" height="7" transform="rotate(-6 -133 -96)"/>
    <rect class="k" fill="#ffffff" x="-125" y="-95" width="12" height="9"/>
    <rect class="n" fill="#ff7ac0" x="-124" y="-94" width="10" height="7"/>
    <rect class="k" fill="#ffffff" x="-136" y="-86" width="12" height="9" transform="rotate(4 -130 -82)"/>
    <rect class="n" fill="#3e6fc9" x="-135" y="-85" width="10" height="4" transform="rotate(4 -130 -82)"/>
    <circle class="n" fill="#d9342b" cx="-132" cy="-113" r="1.4"/>
    <circle class="n" fill="#d9342b" cx="-118" cy="-109" r="1.4"/>
    <circle class="n" fill="#d9342b" cx="-133" cy="-99" r="1.4"/>
    <circle class="n" fill="#d9342b" cx="-119" cy="-94" r="1.4"/>

    <!-- the doorway units come out of: reception, a rack of keys nobody uses, rucksacks against the wall -->
    <rect class="o" fill="#f08a24" x="-100" y="-130" width="96" height="130"/>
    <rect class="o" fill="#2a2520" x="-88" y="-120" width="72" height="120"/>
    <path class="n" fill="#383028" d="M-86 -2 L-86 -118 L-80 -118 L-80 -2 Z"/>
    <path class="o" style="stroke-width:2" fill="#5a3a22" d="M-74 -40 L-30 -40 L-30 -2 L-74 -2 Z"/>
    <path class="t" style="stroke:#8a6a4a;stroke-width:1.6" d="M-74 -32 L-30 -32"/>
    <circle class="n" fill="#fff6c8" cx="-52" cy="-100" r="4"/>
    <circle class="n" fill="#ffe9a8" fill-opacity="0.3" cx="-52" cy="-100" r="12"/>
    <path class="t" style="stroke:#8b8478;stroke-width:1.4" d="M-52 -120 L-52 -104"/>
    <path class="n" fill="#e07a1c" d="M-28 -2 L-28 -26 Q-28 -32 -22 -32 L-19 -32 L-19 -2 Z"/>
    <path class="n" fill="#4b7b3c" d="M-82 -2 L-82 -22 Q-82 -28 -76 -28 L-74 -28 L-74 -2 Z"/>
    <path class="o" style="stroke-width:2" fill="#c98a4d" d="M-88 -1 L-88 -120 L-80 -114 L-80 -1 Z"/>
    <rect class="o" fill="#8f959c" x="-104" y="-6" width="104" height="6"/>

    <!-- the camp in front: an orange ridge tent, a green one with someone's feet sticking out, a little blue one -->
    <path class="t" style="stroke-width:1.2" d="M-298 -2 L-288 -30 M-232 -2 L-242 -30 M-224 -2 L-214 -34 M-158 -2 L-168 -34 M-152 -2 L-146 -22 M-108 -2 L-114 -22"/>
    <path class="o" fill="#f08a24" d="M-292 -2 L-265 -58 L-238 -2 Z"/>
    <path class="n" fill="#d9701a" d="M-292 -2 L-265 -58 L-270 -2 Z"/>
    <path class="o" style="stroke-width:2.4" fill="#3a2418" d="M-276 -2 L-265 -32 L-254 -2 Z"/>
    <path class="t" style="stroke-width:2.2" d="M-265 -58 L-265 -64"/>
    <path class="o" fill="#6fa86a" d="M-220 -2 L-191 -64 L-162 -2 Z"/>
    <path class="n" fill="#5a8f56" d="M-220 -2 L-191 -64 L-196 -2 Z"/>
    <path class="o" style="stroke-width:2.4" fill="#2a3a26" d="M-203 -2 L-191 -36 L-179 -2 Z"/>
    <path class="t" style="stroke-width:2.2" d="M-191 -64 L-191 -70"/>
    <path class="o" fill="#6fb4e0" d="M-150 -2 Q-150 -30 -130 -30 Q-110 -30 -110 -2 Z"/>
    <path class="o" style="stroke-width:2.2" fill="#2a3a4a" d="M-138 -2 Q-138 -16 -130 -16 Q-122 -16 -122 -2 Z"/>
    <!-- a camping stove with the kettle on -->
    <path class="t" style="stroke-width:2" d="M-245 -2 L-241 -12 M-233 -2 L-237 -12"/>
    <rect class="k" fill="#3e6fc9" x="-246" y="-16" width="14" height="5" rx="1.5"/>
    <path class="k" fill="#c9ccd2" d="M-245 -16 Q-245 -26 -239 -26 Q-233 -26 -233 -16 Z"/>
    <path class="t" style="stroke-width:1.6" d="M-233 -22 L-228 -25"/>
    <rect class="o" fill="#8f959c" x="-302" y="-6" width="200" height="6"/>

    <circle data-mount="turret0" fill="none" cx="-150" cy="-144" r="1"/>
    <circle data-mount="turret1" fill="none" cx="-150" cy="-294" r="1"/>
    <circle data-mount="flag" fill="none" cx="-286" cy="-548" r="1"/>
  </g>

  <!-- Two bare soles in the door of the green tent: someone is still asleep at noon. Joint at the heels. -->
  <g id="feet" data-parent="building" transform="translate(-191 -4)">
    <path class="k" style="stroke-width:2" fill="#f3c9a5" d="M-11 2 Q-13 -8 -10 -16 Q-8 -21 -4 -20 Q-1 -18 -1 -12 Q-1 -4 -3 2 Z"/>
    <path class="k" style="stroke-width:2" fill="#f0c19a" d="M11 2 Q13 -8 10 -16 Q8 -21 4 -20 Q1 -18 1 -12 Q1 -4 3 2 Z"/>
    <circle class="k" style="stroke-width:1.2" fill="#f3c9a5" cx="-9.6" cy="-20" r="1.8"/>
    <circle class="k" style="stroke-width:1.2" fill="#f3c9a5" cx="-6.4" cy="-21.4" r="1.6"/>
    <circle class="k" style="stroke-width:1.2" fill="#f3c9a5" cx="-3.4" cy="-20.6" r="1.4"/>
    <circle class="k" style="stroke-width:1.2" fill="#f0c19a" cx="9.6" cy="-20" r="1.8"/>
    <circle class="k" style="stroke-width:1.2" fill="#f0c19a" cx="6.4" cy="-21.4" r="1.6"/>
    <circle class="k" style="stroke-width:1.2" fill="#f0c19a" cx="3.4" cy="-20.6" r="1.4"/>
    <path class="n" fill="#a08c6c" fill-opacity="0.6" d="M-9 -2 Q-8 -8 -4 -8 Q-3 -4 -4 -2 Z M9 -2 Q8 -8 4 -8 Q3 -4 4 -2 Z"/>
  </g>

  <!-- Washing on the roof: a sleeping bag airing out, socks, a towel. Joint at the middle of the line. -->
  <g id="washing" data-parent="building" transform="translate(-226 -474)">
    <g transform="translate(226 474)">
      <path class="t" style="stroke-width:1.4" d="M-288 -480 Q-226 -468 -166 -480"/>
      <path class="t" style="stroke-width:2.6" d="M-166 -480 L-166 -452"/>
      <path class="k" fill="#3e6fc9" d="M-276 -477 L-246 -473.6 L-247 -456 L-277 -459 Z"/>
      <path class="t" style="stroke:#2b4f99;stroke-width:1.2" d="M-271 -470 L-251 -468 M-272 -464 L-252 -462"/>
      <path class="k" fill="#e4dccb" d="M-238 -472.8 L-234 -472.6 L-234.4 -464 L-231 -462 L-236 -461.6 L-238.2 -464 Z M-228 -472.4 L-224 -472.4 L-224.4 -463.4 L-221 -461.4 L-226 -461 L-228.2 -463.4 Z"/>
      <path class="k" fill="#ff7ac0" d="M-212 -472.6 L-190 -474.4 L-189.6 -460 L-211.6 -458.6 Z"/>
      <path class="t" style="stroke:#ffffff;stroke-width:1.4" d="M-211.6 -463 L-189.6 -464.4"/>
    </g>
  </g>

  <!-- Steam from the kettle. Joint at the spout. -->
  <g id="steam" data-parent="building" transform="translate(-228 -26)">
    <path class="k" fill="#ffffff" d="M-4 -4 Q-8 -8 -4 -12 Q-2 -17 3 -14 Q8 -15 7 -10 Q10 -6 5 -4 Q1 -1 -4 -4 Z"/>
  </g>
</svg>
