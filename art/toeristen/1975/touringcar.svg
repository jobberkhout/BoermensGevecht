<svg xmlns="http://www.w3.org/2000/svg" viewBox="-128 -126 254 132" data-rig="vehicle">
  <title>De Touringcar: negen landen in zeven dagen, en de gids hangt met zijn vaantje uit de deur</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .f { stroke: #2b1b16; stroke-width: 1.3; stroke-linejoin: round; }
  </style>

  <g id="chassis" transform="translate(0 0)"/>

  <!-- Diesel smoke. Joint at the end of the exhaust, so it grows out of it. -->
  <g id="puff" data-parent="chassis" transform="translate(-110 -20)">
    <path transform="scale(0.8)" class="o" style="stroke-width:2" fill="#d9d4cc" d="M-2 -3 Q-2 -9 -7 -10 Q-8 -16 -14 -15 Q-20 -14 -19 -8 Q-23 -3 -17 0 Q-11 4 -5 1 Q-1 0 -2 -3 Z"/>
  </g>

  <!-- The coach. Joint in the middle; drawn in whole-coach coordinates. -->
  <g id="body" data-parent="chassis" transform="translate(0 -60)">
    <g transform="translate(0 60)">
      <rect class="o" fill="#6b6b6b" x="-115" y="-23" width="8" height="5" rx="2"/>
      <!-- cream on top, orange and brown stripes, a dark skirt -->
      <path class="o" fill="#f4ecdc" d="M-112 -20 L-112 -100 Q-112 -112 -100 -112 L86 -112 Q98 -112 103 -102 L112 -72 L112 -24 Q112 -16 104 -16 L-106 -16 Q-112 -16 -112 -20 Z"/>
      <path class="n" fill="#e07a1c" d="M-110.8 -60 L111 -60 L111 -51 L-110.8 -51 Z"/>
      <path class="n" fill="#8a4a1f" d="M-110.8 -51 L111 -51 L111 -45 L-110.8 -45 Z"/>
      <path class="n" fill="#e07a1c" d="M-110.8 -64 Q-90 -64 -70 -76 Q-56 -84 -40 -84 L-40 -80 Q-54 -80 -68 -72 Q-88 -60 -110.8 -60 Z"/>
      <path class="o" style="stroke-width:2" fill="#5a3a22" d="M-111 -36 L111.4 -36 L111.4 -24 Q111.4 -17 104 -17 L-106 -17 Q-111 -17 -111 -21 Z"/>
      <path class="t" style="stroke:#3a2416" d="M-104 -30 L100 -30"/>

      <!-- the side windows with the passengers -->
      <rect class="o" fill="#2f4a6a" x="-104" y="-102" width="176" height="34" rx="4"/>
      <path class="t" style="stroke-width:3.2;stroke:#2b1b16" d="M-80 -102 L-80 -68 M-56 -102 L-56 -68 M-32 -102 L-32 -68 M-8 -102 L-8 -68 M16 -102 L16 -68 M40 -102 L40 -68"/>
      <path class="t" style="stroke-width:1.6;stroke:#c9ccd2" d="M-80 -101 L-80 -69 M-56 -101 L-56 -69 M-32 -101 L-32 -69 M-8 -101 L-8 -69 M16 -101 L16 -69 M40 -101 L40 -69"/>
      <!-- 1: asleep with his mouth open -->
      <circle class="f" fill="#f0c19a" cx="-92" cy="-80" r="8"/>
      <path class="n" fill="#8a6a4a" d="M-100 -82 Q-99 -91 -91 -89 Q-86 -88 -85 -84 Q-91 -86 -100 -82 Z"/>
      <path class="t" style="stroke-width:1.2" d="M-91 -81 L-88 -81"/>
      <ellipse class="n" fill="#5a1f2a" cx="-87.6" cy="-76" rx="1.8" ry="2.2"/>
      <!-- 2: a sun hat -->
      <circle class="f" fill="#f3c9a5" cx="-68" cy="-78" r="7.6"/>
      <path class="f" fill="#ead08a" d="M-80 -84 Q-68 -89 -56 -84 Q-68 -82 -80 -84 Z M-74 -85 Q-74 -94 -68 -94 Q-62 -94 -62 -85 Z"/>
      <circle class="n" fill="#2b1b16" cx="-64" cy="-78" r="1.2"/>
      <!-- 3: a camera to the glass -->
      <circle class="f" fill="#e8b08f" cx="-44" cy="-80" r="7.6"/>
      <path class="n" fill="#3a2a1e" d="M-52 -83 Q-50 -90 -44 -89 Q-38 -89 -37 -84 Q-44 -86 -52 -83 Z"/>
      <rect class="f" fill="#3a3a3a" x="-42" y="-84" width="9" height="7" rx="1.4"/>
      <circle class="n" fill="#6fa8d8" cx="-35" cy="-80.5" r="1.6"/>
      <!-- 4: nose flat against the window -->
      <circle class="f" fill="#f0c19a" cx="-20" cy="-80" r="7.6"/>
      <path class="n" fill="#c48a44" d="M-28 -82 Q-27 -89 -20 -89 Q-13 -89 -12 -84 Q-20 -86 -28 -82 Z"/>
      <ellipse class="f" fill="#f7a88e" cx="-11.6" cy="-79" rx="2.6" ry="3.4"/>
      <circle class="n" fill="#2b1b16" cx="-15.6" cy="-82" r="1.2"/>
      <!-- 5: rollers -->
      <circle class="f" fill="#f3c9a5" cx="4" cy="-78" r="7.6"/>
      <rect class="f" fill="#ff7ac0" x="-3" y="-90" width="5" height="7" rx="2"/>
      <rect class="f" fill="#6fd0e0" x="2.6" y="-92" width="5" height="7" rx="2"/>
      <rect class="f" fill="#ffd21f" x="8" y="-89" width="5" height="7" rx="2"/>
      <circle class="n" fill="#2b1b16" cx="8" cy="-78" r="1.2"/>
      <!-- 6: waving -->
      <circle class="f" fill="#e8b08f" cx="28" cy="-78" r="7.6"/>
      <path class="n" fill="#2b1b16" d="M20 -80 Q21 -88 28 -88 Q35 -88 36 -82 Q28 -85 20 -80 Z"/>
      <circle class="n" fill="#2b1b16" cx="32" cy="-78.6" r="1.2"/>
      <path class="t" style="stroke:#2b1b16;stroke-width:5" d="M33 -73 L36 -92"/>
      <path class="t" style="stroke:#e8b08f;stroke-width:2.6" d="M33 -73 L36 -92"/>
      <circle class="f" fill="#e8b08f" cx="36" cy="-93" r="3.4"/>
      <!-- 7: the guide's empty seat, with the microphone -->
      <path class="t" style="stroke-width:2" d="M58 -70 L58 -90 Q58 -94 62 -94"/>
      <rect class="f" fill="#3a3a3a" x="61" y="-96.6" width="6" height="5" rx="2"/>

      <!-- the windscreen and the driver in his sunglasses -->
      <path class="o" fill="#7fb4d8" d="M76 -104 L94 -104 Q100 -104 103 -98 L110 -74 L76 -74 Z"/>
      <circle class="f" fill="#e8b08f" cx="90" cy="-84" r="8"/>
      <path class="n" fill="#3a2a1e" d="M82 -87 Q82 -95 90 -95 Q97 -95 98 -88 Q90 -91 82 -87 Z"/>
      <rect class="n" fill="#2b1b16" x="91" y="-87" width="7" height="3.6" rx="1.4"/>
      <path class="t" style="stroke-width:2.4" d="M96 -76 Q100 -79 104 -76"/>
      <path class="n" fill="#ffffff" fill-opacity="0.5" d="M80 -102 L86 -102 L80 -90 Z"/>

      <!-- the door at the front, folded open -->
      <rect class="o" fill="#2f2a26" x="76" y="-70" width="22" height="52" rx="2"/>
      <path class="t" style="stroke:#c9ccd2;stroke-width:2" d="M80 -66 L80 -22 M94 -66 L94 -22"/>
      <path class="o" fill="#c9ccd2" d="M98 -42 L108 -42 L108 -38 L98 -38 Z"/>

      <!-- nine countries, nine stickers on the back -->
      <circle class="f" fill="#ffd21f" cx="-102" cy="-74" r="4"/>
      <circle class="f" fill="#ffffff" cx="-92" cy="-68" r="4"/>
      <path class="n" fill="#4b7b3c" d="M-95 -66 L-92 -71 L-89 -66 Z"/>
      <circle class="f" fill="#ff7ac0" cx="-103" cy="-63" r="3.6"/>
      <circle class="f" fill="#6fd0e0" cx="-100" cy="-42" r="4"/>
      <path class="n" fill="#ffffff" d="M-102.4 -43 L-97.6 -43 L-100 -39.4 Z"/>
      <circle class="f" fill="#e07a1c" cx="-90" cy="-42" r="3.6"/>
      <rect class="f" fill="#ffffff" x="-85" y="-71" width="7" height="6" rx="1.4"/>
      <path fill="none" stroke="#3e6fc9" stroke-width="1.4" stroke-linecap="round" d="M-84 -67 q1.2 -1.6 2.4 0 q1.2 1.6 2.4 0"/>
      <circle class="f" fill="#4bb167" cx="-80" cy="-42" r="3.6"/>
      <circle class="f" fill="#ffffff" cx="-70" cy="-42" r="4"/>
      <path class="n" fill="#ffd21f" d="M-70 -45 L-69 -42.4 L-66.6 -42 L-69 -41 L-70 -38.6 L-71 -41 L-73.4 -42 L-71 -42.4 Z"/>
      <circle class="f" fill="#8a6fb8" cx="-60" cy="-42" r="3.6"/>

      <!-- headlight, tail light -->
      <ellipse class="o" fill="#fff3b0" cx="109" cy="-30" rx="3.6" ry="5"/>
      <rect class="o" style="stroke-width:1.6" fill="#d9342b" x="-114" y="-46" width="4" height="9" rx="1.4"/>

      <!-- wheel wells -->
      <path class="o" fill="#241b26" d="M-87 -16 A21 21 0 0 1 -45 -16 Z"/>
      <path class="o" fill="#241b26" d="M31 -16 A21 21 0 0 1 73 -16 Z"/>
    </g>
  </g>

  <g id="wheel_back" data-parent="chassis" transform="translate(-66 -17)">
    <circle class="o" fill="#2f2f2f" cx="0" cy="0" r="17"/>
    <circle class="o" style="stroke-width:1.8" fill="#c9ccd2" cx="0" cy="0" r="9"/>
    <path class="t" style="stroke:#8a8f98;stroke-width:1.4" d="M0 -8 L0 8 M-8 0 L8 0"/>
    <circle class="n" fill="#2b1b16" cx="0" cy="0" r="2.2"/>
  </g>

  <g id="wheel_front" data-parent="chassis" transform="translate(52 -17)">
    <circle class="o" fill="#2f2f2f" cx="0" cy="0" r="17"/>
    <circle class="o" style="stroke-width:1.8" fill="#c9ccd2" cx="0" cy="0" r="9"/>
    <path class="t" style="stroke:#8a8f98;stroke-width:1.4" d="M0 -8 L0 8 M-8 0 L8 0"/>
    <circle class="n" fill="#2b1b16" cx="0" cy="0" r="2.2"/>
  </g>

  <!-- The roof rack: suitcases and a rolled-up tent. Joint in the middle of the roof. -->
  <g id="rack" data-parent="body" transform="translate(-30 -112)">
    <g transform="translate(30 113.5)">
      <path class="t" style="stroke-width:2.6" d="M-96 -116 L40 -116 M-90 -116 L-90 -112 M-40 -116 L-40 -112 M10 -116 L10 -112 M36 -116 L36 -112"/>
      <rect class="o" fill="#8a4a1f" x="-90" y="-125" width="26" height="9" rx="2"/>
      <path class="t" style="stroke:#e9c9a0;stroke-width:1.2" d="M-82 -125 L-82 -116 M-72 -125 L-72 -116"/>
      <rect class="o" fill="#3e6fc9" x="-60" y="-124" width="22" height="8" rx="2"/>
      <rect class="o" fill="#4b7b3c" x="-32" y="-124.5" width="30" height="8.6" rx="4.3"/>
      <path class="t" d="M-24 -124 L-24 -116 M-10 -124 L-10 -116"/>
      <rect class="o" fill="#d9342b" x="4" y="-123" width="18" height="7" rx="2"/>
    </g>
  </g>

  <!-- The guide in the doorway, leaning out, the pennant up so the group can find her. Joint at her waist, on the step. -->
  <g id="guide" data-parent="body" transform="translate(95 -44)">
    <g transform="translate(-95 44)">
      <path class="o" fill="#2f5f9e" d="M86 -24 L102 -24 L102 -18 L86 -18 Z"/>
      <path class="o" fill="#ffd21f" d="M85 -44 Q84 -60 93 -64 Q104 -64 105 -52 L103 -40 Q95 -36 85 -40 Z"/>
      <path class="o" fill="#2f5f9e" d="M85 -42 L103 -42 L103 -24 L85 -24 Z"/>
      <path class="t" style="stroke:#d9342b;stroke-width:2.4" d="M89 -63 L95 -54 L100 -63"/>
      <circle class="o" fill="#f3c9a5" cx="94" cy="-74" r="9"/>
      <path class="o" fill="#7a5236" d="M85 -75 Q83 -86 93 -87 Q102 -87 103 -79 Q95 -82 88 -79 Z"/>
      <path class="o" style="stroke-width:2" fill="#2f5f9e" d="M85 -81 Q94 -89 103 -81 L108 -79 L103 -78 Q94 -81 85 -78 Z"/>
      <circle class="n" fill="#2b1b16" cx="98" cy="-74" r="1.4"/>
      <ellipse class="o" style="stroke-width:1.6" fill="#5a1f2a" cx="100.6" cy="-68.4" rx="2.4" ry="2"/>
    </g>
  </g>

  <!-- Her arm and the pennant on its stick: yellow, with the red umbrella. Joint at her shoulder. -->
  <g id="pennant" data-parent="guide" transform="translate(102 -59)">
    <g transform="translate(-102 59)">
      <path class="t" style="stroke-width:5" d="M112 -86 L114 -122"/>
      <path class="t" style="stroke:#c9ccd2;stroke-width:2.4" d="M112 -86 L114 -122"/>
      <path class="o" fill="#ffd21f" d="M113.6 -121 L90 -114 L112.4 -106 Z"/>
      <path class="n" fill="#d9342b" d="M100 -112 Q104 -118 108 -112 Z"/>
      <path class="t" style="stroke-width:1" d="M104 -112 L104 -108"/>
      <path class="o" fill="#ffd21f" d="M99 -61 Q102 -65 105 -61 L115 -84 L109.4 -87 Z"/>
      <circle class="o" fill="#f3c9a5" cx="112.6" cy="-87" r="4"/>
    </g>
  </g>
</svg>
