<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -132 104 138" data-rig="vehicle">
  <title>De Robokoffer: een zelfrijdende koffer die zijn eigenaar kwijt is, met dertig over de stoep</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- Everything hangs from this, so one track can shove the whole case. -->
  <g id="chassis" transform="translate(0 0)"/>

  <!-- Two spinner wheels. Joints at their hubs. -->
  <g id="wheel_back" data-parent="chassis" transform="translate(-20 -7)">
    <circle class="o" fill="#2f3340" cx="0" cy="0" r="7"/>
    <circle class="n" fill="#5d6675" cx="0" cy="0" r="4"/>
    <path class="t" style="stroke:#c9d1dc;stroke-width:1.6" d="M0 -4 L0 4"/>
    <circle class="o" style="stroke-width:1.4" fill="#c9d1dc" cx="0" cy="0" r="1.6"/>
  </g>
  <g id="wheel_front" data-parent="chassis" transform="translate(20 -7)">
    <circle class="o" fill="#2f3340" cx="0" cy="0" r="7"/>
    <circle class="n" fill="#5d6675" cx="0" cy="0" r="4"/>
    <path class="t" style="stroke:#c9d1dc;stroke-width:1.6" d="M0 -4 L0 4"/>
    <circle class="o" style="stroke-width:1.4" fill="#c9d1dc" cx="0" cy="0" r="1.6"/>
  </g>

  <!-- The case: hard shell, souvenir orange, stickers from everywhere it was dragged to. Joint just above the wheels. -->
  <g id="body" data-parent="chassis" transform="translate(0 -14)">
    <g transform="translate(0 14)">
      <!-- the wheel brackets -->
      <path class="o" style="stroke-width:2" fill="#3a3d4a" d="M-27 -16 L-13 -16 L-15 -8 L-25 -8 Z M13 -16 L27 -16 L25 -8 L15 -8 Z"/>
      <!-- the shell -->
      <rect class="o" fill="#f08a24" x="-31" y="-88" width="62" height="74" rx="10"/>
      <path class="n" fill="#d86f14" d="M-29 -26 L29 -26 L29 -24 Q29 -16 21 -16 L-21 -16 Q-29 -16 -29 -24 Z"/>
      <path class="n" fill="#ffb15e" d="M-27 -80 Q-27 -85 -22 -85 L-14 -85 L-14 -30 L-27 -30 Z"/>
      <!-- the ribs of the shell -->
      <path class="t" style="stroke:#c8620f;stroke-width:2.2" d="M-12 -82 L-12 -22 M0 -82 L0 -22 M12 -82 L12 -22"/>
      <!-- the zip all round -->
      <rect class="t" style="stroke:#8a4a0e;stroke-width:1.4;stroke-dasharray:2 2" x="-27" y="-84" width="54" height="66" rx="7"/>
      <!-- stickers: a heart, a plane, a star -->
      <circle class="o" style="stroke-width:1.6" fill="#fbf8f0" cx="-16" cy="-44" r="8"/>
      <path class="n" fill="#e5283f" d="M-16 -39 Q-23 -44 -21 -48 Q-19 -51 -16 -47.4 Q-13 -51 -11 -48 Q-9 -44 -16 -39 Z"/>
      <rect class="o" style="stroke-width:1.6" fill="#7fc4ec" x="-6" y="-38" width="18" height="12" rx="2" transform="rotate(-10 3 -32)"/>
      <path class="n" fill="#fbf8f0" d="M-3 -32 L9 -34 L10 -32.6 L4 -31.6 L6 -28 L4.4 -27.8 L1.6 -31.2 L-2.6 -30.6 Z" transform="rotate(-10 3 -32)"/>
      <path class="o" style="stroke-width:1.5" fill="#f2c230" d="M20 -36 L22 -31.6 L26.8 -31.2 L23.2 -28 L24.4 -23.4 L20 -26 L15.6 -23.4 L16.8 -28 L13.2 -31.2 L18 -31.6 Z"/>
      <!-- the rubber bumper it rams shins with -->
      <path class="o" fill="#3a3d4a" d="M29 -46 Q35 -46 35 -40 L35 -24 Q35 -18 29 -18 Z"/>
      <path class="t" style="stroke:#5d6675;stroke-width:1.4" d="M31 -42 L31 -22"/>
      <!-- the screen of the sensor eye, front top corner -->
      <rect class="o" fill="#1d2230" x="2" y="-80" width="27" height="20" rx="7"/>
      <path class="n" fill="#ffffff" fill-opacity="0.18" d="M5 -76 Q5 -78 8 -78 L14 -78 L8 -63 L5 -63 Z"/>
      <!-- the top grip -->
      <path class="o" style="stroke-width:2.2" fill="#3a3d4a" d="M-6 -88 L-6 -93 Q-6 -95 -4 -95 L10 -95 Q12 -95 12 -93 L12 -88 L9 -88 L9 -92 L-3 -92 L-3 -88 Z"/>
    </g>
  </g>

  <!-- The eye: cyan, searching. Joint in the middle of the screen. -->
  <g id="eye" data-parent="body" transform="translate(16 -70)">
    <g transform="translate(-16 70)">
      <ellipse class="n" fill="#7ff0f0" fill-opacity="0.35" cx="18" cy="-70" rx="8" ry="6"/>
      <ellipse class="n" fill="#7ff0f0" cx="18" cy="-70" rx="4.6" ry="4.4"/>
      <circle class="n" fill="#ffffff" cx="19.4" cy="-71.4" r="1.4"/>
      <!-- a worried brow: where is my person? -->
      <path class="t" style="stroke:#7ff0f0;stroke-width:1.8" d="M12 -76.4 Q17 -79.4 23.6 -77"/>
    </g>
  </g>

  <!-- The telescopic handle, pulled all the way out like an antenna. Joint where it leaves the shell. -->
  <g id="handle" data-parent="body" transform="translate(-20 -88)">
    <g transform="translate(20 88)">
      <path class="o" fill="#8a919c" d="M-23 -88 L-23 -102 L-17 -102 L-17 -88 Z"/>
      <path class="o" fill="#a9b0ba" d="M-22 -102 L-22 -114 L-18 -114 L-18 -102 Z"/>
      <path class="o" style="stroke-width:2" fill="#c9d1dc" d="M-21.2 -114 L-21.2 -122 L-18.8 -122 L-18.8 -114 Z"/>
      <!-- the grip, sideways like a T -->
      <rect class="o" style="stroke-width:2" fill="#3a3d4a" x="-27" y="-110" width="14" height="5" rx="2.4"/>
    </g>
  </g>

  <!-- The beacon on top of the handle: blinking for an owner who is not coming. Joint at its foot. -->
  <g id="beacon" data-parent="handle" transform="translate(-20 -122)">
    <g transform="translate(20 122)">
      <circle class="n" fill="#ff5a4e" fill-opacity="0.3" cx="-20" cy="-126" r="6.4"/>
      <circle class="o" style="stroke-width:1.8" fill="#ff5a4e" cx="-20" cy="-126" r="3.6"/>
      <circle class="n" fill="#ffffff" cx="-21" cy="-127.2" r="1"/>
    </g>
  </g>

  <!-- The luggage tag on its strap, flapping behind. Joint where it hangs from the grip. -->
  <g id="tag" data-parent="handle" transform="translate(-26 -107)">
    <g transform="translate(26 107)">
      <path class="t" style="stroke:#5d6675;stroke-width:1.8" d="M-26 -107 Q-30 -100 -29 -94"/>
      <path class="o" style="stroke-width:1.8" fill="#f2c230" d="M-35 -94 L-23 -94 L-22 -76 L-34 -76 Z"/>
      <circle class="o" style="stroke-width:1.2" fill="#fbf8f0" cx="-29" cy="-90" r="1.6"/>
      <!-- the owner's address, smudged out by the rain of six countries -->
      <path class="t" style="stroke:#8a6a10;stroke-width:1.4" d="M-32 -85 L-25 -85 M-32 -81.6 L-26 -81.6 M-32 -78.4 L-27 -78.4"/>
      <path class="n" fill="#7fc4ec" fill-opacity="0.55" d="M-33 -86 Q-29 -88 -25 -84 Q-26 -80 -30 -79 Q-34 -82 -33 -86 Z"/>
    </g>
  </g>
</svg>
