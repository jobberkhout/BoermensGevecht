<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -20 32 39" data-rig="static">
  <title>Een zwevend blikje bier, op een eigen ventilatortje</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <!-- The beer of 2050: a self-cooling can that flies on a little fan of its own, glowing pink like the
       bike it was thrown from. The ring pull is open and the foam is out. Origin = the middle of the can. -->
  <g id="can" transform="translate(0 0)">
    <!-- the glow its fan blows downwards -->
    <ellipse class="n" fill="#ff7ac0" fill-opacity="0.35" cx="0" cy="14.6" rx="11" ry="3.4"/>
    <!-- the fan ring underneath -->
    <ellipse class="o" style="stroke-width:1.6" fill="#3a3d4a" cx="0" cy="11.4" rx="9" ry="2.8"/>
    <ellipse class="n" fill="#ff7ac0" cx="0" cy="11.4" rx="6" ry="1.3"/>
    <!-- the can -->
    <path class="o" fill="#c9d1dc" d="M-7 -10 Q-7 -12.4 -5 -12.4 L5 -12.4 Q7 -12.4 7 -10 L7 8.6 Q7 10 5.6 10 L-5.6 10 Q-7 10 -7 8.6 Z"/>
    <path class="n" fill="#ff5fa2" d="M-6.6 -3.4 L6.6 -3.4 L6.6 4.2 L-6.6 4.2 Z"/>
    <path class="n" fill="#ffd21f" d="M-2.6 -1.8 L2.2 -1.8 L2 2.6 L-2.4 2.6 Z M2.2 -0.8 Q4.2 -0.8 4.2 0.4 Q4.2 1.6 2.1 1.6"/>
    <path class="n" fill="#ffffff" fill-opacity="0.7" d="M-5 -10 L-3.6 -10 L-3.6 7.6 L-5 7.6 Z"/>
    <!-- frost: it keeps itself cold -->
    <circle class="n" fill="#bff6ff" cx="4" cy="-7.4" r="1"/>
    <circle class="n" fill="#bff6ff" cx="2" cy="7" r="0.8"/>
    <!-- the ring pull, and the foam that got out -->
    <path class="t" style="stroke-width:1.6" d="M-1 -12.6 L3.4 -15"/>
    <path class="o" style="stroke-width:1.4" fill="#fffaf0" d="M-5 -12.4 Q-6.4 -16.4 -2 -16.4 Q0 -19 3 -16.8 Q6.4 -17 5.6 -12.4 Z"/>
  </g>
</svg>
