<svg xmlns="http://www.w3.org/2000/svg" viewBox="-19 -13 41 26" data-rig="static">
  <title>Een sleutel aan een grote plastic hanger: de gast is hem kwijt, dus gooit hij hem maar</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <g id="key" transform="translate(0 0)">
    <!-- the big plastic fob, so it can never be lost -->
    <path class="o" fill="#ff8c2a" d="M-17 -4 Q-17 -10 -11 -10 L-4 -10 Q1 -10 2 -5 L2 5 Q1 10 -4 10 L-11 10 Q-17 10 -17 4 Z"/>
    <path class="n" fill="#ffb15e" d="M-14.6 -6 Q-14.6 -8 -12 -8 L-6 -8 L-12 -3 L-14.6 -3 Z"/>
    <!-- a little house on it, for the flat that used to be somebody's home -->
    <path class="n" fill="#fbf8f0" d="M-12.4 5 L-12.4 0 L-8 -4 L-3.6 0 L-3.6 5 Z"/>
    <path class="n" fill="#ff8c2a" d="M-9.2 5 L-9.2 1.6 L-6.8 1.6 L-6.8 5 Z"/>
    <!-- the ring -->
    <circle class="t" style="stroke:#8a919c;stroke-width:2.2" cx="3.6" cy="0" r="3"/>
    <!-- the key: bow, shaft and bit -->
    <circle class="o" fill="#e0b84a" cx="8.6" cy="0" r="4"/>
    <circle class="n" fill="#ff8c2a" cx="8.6" cy="0" r="1.4"/>
    <path class="o" fill="#e0b84a" d="M12.4 -1.6 L20.6 -1.6 L20.6 1.6 L19.4 1.6 L19.4 4.4 L17.8 4.4 L17.8 3 L16.4 3 L16.4 4.4 L14.8 4.4 L14.8 1.6 L12.4 1.6 Z"/>
  </g>
</svg>
