<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -120 224 124" data-rig="static">
  <title>De Sleutelkluizentoren: een huis waar de buren woonden, nu vol sleutelkluisjes. De gasten op de balkons gooien de sleutels die ze kwijt waren</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .limb { stroke: #2b1b16; stroke-width: 6.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .box { fill: #8a919c; stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; }
    .shackle { fill: none; stroke: #2b1b16; stroke-width: 1.8; stroke-linecap: round; }
  </style>

  <!-- The house, the pavement, the balconies and the suitcases. Origin = middle of the floor. -->
  <g id="tower" transform="translate(0 0)">
    <!-- the pavement -->
    <rect class="o" fill="#b7bfb4" x="-108" y="-6" width="216" height="6" rx="2"/>
    <path class="t" style="stroke:#949c92;stroke-width:1.2" d="M-72 -6 L-72 0 M-36 -6 L-36 0 M0 -6 L0 0 M36 -6 L36 0 M72 -6 L72 0"/>
    <!-- the narrow house front, a little gable on top -->
    <path class="o" fill="#b5553c" d="M-38 -6 L-38 -98 L-28 -98 L-28 -106 L-18 -106 L-18 -114 L14 -114 L14 -106 L24 -106 L24 -98 L34 -98 L34 -6 Z"/>
    <path fill="none" stroke="#9a4532" stroke-width="1.2" d="M-37 -20 H33 M-37 -34 H33 M-37 -48 H33 M-37 -62 H33 M-37 -76 H33 M-37 -90 H33 M-17 -108 H13"/>
    <!-- the little round window in the gable, still with the neighbours' curtain -->
    <circle class="o" style="stroke-width:2" fill="#ffe9a8" cx="-2" cy="-104" r="5"/>
    <path class="n" fill="#e5283f" d="M-6.6 -106 Q-4 -104 -6 -100 L-7 -102 Z M2.6 -106 Q0 -104 2 -100 L3 -102 Z"/>
    <!-- key boxes, three across and five high, where the doorbells used to be -->
    <g>
      <path class="shackle" d="M-30 -92 Q-30 -97 -26 -97 Q-22 -97 -22 -92 M-8 -92 Q-8 -97 -4 -97 Q0 -97 0 -92 M14 -92 Q14 -97 18 -97 Q22 -97 22 -92"/>
      <rect class="box" x="-34" y="-92" width="16" height="13" rx="2"/>
      <rect class="box" style="fill:#3a3d4a" x="-12" y="-92" width="16" height="13" rx="2"/>
      <rect class="box" x="10" y="-92" width="16" height="13" rx="2"/>
      <path class="shackle" d="M-30 -74 Q-30 -79 -26 -79 Q-22 -79 -22 -74 M-8 -74 Q-8 -79 -4 -79 Q0 -79 0 -74 M14 -74 Q14 -79 18 -79 Q22 -79 22 -74"/>
      <rect class="box" style="fill:#ff8c2a" x="-34" y="-74" width="16" height="13" rx="2"/>
      <rect class="box" x="-12" y="-74" width="16" height="13" rx="2"/>
      <rect class="box" style="fill:#3a3d4a" x="10" y="-74" width="16" height="13" rx="2"/>
      <path class="shackle" d="M-30 -56 Q-30 -61 -26 -61 Q-22 -61 -22 -56 M-8 -56 Q-8 -61 -4 -61 Q0 -61 0 -56 M14 -56 Q14 -61 18 -61 Q22 -61 22 -56"/>
      <rect class="box" x="-34" y="-56" width="16" height="13" rx="2"/>
      <rect class="box" style="fill:#3a3d4a" x="-12" y="-56" width="16" height="13" rx="2"/>
      <rect class="box" x="10" y="-56" width="16" height="13" rx="2"/>
      <path class="shackle" d="M-30 -38 Q-30 -43 -26 -43 Q-22 -43 -22 -38 M-8 -38 Q-8 -43 -4 -43 Q0 -43 0 -38 M14 -38 Q14 -43 18 -43 Q22 -43 22 -38"/>
      <rect class="box" style="fill:#3a3d4a" x="-34" y="-38" width="16" height="13" rx="2"/>
      <rect class="box" x="-12" y="-38" width="16" height="13" rx="2"/>
      <rect class="box" style="fill:#ff8c2a" x="10" y="-38" width="16" height="13" rx="2"/>
      <path class="shackle" d="M-30 -20 Q-30 -25 -26 -25 Q-22 -25 -22 -20 M14 -20 Q14 -25 18 -25 Q22 -25 22 -20"/>
      <rect class="box" x="-34" y="-20" width="16" height="13" rx="2"/>
      <rect class="box" x="10" y="-20" width="16" height="13" rx="2"/>
      <!-- keypads: a grid of dots on each, and a red light -->
      <path class="n" fill="#2b1b16" d="M-30 -88 h2 v2 h-2 Z M-26 -88 h2 v2 h-2 Z M-30 -84 h2 v2 h-2 Z M-26 -84 h2 v2 h-2 Z M14 -88 h2 v2 h-2 Z M18 -88 h2 v2 h-2 Z M14 -84 h2 v2 h-2 Z M18 -84 h2 v2 h-2 Z M-30 -70 h2 v2 h-2 Z M-26 -70 h2 v2 h-2 Z M-30 -66 h2 v2 h-2 Z M-26 -66 h2 v2 h-2 Z M-8 -70 h2 v2 h-2 Z M-4 -70 h2 v2 h-2 Z M-8 -66 h2 v2 h-2 Z M-4 -66 h2 v2 h-2 Z M-30 -52 h2 v2 h-2 Z M-26 -52 h2 v2 h-2 Z M-30 -48 h2 v2 h-2 Z M-26 -48 h2 v2 h-2 Z M14 -52 h2 v2 h-2 Z M18 -52 h2 v2 h-2 Z M14 -48 h2 v2 h-2 Z M18 -48 h2 v2 h-2 Z M-8 -34 h2 v2 h-2 Z M-4 -34 h2 v2 h-2 Z M-8 -30 h2 v2 h-2 Z M-4 -30 h2 v2 h-2 Z M14 -34 h2 v2 h-2 Z M18 -34 h2 v2 h-2 Z M14 -30 h2 v2 h-2 Z M18 -30 h2 v2 h-2 Z M-30 -16 h2 v2 h-2 Z M-26 -16 h2 v2 h-2 Z M-30 -12 h2 v2 h-2 Z M-26 -12 h2 v2 h-2 Z M14 -16 h2 v2 h-2 Z M18 -16 h2 v2 h-2 Z M14 -12 h2 v2 h-2 Z M18 -12 h2 v2 h-2 Z"/>
      <path class="n" fill="#c9d1dc" d="M-8 -88 h2 v2 h-2 Z M-4 -88 h2 v2 h-2 Z M-8 -84 h2 v2 h-2 Z M-4 -84 h2 v2 h-2 Z M14 -70 h2 v2 h-2 Z M18 -70 h2 v2 h-2 Z M14 -66 h2 v2 h-2 Z M18 -66 h2 v2 h-2 Z M-8 -52 h2 v2 h-2 Z M-4 -52 h2 v2 h-2 Z M-8 -48 h2 v2 h-2 Z M-4 -48 h2 v2 h-2 Z M-30 -34 h2 v2 h-2 Z M-26 -34 h2 v2 h-2 Z M-30 -30 h2 v2 h-2 Z M-26 -30 h2 v2 h-2 Z"/>
      <circle class="n" fill="#e5283f" cx="-21" cy="-89" r="1.3"/>
      <circle class="n" fill="#e5283f" cx="1" cy="-71" r="1.3"/>
      <circle class="n" fill="#e5283f" cx="23" cy="-53" r="1.3"/>
      <circle class="n" fill="#e5283f" cx="-21" cy="-17" r="1.3"/>
    </g>
    <!-- the one doorbell nobody rings any more, a heart on it -->
    <rect class="o" style="stroke-width:1.6" fill="#fbf8f0" x="-11" y="-21" width="12" height="12" rx="2"/>
    <path class="n" fill="#e5283f" d="M-5 -12 Q-9.4 -15 -8.4 -17.4 Q-7 -19.4 -5 -17 Q-3 -19.4 -1.6 -17.4 Q-0.6 -15 -5 -12 Z"/>

    <!-- the left balcony -->
    <path class="t" style="stroke-width:2.4" d="M-38 -38 L-52 -46"/>
    <rect class="o" fill="#5d6675" x="-82" y="-50" width="44" height="5" rx="2"/>
    <!-- the right balcony -->
    <path class="t" style="stroke-width:2.4" d="M34 -42 L48 -52"/>
    <rect class="o" fill="#5d6675" x="34" y="-56" width="44" height="5" rx="2"/>

    <!-- suitcases waiting at the corner, nobody's -->
    <rect class="o" fill="#5fb7e8" x="-104" y="-30" width="20" height="24" rx="3"/>
    <path class="t" style="stroke-width:2.2" d="M-98 -30 L-98 -36 L-90 -36 L-90 -30"/>
    <rect class="o" fill="#ff5fa2" x="-82" y="-22" width="22" height="16" rx="3"/>
    <path class="t" style="stroke:#c2477d;stroke-width:1.4" d="M-75 -22 L-75 -6 M-67 -22 L-67 -6"/>
  </g>

  <!-- The light on one key box that sometimes, briefly, says yes. Joint at the light. -->
  <g id="led" transform="translate(23 -89)">
    <circle class="n" fill="#5fe08a" cx="0" cy="0" r="1.8"/>
    <circle class="n" fill="#5fe08a" fill-opacity="0.35" cx="0" cy="0" r="3.4"/>
  </g>

  <!-- On the left balcony: a guest in the hotel robe, holding up an empty key ring. Joint at the feet. -->
  <g id="a_body" transform="translate(-60 -50)">
    <g transform="translate(60 50)">
      <path class="t" style="stroke-width:6" d="M-64 -62 L-65 -52 M-56 -62 L-55 -52"/>
      <path fill="none" stroke="#f2a98a" stroke-width="3" stroke-linecap="round" d="M-64 -62 L-65 -53 M-56 -62 L-55 -53"/>
      <path class="o" style="stroke-width:1.8" fill="#fbf8f0" d="M-70 -51 L-61 -51 L-61 -54 Q-66 -56 -70 -54 Z M-59 -51 L-50 -51 L-50 -54 Q-54 -56 -59 -54 Z"/>
      <path class="o" fill="#fbf8f0" d="M-70 -60 Q-72 -76 -66 -82 L-54 -82 Q-48 -76 -50 -60 Z"/>
      <path class="t" style="stroke:#c9d1dc;stroke-width:1.4" d="M-66 -82 L-60 -70 L-56 -82"/>
      <path class="n" fill="#e6ecee" d="M-70 -68 L-50 -68 L-50 -65 L-70 -65 Z"/>
      <path class="t" style="stroke:#c9d1dc;stroke-width:1.2" d="M-70 -68 L-50 -68 M-70 -65 L-50 -65"/>
    </g>
  </g>
  <g id="a_arms" data-parent="a_body" transform="translate(-60 -78)">
    <g transform="translate(60 78)">
      <path class="limb" d="M-66 -78 L-74 -84 L-74 -92 M-54 -78 L-46 -84 L-45 -92"/>
      <path fill="none" stroke="#fbf8f0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="M-66 -78 L-73 -83.6 M-54 -78 L-47 -83.6"/>
      <path fill="none" stroke="#f2a98a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="M-74 -86 L-74 -92 M-46 -86 L-45 -92"/>
      <!-- the key ring, and no key on it -->
      <circle fill="none" stroke="#8a919c" stroke-width="2" cx="-44" cy="-98" r="4"/>
    </g>
  </g>
  <g id="a_head" data-parent="a_body" transform="translate(-60 -82)">
    <g transform="translate(60 82)">
      <circle class="o" fill="#f2a98a" cx="-60" cy="-89" r="8"/>
      <path class="o" style="stroke-width:1.8" fill="#8a5c40" d="M-68 -91 Q-70 -99 -62 -99 Q-56 -102 -52 -96 Q-55 -96 -57 -94 Q-62 -98 -68 -91 Z"/>
      <!-- the sleep mask pushed up -->
      <rect class="o" style="stroke-width:1.6" fill="#ff7ac0" x="-66" y="-97" width="14" height="4" rx="2"/>
      <path class="t" style="stroke-width:1.6" d="M-56 -89 L-53.6 -89"/>
      <path class="t" style="stroke-width:1.6" d="M-57 -84.6 Q-55 -86 -53 -84.4"/>
    </g>
  </g>

  <!-- On the ground: a guest with a backpack, typing a code from the phone into the wrong box. Joint at the feet. -->
  <g id="c_body" transform="translate(-10 -6)">
    <g transform="translate(10 6)">
      <path class="o" fill="#2f6fb3" d="M-16 -6 L-16 -24 L-4 -24 L-4 -6 Z"/>
      <path class="t" style="stroke:#255a93" d="M-10 -22 L-10 -7"/>
      <path class="o" style="stroke-width:2" fill="#3a3d4a" d="M-18 -6 L-18 -9 L-10 -9 L-10 -6 Z M-10 -6 L-10 -9 L-1 -9 L-1 -6 Z"/>
      <!-- the backpack, bigger than the guest -->
      <rect class="o" fill="#5fc9a0" x="-34" y="-50" width="18" height="32" rx="6"/>
      <path class="t" style="stroke:#3fa080;stroke-width:1.4" d="M-30 -36 L-20 -36"/>
      <rect class="o" style="stroke-width:1.8" fill="#ff8c2a" x="-32" y="-56" width="14" height="8" rx="4"/>
      <path class="o" fill="#ffd21f" d="M-18 -24 Q-20 -40 -16 -46 L-4 -46 Q0 -40 -2 -24 Z"/>
      <path class="t" style="stroke-width:2.2" d="M-16 -44 L-18 -30"/>
    </g>
  </g>
  <g id="c_head" data-parent="c_body" transform="translate(-9 -46)">
    <g transform="translate(9 46)">
      <circle class="o" fill="#e0a283" cx="-9" cy="-53" r="7.6"/>
      <path class="o" style="stroke-width:2" fill="#e5283f" d="M-17 -55 Q-16 -63 -9 -63 Q-2 -63 -1 -56 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#e5283f" d="M-2 -56 L5 -55 Q5 -53.6 3 -53.6 L-2 -54 Z"/>
      <path class="t" style="stroke-width:1.6" d="M-4 -52 L-2 -52"/>
      <path class="t" style="stroke-width:1.4" d="M-4 -47.6 L-1.6 -47.6"/>
    </g>
  </g>
  <g id="c_arm" data-parent="c_body" transform="translate(-6 -42)">
    <g transform="translate(6 42)">
      <path class="limb" d="M-6 -42 L-1 -34 L4 -40"/>
      <path fill="none" stroke="#ffd21f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="M-6 -42 L-2 -35.4"/>
      <path fill="none" stroke="#e0a283" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="M0 -35.4 L4 -40"/>
      <!-- the phone, with the code on it, which is for another box -->
      <rect class="o" style="stroke-width:1.6" fill="#2f3340" x="3" y="-49" width="6" height="10" rx="1.4"/>
      <rect class="n" fill="#7ff0f0" x="4.2" y="-47.6" width="3.6" height="6" rx="0.6"/>
    </g>
  </g>

  <!-- On the right balcony: the thrower, in a loud shirt, sunglasses on the head. Joint at the feet. -->
  <g id="b_body" transform="translate(56 -56)">
    <g transform="translate(-56 56)">
      <path class="t" style="stroke-width:6" d="M52 -68 L51 -58 M60 -68 L61 -58"/>
      <path fill="none" stroke="#f2b896" stroke-width="3" stroke-linecap="round" d="M52 -68 L51 -59 M60 -68 L61 -59"/>
      <path class="o" style="stroke-width:1.8" fill="#5d6675" d="M47 -56 L55 -56 L55 -59 Q51 -61 47 -59 Z M57 -56 L65 -56 L65 -59 Q61 -61 57 -59 Z"/>
      <path class="o" fill="#c8b48a" d="M48 -64 L48 -74 L64 -74 L64 -64 Z"/>
      <path class="o" fill="#2fb6a8" d="M47 -72 Q45 -86 50 -92 L62 -92 Q67 -86 65 -72 Z"/>
      <path class="n" fill="#ffd21f" d="M51 -86 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0 Z M57 -78 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0 Z M50 -77 a1.6 1.6 0 1 0 3.2 0 a1.6 1.6 0 1 0 -3.2 0 Z"/>
      <path class="n" fill="#ff5fa2" d="M58 -88 a1.6 1.6 0 1 0 3.2 0 a1.6 1.6 0 1 0 -3.2 0 Z M54 -81 a1.4 1.4 0 1 0 2.8 0 a1.4 1.4 0 1 0 -2.8 0 Z"/>
      <!-- the other hand on the rail -->
      <path class="limb" d="M50 -88 L46 -78 L44 -68"/>
      <path fill="none" stroke="#2fb6a8" stroke-width="3.4" stroke-linecap="round" d="M50 -88 L47.6 -82"/>
      <path fill="none" stroke="#f2b896" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="M46.4 -79 L44 -68"/>
    </g>
  </g>
  <g id="b_head" data-parent="b_body" transform="translate(56 -92)">
    <g transform="translate(-56 92)">
      <circle class="o" fill="#f2b896" cx="57" cy="-99" r="8"/>
      <path class="o" style="stroke-width:1.8" fill="#e0b84a" d="M49 -101 Q49 -108 57 -108 Q64 -108 65 -102 Q60 -104 56 -103 Q51 -103 49 -101 Z"/>
      <!-- sunglasses up on the head, where they are no use -->
      <path class="o" style="stroke-width:1.6" fill="#2b1b16" d="M53 -105 L61 -105 L61 -102.4 L53 -102.4 Z"/>
      <circle class="n" fill="#2b1b16" cx="61" cy="-98.4" r="1.4"/>
      <path class="o" style="stroke-width:1.6" fill="#7a2a2a" d="M60 -94.6 Q63 -94 64.4 -95 Q64 -91.6 62 -91.8 Q60.4 -92.4 60 -94.6 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#f07c6a" d="M64.4 -100 Q68 -98 64.6 -96"/>
    </g>
  </g>
  <g id="b_arm" data-parent="b_body" transform="translate(62 -88)">
    <g transform="translate(-62 88)">
      <path class="limb" d="M62 -88 L70 -84 L76 -92"/>
      <path fill="none" stroke="#2fb6a8" stroke-width="3.4" stroke-linecap="round" d="M62 -88 L67 -85.6"/>
      <path fill="none" stroke="#f2b896" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="M69.4 -84.6 L70 -84 L76 -92"/>
      <!-- the key that was lost, found, and now thrown -->
      <rect class="o" style="stroke-width:1.6" fill="#ff8c2a" x="72" y="-104" width="8" height="10" rx="2"/>
      <path class="t" style="stroke:#e0b84a;stroke-width:2.2" d="M80 -99 L86 -101"/>
      <circle data-mount="muzzle" fill="none" cx="80" cy="-100" r="1"/>
    </g>
  </g>
</svg>
