<svg xmlns="http://www.w3.org/2000/svg" viewBox="-44 -134 98 140" data-rig="humanoid">
  <title>De verdwaalde toerist</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm, stretched up behind his head: the phone has to go higher. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <g transform="rotate(160)">
      <path class="o" fill="#3a8fd0" d="M-6 -3 Q-8 6 -6.5 13 L6 13 Q7.5 6 6 -3 Z"/>
      <path class="o" fill="#e9a183" d="M-4.5 12 L-4 40 Q0 45 4 40 L4.5 12 Z"/>
    </g>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#b39a63" d="M-7.5 -3 L7.5 -3 L7 16 L-7 16 Z"/>
    <path class="o" fill="#e0987b" d="M-5 15 L5 15 L4.5 25 L-4.5 25 Z"/>
    <path class="o" fill="#e9e9e9" d="M-5 23 L5 23 L5.5 32 L-5 32 Z"/>
    <path class="o" fill="#6e4a2e" d="M-7 34 Q-7 32 -4 32 L4 32 Q11 32.4 13.5 35 L13.5 38 L-7 38 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#c9b07a" d="M-7.5 -3 L7.5 -3 L7 16 L-7 16 Z"/>
    <rect class="o" style="stroke-width:1.6" fill="#b39a63" x="-1" y="3" width="7" height="7" rx="1"/>
    <path class="o" fill="#f2b096" d="M-5 15 L5 15 L4.5 25 L-4.5 25 Z"/>
    <!-- socks, in sandals -->
    <path class="o" fill="#ffffff" d="M-5 23 L5 23 L5.5 32 L-5 32 Z"/>
    <path class="o" fill="#ffffff" d="M-6 33 Q-6 31 -3 31 L4 31 Q11 31.4 13 34.6 L13 36 L-6 36 Z"/>
    <path class="o" fill="#7a4a24" d="M-7 35.5 L14 35.5 L14 38.4 L-7 38.4 Z"/>
    <path class="t" style="stroke:#7a4a24;stroke-width:2.2" d="M1 31 L4 35 M7 32 L8 35"/>
  </g>

  <!-- The same blue as the rest of the group, and the bum bag. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#3fa9e0" d="M-15 6 Q-18 -14 -15 -30 Q-12 -37 0 -37 Q13 -37 16 -30 Q19 -14 15 6 Z"/>
    <path class="n" fill="#3a8fd0" d="M-14 5 Q-16.5 -14 -14 -29 Q-10 -20 -9 5 Z"/>
    <path class="t" style="stroke:#2f6bb3" d="M-5 -36 Q2 -31 8 -36"/>
    <rect class="o" fill="#3a3f4a" x="-6" y="-4" width="16" height="9" rx="3.4"/>
    <path class="t" style="stroke:#9aa3b2;stroke-width:1.2" d="M-4 0 L8 0"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#e9a183" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#f2b096" cx="2" cy="-21" rx="18.5" ry="18"/>
    <ellipse class="o" fill="#f2b096" cx="-8.5" cy="-18.5" rx="3.4" ry="4.8"/>
    <path class="o" fill="#d9b48a" d="M-16 -16 Q-19 -28 -12 -33 L-6 -27 Q-10 -22 -11 -14 Q-14 -11 -16 -16 Z"/>
    <!-- lost: eyebrows up, eyes wide, mouth all over the place -->
    <circle class="o" style="stroke-width:1.6" fill="#ffffff" cx="10" cy="-20" r="3.6"/>
    <circle class="o" style="stroke-width:1.6" fill="#ffffff" cx="18" cy="-20" r="3.2"/>
    <circle class="n" fill="#2b1b16" cx="11" cy="-20" r="1.6"/>
    <circle class="n" fill="#2b1b16" cx="18.8" cy="-20" r="1.5"/>
    <path class="t" style="stroke-width:2" d="M6 -28 Q9 -31.4 13 -29.4 M15.6 -29.6 Q18 -31 20.4 -29.4"/>
    <path class="o" fill="#f2b096" d="M20.5 -16.5 Q24.5 -13.5 20.5 -11.5"/>
    <path class="t" style="stroke-width:1.9" d="M9 -7.4 Q11 -9.6 13 -7.4 Q15 -5.4 17 -7.6"/>
    <ellipse class="n" fill="#e5583f" fill-opacity="0.45" cx="7" cy="-12" rx="3.4" ry="2.2"/>
    <!-- the group cap: orange, a white badge, the brim out front -->
    <path class="o" fill="#f08a24" d="M-17 -24 Q-17 -43 2 -42.6 Q20 -42.6 19.6 -27 Z"/>
    <path class="o" style="stroke-width:2" fill="#c96a12" d="M15 -28.6 L31 -26 Q32.6 -23.4 30 -23 L15 -25 Z"/>
    <circle class="n" fill="#ffffff" cx="7" cy="-35" r="3"/>
    <circle class="o" style="stroke-width:1.4" fill="#f08a24" cx="1.6" cy="-43.2" r="1.8"/>
  </g>

  <!-- The phone, as high as it goes: no signal, 2% left. Joint at his far hand. -->
  <g id="phone" data-parent="arm_back" transform="translate(-24 -113)">
    <rect class="o" style="stroke-width:2" fill="#1d1d24" x="-5" y="-18" width="10" height="17" rx="1.8"/>
    <rect class="n" fill="#3a3f4a" x="-3.4" y="-16.2" width="6.8" height="13"/>
    <rect fill="none" stroke="#ffffff" stroke-width="1.2" x="-2.3" y="-11.8" width="4.6" height="7.6" rx="0.8"/>
    <rect class="n" fill="#ffffff" x="-0.9" y="-13" width="1.8" height="1.2"/>
    <rect class="n" fill="#ff3b30" x="-1.3" y="-5.8" width="2.6" height="1"/>
    <circle class="o" fill="#e9a183" cx="0" cy="0" r="4.4"/>
  </g>

  <!-- The near arm, bent, holding the map out in front of him. -->
  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#3fa9e0" d="M-6 -3 Q-8 6 -6.5 13 L6 13 Q7.5 6 6 -3 Z"/>
    <path fill="none" stroke="#2b1b16" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" d="M0 12 L0 16 L11 9"/>
    <path fill="none" stroke="#f2b096" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M0 12 L0 16 L11 9"/>
    <path class="o" fill="#3fa9e0" d="M-6.5 9 L6 9 L6.2 13.4 L-6.6 13.4 Z"/>
  </g>

  <!-- The map, upside down: the north arrow points at his sandals. Joint at his near hand. -->
  <g id="map" data-parent="arm_front" transform="translate(21 -63)">
    <g transform="rotate(-8 14 -4)">
      <path class="o" fill="#fdf6df" d="M-2 -15 L10 -13 L20 -15 L32 -13 L32 8 L20 6 L10 8 L-2 6 Z"/>
      <path class="t" style="stroke:#c9b07a;stroke-width:1.2" d="M10 -13 L10 8 M20 -15 L20 6"/>
      <path fill="none" stroke="#7cc6ec" stroke-width="2.6" stroke-linecap="round" d="M-1 -2 Q8 -6 14 0 Q22 5 31 0"/>
      <rect class="n" fill="#9fd08a" x="2" y="-12" width="6" height="5" rx="1"/>
      <path class="t" style="stroke:#e5283f;stroke-width:1.6" d="M22 -11 L28 -11 M25 -13 L25 -5"/>
      <path class="n" fill="#e5283f" d="M14 2 L16.4 -4 L14 -2.6 L11.6 -4 Z"/>
      <path class="n" fill="#2b1b16" d="M14 -10 L16.4 -4 L14 -5.4 L11.6 -4 Z"/>
    </g>
    <circle class="o" fill="#f2b096" cx="0" cy="0" r="4.4"/>
    <circle data-mount="hand" fill="none" cx="12" cy="-4" r="1"/>
  </g>
</svg>
