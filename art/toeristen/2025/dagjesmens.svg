<svg xmlns="http://www.w3.org/2000/svg" viewBox="-46 -132 98 138" data-rig="humanoid">
  <title>De dagjesmens</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm, bent like a runner's. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#1fb5a8" d="M-6 -3 Q-8 6 -6.5 12 L6 12 Q7.5 6 6 -3 Z"/>
    <path fill="none" stroke="#2b1b16" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" d="M0 11 L1 17 L12 11"/>
    <path fill="none" stroke="#c58f6e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M0 11 L1 17 L12 11"/>
    <circle class="o" fill="#c58f6e" cx="13" cy="10.4" r="4"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#e6e6e6" d="M-7.5 -3 L7.5 -3 L7 14 L-7 14 Z"/>
    <path class="o" fill="#b07a58" d="M-5 13 L5 13 L4.5 24 L-4.5 24 Z"/>
    <path class="o" fill="#f2f2f2" d="M-5 22 L5 22 L5 31 L-5 31 Z"/>
    <path class="o" fill="#dcdcdc" d="M-7 33.5 Q-7 31 -4 31 L4 31 Q11 31.5 13.5 35 L13.5 38 L-7 38 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#ffffff" d="M-7.5 -3 L7.5 -3 L7 14 L-7 14 Z"/>
    <path class="o" fill="#c58f6e" d="M-5 13 L5 13 L4.5 24 L-4.5 24 Z"/>
    <path class="o" fill="#ffffff" d="M-5 22 L5 22 L5 31 L-5 31 Z"/>
    <path class="t" style="stroke:#1f3f7a" d="M-5 24.4 L5 24.4 M-5 26.6 L5 26.6"/>
    <path class="o" fill="#fafafa" d="M-7 33.5 Q-7 31 -4 31 L4 31 Q11 31.5 13.5 35 L13.5 38 L-7 38 Z"/>
    <path class="n" fill="#d6d6d6" d="M-6 36 L12.6 36 L12.6 37.6 L-6 37.6 Z"/>
  </g>

  <!-- A teal shirt, the bum bag, and the lanyard with the card that gets you back on board. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#2cc7b9" d="M-15 6 Q-18 -14 -15 -30 Q-12 -37 0 -37 Q13 -37 16 -30 Q19 -14 15 6 Z"/>
    <path class="n" fill="#1fb5a8" d="M-14 5 Q-16.5 -14 -14 -29 Q-10 -20 -9 5 Z"/>
    <path class="o" fill="#3a3f4a" d="M-15 -2 L16 -2 L16 4 L-15 4 Z"/>
    <rect class="o" fill="#3a3f4a" x="2" y="-4" width="15" height="10" rx="3.4"/>
    <path class="t" style="stroke:#9aa3b2;stroke-width:1.2" d="M4 0 L15 0"/>
    <path fill="none" stroke="#2b1b16" stroke-width="3.6" stroke-linecap="round" d="M-6 -36 Q-2 -24 3 -18 Q6 -24 9 -36"/>
    <path fill="none" stroke="#1f3f7a" stroke-width="1.8" stroke-linecap="round" d="M-6 -36 Q-2 -24 3 -18 Q6 -24 9 -36"/>
    <rect class="o" style="stroke-width:1.8" fill="#ffffff" x="-1.6" y="-19" width="9" height="11" rx="1.4"/>
    <path class="n" fill="#1f3f7a" d="M-0.2 -17.6 L6 -17.6 L6 -15.2 L-0.2 -15.2 Z"/>
    <path class="t" style="stroke:#9aa3b2;stroke-width:1" d="M0 -12.6 L6 -12.6 M0 -10.6 L4.6 -10.6"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#b07a58" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#c58f6e" cx="2" cy="-21" rx="19" ry="18"/>
    <ellipse class="o" fill="#c58f6e" cx="-8.5" cy="-18.5" rx="3.4" ry="4.8"/>
    <path class="o" fill="#4a3426" d="M-16.5 -16 Q-19 -26 -13 -31 L-6 -26 Q-10 -22 -11 -14 Q-14 -11 -16.5 -16 Z"/>
    <!-- eyes on the prize: the cheese shop -->
    <circle class="n" fill="#2b1b16" cx="10" cy="-21" r="2.1"/>
    <circle class="n" fill="#2b1b16" cx="18" cy="-21" r="1.9"/>
    <path class="t" style="stroke-width:2.2" d="M6 -25.4 L13.4 -24 M15.6 -24 L20.6 -25.6"/>
    <path class="o" fill="#c58f6e" d="M20.5 -18.5 Q24.5 -15.5 20.5 -13.5"/>
    <!-- panting -->
    <path class="o" style="stroke-width:1.8" fill="#7a1f1f" d="M10 -11 Q15 -10 19 -11.6 Q18.4 -5 14.2 -5.4 Q10.6 -6 10 -11 Z"/>
    <path class="n" fill="#ff8a8a" d="M12 -7.6 Q14.6 -8.6 17 -7.4 Q15.6 -5.8 13.6 -6 Z"/>
    <!-- a bead of sweat -->
    <path class="o" style="stroke-width:1.4" fill="#bfe9ff" d="M-1 -27 Q-3 -23 -1 -21.6 Q1 -23 -1 -27 Z"/>
    <!-- the ship's cap: white, a navy band, a little anchor -->
    <path class="o" fill="#ffffff" d="M-17.4 -24 Q-17.4 -43.6 2 -43.2 Q20.4 -43.2 20 -27 Z"/>
    <path class="n" fill="#1f3f7a" d="M-16.6 -27.6 L19.4 -30 L19.8 -27 L-17.2 -24 Z"/>
    <path class="o" style="stroke-width:2" fill="#1f3f7a" d="M15.4 -29 L32 -26.6 Q33.6 -24 31 -23.6 L15.4 -25.4 Z"/>
    <path class="t" style="stroke:#1f3f7a;stroke-width:1.5" d="M6 -40 L6 -33 M3.6 -38.2 L8.4 -38.2 M3 -35 Q6 -31.6 9 -35"/>
    <circle class="o" style="stroke-width:1.4" fill="#ffffff" cx="1.6" cy="-43.6" r="1.8"/>
  </g>

  <!-- The camera on its strap, round the neck and bouncing on his belly. Joint at the back of the neck. -->
  <g id="camera" data-parent="torso" transform="translate(-2 -76)">
    <path fill="none" stroke="#2b1b16" stroke-width="2.2" stroke-linecap="round" d="M0 0 Q-4 14 -3 23"/>
    <rect class="o" fill="#3a3f4a" x="-10" y="22" width="15" height="10" rx="2"/>
    <circle class="o" style="stroke-width:1.8" fill="#9aa3b2" cx="0" cy="27" r="3.8"/>
    <circle class="n" fill="#1d1d24" cx="0" cy="27" r="1.7"/>
    <rect class="n" fill="#ffd23f" x="-8" y="23.6" width="3" height="2"/>
  </g>

  <!-- The near arm, bent like a runner's, with the watch: two hours. -->
  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#2cc7b9" d="M-6 -3 Q-8 6 -6.5 12 L6 12 Q7.5 6 6 -3 Z"/>
    <path fill="none" stroke="#2b1b16" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" d="M0 11 L-2 17 L10 9"/>
    <path fill="none" stroke="#c58f6e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M0 11 L-2 17 L10 9"/>
    <path class="o" fill="#2cc7b9" d="M-6.5 8 L6 8 L6.2 12.4 L-6.6 12.4 Z"/>
    <circle class="o" style="stroke-width:1.8" fill="#ffd23f" cx="6" cy="11.6" r="3.4"/>
    <path class="t" style="stroke-width:1.2" d="M6 11.6 L6 9.4 M6 11.6 L7.6 12.4"/>
    <circle class="o" fill="#c58f6e" cx="11" cy="8.4" r="4"/>
    <circle data-mount="hand" fill="none" cx="11" cy="8.4" r="1"/>
  </g>
</svg>
