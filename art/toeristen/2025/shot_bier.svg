<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -19 30 36" data-rig="static">
  <title>Een stenen pul bier, met schuim dat eruit klotst</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <!-- The stein from the beer bike, thrown full: the foam is leaving first. Origin = the middle of the stein. -->
  <g id="stein" transform="translate(0 0)">
    <!-- the handle -->
    <path class="t" style="stroke-width:2.6" d="M7 -6 Q13 -6 13 1 Q13 8 7 8"/>
    <!-- the stein -->
    <rect class="o" fill="#f7c948" x="-8" y="-9" width="15" height="22" rx="2"/>
    <path class="n" fill="#fff3b0" d="M-5.4 -5 L-3.6 -5 L-3.6 10 L-5.4 10 Z"/>
    <circle class="n" fill="#fff3b0" cx="1.6" cy="4" r="1.2"/>
    <circle class="n" fill="#fff3b0" cx="3.4" cy="8.6" r="0.9"/>
    <circle class="n" fill="#fff3b0" cx="2.6" cy="-1" r="0.8"/>
    <!-- the foam, sloshing over the rim -->
    <path class="o" style="stroke-width:1.6" fill="#fffaf0" d="M-10 -8 Q-12 -13 -6.6 -13.4 Q-5 -17 -0.6 -15.2 Q3.6 -17.4 5.6 -13.6 Q10 -13 8.6 -8.6 Q9 -5 6 -6 L6 -8 L-7 -8 Q-7.4 -4 -9.6 -5 Q-11 -6 -10 -8 Z"/>
    <!-- a splash flying off the back -->
    <path class="o" style="stroke-width:1.2" fill="#fffaf0" d="M-12.4 -14.6 Q-10.6 -17.6 -9 -15.6 Q-9.6 -13.6 -12.4 -14.6 Z"/>
  </g>
</svg>
