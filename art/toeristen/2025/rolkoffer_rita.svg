<svg xmlns="http://www.w3.org/2000/svg" viewBox="-68 -136 120 142" data-rig="humanoid">
  <title>Rolkoffer-Rita</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm reaches back to the handle of the suitcase. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <g transform="rotate(28)">
      <path class="o" fill="#e0b52a" d="M-6 -3 Q-8 8 -6 15 L6 15 Q7.5 7 6 -3 Z"/>
      <path class="o" fill="#e9a183" d="M-4.5 14 L-4 28 Q0 33 4 28 L4.5 14 Z"/>
      <circle class="o" fill="#e9a183" cx="0" cy="31" r="4.4"/>
    </g>
  </g>

  <!-- The suitcase, at the end of its handle: hard shell, souvenir orange, one sticker per city. Joint at her hand. -->
  <g id="suitcase" data-parent="arm_back" transform="translate(-24 -44)">
    <g transform="rotate(30)">
      <rect class="o" fill="#9aa3b2" x="-2.6" y="-1" width="5.2" height="12"/>
      <rect class="o" fill="#3a3f4a" x="-5" y="-3.4" width="10" height="5" rx="2"/>
      <rect class="o" fill="#f08a24" x="-21" y="7" width="26" height="37" rx="5"/>
      <path class="n" fill="#f7ad5c" d="M-18 10 L-13 10 L-13 41 L-18 41 Z"/>
      <path class="t" style="stroke:#b85d10" d="M-8 9 L-8 42 M0 9 L0 42"/>
      <!-- stickers -->
      <circle class="o" style="stroke-width:1.4" fill="#3fa9e0" cx="-13" cy="17" r="4"/>
      <rect class="o" style="stroke-width:1.4" fill="#ffffff" x="-6" y="27" width="8" height="6" rx="1" transform="rotate(-12 -2 30)"/>
      <circle class="o" style="stroke-width:1.4" fill="#f2d14b" cx="-14" cy="34" r="3.2"/>
      <path class="n" fill="#e5283f" d="M-15.4 33.4 Q-14 31.8 -14 33.4 Q-14 31.8 -12.6 33.4 Q-12.6 34.6 -14 35.6 Q-15.4 34.6 -15.4 33.4 Z"/>
      <!-- the luggage tag -->
      <path class="t" style="stroke-width:1.2" d="M-6 7.5 Q-8 4 -11 5"/>
      <rect class="o" style="stroke-width:1.4" fill="#e5283f" x="-17" y="1" width="7" height="9" rx="1.4" transform="rotate(-20 -13.5 5.5)"/>
      <!-- the wheel that wakes the street at six -->
      <circle class="o" fill="#2a2b33" cx="2" cy="46" r="4.2"/>
      <circle class="n" fill="#9aa3b2" cx="2" cy="46" r="1.4"/>
    </g>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#b39a63" d="M-7.5 -3 L7.5 -3 L7 16 L-7 16 Z"/>
    <path class="o" fill="#e0987b" d="M-5 15 L5 15 L4.5 27 L-4.5 27 Z"/>
    <path class="o" fill="#f2f2f2" d="M-5 25 L5 25 L5 31 L-5 31 Z"/>
    <path class="o" fill="#dcdcdc" d="M-7 33.5 Q-7 31 -4 31 L4 31 Q11 31.5 13.5 35 L13.5 38 L-7 38 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#c9b07a" d="M-7.5 -3 L7.5 -3 L7 16 L-7 16 Z"/>
    <rect class="o" style="stroke-width:1.6" fill="#b39a63" x="-1" y="3" width="7" height="7" rx="1"/>
    <path class="o" fill="#f2b096" d="M-5 15 L5 15 L4.5 27 L-4.5 27 Z"/>
    <path class="o" fill="#ffffff" d="M-5 25 L5 25 L5 31 L-5 31 Z"/>
    <path class="t" style="stroke:#3fa9e0" d="M-5 27.4 L5 27.4"/>
    <path class="o" fill="#fafafa" d="M-7 33.5 Q-7 31 -4 31 L4 31 Q11 31.5 13.5 35 L13.5 38 L-7 38 Z"/>
    <path class="n" fill="#d6d6d6" d="M-6 36 L12.6 36 L12.6 37.6 L-6 37.6 Z"/>
  </g>

  <!-- A souvenir T-shirt: a heart and a windmill. The bum bag on a strap across her chest. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#f2c94c" d="M-15 6 Q-18 -14 -15 -30 Q-12 -37 0 -37 Q13 -37 16 -30 Q19 -14 15 6 Z"/>
    <path class="n" fill="#e0b52a" d="M-14 5 Q-16.5 -14 -14 -29 Q-10 -20 -9 5 Z"/>
    <path class="n" fill="#e5283f" d="M-1 -22 Q-1 -26 2.4 -26 Q4.4 -26 5 -24 Q5.6 -26 7.6 -26 Q11 -26 11 -22 Q11 -18 5 -14 Q-1 -18 -1 -22 Z"/>
    <path class="t" style="stroke:#2b1b16;stroke-width:1.3" d="M5 -12 L3.6 -4 L6.4 -4 Z M5 -12 L1.4 -15.4 M5 -12 L8.6 -8.6 M5 -12 L8.6 -15.4 M5 -12 L1.4 -8.6"/>
    <path fill="none" stroke="#2b1b16" stroke-width="4.4" stroke-linecap="round" d="M9 -35 L-10 -2"/>
    <path fill="none" stroke="#3a3f4a" stroke-width="2.2" stroke-linecap="round" d="M9 -35 L-10 -2"/>
    <rect class="o" fill="#3a3f4a" x="-16" y="-5" width="15" height="10" rx="3.4"/>
    <path class="t" style="stroke:#9aa3b2;stroke-width:1.2" d="M-14 -1.4 L-3 -1.4"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#e9a183" x="-4" y="-6" width="9" height="9" rx="2"/>
    <!-- a ponytail, swinging -->
    <path class="o" fill="#8a5a2b" d="M-15 -30 Q-27 -26 -25 -12 Q-23 -6 -19 -9 Q-21 -19 -12 -24 Z"/>
    <ellipse class="o" fill="#f2b096" cx="2" cy="-21" rx="19" ry="18"/>
    <ellipse class="o" fill="#f2b096" cx="-8.5" cy="-18.5" rx="3.4" ry="4.8"/>
    <path class="o" fill="#a66a33" d="M-17 -15 Q-23 -40 2 -41.5 Q23 -41.5 21.5 -27 Q13 -34 4 -32 Q-5 -30.5 -8.5 -23 Q-11 -15 -13.5 -10 Q-18 -10 -17 -15 Z"/>
    <path class="n" fill="#c98a4f" d="M-9 -36 Q0 -40 10 -37.5 Q2 -36.5 -7 -32.5 Z"/>
    <!-- sunburnt nose and cheek -->
    <ellipse class="n" fill="#e5583f" fill-opacity="0.45" cx="7" cy="-13" rx="4.2" ry="2.4"/>
    <ellipse class="n" fill="#e5583f" fill-opacity="0.45" cx="20" cy="-17" rx="2.2" ry="2.4"/>
    <circle class="n" fill="#2b1b16" cx="10" cy="-21" r="2"/>
    <circle class="n" fill="#2b1b16" cx="18" cy="-21" r="1.8"/>
    <path class="t" d="M6.5 -26.5 Q10 -28.5 13 -26.5"/>
    <path class="o" fill="#f2b096" d="M20.5 -18.5 Q24.5 -15.5 20.5 -13.5"/>
    <!-- mid-sentence: loud -->
    <path class="o" style="stroke-width:1.8" fill="#7a1f1f" d="M9 -10 Q14 -8.5 18.5 -10.5 Q17 -4 13 -4.5 Q10 -5 9 -10 Z"/>
  </g>

  <!-- Sunglasses on top of her head, where they live. -->
  <g id="shades" data-parent="head" transform="translate(5 -115)">
    <path class="t" style="stroke-width:2" d="M-14 2 L-4 -1"/>
    <rect class="o" style="stroke-width:1.8" fill="#1d1d24" x="-5" y="-4.6" width="10.5" height="7" rx="3"/>
    <rect class="o" style="stroke-width:1.8" fill="#1d1d24" x="7.5" y="-4" width="8" height="6.4" rx="3"/>
    <path class="n" fill="#6d7a8f" d="M-3 -3 L1 -3 L-1.6 0 Z"/>
  </g>

  <!-- The neck pillow, worn from the plane to the hotel and on into town. -->
  <g id="pillow" data-parent="torso" transform="translate(1 -78)">
    <path class="o" fill="#7cc6ec" d="M-13 -4 Q-15 6 -4 8 Q6 9 11 3 Q13 0 10 -2 Q6 1 -2 1 Q-8 0 -9 -5 Q-11 -7 -13 -4 Z"/>
    <circle class="n" fill="#ffffff" cx="-7" cy="4" r="1.2"/>
    <circle class="n" fill="#ffffff" cx="2" cy="5.4" r="1.2"/>
    <circle class="n" fill="#ffffff" cx="-11" cy="-1" r="1"/>
  </g>

  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#f2c94c" d="M-6 -3 Q-8 6 -6.5 13 L6 13 Q7 6 6 -3 Z"/>
    <path fill="none" stroke="#2b1b16" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" d="M0 13 L0.5 18.5 L12 9"/>
    <path fill="none" stroke="#f2b096" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M0 13 L0.5 18.5 L12 9"/>
    <path class="o" fill="#f2c94c" d="M-6.5 10 L6 10 L6.2 14 L-6.6 14 Z"/>
    <!-- the phone with the map on it, held up and not looked up from -->
    <rect class="o" style="stroke-width:2" fill="#1d1d24" x="12" y="-3" width="7" height="12" rx="1.6" transform="rotate(14 15.5 3)"/>
    <rect class="n" fill="#8fd0d8" x="13.4" y="-1.4" width="4.2" height="8.6" transform="rotate(14 15.5 3)"/>
    <circle class="o" fill="#f2b096" cx="13.5" cy="8" r="4.2"/>
    <circle data-mount="hand" fill="none" cx="15" cy="3" r="1"/>
  </g>
</svg>
