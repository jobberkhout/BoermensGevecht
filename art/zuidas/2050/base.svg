<svg xmlns="http://www.w3.org/2000/svg" viewBox="-312 -596 328 602" data-rig="static">
  <title>Het Spiegelpaleis in 2050: de toren verdwijnt in de wolken, het bouwhek staat er nog</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .m { stroke: #e6f8f5; stroke-width: 2; stroke-linecap: round; fill: none; }
    .c { stroke: #7f9bb0; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    .z { stroke: #8d98a3; stroke-width: 1.1; stroke-linecap: round; fill: none; }
