<svg xmlns="http://www.w3.org/2000/svg" viewBox="-104 -130 210 136" data-rig="vehicle">
  <title>De Vergaderpod: een zelfrijdende glazen vergaderruimte. Het overleg loopt al jaren</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .s { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .web { stroke: #8fa0b3; stroke-width: 1; stroke-linecap: round; fill: none; }
  </style>

  <g id="chassis" transform="translate(0 0)"/>

  <g id="wheel_back" data-parent="chassis" transform="translate(-58 -12)">
    <circle class="o" fill="#2b2b33" cx="0" cy="0" r="11.5"/>
    <circle class="s" fill="#cfd6df" cx="0" cy="0" r="6.2"/>
    <path class="t" style="stroke-width:1.8" d="M0 -6.2 L0 6.2 M-6.2 0 L6.2 0"/>
    <circle class="n" fill="#2fc9b5" cx="0" cy="0" r="2.2"/>
  </g>
  <g id="wheel_front" data-parent="chassis" transform="translate(58 -12)">
    <circle class="o" fill="#2b2b33" cx="0" cy="0" r="11.5"/>
    <circle class="s" fill="#cfd6df" cx="0" cy="0" r="6.2"/>
    <path class="t" style="stroke-width:1.8" d="M0 -6.2 L0 6.2 M-6.2 0 L6.2 0"/>
    <circle class="n" fill="#2fc9b5" cx="0" cy="0" r="2.2"/>
  </g>

  <!-- The room, seen through its glass: the far wall, the floor and the flip chart nobody has turned over since. Joint at the floor. -->
  <g id="body" data-parent="chassis" transform="translate(0 -34)">
    <g transform="translate(0 34)">
      <rect class="n" fill="#eefaf7" x="-86" y="-112" width="172" height="78" rx="15"/>
      <path class="n" fill="#d5ece8" d="M-86 -60 L86 -60 L86 -49 Q86 -34 71 -34 L-71 -34 Q-86 -34 -86 -49 Z"/>
      <path class="n" fill="#b9c6d6" d="M-84 -39.4 L84 -39.4 L84 -34 L-84 -34 Z"/>
      <!-- the flip chart: the line still goes up -->
      <path class="t" style="stroke-width:2" d="M66 -74 L62.6 -39 M78 -74 L82.6 -39"/>
      <rect class="s" fill="#ffffff" x="60.6" y="-105" width="22.4" height="31" rx="2"/>
      <rect class="n" fill="#24376b" x="61.5" y="-104.1" width="20.6" height="3.6"/>
      <path class="t" style="stroke-width:1.1" d="M64.8 -96.6 L64.8 -79 L79.6 -79"/>
      <path fill="none" stroke="#1e8f86" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M66.6 -81.6 L70 -86 L72.6 -84 L77.4 -93.4"/>
      <rect class="n" fill="#ffe45c" x="76" y="-78" width="5" height="5" transform="rotate(8 78.5 -75.5)"/>
      <!-- cobwebs in the corner -->
      <path class="web" d="M84 -110 L70 -111 M84 -110 L84.6 -96 M84 -110 L74 -100 M78 -110.6 Q79 -106 84.4 -104 M73.4 -110.8 Q76 -102 84.6 -99.4"/>
    </g>
  </g>

  <!-- The plant in the corner. Nobody watered it and it did fine. Joint at the pot. -->
  <g id="plant" data-parent="body" transform="translate(-73 -39)">
    <g transform="translate(73 39)">
      <path class="t" style="stroke-width:4.4" d="M-73 -50 Q-78 -70 -72.6 -90 Q-70.6 -102 -72 -112"/>
      <path fill="none" stroke="#2f7d4a" stroke-width="2" stroke-linecap="round" d="M-73 -50 Q-78 -70 -72.6 -90 Q-70.6 -102 -72 -112"/>
      <path class="s" fill="#56b96e" d="M-74 -58 Q-84.6 -60 -83.6 -71 Q-74 -70 -74 -58 Z"/>
      <path class="s" fill="#3f9b57" d="M-75 -70 Q-63 -70 -61 -82 Q-72.6 -83 -75 -70 Z"/>
      <path class="s" fill="#56b96e" d="M-74 -84 Q-84.6 -86 -83.6 -97.4 Q-73.6 -96 -74 -84 Z"/>
      <path class="s" fill="#3f9b57" d="M-71.6 -98 Q-60 -109 -47 -105 Q-56 -95.6 -71.6 -98 Z"/>
      <path class="t" style="stroke:#2f7d4a;stroke-width:1" d="M-70 -99.6 Q-60 -104 -50 -104"/>
      <path class="s" fill="#f4ecdc" d="M-80.4 -51 L-65.6 -51 L-68 -39 L-78 -39 Z"/>
      <path class="n" fill="#e2d6c1" d="M-79.4 -48 L-66.4 -48 L-66.9 -45.6 L-78.9 -45.6 Z"/>
    </g>
  </g>

  <!-- She brought her knitting in the second year. Chair, body and arms; joint at the seat. -->
  <g id="knitter" data-parent="body" transform="translate(-48 -58)">
    <g transform="translate(41 58)">
      <rect class="s" fill="#1e8f86" x="-54" y="-83" width="13" height="27" rx="4"/>
      <path class="s" fill="#24376b" d="M-50 -55 Q-52 -66 -47.6 -69.4 L-36 -69.4 Q-31.4 -66 -32 -55 Z"/>
      <path class="t" style="stroke-width:6.6" d="M-37 -65.4 L-28 -62"/>
      <path fill="none" stroke="#3d5a9e" stroke-width="3.6" stroke-linecap="round" d="M-37 -65.4 L-28 -62"/>
      <circle class="s" style="stroke-width:1.5" fill="#f3c9a5" cx="-26.6" cy="-61.6" r="2.7"/>
    </g>
  </g>
  <g id="knitter_head" data-parent="knitter" transform="translate(-47 -69)">
    <g transform="translate(40 69)">
      <rect class="s" fill="#e9b796" x="-42.4" y="-72" width="5.4" height="4.6" rx="1.4"/>
      <circle class="s" fill="#c9c2b0" cx="-47.4" cy="-85.4" r="4.2"/>
      <circle class="s" fill="#f3c9a5" cx="-39" cy="-78" r="8.3"/>
      <path class="s" fill="#c9c2b0" d="M-47.2 -74.6 Q-49.8 -87 -39 -86.8 Q-32.6 -86.8 -31.2 -81.6 Q-37 -83.4 -41 -80.4 Q-43.6 -77.4 -43.6 -73 Q-46 -72.4 -47.2 -74.6 Z"/>
      <path class="t" style="stroke-width:1.2" d="M-37.6 -78.6 L-43.4 -79.4"/>
      <circle class="s" style="stroke-width:1.2" fill="#ffffff" fill-opacity="0.6" cx="-34.6" cy="-78.2" r="3"/>
      <circle class="n" fill="#2b1b16" cx="-34.2" cy="-78" r="1.1"/>
      <path class="s" style="stroke-width:1.6" fill="#f3c9a5" d="M-31 -78.4 Q-27.8 -76.4 -30.8 -74.4"/>
      <path class="t" style="stroke-width:1.2" d="M-35.6 -72.6 L-32.6 -72.8"/>
    </g>
  </g>

  <!-- He put his head down for a moment. Chair, back and the arm he sleeps on; joint at the seat. -->
  <g id="sleeper" data-parent="body" transform="translate(-3 -58)">
    <g transform="translate(-4 58)">
      <rect class="s" fill="#1e8f86" x="-5" y="-81" width="13" height="25" rx="4"/>
      <path class="s" fill="#bcd0ee" d="M-1.6 -55 Q-3.6 -70 6 -73.4 Q15 -75.4 21 -66 L22 -57 Z"/>
      <path class="s" fill="#bcd0ee" d="M10 -62.6 L30 -63 Q33.4 -62.6 33.4 -60.4 L33.4 -57.6 L10 -57.6 Z"/>
    </g>
  </g>
  <g id="sleeper_head" data-parent="sleeper" transform="translate(10 -66)">
    <g transform="translate(-17 66)">
      <circle class="s" fill="#f0c19a" cx="25" cy="-69" r="8.2"/>
      <path class="s" fill="#6b4630" d="M17.2 -64 Q12.6 -75 20 -78.4 Q27.4 -81.2 32.4 -75 Q26.6 -75 23.4 -71.8 Q21 -68.4 21 -63.4 Q19 -62 17.2 -64 Z"/>
      <path class="t" style="stroke-width:1.3" d="M26.2 -69.4 Q28.2 -67.6 30.2 -69.4"/>
      <path class="s" style="stroke-width:1.6" fill="#f0c19a" d="M32.8 -70 Q35.8 -68 32.8 -66.2"/>
      <ellipse class="n" fill="#5a1f2a" cx="29.8" cy="-64.2" rx="1.7" ry="1.3"/>
    </g>
  </g>
  <!-- The bubble he snores. Joint at his nose. -->
  <g id="bubble" data-parent="sleeper_head" transform="translate(27.6 -67.6)">
    <circle class="s" style="stroke-width:1.2" fill="#d6f3ff" fill-opacity="0.85" cx="3.2" cy="0" r="3.3"/>
    <path class="n" fill="#ffffff" d="M1.6 -1.6 Q2.6 -2.6 4 -2.4 Q2.8 -1.8 2.2 -0.8 Z"/>
  </g>

  <!-- The one who called the meeting, still on his second point. Legs and jacket; joint at his feet. -->
  <g id="presenter" data-parent="body" transform="translate(47 -39)">
    <g transform="translate(-45 39)">
      <path class="s" style="stroke-width:1.5" fill="#2b2b33" d="M36.4 -39 Q36.4 -42.4 40 -42.4 L44.4 -42.4 L44.4 -39 Z M45.6 -39 Q45.6 -42.4 49 -42.4 L53.2 -42.4 L53.2 -39 Z"/>
      <path class="s" fill="#24376b" d="M39.4 -42 L40 -61 L51.6 -61 L52.6 -42 L47.2 -42 L46 -55 L44.8 -42 Z"/>
      <path class="s" fill="#3d5a9e" d="M38.4 -59 Q36.4 -73 39.8 -81 L51.2 -81 Q55.2 -73 53.2 -59 Z"/>
    </g>
  </g>
  <g id="presenter_head" data-parent="presenter" transform="translate(47 -81)">
    <g transform="translate(-45 81)">
      <rect class="s" fill="#d9a880" x="42.4" y="-84.4" width="5.6" height="5" rx="1.4"/>
      <circle class="s" fill="#eab98f" cx="44.6" cy="-91" r="8.4"/>
      <path class="s" fill="#f4f1ea" d="M46.4 -99.2 Q54.4 -98.4 53.6 -89.4 Q53.2 -85.4 50 -84.8 Q50.6 -90.4 47.2 -93.4 Q45.4 -96.4 46.4 -99.2 Z"/>
      <ellipse class="s" style="stroke-width:1.3" fill="#eab98f" cx="47.8" cy="-90" rx="1.9" ry="2.6"/>
      <path class="s" style="stroke-width:1.6" fill="#eab98f" d="M36.8 -92.4 Q33.4 -90.2 36.6 -88"/>
      <circle class="n" fill="#2b1b16" cx="40" cy="-92.2" r="1.2"/>
      <path class="t" style="stroke-width:1.3" d="M37.4 -95.6 L42 -95"/>
    </g>
  </g>
  <!-- His beard was not there when he started. Joint at the chin. -->
  <g id="beard" data-parent="presenter_head" transform="translate(44 -85)">
    <g transform="translate(-42 85)">
      <path class="s" fill="#f4f1ea" d="M36.2 -88 Q34.6 -80 36 -72 Q33.6 -63 37 -55 Q35.4 -48 39.8 -42 Q43.4 -48 42.8 -55 Q46 -63 44.2 -72 Q47.2 -80 48.4 -86.6 Q42 -83 36.2 -88 Z"/>
      <path class="t" style="stroke:#c9c2b0;stroke-width:1.1" d="M40 -80 Q38.8 -70 40.4 -62 M42 -74 Q43 -64 40.6 -54"/>
    </g>
  </g>
  <!-- The arm with the pointer. Joint at the shoulder. -->
  <g id="pointer" data-parent="presenter" transform="translate(52.4 -77.4)">
    <g transform="translate(-50.4 77.4)">
      <path class="t" style="stroke-width:1.8" d="M58 -84.6 L71 -94"/>
      <path class="t" style="stroke-width:6.8" d="M50.4 -77.4 L57.6 -84"/>
      <path fill="none" stroke="#4a69b0" stroke-width="3.8" stroke-linecap="round" d="M50.4 -77.4 L57.6 -84"/>
      <circle class="s" style="stroke-width:1.5" fill="#eab98f" cx="58.4" cy="-84.8" r="2.7"/>
    </g>
  </g>

  <!-- The table, a laptop gone to sleep as well, and what she has knitted so far. -->
  <g id="table" data-parent="body" transform="translate(-16 -39)">
    <g transform="translate(9 39)">
      <rect class="s" fill="#9aa4b2" x="-12" y="-54.6" width="5.4" height="14" rx="1"/>
      <rect class="s" fill="#9aa4b2" x="-21" y="-42" width="23.4" height="3.2" rx="1.5"/>
      <rect class="s" fill="#e8cfa0" x="-55" y="-58" width="92" height="4.8" rx="2.2"/>
      <path class="s" style="stroke-width:1.4" fill="#16243a" d="M-2 -59.6 L-5 -70 L-3.2 -70.6 L0 -59.6 Z"/>
      <rect class="s" style="stroke-width:1.4" fill="#cfd6df" x="-2.4" y="-60" width="11" height="2.2" rx="0.8"/>
      <path class="web" d="M-4.4 -70.4 L-9 -86 M-4.4 -70.4 Q-7.6 -75 -8 -79.6 M-5.6 -74.4 Q-7.4 -77 -8.6 -77.4 M-6.6 -78.6 L-8.8 -82"/>
      <!-- the scarf: off the needles, over the edge of the table and along the floor -->
      <path class="n" fill="#f2c230" d="M-27.6 -60.4 L-20.4 -60.4 L-20.4 -44.6 L31 -44.6 L31 -39.6 L-27.6 -39.6 Z"/>
      <path class="n" fill="#2fc9b5" d="M-27.6 -56 L-20.4 -56 L-20.4 -51.6 L-27.6 -51.6 Z M-27.6 -47.2 L-20.4 -47.2 L-20.4 -44.6 L-23 -44.6 L-23 -39.6 L-27.6 -39.6 Z M-16.6 -44.6 L-10.2 -44.6 L-10.2 -39.6 L-16.6 -39.6 Z M-3.8 -44.6 L2.6 -44.6 L2.6 -39.6 L-3.8 -39.6 Z M9 -44.6 L15.4 -44.6 L15.4 -39.6 L9 -39.6 Z M21.8 -44.6 L28.2 -44.6 L28.2 -39.6 L21.8 -39.6 Z"/>
      <path class="t" d="M-27.6 -60.4 L-20.4 -60.4 L-20.4 -44.6 L31 -44.6 L31 -39.6 L-27.6 -39.6 Z"/>
      <path class="t" style="stroke-width:1.1" d="M31 -43.6 L33.6 -43.8 M31 -42 L33.8 -42 M31 -40.4 L33.6 -40.2"/>
    </g>
  </g>

  <!-- Her needles. Joint where they cross. -->
  <g id="needles" data-parent="knitter" transform="translate(-32 -62)">
    <path class="t" style="stroke-width:2.6" d="M-6 -4.6 L5.4 3.6 M-5 4 L5 -5.6"/>
    <path fill="none" stroke="#cfd6df" stroke-width="1.1" stroke-linecap="round" d="M-6 -4.6 L5.4 3.6 M-5 4 L5 -5.6"/>
  </g>

  <!-- Every coffee of the meeting, stacked. Joint where the stack stands on the table. -->
  <g id="cups" data-parent="body" transform="translate(-19.6 -58)">
    <g transform="rotate(-4)">
      <path class="s" style="stroke-width:1.5" fill="#fffdf5" d="M-3.8 0 L-3.2 -33 L3.2 -33 L3.8 0 Z"/>
      <path class="s" style="stroke-width:1.3" fill="#fffdf5" d="M-4.8 -6 L4.8 -6 L4.8 -4 L-4.8 -4 Z M-4.8 -11 L4.8 -11 L4.8 -9 L-4.8 -9 Z M-4.8 -16 L4.8 -16 L4.8 -14 L-4.8 -14 Z M-4.8 -21 L4.8 -21 L4.8 -19 L-4.8 -19 Z M-4.8 -26 L4.8 -26 L4.8 -24 L-4.8 -24 Z M-4.8 -31 L4.8 -31 L4.8 -29 L-4.8 -29 Z M-4.8 -35 L4.8 -35 L4.8 -33 L-4.8 -33 Z"/>
      <path class="n" fill="#b98a5a" d="M-3 -3 L3 -3 L3.3 -0.8 L-3.3 -0.8 Z"/>
    </g>
  </g>

  <!-- The glass, its frame, and everything on the outside. -->
  <g id="glass" data-parent="body" transform="translate(0 -34)">
    <g transform="translate(0 34)">
      <rect class="n" fill="#7fe3d6" fill-opacity="0.14" x="-86" y="-112" width="172" height="78" rx="15"/>
      <path class="n" fill="#ffffff" fill-opacity="0.5" d="M-70 -110 L-59 -110 L-78 -64 L-84 -64 L-84 -80 Z M-55 -110 L-51.6 -110 L-70.6 -64 L-74 -64 Z"/>
      <path class="n" fill="#ffffff" fill-opacity="0.4" d="M30 -110 L36 -110 L25 -84 L19 -84 Z"/>
      <rect fill="none" stroke="#2b1b16" stroke-width="7.4" x="-86" y="-112" width="172" height="78" rx="15"/>
      <rect fill="none" stroke="#24376b" stroke-width="2.8" x="-86" y="-112" width="172" height="78" rx="15"/>
      <!-- the sill and the wheel arches -->
      <path class="o" fill="#24376b" d="M-90 -37 L90 -37 Q96 -37 96 -31 L96 -17 Q96 -11 90 -11 L73.5 -11 Q73.5 -27.5 58 -27.5 Q42.5 -27.5 42.5 -11 L-42.5 -11 Q-42.5 -27.5 -58 -27.5 Q-73.5 -27.5 -73.5 -11 L-90 -11 Q-96 -11 -96 -17 L-96 -31 Q-96 -37 -90 -37 Z"/>
      <path class="n" fill="#3d5a9e" d="M-88 -34.6 L88 -34.6 Q92.6 -34.6 93.4 -31 L-93.4 -31 Q-92.6 -34.6 -88 -34.6 Z"/>
      <rect class="s" fill="#5fe6d3" x="87.6" y="-29" width="7" height="8" rx="2"/>
      <rect class="s" fill="#e5283f" x="-94.6" y="-29" width="6" height="8" rx="2"/>
      <rect class="o" fill="#9aa4b2" x="89" y="-20.6" width="11" height="8.6" rx="3.4"/>
      <!-- booked: the lamp has been red for as long as anyone remembers -->
      <rect class="s" fill="#16243a" x="-30" y="-27.6" width="17" height="10.6" rx="2.4"/>
      <circle class="n" fill="#ff4a3d" cx="-25.4" cy="-22.3" r="2.5"/>
      <path fill="none" stroke="#5d6675" stroke-width="1.5" stroke-linecap="round" d="M-20.6 -24.4 L-15.6 -24.4 M-20.6 -20.4 L-17.6 -20.4"/>
      <!-- the scanner on the roof that does the driving -->
      <rect class="o" fill="#24376b" x="52" y="-121.4" width="20" height="6.4" rx="2"/>
      <rect class="s" fill="#9aa4b2" x="54.6" y="-128" width="14.8" height="7" rx="2.8"/>
    </g>
  </g>

  <!-- The scanner's eye, which goes round and round. Joint in the middle of the scanner. -->
  <g id="lidar" data-parent="glass" transform="translate(62 -124.6)">
    <rect class="n" fill="#5fe6d3" x="-2.2" y="-1.5" width="4.4" height="3" rx="1"/>
  </g>

  <!-- Where the plant went when it reached the ceiling. Joint at the hole in the roof. -->
  <g id="plant_top" data-parent="plant" transform="translate(-72 -114)">
    <path class="t" d="M-8 0.6 L-11.6 -1.6 M7 0.6 L10.4 -1.4"/>
    <path class="s" fill="#56b96e" d="M0 1.6 Q-14.6 0.4 -16.4 -9.4 Q-4 -11 0 1.6 Z"/>
    <path class="s" fill="#3f9b57" d="M1 1.6 Q14 1.6 17 -8.4 Q5 -10.6 1 1.6 Z"/>
    <path class="s" fill="#56b96e" d="M0.4 1.6 Q-4.6 -6 0.6 -12.6 Q5.6 -6 0.4 1.6 Z"/>
  </g>
</svg>
