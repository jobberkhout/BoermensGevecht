<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -134 112 140" data-rig="humanoid">
  <title>Mr. Declarabel</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm: a wide sleeve, bent forward under the pile. Almost all of it is behind the gown. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#22232c" d="M-6 -3 Q-9 10 -5 21 L22 34 L27 24 L8 12 L6 -3 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#1f2029" d="M-6 -3 L6 -3 L5 32 L-5 32 Z"/>
    <path class="o" fill="#15151a" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#2c2e3a" d="M-6 -3 L6 -3 L5 32 L-5 32 Z"/>
    <path class="o" fill="#1d1d24" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
    <path class="n" fill="#5d6074" d="M3 33.2 Q8 33.4 10.6 35.4 L5 35 Z"/>
  </g>

  <!-- The gown: a black bell from his shoulders to his ankles, with the white bands at the throat. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#2a2b36" d="M-15 -33 Q-12 -38 0 -38 Q12 -38 15 -33 Q19 -14 20 4 L23 27 Q1 32 -21 27 L-19 4 Q-18 -16 -15 -33 Z"/>
    <path fill="none" stroke="#15161d" stroke-width="1.8" stroke-linecap="round" d="M-9 2 L-12 27.5 M-1 8 L-2 29 M13 2 L16 28"/>
    <path fill="none" stroke="#4b4e62" stroke-width="1.6" stroke-linecap="round" d="M-14.5 -18 Q-15.5 -6 -16 8 M7 -20 L9 29"/>
    <!-- the yoke, gathered across the shoulders -->
    <path class="o" fill="#3a3c4b" d="M-14.5 -33.5 Q-12 -38 0 -38 Q12 -38 14.5 -33.5 Q15.6 -30 15.2 -27 Q0 -23.5 -15.2 -27 Q-15.6 -30 -14.5 -33.5 Z"/>
    <path fill="none" stroke="#23242e" stroke-width="1.4" stroke-linecap="round" d="M-10 -35 L-10.5 -27.5 M-5 -36.5 L-5.2 -26.5 M12 -34 L12.5 -27.5"/>
    <!-- the bands -->
    <path class="o" fill="#ffffff" d="M-5 -37 L4.5 -37 L5.6 -19.5 L0.6 -19.5 L-0.1 -24 L-0.8 -19.5 L-5.8 -19.5 Z"/>
    <path class="t" style="stroke-width:1.2" d="M-0.1 -36 L-0.1 -24"/>
    <path fill="none" stroke="#c3c8d2" stroke-width="1" stroke-linecap="round" d="M-3 -34 L-3.3 -22 M2.7 -34 L3.1 -22"/>
  </g>

  <!-- The stopwatch on its cord. One tenth of the dial is red: six minutes. -->
  <g id="watch" data-parent="torso" transform="translate(-9 -74)">
    <path fill="none" stroke="#2b1b16" stroke-width="3.4" stroke-linecap="round" d="M0 0 L-1 19"/>
    <path fill="none" stroke="#e6b422" stroke-width="1.5" stroke-linecap="round" d="M0 0 L-1 19"/>
    <rect class="o" style="stroke-width:1.6" fill="#e6b422" x="-2.9" y="16.6" width="3.8" height="4.4" rx="0.8"/>
    <circle class="o" style="stroke-width:2" fill="#e6b422" cx="-1" cy="27" r="6.8"/>
    <circle class="n" fill="#fffaf0" cx="-1" cy="27" r="4.6"/>
    <path class="n" fill="#e5283f" d="M-1 27 L-1 22.4 A4.6 4.6 0 0 1 1.7 23.28 Z"/>
    <path fill="none" stroke="#2b1b16" stroke-width="1.3" stroke-linecap="round" d="M-1 27 L1.3 23.9"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#d9a98c" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#f0cbb0" cx="2" cy="-21" rx="17" ry="17.5"/>
    <ellipse class="o" fill="#f0cbb0" cx="-8" cy="-19" rx="3.4" ry="4.8"/>
    <!-- grey, swept back from a forehead that has seen a lot of fine print -->
    <path class="o" fill="#c5c9d2" d="M-14.5 -24 Q-19 -41 -2 -43.5 Q7 -44.5 11 -40 Q3 -38.5 -3 -33 Q-6.5 -29.5 -7 -24 Q-10 -26 -12 -22 Q-11.5 -13 -13 -8.5 Q-17.5 -14 -14.5 -24 Z"/>
    <path class="n" fill="#a4a9b6" d="M-13 -29 Q-12 -39 -2 -41 Q-9 -36 -10 -27.5 Z"/>
    <path class="o" style="stroke-width:1.4" fill="#c5c9d2" d="M5.2 -27.6 Q9.5 -31 13.6 -27.2 Q9.5 -28.2 6 -25.6 Z"/>
    <path class="o" style="stroke-width:1.4" fill="#c5c9d2" d="M15.4 -27.8 Q18 -29.8 20.6 -27.4 Q18 -27.8 16 -26.2 Z"/>
    <circle class="n" fill="#2b1b16" cx="10" cy="-21.6" r="1.7"/>
    <circle class="n" fill="#2b1b16" cx="17.8" cy="-21.6" r="1.5"/>
    <path class="t" d="M7 -23.8 L12.8 -23.2 M15.6 -23.4 L19.8 -23.2"/>
    <path class="o" fill="#f0cbb0" d="M19 -20 Q26.5 -14.5 20.5 -11.6"/>
    <!-- half-moon glasses, to look over -->
    <path class="o" style="stroke:#9a7112;stroke-width:1.5" fill="#ffffff" fill-opacity="0.6" d="M5 -18.4 L13.4 -18.4 Q13.4 -12.8 9.2 -12.8 Q5 -12.8 5 -18.4 Z"/>
    <path class="o" style="stroke:#9a7112;stroke-width:1.5" fill="#ffffff" fill-opacity="0.6" d="M15.6 -18.4 L21.6 -18.4 Q21.6 -13.2 18.6 -13.2 Q15.6 -13.2 15.6 -18.4 Z"/>
    <path class="t" style="stroke:#9a7112;stroke-width:1.5" d="M13.4 -17.8 L15.6 -17.8 M5 -18.2 L-6 -20.6"/>
    <path class="t" d="M9.5 -6.4 Q13.5 -8.6 18 -6.2"/>
    <path class="t" style="stroke-width:1.2" d="M7.6 -9.6 Q6.6 -7 8 -4.8"/>
  </g>

  <!-- The pile of invoices on his far arm, tied with red tape. -->
  <g id="pile" data-parent="arm_back" transform="translate(19 -43)">
    <g transform="rotate(-5)">
      <path class="o" style="stroke-width:1.6" fill="#ffffff" d="M3 -6 L18 -9 L18.5 -6.6 L14 -6 Z"/>
      <rect class="o" fill="#ffffff" x="-13" y="-6" width="27" height="11" rx="1"/>
      <path fill="none" stroke="#b3b8c3" stroke-width="1" d="M-12 -3.3 L13 -3.3 M-12 -0.6 L13 -0.6 M-12 2.1 L13 2.1"/>
      <rect class="n" fill="#e5283f" x="-4" y="-5" width="3.6" height="9"/>
      <path class="t" style="stroke-width:1.2" d="M-4 -6 L-4 5 M-0.4 -6 L-0.4 5"/>
    </g>
    <path class="o" fill="#d9a98c" d="M5 6 Q5 2 9 2 L12.5 2 Q15.5 2 15.5 5.5 Q15.5 9 12 9 L8.5 9 Q5 9 5 6 Z"/>
  </g>

  <!-- The throwing arm: a wide sleeve, a white cuff, two fingers. -->
  <g id="arm_front" data-parent="torso" transform="translate(13 -72)">
    <path class="o" fill="#343649" d="M-6 -3 Q-8.5 9 -7 18 Q-4 27 5 26 Q11 25 13.5 19 L16.5 12 L12 3.5 L5.5 8 L6 -3 Z"/>
    <path fill="none" stroke="#50536b" stroke-width="1.6" stroke-linecap="round" d="M-3 2 Q-4.5 11 -2.5 19"/>
    <path class="o" fill="#15161d" d="M12 3.5 Q17 5 16.5 12 Q11 12.5 12 3.5 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M12.8 5 L17 4.2 L18 10 L13.8 10.8 Z"/>
    <circle class="o" fill="#f0cbb0" cx="19.4" cy="6.6" r="4.4"/>
    <circle data-mount="hand" fill="none" cx="23" cy="1" r="1"/>
  </g>

  <!-- The next invoice, already folded. Joint in his fingers. -->
  <g id="prop" data-parent="arm_front" transform="translate(32.4 -65.4)">
    <g transform="rotate(-30)">
      <path class="o" style="stroke-width:2" fill="#ffffff" d="M16 0.5 L-11 -11 L-7.5 -1.5 L-4 9.5 Z"/>
      <path class="n" fill="#c3cbd9" d="M13 0.8 L-6.6 -0.8 L-3.8 7.4 Z"/>
      <path class="t" style="stroke-width:1.2" d="M15 0.5 L-7.5 -1.5"/>
      <path fill="none" stroke="#9aa3b2" stroke-width="1" stroke-linecap="round" d="M-6.5 -6.2 L3.5 -2.6 M-5.4 -3.8 L0 -2"/>
    </g>
    <ellipse class="o" style="stroke-width:1.8" fill="#f0cbb0" cx="-0.4" cy="1.6" rx="2.6" ry="3.4"/>
  </g>
</svg>
