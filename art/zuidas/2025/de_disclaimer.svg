<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -130 100 136" data-rig="humanoid">
  <title>De Disclaimer</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(-20 -38)"/>

  <!-- The far arm reaches forward to the top of the sheet. Only its fingers show, and those are drawn on the sheet. -->
  <g id="arm_back" data-parent="torso" transform="translate(-26 -72)">
    <path class="o" fill="#737b89" d="M-6 -3 Q-8 9 -5 19 L6 19 Q8 9 6 -3 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-25 -38)">
    <path class="o" fill="#5c6370" d="M-7 -3 L7 -3 L5.5 32 L-5.5 32 Z"/>
    <path class="o" fill="#15151a" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(-15 -38)">
    <path class="o" fill="#6f7785" d="M-7 -3 L7 -3 L5.5 32 L-5.5 32 Z"/>
    <path class="t" style="stroke:#8d95a3" d="M0.5 0 L0.5 30"/>
    <path class="o" fill="#1d1d24" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
    <path class="n" fill="#5d6074" d="M3 33.2 Q8 33.4 10.6 35.4 L5 35 Z"/>
  </g>

  <!-- A grey suit, buttoned. The keycord goes round his collar and down to a pass that he never takes off. -->
  <g id="torso" data-parent="hips" transform="translate(-20 -40)">
    <path class="o" fill="#8d95a3" d="M-14.5 8 Q-17 -14 -14 -30 Q-11 -37 0 -37 Q12 -37 15 -30 Q18 -14 14.5 8 Z"/>
    <path class="n" fill="#a3aab6" d="M-12 -28 Q-9.5 -34 -3 -35 Q-9 -30 -10.5 -8 L-13.4 -8 Q-14 -20 -12 -28 Z"/>
    <path class="t" style="stroke:#6f7785" d="M-8 -2 L1 -2 M-13.6 2 Q-14.4 -4 -14.6 -10"/>
    <path class="o" fill="#ffffff" d="M3 -36.6 L10 -34 L12 -28 L6 -30 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#2f7d8a" d="M8.2 -31 L11.6 -29.4 L12.4 -16 L10 -13 L8 -16.4 Z"/>
    <path fill="none" stroke="#2b1b16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M-7 -36 Q-1 -31.5 5.5 -33 L1.5 -8"/>
    <path fill="none" stroke="#3fb3c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M-7 -36 Q-1 -31.5 5.5 -33 L1.5 -8"/>
    <rect class="o" style="stroke-width:1.8" fill="#ffffff" x="-4.5" y="-9" width="10.5" height="13" rx="1.6"/>
    <rect class="n" fill="#6f7785" x="-2.6" y="-6.6" width="4" height="4.8"/>
    <path fill="none" stroke="#9aa3b2" stroke-width="1.2" stroke-linecap="round" d="M2.6 -5.8 L4.2 -5.8 M2.6 -3.2 L4.2 -3.2 M-2.6 0.8 L4.2 0.8"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(-19 -76)">
    <rect class="o" fill="#dea888" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#f1cdb0" cx="2" cy="-21" rx="17.5" ry="17.5"/>
    <ellipse class="o" fill="#f1cdb0" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <!-- thin hair with a parting that is checked every morning -->
    <path class="o" fill="#5a5148" d="M-15.4 -22 Q-20.5 -41 -2 -43.6 Q11 -45 17 -36.5 Q9 -39.5 2 -36 Q-7 -32 -9.5 -24.5 Q-12 -26 -13.2 -21 Q-13.6 -15 -15.4 -22 Z"/>
    <path class="n" fill="#7a7068" d="M-10 -36 Q-2 -42 9 -40.4 Q0 -39.6 -7 -33 Z"/>
    <path class="n" fill="#a8a29c" d="M-13.6 -24 Q-13 -29 -10.5 -31 Q-11 -27 -10.6 -24 Q-12.4 -25 -13.6 -24 Z"/>
    <!-- eyebrows up: he has read all of it -->
    <path class="t" style="stroke-width:2" d="M4.6 -27.8 Q9 -31.8 13.4 -30.2 M15.6 -30.4 Q18.2 -31.4 20.6 -29.4"/>
    <circle class="n" fill="#2b1b16" cx="10.4" cy="-20.6" r="1.9"/>
    <circle class="n" fill="#2b1b16" cx="18.4" cy="-20.6" r="1.7"/>
    <path class="o" fill="#f1cdb0" d="M19.5 -18 Q24 -15 19.8 -12.8"/>
    <!-- glasses with a proper frame -->
    <rect class="o" style="stroke-width:2" fill="#ffffff" fill-opacity="0.5" x="4.6" y="-25.4" width="10" height="8.6" rx="2"/>
    <rect class="o" style="stroke-width:2" fill="#ffffff" fill-opacity="0.5" x="16" y="-25.4" width="6.6" height="8.6" rx="2"/>
    <path class="t" style="stroke-width:2" d="M14.6 -22 L16 -22 M4.6 -22.4 L-7 -21.4"/>
    <path class="t" d="M10.5 -8 L17 -8.4"/>
  </g>

  <!-- The same sheet rolled up, for the walk home. It stands behind the page until then. Joint in its middle. -->
  <g id="roll" data-parent="torso" transform="translate(13 -47)">
    <rect class="o" fill="#ffffff" x="-5" y="-33" width="10" height="66" rx="3"/>
    <path fill="none" stroke="#9aa3b2" stroke-width="1" stroke-linecap="round" d="M-2 -24 L-2 -8 M1 -26 L1 -10 M-2 8 L-2 26 M1 6 L1 22"/>
    <rect class="o" style="stroke-width:1.6" fill="#3fb3c2" x="-5.6" y="-3" width="11.2" height="5.4" rx="1.4"/>
    <ellipse class="o" style="stroke-width:1.8" fill="#e9edf2" cx="0" cy="-32" rx="5" ry="2.6"/>
    <path class="t" style="stroke-width:1.1" d="M-2.4 -32 Q0 -33.6 2 -32 Q0 -31 -0.6 -32"/>
  </g>

  <!-- The sheet: a page of small print in a clear screen on two feet. Joint at the middle of its foot. -->
  <g id="sheet" data-parent="torso" transform="translate(13 -2)">
    <g transform="translate(-13 2)">
      <path class="o" fill="#d5d8de" d="M-8 -5 L-2 -5 L0 0 L-10 0 Z M28 -5 L34 -5 L36 0 L26 0 Z"/>
      <!-- the handle on his side -->
      <path fill="none" stroke="#2b1b16" stroke-width="5.6" stroke-linecap="round" d="M-10 -68 Q-16.5 -68 -16.5 -61 Q-16.5 -54 -10 -54"/>
      <path fill="none" stroke="#b9bec6" stroke-width="2.4" stroke-linecap="round" d="M-10 -68 Q-16.5 -68 -16.5 -61 Q-16.5 -54 -10 -54"/>
      <rect class="o" fill="#bfe6ec" fill-opacity="0.6" x="-10" y="-92" width="46" height="88" rx="3"/>
      <path class="n" fill="#ffffff" fill-opacity="0.7" d="M-8 -90 L-2 -90 L-8 -78 Z M30 -6 L34 -6 L34 -14 Z"/>
      <rect class="o" style="stroke-width:1.8" fill="#ffffff" x="-5" y="-86" width="36" height="76" rx="1"/>
      <!-- a heading, an asterisk, and the rest -->
      <path fill="none" stroke="#2b1b16" stroke-width="2.2" stroke-linecap="round" d="M-1.5 -80 L13 -80"/>
      <path fill="none" stroke="#e5283f" stroke-width="2" stroke-linecap="round" d="M23.5 -83.6 L23.5 -75.6 M20 -81.6 L27 -77.6 M27 -81.6 L20 -77.6"/>
      <path fill="none" stroke="#8c95a5" stroke-width="1.1" stroke-linecap="round" d="M-1.5 -73 L27.5 -73 M-1.5 -69.7 L26 -69.7 M-1.5 -66.4 L27.5 -66.4 M-1.5 -63.1 L24 -63.1 M-1.5 -59.8 L27.5 -59.8 M-1.5 -56.5 L27 -56.5 M-1.5 -53.2 L25 -53.2 M-1.5 -49.9 L27.5 -49.9 M-1.5 -46.6 L26.5 -46.6 M-1.5 -43.3 L27.5 -43.3 M-1.5 -40 L23 -40 M-1.5 -36.7 L12 -36.7"/>
      <!-- the asterisk again, and what it stands for -->
      <path fill="none" stroke="#e5283f" stroke-width="1.1" stroke-linecap="round" d="M0 -32.8 L0 -29.4 M-1.5 -32 L1.5 -30.2 M1.5 -32 L-1.5 -30.2"/>
      <path fill="none" stroke="#a3abb9" stroke-width="0.7" stroke-linecap="round" d="M3 -32 L18.5 -32 M3 -29.9 L18 -29.9 M3 -27.8 L18.5 -27.8 M3 -25.7 L14 -25.7"/>
      <!-- sign here -->
      <path fill="none" stroke="#2b1b16" stroke-width="1.3" stroke-linecap="round" d="M-0.5 -19.4 L3.5 -15 M3.5 -19.4 L-0.5 -15 M6 -14.6 L17.5 -14.6"/>
      <!-- the annex, and the annex to the annex -->
      <g transform="rotate(7 27 -24)">
        <rect class="o" style="stroke-width:1.6" fill="#ffffff" x="20" y="-34" width="14" height="20" rx="0.8"/>
        <path fill="none" stroke="#a3abb9" stroke-width="0.6" stroke-linecap="round" d="M22 -30.4 L28.5 -30.4 M22 -28.2 L32 -28.2 M22 -26 L31 -26 M22 -23.8 L32 -23.8 M22 -21.6 L30.5 -21.6 M22 -19.4 L32 -19.4 M22 -17.2 L27 -17.2"/>
        <path fill="none" stroke="#e5283f" stroke-width="0.9" stroke-linecap="round" d="M31 -32.6 L31 -29.8 M29.8 -31.9 L32.2 -30.5 M32.2 -31.9 L29.8 -30.5"/>
        <path fill="none" stroke="#5c6370" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" d="M23.4 -31 L23.4 -36.4 Q23.4 -37.8 24.8 -37.8 Q26.2 -37.8 26.2 -36.4 L26.2 -32.4"/>
      </g>
      <g transform="rotate(-6 32 -17)">
        <rect class="o" style="stroke-width:1.3" fill="#ffffff" x="28" y="-22.5" width="8" height="11" rx="0.6"/>
        <path fill="none" stroke="#a3abb9" stroke-width="0.5" d="M29.4 -19.6 L34.6 -19.6 M29.4 -17.8 L34.6 -17.8 M29.4 -16 L33 -16"/>
        <path fill="none" stroke="#5c6370" stroke-width="1" stroke-linecap="round" d="M30 -21 L30 -24.4 Q30 -25.4 31 -25.4 Q32 -25.4 32 -24.4 L32 -21.8"/>
      </g>
      <!-- the far hand, over the top -->
      <path class="o" style="stroke-width:1.8" fill="#dea888" d="M13 -90 Q13 -95.6 15.8 -95.6 Q18.4 -95.6 18.4 -93 Q18.6 -96 21.2 -96 Q23.8 -96 23.8 -93 Q24.2 -95.6 26.6 -95.6 Q29.2 -95.6 29.2 -90 Z"/>
    </g>
  </g>

  <!-- The near arm, bent, with its hand round the handle. -->
  <g id="arm_front" data-parent="torso" transform="translate(-14 -72)">
    <path class="o" fill="#99a1ad" d="M-6 -3 Q-8.5 8 -7.5 15 Q-6 21.5 0 20.5 L6 17.5 L3.5 9 Q5.6 3 6 -3 Z"/>
    <path class="n" fill="#adb4bf" d="M1 -1 L4.2 -1 Q4 4 2.4 9 L0 9 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M3.2 9.4 L6.4 8.4 L8.6 15.6 L5.6 16.8 Z"/>
    <path class="o" fill="#f1cdb0" d="M3 12 Q2 7.6 6.6 7 Q11 6.6 11.4 11 Q11.8 15.6 7.4 16 Q3.6 16.2 3 12 Z"/>
  </g>
</svg>
