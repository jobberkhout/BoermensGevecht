<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17 -14 34 28" data-rig="static">
  <title>Een factuur, als vliegtuigje gevouwen</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <!-- Nose to the right: one wing on top, the keel below, and what is left of the print. Origin = its middle. -->
  <g id="plane" transform="translate(0 0)">
    <path class="o" fill="#ffffff" d="M15 0.5 L-13 -11 L-9 -1.5 L-5 10 Z"/>
    <path class="n" fill="#c3cbd9" d="M12 0.8 L-8 -0.8 L-4.8 8 Z"/>
    <path class="t" d="M14 0.5 L-9 -1.5"/>
    <path fill="none" stroke="#9aa3b2" stroke-width="1" stroke-linecap="round" d="M-8 -6.4 L3 -2.6 M-6.8 -3.8 L-1 -2"/>
    <path class="n" fill="#e5283f" d="M-10.4 -8.2 L-8 -7.2 L-8.8 -5.4 L-9.6 -5.8 Z"/>
  </g>
</svg>
