<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -128 112 134" data-rig="humanoid">
  <title>Bodywarmer-Bas</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm, bent forward: it carries the coffees and never moves. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#b4c8e6" d="M-6 -3 Q-8 8 -5 17 L7 20 Q8 7 6 -3 Z"/>
    <path class="o" fill="#b4c8e6" d="M-4 10 L35 16 L34 25 L-5 20 Z"/>
    <path class="o" fill="#fafafa" d="M32 15 L37 16 L36 25.5 L31 24.5 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#1f3358" d="M-7 -3 L7 -3 L5.5 28 L-5.5 28 Z"/>
    <rect class="o" fill="#dea888" x="-3" y="27.5" width="6" height="5"/>
    <path class="o" fill="#e9e9e9" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
    <path class="n" fill="#c9c9c9" d="M-6 36 L12.5 36 L12.5 37.6 L-6 37.6 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#27406b" d="M-7 -3 L7 -3 L5.5 28 L-5.5 28 Z"/>
    <!-- the crease: these are suit trousers -->
    <path class="t" style="stroke:#3b5a91" d="M0.5 0 L0.5 26"/>
    <rect class="o" fill="#f3c9a5" x="-3" y="27.5" width="6" height="5"/>
    <path class="o" fill="#fafafa" d="M-7 33.5 Q-7 31.5 -4 31.5 L4 31.5 Q11 32 13 35.5 L13 38 L-7 38 Z"/>
    <path class="n" fill="#d6d6d6" d="M-6 36 L12.5 36 L12.5 37.6 L-6 37.6 Z"/>
    <path fill="none" stroke="#e6b422" stroke-width="1.7" stroke-linecap="round" d="M2 32.5 L6 35"/>
  </g>

  <!-- Pale blue shirt, no tie, under a quilted bodywarmer. The lanyard hangs over it. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#cfdff5" d="M-14 6 Q-17 -14 -14 -30 Q-11 -37 0 -37 Q12 -37 15 -30 Q18 -14 14 6 Z"/>
    <path class="o" fill="#6b4a2f" d="M-14.5 2 L14.6 2 L14 6.5 L-14 6.5 Z"/>
    <rect class="n" fill="#e6b422" x="3" y="2.6" width="4.4" height="3.4" rx="0.8"/>
    <path class="o" fill="#2f5d6b" d="M-15.5 1.5 Q-18.5 -14 -15.5 -29 Q-12 -37 -5 -38.5 L0 -24 L7.5 -38.5 Q13 -37 16.5 -29 Q19.5 -14 15.5 1.5 Z"/>
    <path fill="none" stroke="#4b8494" stroke-width="1.8" stroke-linecap="round" d="M-16.6 -24 L-3 -24 M4 -24 L17.6 -24 M-17.6 -15.5 L18.6 -15.5 M-17.4 -7 L17.4 -7"/>
    <path class="t" d="M0.8 -24 L0.8 1.5"/>
    <!-- the collar of the bodywarmer and the open shirt collar -->
    <path class="o" fill="#3f7482" d="M-6.5 -38.5 L-1.5 -27 L1 -31 L-2 -40 Z M9 -38.5 L3 -27 L1 -31 L5 -40.5 Z"/>
    <path class="o" fill="#fafafa" d="M-3.5 -38.5 L1 -31 L6.5 -38.5 Q1.5 -41 -3.5 -38.5 Z"/>
    <!-- lanyard and pass -->
    <path fill="none" stroke="#2b1b16" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" d="M-8.5 -35 L-4.5 -12 L6.5 -35"/>
    <path fill="none" stroke="#e6b422" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M-8.5 -35 L-4.5 -12 L6.5 -35"/>
    <rect class="o" style="stroke-width:1.8" fill="#fafafa" x="-10" y="-13" width="11" height="13" rx="1.6"/>
    <rect class="n" fill="#27406b" x="-8" y="-10.6" width="4.2" height="5"/>
    <path fill="none" stroke="#9aa7bb" stroke-width="1.2" stroke-linecap="round" d="M-2.2 -9.6 L-0.6 -9.6 M-2.2 -7 L-0.6 -7 M-8 -3 L-0.8 -3"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#dea888" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#f3c9a5" cx="2" cy="-21" rx="18" ry="17.5"/>
    <ellipse class="o" fill="#f3c9a5" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <!-- an earbud that never comes out -->
    <path class="o" style="stroke-width:1.6" fill="#ffffff" d="M-10.8 -19.5 Q-8 -21.5 -7 -18.5 L-7.4 -11.5 Q-8.6 -10.2 -9.8 -11.5 L-9.6 -16.5 Q-11.4 -17.2 -10.8 -19.5 Z"/>
    <!-- hair combed back with product, parting on the far side -->
    <path class="o" fill="#4a3526" d="M-15.5 -22 Q-21 -42 -2 -44.5 Q14 -46 21.5 -34 Q17 -33.5 12 -34.5 Q0 -37 -12.5 -27 Z"/>
    <path class="n" fill="#6b4d38" d="M-10 -37 Q0 -42.5 13 -39 Q3 -39 -7 -33.5 Z"/>
    <path class="o" fill="#4a3526" d="M-16 -25 Q-18 -15 -12.5 -10 L-11 -22 Z"/>
    <circle class="n" fill="#2b1b16" cx="9.5" cy="-20" r="2"/>
    <circle class="n" fill="#2b1b16" cx="17.5" cy="-20" r="1.8"/>
    <path class="t" style="stroke-width:2" d="M5.5 -26.5 Q9.5 -28 13.5 -25.5 M15.5 -26.5 Q18 -27.5 20.5 -26"/>
    <path class="o" fill="#f3c9a5" d="M19.5 -18 Q24 -15 19.8 -12.8"/>
    <!-- the smile of someone who is about to say "even sparren?" -->
    <path class="o" fill="#ffffff" d="M7 -10.5 Q13 -3.5 19.5 -11.5 Q13 -12.5 7 -10.5 Z"/>
    <path class="t" d="M5 -11.5 L7 -10.5"/>
  </g>

  <!-- A carrier with two takeaway coffees, in the far hand. Joint under the carrier. It stays level, always. -->
  <g id="tray" data-parent="arm_back" transform="translate(30 -48)">
    <circle class="o" fill="#e9b796" cx="-1" cy="1.5" r="4.4"/>
    <path class="o" fill="#fffaf0" d="M-11.5 -6 L-2 -6 L-0.6 -21 L-12.9 -21 Z"/>
    <path class="o" fill="#b98a5a" d="M-12.4 -17 L-1 -17 L-1.5 -10.5 L-11.9 -10.5 Z"/>
    <rect class="o" fill="#2f3440" x="-14" y="-24.5" width="14.4" height="4" rx="1.6"/>
    <path class="o" fill="#fffaf0" d="M3.5 -6 L13 -6 L14.4 -21 L2.1 -21 Z"/>
    <path class="o" fill="#b98a5a" d="M2.6 -17 L14 -17 L13.5 -10.5 L3.1 -10.5 Z"/>
    <rect class="o" fill="#2f3440" x="1" y="-24.5" width="14.4" height="4" rx="1.6"/>
    <path class="o" fill="#c8a877" d="M-16 0 L-14.5 -8 L17.5 -8 L19 0 Z"/>
    <path class="t" style="stroke:#a3845a" d="M-12 -4 L15 -4"/>
  </g>

  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#cfdff5" d="M-6 -3 Q-8 10 -5.5 23 L5.5 23 Q7 10 6 -3 Z"/>
    <path class="n" fill="#e3ecfa" d="M1.5 -1 L4.6 -1 Q5.4 10 4.4 21 L1.8 21 Z"/>
    <rect class="o" fill="#fafafa" x="-5.6" y="21.5" width="11.2" height="4.4" rx="1.4"/>
    <rect class="o" style="stroke-width:1.6" fill="#e6b422" x="-4.6" y="25.6" width="9.2" height="3" rx="1.2"/>
    <circle class="o" fill="#f3c9a5" cx="1" cy="31" r="4.6"/>
  </g>

  <!-- The laptop bag: what he hits with. Joint in his fist. -->
  <g id="bag" data-parent="arm_front" transform="translate(11 -41)">
    <path fill="none" stroke="#2b1b16" stroke-width="5.6" stroke-linecap="round" d="M-6 7 Q-6 0 0 0 Q6 0 6 7"/>
    <path fill="none" stroke="#5a6272" stroke-width="2.6" stroke-linecap="round" d="M-6 7 Q-6 0 0 0 Q6 0 6 7"/>
    <rect class="o" fill="#c9ced6" x="-10" y="4.5" width="20" height="5" rx="1.4"/>
    <rect class="o" fill="#3a3f4a" x="-14" y="7" width="28" height="17.5" rx="2.6"/>
    <path class="n" fill="#4c5361" d="M-12.5 8.5 L12.5 8.5 L12.5 13.5 Q0 17.5 -12.5 13.5 Z"/>
    <path class="t" d="M-12.5 13.5 Q0 17.5 12.5 13.5"/>
    <rect class="n" fill="#e6b422" x="-2.2" y="13.8" width="4.4" height="4" rx="1"/>
    <circle class="o" fill="#f3c9a5" cx="0" cy="0" r="4.4"/>
  </g>
</svg>
