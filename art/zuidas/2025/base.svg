<svg xmlns="http://www.w3.org/2000/svg" viewBox="-312 -596 328 602" data-rig="static">
  <title>Het Spiegelpaleis</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!--
    Head office of Krijtstreep & Zn.: mirror glass from the pavement up, two terraces cut into the front,
    a roof terrace, and a revolving door. Origin = the gate on the road; the building stands to the left of it.
  -->
  <g id="building" transform="translate(0 0)">
    <!-- flagpole -->
    <path fill="none" stroke="#2b1b16" stroke-width="7" stroke-linecap="round" d="M-288 -448 L-288 -552"/>
    <path fill="none" stroke="#d5d8de" stroke-width="2.6" stroke-linecap="round" d="M-288 -448 L-288 -552"/>
    <circle class="o" fill="#e6b422" cx="-288" cy="-556" r="4.6"/>

    <!-- the boardroom floor: glass that shows the sky, and the crane across the road -->
    <rect class="o" fill="#5fb8c2" x="-150" y="-540" width="146" height="98"/>
    <path class="n" fill="#86cfd6" d="M-150 -540 L-113.5 -540 L-113.5 -507.3 L-150 -507.3 Z M-77 -507.3 L-40.5 -507.3 L-40.5 -474.7 L-77 -474.7 Z M-40.5 -540 L-4 -540 L-4 -507.3 L-40.5 -507.3 Z M-113.5 -474.7 L-77 -474.7 L-77 -442 L-113.5 -442 Z"/>
    <path class="n" fill="#4aa5b0" d="M-113.5 -507.3 L-77 -507.3 L-77 -474.7 L-113.5 -474.7 Z M-40.5 -474.7 L-4 -474.7 L-4 -442 L-40.5 -442 Z"/>
    <path fill="none" stroke="#b4e6ea" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M-56 -444 L-56 -524 M-104 -514 L-26 -514 M-56 -524 L-84 -514 M-56 -524 L-34 -514 M-92 -514 L-92 -492"/>
    <rect class="n" fill="#b4e6ea" x="-97" y="-493" width="10" height="7"/>
    <path class="n" fill="#ffffff" fill-opacity="0.6" d="M-140 -486 Q-143 -497 -131 -497 Q-128 -509 -114 -505 Q-103 -512 -95 -501 Q-84 -501 -85 -490 Q-86 -484 -94 -484 L-132 -484 Q-140 -484 -140 -486 Z"/>
    <path class="n" fill="#ffffff" fill-opacity="0.22" d="M-60 -540 L-30 -540 L-76 -442 L-106 -442 Z"/>
    <path fill="none" stroke="#2f7d8a" stroke-width="2.4" d="M-113.5 -540 L-113.5 -442 M-77 -540 L-77 -442 M-40.5 -540 L-40.5 -442 M-150 -507.3 L-4 -507.3 M-150 -474.7 L-4 -474.7"/>
    <rect fill="none" stroke="#2b1b16" stroke-width="3" x="-150" y="-540" width="146" height="98"/>
    <rect class="o" fill="#d5d8de" x="-155" y="-549" width="156" height="10" rx="2"/>
    <!-- plant room, mast, and the red light for the planes -->
    <rect class="o" fill="#8d95a3" x="-72" y="-565" width="46" height="16"/>
    <path class="t" style="stroke:#5c6370" d="M-66 -560 L-32 -560 M-66 -555 L-32 -555"/>
    <path class="t" style="stroke-width:3" d="M-38 -565 L-38 -584"/>
    <circle class="o" style="stroke-width:2" fill="#e5283f" cx="-38" cy="-587" r="3.6"/>

    <!-- the roof terrace: a planter, a parasol that is down, a glass balustrade -->
    <path class="t" style="stroke-width:3" d="M-161 -450 L-161 -522"/>
    <path class="o" style="stroke-width:2.4" fill="#f1e4c8" d="M-161 -524 Q-168 -508 -165.4 -486 L-156.6 -486 Q-154 -508 -161 -524 Z"/>
    <path class="t" style="stroke:#2f9aa8;stroke-width:2.4" d="M-165 -494 L-157 -494"/>
    <path fill="none" stroke="#2b1b16" stroke-width="4.6" stroke-linecap="round" d="M-262 -468 L-268 -490 M-254 -468 L-254 -496 M-246 -468 L-240 -492 M-236 -468 L-228 -486 M-228 -468 L-222 -480"/>
    <path fill="none" stroke="#7bbf6a" stroke-width="2.2" stroke-linecap="round" d="M-262 -468 L-268 -490 M-254 -468 L-254 -496 M-246 -468 L-240 -492 M-236 -468 L-228 -486 M-228 -468 L-222 -480"/>
    <rect class="o" fill="#8d95a3" x="-272" y="-468" width="60" height="18"/>
    <rect class="n" fill="#ffffff" fill-opacity="0.34" x="-294" y="-474" width="142" height="24"/>
    <path class="n" fill="#ffffff" fill-opacity="0.4" d="M-206 -474 L-196 -474 L-208 -450 L-218 -450 Z"/>
    <path class="o" style="stroke-width:2" fill="#8d95a3" d="M-226 -476 L-222 -476 L-222 -450 L-226 -450 Z"/>
    <rect class="o" fill="#d5d8de" x="-299" y="-480" width="150" height="6" rx="2.5"/>

    <!-- the tower itself -->
    <rect class="o" fill="#2b5f6b" x="-296" y="-442" width="292" height="442"/>

