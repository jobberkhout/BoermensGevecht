    <rect class="o" fill="#d5d8de" x="-298" y="-10" width="198" height="10"/>
    <!-- the brass plate by the door -->
    <rect class="o" style="stroke-width:2" fill="#e6b422" x="-124" y="-116" width="15" height="19" rx="1.5"/>
    <path class="t" style="stroke:#8a6a10;stroke-width:1.3" d="M-121 -111 L-112 -111 M-121 -107 L-112 -107 M-121 -103 L-116 -103"/>

    <!-- the revolving door: a dark drum with glass round it -->
    <rect class="o" fill="#8d95a3" x="-100" y="-124" width="96" height="124"/>
    <rect class="o" fill="#14262e" x="-94" y="-118" width="84" height="118"/>
    <path class="n" fill="#1f3d48" d="M-94 -118 L-10 -118 L-10 -108 L-94 -108 Z"/>
    <path class="o" style="stroke-width:2" fill="#5fb8c2" fill-opacity="0.55" d="M-94 -108 L-80 -108 L-80 0 L-94 0 Z M-24 -108 L-10 -108 L-10 0 L-24 0 Z"/>
    <path class="n" fill="#ffffff" fill-opacity="0.3" d="M-92 -104 L-86 -104 L-92 -76 Z M-22 -104 L-16 -104 L-22 -76 Z"/>

    <circle data-mount="turret0" fill="none" cx="-150" cy="-144" r="1"/>
    <circle data-mount="turret1" fill="none" cx="-150" cy="-294" r="1"/>
    <circle data-mount="flag" fill="none" cx="-286" cy="-548" r="1"/>
  </g>

  <!-- The two leaves of the door. They are drawn flat; the clip turns them by squeezing them. Joint on the post. -->
  <g id="door_b" transform="translate(-52 -54)">
    <rect fill="#7fc9d1" fill-opacity="0.1" stroke="#4f9aa6" stroke-width="2" x="-28" y="-54" width="56" height="106"/>
    <path fill="none" stroke="#6f7785" stroke-width="3" stroke-linecap="round" d="M-23 4 L-7 4 M7 4 L23 4"/>
  </g>
  <g id="door_a" transform="translate(-52 -54)">
    <rect fill="#a9e0e5" fill-opacity="0.16" stroke="#8fd0d8" stroke-width="2" x="-28" y="-54" width="56" height="106"/>
    <path class="n" fill="#ffffff" fill-opacity="0.22" d="M-24 -50 L-14 -50 L-24 -12 Z M8 -50 L14 -50 L4 -12 L-2 -12 Z"/>
    <path fill="none" stroke="#d5d8de" stroke-width="3" stroke-linecap="round" d="M-23 4 L-7 4 M7 4 L23 4"/>
  </g>

  <!-- In front of everything: the canopy, the post of the door, and the building site that was going to be finished last year. -->
  <g id="front" transform="translate(0 0)">
    <rect class="o" style="stroke-width:2" fill="#8d95a3" x="-54" y="-108" width="4" height="108"/>
    <rect class="o" fill="#d5d8de" x="-108" y="-136" width="112" height="13" rx="2.5"/>
    <path class="n" fill="#e6b422" d="M-106 -127.6 L2 -127.6 L2 -125.2 L-106 -125.2 Z"/>

    <!-- sand, with the shovel still in it -->
    <path class="o" fill="#e3c98a" d="M-294 -10 Q-264 -56 -228 -10 Z"/>
    <path class="n" fill="#f0dcae" d="M-276 -22 Q-266 -40 -254 -34 Q-264 -32 -270 -20 Z"/>
    <path fill="none" stroke="#2b1b16" stroke-width="5.4" stroke-linecap="round" d="M-252 -30 L-240 -68"/>
    <path fill="none" stroke="#c98a45" stroke-width="2.4" stroke-linecap="round" d="M-252 -30 L-240 -68"/>
    <path class="o" style="stroke-width:2.4" fill="none" d="M-245 -70 L-235 -66.6"/>

    <!-- the site toilet -->
    <rect class="o" style="stroke-width:2.4" fill="#8d95a3" x="-143" y="-110" width="5" height="16"/>
    <rect class="o" fill="#3fb3c2" x="-178" y="-94" width="42" height="84" rx="3"/>
    <path class="o" fill="#eef1f4" d="M-182 -93 Q-157 -108 -132 -93 Z"/>
    <rect class="o" style="stroke-width:2.4" fill="#2f9aa8" x="-172" y="-86" width="30" height="72" rx="2"/>
    <path class="t" style="stroke:#1f6b77" d="M-166 -79 L-148 -79 M-166 -74.6 L-148 -74.6 M-166 -70.2 L-148 -70.2"/>
    <circle class="o" style="stroke-width:1.8" fill="#ffffff" cx="-147.6" cy="-50" r="3.6"/>
    <path class="n" fill="#e5283f" d="M-150.6 -50 A3 3 0 0 1 -144.6 -50 Z"/>

    <!-- the fence -->
    <g>
        <path fill="none" stroke="#9aa3ab" stroke-width="1.1" d="M-287 -84 L-287 -12 M-279.9 -84 L-279.9 -12 M-272.8 -84 L-272.8 -12 M-265.7 -84 L-265.7 -12 M-258.6 -84 L-258.6 -12 M-251.5 -84 L-251.5 -12 M-244.4 -84 L-244.4 -12 M-237.3 -84 L-237.3 -12 M-230.2 -84 L-230.2 -12 M-223.1 -84 L-223.1 -12 M-216 -84 L-216 -12 M-208.9 -84 L-208.9 -12"/>
        <path fill="none" stroke="#8d95a3" stroke-width="1.8" d="M-292 -64 L-204 -64 M-292 -32 L-204 -32"/>
        <rect fill="none" stroke="#2b1b16" stroke-width="5.6" x="-294" y="-86" width="92" height="76" rx="3"/>
        <rect fill="none" stroke="#b9bec6" stroke-width="2.4" x="-294" y="-86" width="92" height="76" rx="3"/>
    </g>
    <g transform="rotate(2.6 -202 -10)">
        <path fill="none" stroke="#9aa3ab" stroke-width="1.1" d="M-193 -84 L-193 -12 M-185.9 -84 L-185.9 -12 M-178.8 -84 L-178.8 -12 M-171.7 -84 L-171.7 -12 M-164.6 -84 L-164.6 -12 M-157.5 -84 L-157.5 -12 M-150.4 -84 L-150.4 -12 M-143.3 -84 L-143.3 -12 M-136.2 -84 L-136.2 -12 M-129.1 -84 L-129.1 -12 M-122 -84 L-122 -12 M-114.9 -84 L-114.9 -12"/>
        <path fill="none" stroke="#8d95a3" stroke-width="1.8" d="M-198 -64 L-114 -64 M-198 -32 L-114 -32"/>
        <rect fill="none" stroke="#2b1b16" stroke-width="5.6" x="-200" y="-86" width="88" height="76" rx="3"/>
        <rect fill="none" stroke="#b9bec6" stroke-width="2.4" x="-200" y="-86" width="88" height="76" rx="3"/>
        <!-- a board in red and white, cable-tied on -->
        <rect class="o" style="stroke-width:2.4" fill="#ffffff" x="-190" y="-60" width="68" height="12" rx="1.5"/>
        <path class="n" fill="#e5283f" d="M-188.6 -58.6 L-180 -58.6 L-186 -49.4 L-188.6 -49.4 Z M-170 -58.6 L-158 -58.6 L-164 -49.4 L-176 -49.4 Z M-148 -58.6 L-136 -58.6 L-142 -49.4 L-154 -49.4 Z M-126 -58.6 L-123.4 -58.6 L-123.4 -49.4 L-132 -49.4 Z"/>
    </g>
    <!-- a sign: mind your head -->
    <rect class="o" style="stroke-width:2.4" fill="#ffd23a" x="-276" y="-76" width="24" height="24" rx="3"/>
    <path fill="none" stroke="#2b1b16" stroke-width="3.4" stroke-linecap="round" d="M-264 -70.6 L-264 -62.6 M-264 -57.2 L-264 -57"/>
    <!-- concrete feet -->
    <path class="o" style="stroke-width:2.4" fill="#b9bec6" d="M-306 -11 L-282 -11 L-280 0 L-308 0 Z M-214 -11 L-190 -11 L-188 0 L-216 0 Z M-124 -11 L-104 -11 L-102 0 L-126 0 Z"/>
    <!-- and a cone -->
    <path class="o" style="stroke-width:2.4" fill="#f0791c" d="M-100 -5 L-96.6 -34 L-91.4 -34 L-88 -5 Z"/>
    <path class="n" fill="#ffffff" d="M-98 -17 L-90 -17 L-90.8 -24 L-97.2 -24 Z"/>
    <rect class="o" style="stroke-width:2.4" fill="#f0791c" x="-105" y="-5" width="22" height="5" rx="1.5"/>
