    <path class="o" style="stroke-width:2" fill="#8d95a3" d="M-198 -174 L-194 -174 L-194 -142 L-198 -142 Z M-106 -174 L-102 -174 L-102 -142 L-106 -142 Z"/>
    <rect class="o" style="stroke-width:2.4" fill="#d5d8de" x="-290" y="-178" width="280" height="6" rx="2.5"/>

    <!-- floor slabs and the roof edge -->
    <rect class="o" fill="#d5d8de" x="-300" y="-292" width="300" height="10"/>
    <rect class="o" fill="#d5d8de" x="-300" y="-142" width="300" height="10"/>
    <rect class="o" fill="#d5d8de" x="-302" y="-450" width="304" height="12"/>
    <path class="n" fill="#e6b422" d="M-300.5 -444.6 L0.5 -444.6 L0.5 -442.4 L-300.5 -442.4 Z"/>

    <!-- the lobby: a desk nobody sits at, a plant that is rented, lamps -->
    <rect class="o" fill="#a9dde2" x="-290" y="-124" width="186" height="116"/>
    <path class="n" fill="#c6eaee" d="M-290 -124 L-228 -124 L-228 -8 L-290 -8 Z"/>
    <path fill="none" stroke="#2b1b16" stroke-width="1.6" d="M-262 -124 L-262 -108 M-200 -124 L-200 -104 M-146 -124 L-146 -108"/>
    <path class="o" style="stroke-width:2" fill="#e6b422" d="M-268 -108 L-256 -108 L-258 -100 L-266 -100 Z M-207 -104 L-193 -104 L-195.4 -95 L-204.6 -95 Z M-152 -108 L-140 -108 L-142 -100 L-150 -100 Z"/>
