    <path class="n" fill="#ffffff" fill-opacity="0.16" d="M-200 -432 L-160 -432 L-226 -292 L-266 -292 Z M-70 -432 L-54 -432 L-120 -292 L-136 -292 Z"/>
    <path fill="none" stroke="#2f7d8a" stroke-width="2.4" d="M-220 -432 L-220 -292 M-150 -432 L-150 -292 M-80 -432 L-80 -292 M-290 -362 L-10 -362"/>
    <rect fill="none" stroke="#2b1b16" stroke-width="3" x="-290" y="-432" width="280" height="140"/>
    <!-- a box ball, a balustrade -->
    <rect class="o" style="stroke-width:2.4" fill="#8d95a3" x="-56" y="-312" width="26" height="20"/>
    <circle class="o" style="stroke-width:2.4" fill="#6fb35f" cx="-43" cy="-324" r="14"/>
    <path class="n" fill="#8fcf80" d="M-52 -328 Q-49 -335.6 -41 -335.6 Q-46.4 -332 -47.6 -325.6 Z"/>
    <rect class="n" fill="#ffffff" fill-opacity="0.24" x="-288" y="-322" width="276" height="30"/>
    <path class="n" fill="#ffffff" fill-opacity="0.3" d="M-250 -322 L-236 -322 L-252 -292 L-266 -292 Z M-120 -322 L-112 -322 L-128 -292 L-136 -292 Z"/>
    <path class="o" style="stroke-width:2" fill="#8d95a3" d="M-198 -324 L-194 -324 L-194 -292 L-198 -292 Z M-106 -324 L-102 -324 L-102 -292 L-106 -292 Z"/>
    <rect class="o" style="stroke-width:2.4" fill="#d5d8de" x="-290" y="-328" width="280" height="6" rx="2.5"/>

    <!-- lower terrace -->
    <rect class="o" fill="#3f97a4" x="-290" y="-282" width="280" height="140"/>
    <path class="n" fill="#56aab5" d="M-220 -282 L-150 -282 L-150 -212 L-220 -212 Z M-80 -212 L-10 -212 L-10 -142 L-80 -142 Z"/>
    <path class="n" fill="#ffffff" fill-opacity="0.16" d="M-130 -282 L-90 -282 L-156 -142 L-196 -142 Z M-262 -282 L-246 -282 L-290 -188 L-290 -222 Z"/>
