<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -136 110 142" data-rig="humanoid">
  <title>De brandkast: de kassier duwt de kluis op een steekwagen voor zich uit en kijkt er net overheen</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .k { stroke: #2b1b16; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <g id="hips" transform="translate(-27 -38)"/>

  <!-- The far arm goes over the top of the safe; all you see of it there is his fingers. -->
  <g id="arm_back" data-parent="torso" transform="translate(-23 -80)">
    <path class="o" fill="#8f979c" d="M-3 -5 L17 -17 L21 -10 L1 5 Q-4 5 -5.4 0 Q-5.6 -3.4 -3 -5 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-32 -38)">
    <path class="o" fill="#1d1a1c" d="M-5.5 33 L5 33 Q12 33.5 13 37 L13 38 L-6 38 Z"/>
    <path class="o" fill="#2c323c" d="M-6 -3 L6 -3 L5.4 33.5 L-5.4 33.5 Z"/>
  </g>
  <g id="leg_front" data-parent="hips" transform="translate(-22 -38)">
    <path class="o" fill="#2b2326" d="M-5.5 33 L5 33 Q12 33.5 13 37 L13 38 L-6 38 Z"/>
    <path class="n" fill="#6b6266" d="M5 34.6 Q9.4 34.6 10.8 36.4 L6 36 Z"/>
    <path class="o" fill="#3d4450" d="M-6 -3 L6 -3 L5.4 33.5 L-5.4 33.5 Z"/>
    <path class="t" style="stroke:#2c323c;stroke-width:1.4" d="M0.2 2 L0.2 31"/>
  </g>

  <!-- A long grey dustcoat, buttoned to the top, pens in the pocket. He leans into the load. -->
  <g id="torso" data-parent="hips" transform="translate(-27 -40)">
    <g transform="rotate(9)">
      <path class="o" fill="#a9b0b4" d="M-14 15 Q-16.5 -16 -13.5 -37 Q-10.5 -45 0 -45 Q10.5 -45 13.5 -37 Q16.5 -16 14.5 15 Z"/>
      <path class="n" fill="#8f979c" d="M-12.8 13.8 Q-15 -16 -12.4 -36 Q-8.6 -20 -8 13.8 Z"/>
      <path class="t" style="stroke:#6f777c;stroke-width:1.4" d="M8.4 -42 L10 14"/>
      <circle class="n" fill="#2b1b16" cx="10.8" cy="-30" r="1.2"/>
      <circle class="n" fill="#2b1b16" cx="11.4" cy="-16" r="1.2"/>
      <circle class="n" fill="#2b1b16" cx="12" cy="-2" r="1.2"/>
      <path class="k" fill="#fffdf5" d="M1 -45.4 L10 -44 L7.4 -37.4 Z"/>
      <path class="k" fill="#2b1b16" d="M5.4 -44 L8 -43.6 L7.6 -38.6 L5.8 -40 Z"/>
      <path class="k" fill="#8f979c" d="M-9 -24 L1 -24 L1 -15 Q-4 -13 -9 -15 Z"/>
      <path class="k" style="stroke-width:1" fill="#d9342b" d="M-6.6 -23.6 L-6.6 -28.6 Q-5.6 -30 -4.6 -28.6 L-4.6 -23.6 Z"/>
      <path class="k" style="stroke-width:1" fill="#26365c" d="M-3.4 -23.6 L-3.4 -28.6 Q-2.4 -30 -1.4 -28.6 L-1.4 -23.6 Z"/>
    </g>
  </g>

  <!-- His head, behind the safe: a green eyeshade, round glasses, two worried eyes. The rest stays out of sight. -->
  <g id="head" data-parent="torso" transform="translate(-19 -84)">
    <rect class="o" fill="#dba27f" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#efc09a" cx="4" cy="-21" rx="17" ry="17"/>
    <path class="o" style="stroke-width:1.8" fill="#c4c2bb" d="M-3 -26 Q-9 -29 -12.6 -24 Q-13.6 -15 -10 -8.6 Q-6.4 -6.6 -4.4 -9 Q-2.6 -16 -3 -26 Z"/>
    <ellipse class="o" style="stroke-width:1.8" fill="#efc09a" cx="-2.6" cy="-17" rx="3" ry="3.8"/>
    <path class="t" style="stroke:#8f8d88;stroke-width:1.3" d="M-9 -33 Q0 -39.6 12 -36"/>
    <path class="t" style="stroke-width:1.5" d="M7.4 -27.4 L13.6 -28.4 M16.4 -28.2 L20.4 -27.2"/>
    <circle class="k" style="stroke-width:1.5" fill="#fffdf5" cx="11" cy="-21" r="4.6"/>
    <circle class="k" style="stroke-width:1.5" fill="#fffdf5" cx="19" cy="-21" r="4"/>
    <path class="t" style="stroke-width:1.3" d="M6.4 -21.4 L-1 -19.6"/>
    <circle class="n" fill="#2b1b16" cx="12.4" cy="-20.6" r="1.7"/>
    <circle class="n" fill="#2b1b16" cx="20" cy="-20.6" r="1.5"/>
    <path class="o" fill="#efc09a" d="M20.6 -17.4 Q25.2 -14.6 20.6 -12.2"/>
    <path class="t" style="stroke-width:1.6" d="M11 -8.6 Q14 -9.8 17 -8.4"/>
    <!-- the eyeshade -->
    <path class="t" style="stroke-width:3.4" d="M-12.6 -27.4 Q3 -36 20 -31.6"/>
    <path class="t" style="stroke:#3a3a44;stroke-width:1.6" d="M-12.6 -27.4 Q3 -36 20 -31.6"/>
    <path class="o" style="stroke-width:1.8" fill="#3fb86a" fill-opacity="0.9" d="M8 -34.6 Q19 -35.6 28.6 -29.4 Q30.6 -27 28 -26 Q19 -30.6 9.4 -30.4 Z"/>
    <path class="n" fill="#a8e6b0" d="M12 -33.4 Q18 -33.4 23 -30.6 Q17.4 -31.8 12.6 -31.8 Z"/>
  </g>

  <!-- The sack truck: red tube, a toe plate under the safe. Joint at the axle, so it tips back to roll. -->
  <g id="truck" transform="translate(-12 -9)">
    <g transform="translate(12 9)">
      <rect class="k" fill="#8a8f93" x="-14" y="-3" width="54" height="3" rx="1"/>
      <path class="t" style="stroke-width:6.6" d="M-12 -9 L-12 -66 Q-12 -73 -17 -73"/>
      <path class="t" style="stroke:#c0392b;stroke-width:3.6" d="M-12 -9 L-12 -66 Q-12 -73 -17 -73"/>
      <path class="t" style="stroke-width:6.6" d="M-21 -73 L-15 -73"/>
      <path class="k" fill="#c0392b" d="M-14.4 -12 L-9.6 -12 L-8 -3 L-13 -3 Z"/>
    </g>
  </g>

  <g id="wheel" data-parent="truck" transform="translate(-12 -9)">
    <circle class="o" fill="#1d1a1c" cx="0" cy="0" r="9"/>
    <path class="t" style="stroke:#8a8f93;stroke-width:1.6" d="M0 -7.2 L0 -5 M0 5 L0 7.2 M-7.2 0 L-5 0 M5 0 L7.2 0"/>
    <circle class="k" fill="#c0392b" cx="0" cy="0" r="4.2"/>
    <circle class="n" fill="#2b1b16" cx="0" cy="0" r="1.3"/>
  </g>

  <!-- The safe: dark green steel, brass corners. Inside (you only see it when the door is open): nothing but a cobweb. Joint under its middle. -->
  <g id="safe" data-parent="truck" transform="translate(15 -3)">
    <g transform="translate(-15 3)">
      <rect class="k" fill="#16382c" x="-5" y="-6.4" width="9" height="3.6"/>
      <rect class="k" fill="#16382c" x="26" y="-6.4" width="9" height="3.6"/>
      <rect class="o" fill="#1f4a3a" x="-8" y="-98" width="46" height="92.4" rx="3"/>
      <path class="t" style="stroke:#3f7a66;stroke-width:1.4" d="M-5.4 -88 L-5.4 -95.4 L28 -95.4"/>
      <rect class="k" style="stroke-width:1.6" fill="#0e1614" x="-3.4" y="-91" width="36.8" height="80" rx="1.5"/>
      <path class="t" style="stroke:#24332e;stroke-width:1.6" d="M-2.6 -62 L32.6 -62 M-2.6 -36 L32.6 -36"/>
      <path class="t" style="stroke:#8a938f;stroke-width:0.8" d="M32.6 -90.2 L21 -79 M32.6 -84 Q27 -85 25 -90.2 M32.6 -77 Q23 -79.6 19 -90.2"/>
      <rect class="k" fill="#e6b422" x="-7.4" y="-81" width="5.4" height="9.6" rx="1.6"/>
      <rect class="k" fill="#e6b422" x="-7.4" y="-30" width="5.4" height="9.6" rx="1.6"/>
      <path class="k" fill="#e6b422" d="M-8 -95 Q-8 -98 -5 -98 L5 -98 L-8 -85 Z M38 -95 Q38 -98 35 -98 L25 -98 L38 -85 Z M-8 -8.6 Q-8 -5.6 -5 -5.6 L5 -5.6 L-8 -18.6 Z M38 -8.6 Q38 -5.6 35 -5.6 L25 -5.6 L38 -18.6 Z"/>
      <path class="n" fill="#8a6a1c" d="M-5.6 -94.6 a1 1 0 1 0 2 0 a1 1 0 1 0 -2 0 M33.6 -94.6 a1 1 0 1 0 2 0 a1 1 0 1 0 -2 0 M-5.6 -9 a1 1 0 1 0 2 0 a1 1 0 1 0 -2 0 M33.6 -9 a1 1 0 1 0 2 0 a1 1 0 1 0 -2 0"/>
    </g>
  </g>

  <!-- What lives in it. Drawn before the door, so you only see it when the door is open. -->
  <g id="moth" data-parent="safe" transform="translate(22 -52)">
    <path class="k" style="stroke-width:0.9" fill="#e3d6b0" d="M0 -1 Q-7.6 -7 -7 0.6 Q-4.4 3.4 0 1 Z M0 -1 Q7.6 -7 7 0.6 Q4.4 3.4 0 1 Z"/>
    <ellipse class="n" fill="#6b5b4b" cx="0" cy="0" rx="1.2" ry="2.8"/>
  </g>

  <!-- The door, hinged on his side. Joint on the hinge line; it opens by getting narrower. -->
  <g id="door" data-parent="safe" transform="translate(-3.4 -51)">
    <g transform="translate(3.4 51)">
      <rect class="o" style="stroke-width:2" fill="#2a5d49" x="-3.4" y="-91" width="36.8" height="80" rx="1.5"/>
      <rect class="t" style="stroke:#1f4a3a;stroke-width:1.4" x="0.8" y="-86.8" width="28.4" height="71.6" rx="1"/>
      <path class="t" style="stroke:#4f8f78;stroke-width:1.2" d="M2.6 -85 L27.4 -85 M2.6 -85 L2.6 -18"/>
      <!-- the maker's plate: pinstripes, like everything else here -->
      <ellipse class="k" fill="#e6b422" cx="15" cy="-78.4" rx="7.4" ry="3.6"/>
      <path fill="none" stroke="#b98a1c" stroke-width="1" stroke-linecap="round" d="M11.4 -80 L11.4 -76.8 M13.8 -80.6 L13.8 -76.2 M16.2 -80.6 L16.2 -76.2 M18.6 -80 L18.6 -76.8"/>
      <path class="n" fill="#e6b422" d="M15 -67.6 L12.6 -71.6 L17.4 -71.6 Z"/>
    </g>
  </g>

  <!-- The combination dial. Joint in its middle. -->
  <g id="dial" data-parent="door" transform="translate(15 -57)">
    <circle class="o" style="stroke-width:1.8" fill="#d5dcd8" cx="0" cy="0" r="9.4"/>
    <circle fill="none" stroke="#2b1b16" stroke-width="2.2" stroke-dasharray="1 2.77" cx="0" cy="0" r="7.2"/>
    <circle class="k" fill="#3a3a44" cx="0" cy="0" r="4.4"/>
    <path fill="none" stroke="#fffdf5" stroke-width="1.5" stroke-linecap="round" d="M0 -0.6 L0 -3.6"/>
  </g>

  <!-- The handle: three spokes, as on a vault. Joint at the hub. -->
  <g id="handle" data-parent="door" transform="translate(15 -32)">
    <path class="t" style="stroke-width:4.4" d="M0 0 L0 -9 M0 0 L7.8 4.5 M0 0 L-7.8 4.5"/>
    <path class="t" style="stroke:#e6b422;stroke-width:2.2" d="M0 0 L0 -9 M0 0 L7.8 4.5 M0 0 L-7.8 4.5"/>
    <circle class="k" fill="#f0c53a" cx="0" cy="-9" r="2.3"/>
    <circle class="k" fill="#f0c53a" cx="7.8" cy="4.5" r="2.3"/>
    <circle class="k" fill="#f0c53a" cx="-7.8" cy="4.5" r="2.3"/>
    <circle class="k" fill="#e6b422" cx="0" cy="0" r="3.2"/>
  </g>

  <!-- The fingers of his far hand, over the top edge. -->
  <g id="fingers" data-parent="safe" transform="translate(18 -98)">
    <path class="k" fill="#efc09a" d="M-6.8 1 L-6.8 -2.8 Q-6.8 -4.8 -5.1 -4.8 Q-3.4 -4.8 -3.4 -2.8 L-3.4 1 Z M-3.4 1 L-3.4 -3.4 Q-3.4 -5.4 -1.7 -5.4 Q0 -5.4 0 -3.4 L0 1 Z M0 1 L0 -3.4 Q0 -5.4 1.7 -5.4 Q3.4 -5.4 3.4 -3.4 L3.4 1 Z M3.4 1 L3.4 -2.8 Q3.4 -4.8 5.1 -4.8 Q6.8 -4.8 6.8 -2.8 L6.8 1 Z"/>
  </g>

  <!-- The near arm: a sleeve garter above the elbow, his hand on the grip of the truck. Joint at the shoulder. -->
  <g id="arm_front" data-parent="torso" transform="translate(-17 -78)">
    <path class="o" fill="#a9b0b4" d="M-10.6 9.6 L-1.4 1.8 L3.2 8.4 L-6.6 18.2 Z"/>
    <path class="k" fill="#fffdf5" d="M-2.8 2.9 L-0.4 1.3 L4.2 7.9 L1.8 9.5 Z"/>
    <circle class="o" style="stroke-width:1.8" fill="#efc09a" cx="2.8" cy="5.2" r="4.2"/>
    <path class="o" fill="#a9b0b4" d="M-5.6 -3.6 Q0 -7.4 5.4 -3.4 L-0.8 16.6 Q-6 20.4 -11.6 16 Z"/>
    <path class="k" fill="#2b1b16" d="M-7.6 3.6 L2.6 6.6 L1.8 9.6 L-8.6 6.6 Z"/>
    <circle class="n" fill="#f0c53a" cx="-2.4" cy="6.6" r="1.2"/>
  </g>
</svg>
