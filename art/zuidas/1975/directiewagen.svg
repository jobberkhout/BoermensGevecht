<svg xmlns="http://www.w3.org/2000/svg" viewBox="-126 -104 256 110" data-rig="vehicle">
  <title>De directiewagen: lang, zwart, met chauffeur; de directie zit achterin in de rook</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="chassis" transform="translate(0 0)"/>

  <!-- What you see through the windows: oxblood leather and a steering wheel. -->
  <g id="interior" data-parent="body" transform="translate(0 -40)">
    <g transform="translate(0 40)">
      <path class="n" fill="#4a1c24" d="M-52 -45.5 L-47 -65 L20 -65 L25 -62.5 L39 -45.5 Z"/>
      <path class="n" fill="#7a2f38" d="M-52 -44 L-52 -57 Q-52 -61 -47 -61 L-44 -61 L-44 -44 Z M-6 -44 L-6 -58 Q-6 -61.5 -1.5 -61.5 L2 -61.5 L3 -44 Z"/>
      <path class="t" style="stroke-width:2.6" d="M27.5 -53.5 Q32.5 -51 31.5 -45"/>
    </g>
  </g>

  <!-- The chauffeur: cap, gloves, eyes on the road. Joint at his collar. -->
  <g id="driver" data-parent="body" transform="translate(12 -48)">
    <g transform="translate(-12 48)">
      <path class="o" style="stroke-width:2" fill="#5a6470" d="M3 -43 Q3 -50.5 9 -50.5 L16 -50.5 Q21 -50.5 22 -43 Z"/>
      <path class="o" style="stroke-width:1.5" fill="#5a6470" d="M17 -49.6 L26 -52.8 L27.2 -49.8 L18.4 -46 Z"/>
      <circle class="o" style="stroke-width:1.5" fill="#fffdf5" cx="27.8" cy="-51.4" r="2.6"/>
      <path class="n" fill="#fffdf5" d="M10 -50.4 L16 -50.4 L14.6 -48 L11.2 -48 Z"/>
      <circle class="o" style="stroke-width:2" fill="#efc09a" cx="12.5" cy="-55.6" r="6.3"/>
      <path class="o" style="stroke-width:1.6" fill="#efc09a" d="M18.2 -56.6 Q21.2 -55.4 18.4 -53.8"/>
      <circle class="n" fill="#2b1b16" cx="15.6" cy="-56.6" r="1.05"/>
      <path class="t" style="stroke-width:1.2" d="M14.6 -52.4 L17.4 -52.6"/>
      <path class="o" style="stroke-width:1.8" fill="#5a6470" d="M5.8 -59.2 Q4.4 -65.8 12 -66.2 Q20.6 -66.4 19.6 -60.4 Z"/>
      <path class="o" style="stroke-width:1.6" fill="#2a2f3a" d="M6 -59.6 L19.6 -60.9 L19.7 -58.7 L6.3 -57.3 Z"/>
      <path class="o" style="stroke-width:1.6" fill="#1d1a1c" d="M18.8 -60.7 Q23.8 -60.5 24.8 -58.5 Q21.4 -57.9 18.9 -58.6 Z"/>
      <circle class="n" fill="#f0c53a" cx="16.6" cy="-62.8" r="1.05"/>
    </g>
  </g>

  <!-- The back seat: a cloud with a hat in it. Joint in the middle of the cloud. -->
  <g id="smoke" data-parent="body" transform="translate(-33 -55)">
    <g transform="translate(33 55)">
      <path class="n" fill="#a39f95" d="M-41.5 -60.4 Q-41.5 -65.4 -36 -65.4 Q-30.5 -65.4 -30.5 -60.4 L-27.4 -60.4 L-27.4 -59 L-30.6 -59 Q-28.4 -56.2 -28.8 -53.6 L-26.4 -52.4 L-28.8 -51.2 Q-29.2 -48.4 -33 -47.6 L-37 -44 L-45 -44 L-41 -49 L-41 -59 L-44.6 -59 L-44.6 -60.4 Z"/>
      <circle class="n" fill="#dcd9d0" fill-opacity="0.82" cx="-44" cy="-52" r="7.5"/>
      <circle class="n" fill="#dcd9d0" fill-opacity="0.82" cx="-37" cy="-58" r="8"/>
      <circle class="n" fill="#e8e5dd" fill-opacity="0.8" cx="-27" cy="-55" r="8"/>
      <circle class="n" fill="#dcd9d0" fill-opacity="0.8" cx="-20" cy="-59" r="6"/>
      <circle class="n" fill="#e8e5dd" fill-opacity="0.8" cx="-33" cy="-49" r="6.5"/>
      <circle class="n" fill="#dcd9d0" fill-opacity="0.8" cx="-19" cy="-49.5" r="5"/>
      <path fill="none" stroke="#b3afa5" stroke-width="1.3" stroke-linecap="round" d="M-45 -54 q4 -4.4 8 0 M-31 -60 q3.6 -3.6 7.2 0 M-25 -50.5 q3 -3 6 0"/>
    </g>
  </g>

  <!-- The cigar that makes it. Joint where the cloud holds it. -->
  <g id="cigar" data-parent="body" transform="translate(-26 -52.4)">
    <path class="t" style="stroke-width:5.4" d="M0 0 L9.5 -1.4"/>
    <path fill="none" stroke="#6b3a1e" stroke-width="3" stroke-linecap="round" d="M0 0 L9.5 -1.4"/>
    <path fill="none" stroke="#c9c9d2" stroke-width="3" d="M8 -1.2 L9.8 -1.45"/>
  </g>
  <g id="glow" data-parent="cigar" transform="translate(-15.6 -54)">
    <circle class="n" fill="#ff7a1f" cx="0" cy="0" r="2.5"/>
    <circle class="n" fill="#ffd21f" cx="0.3" cy="0" r="1.2"/>
  </g>

  <!-- The radio aerial on the rear wing. Joint at its foot. -->
  <g id="aerial" data-parent="body" transform="translate(-78 -44)">
    <path class="t" style="stroke-width:3.4" d="M0 0 L-0.6 -3"/>
    <path class="t" style="stroke:#8b9690;stroke-width:1.3" d="M0 -2 L-5 -30"/>
    <circle class="n" fill="#2b1b16" cx="-5.1" cy="-30.4" r="1.3"/>
  </g>

  <!-- The car. Joint in the middle; the art inside is drawn in whole-car coordinates. -->
  <g id="body" data-parent="chassis" transform="translate(0 -40)">
    <g transform="translate(0 40)">
      <!-- glass over whatever is inside -->
      <path class="n" fill="#cfe9f2" fill-opacity="0.25" d="M-51 -47 L-46 -64 L-10.5 -64 L-10.5 -47 Z M-5.5 -47 L-5.5 -64 L19 -64 Q22.5 -64 24.5 -61.5 L38 -47 Z"/>
      <path class="n" fill="#ffffff" fill-opacity="0.4" d="M3 -63 L8 -63 L1 -48 L-3 -48 Z M-43 -63 L-39.5 -63 L-45.5 -48 L-48.4 -48 Z"/>
      <!-- chrome: bumpers, exhaust -->
      <rect class="o" style="stroke-width:1.8" fill="#8a8f93" x="-102" y="-14.5" width="12" height="4" rx="1.6"/>
      <rect class="o" fill="#d5dcd8" x="-99.5" y="-26" width="11" height="8.5" rx="2.6"/>
      <rect class="o" fill="#d5dcd8" x="88.5" y="-26" width="11" height="8.5" rx="2.6"/>
      <!-- the roof and its pillars; the windows are holes -->
      <path class="o" fill="#23252b" fill-rule="evenodd" d="M-63 -43 L-54 -64.5 Q-52 -69.5 -45.5 -69.5 L20 -69.5 Q25.6 -69.5 28.8 -65.4 L48.5 -43 Z M-51 -47 L-46 -64 L-10.5 -64 L-10.5 -47 Z M-5.5 -47 L-5.5 -64 L19 -64 Q22.5 -64 24.5 -61.5 L38 -47 Z"/>
      <path fill="none" stroke="#4d515c" stroke-width="1.6" stroke-linecap="round" d="M-45 -67 L19.5 -67"/>
      <!-- long bonnet, long boot -->
      <path class="o" fill="#23252b" d="M-93 -15 L-93 -37 Q-93 -43 -87 -43.5 L-58 -45.5 L46 -45.5 L85 -42.7 Q93 -41.7 93 -36 L93 -15 Q93 -12 90 -12 L-90 -12 Q-93 -12 -93 -15 Z"/>
      <path class="n" fill="#3f434d" d="M-89 -40.7 L-58 -42.8 L46 -42.8 L85 -40.1 Q89.4 -39.5 89.8 -37.5 L46 -40.2 L-58 -40.2 L-89.6 -38.1 Z"/>
      <path class="n" fill="#17181c" d="M-92 -19 L92 -19 L92 -15 Q92 -13 90 -13 L-90 -13 Q-92 -13 -92 -15 Z"/>
      <path fill="none" stroke="#c9ced2" stroke-width="1.7" stroke-linecap="round" d="M-91 -27.5 L91 -27.5"/>
      <!-- doors and handles -->
      <path class="t" style="stroke:#0f1013;stroke-width:1.4" d="M-8 -45 L-8 -13.5 M41 -45 L42.5 -13.5 M-55 -45 L-53.5 -36 Q-47 -33 -41.5 -24"/>
      <rect class="o" style="stroke-width:1.3" fill="#d5dcd8" x="-22" y="-40.6" width="8.5" height="3" rx="1.4"/>
      <rect class="o" style="stroke-width:1.3" fill="#d5dcd8" x="24" y="-40.6" width="8.5" height="3" rx="1.4"/>
      <ellipse class="o" style="stroke-width:1.6" fill="#d5dcd8" cx="43" cy="-48" rx="3.6" ry="2.6"/>
      <!-- lights -->
      <rect class="o" style="stroke-width:1.8" fill="#fff3b0" x="87" y="-40.5" width="6.4" height="9.5" rx="1.6"/>
      <rect class="o" style="stroke-width:1.4" fill="#ff9a3d" x="88.6" y="-30" width="4.8" height="3.6" rx="1"/>
      <rect class="o" style="stroke-width:1.8" fill="#d9342b" x="-93.4" y="-40.5" width="5.6" height="10.5" rx="1.4"/>
      <!-- the pole for the house pennant -->
      <path class="t" style="stroke-width:3.2" d="M76 -43 L76 -61"/>
      <path class="t" style="stroke:#c9ced2;stroke-width:1.4" d="M76 -43 L76 -61"/>
      <!-- wheel arches -->
      <path class="o" fill="#121317" d="M-81 -12 A21 21 0 0 1 -39 -12 Z"/>
      <path class="o" fill="#121317" d="M43 -12 A21 21 0 0 1 85 -12 Z"/>
    </g>
  </g>

  <!-- The house pennant on the front wing: pinstripe with a gold stripe. Joint at the pole. -->
  <g id="pennant" data-parent="body" transform="translate(76 -61)">
    <path class="o" style="stroke-width:1.8" fill="#26365c" d="M0 -0.5 L-19 4 L0 9 Z"/>
    <path fill="none" stroke="#6f86ba" stroke-width="0.9" d="M-4 0.6 L-4 7.8 M-8.5 1.7 L-8.5 6.6 M-13 2.8 L-13 5.4"/>
    <path fill="none" stroke="#f0c53a" stroke-width="1.6" stroke-linecap="round" d="M-15.4 4.2 L-1.6 4.2"/>
  </g>

  <!-- Smoke that gets out through the top of the rear window. Joint at the gap. -->
  <g id="puff_b" data-parent="body" transform="translate(-30 -66)">
    <path class="o" style="stroke-width:1.8" fill="#e8e5dd" d="M-16 -13 Q-19.5 -17 -15.5 -20 Q-14.5 -24.5 -9.5 -23.5 Q-5 -25 -3.5 -20.5 Q0 -18.5 -2.5 -14 Q-6 -11.5 -9.5 -13 Q-13 -11 -16 -13 Z"/>
  </g>
  <g id="puff_a" data-parent="body" transform="translate(-30 -66)">
    <path class="o" style="stroke-width:1.8" fill="#e8e5dd" d="M-7 0 Q-10 -3.6 -6.4 -6 Q-5.6 -10 -1 -9.2 Q3.4 -10.4 4.6 -6.4 Q8 -4.6 5.6 -0.6 Q2.4 1.6 -0.8 0.4 Q-4 2 -7 0 Z"/>
  </g>

  <!-- White-wall tyres. The hubcaps are not quite symmetrical, so the turning shows. -->
  <g id="wheel_back" data-parent="chassis" transform="translate(-60 -15)">
    <circle class="o" fill="#1d1a1c" cx="0" cy="0" r="15"/>
    <circle fill="none" stroke="#f4ecdc" stroke-width="1.8" cx="0" cy="0" r="10.6"/>
    <circle class="o" style="stroke-width:1.8" fill="#c9ced2" cx="0" cy="0" r="7.2"/>
    <circle class="n" fill="#8b9690" cx="0" cy="0" r="2.6"/>
    <path class="n" fill="#3a3d45" d="M-1.1 -6 L1.1 -6 L0.8 -3.6 L-0.8 -3.6 Z M4.6 3.9 L5.7 2 L3.6 1 L2.8 2.6 Z M-4.6 3.9 L-5.7 2 L-3.6 1 L-2.8 2.6 Z"/>
    <circle class="n" fill="#8b9690" cx="9" cy="-9" r="1.2"/>
  </g>
  <g id="wheel_front" data-parent="chassis" transform="translate(64 -15)">
    <circle class="o" fill="#1d1a1c" cx="0" cy="0" r="15"/>
    <circle fill="none" stroke="#f4ecdc" stroke-width="1.8" cx="0" cy="0" r="10.6"/>
    <circle class="o" style="stroke-width:1.8" fill="#c9ced2" cx="0" cy="0" r="7.2"/>
    <circle class="n" fill="#8b9690" cx="0" cy="0" r="2.6"/>
    <path class="n" fill="#3a3d45" d="M-1.1 -6 L1.1 -6 L0.8 -3.6 L-0.8 -3.6 Z M4.6 3.9 L5.7 2 L3.6 1 L2.8 2.6 Z M-4.6 3.9 L-5.7 2 L-3.6 1 L-2.8 2.6 Z"/>
    <circle class="n" fill="#8b9690" cx="-9" cy="9" r="1.2"/>
  </g>
</svg>
