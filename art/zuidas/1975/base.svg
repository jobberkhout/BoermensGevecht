  <!-- The telex: the bar that types. Joint in its middle. -->
  <g id="carriage" data-parent="building" transform="translate(-224 -83)">
    <rect class="k" fill="#3a3a44" x="-9" y="-3" width="18" height="6" rx="1.6"/>
    <rect class="n" fill="#c9c9d2" x="-2" y="-2" width="4" height="4"/>
  </g>

  <!-- What it types: the day's prices on one endless strip, over the desk and down. Joint at the slot. -->
  <g id="tape" data-parent="building" transform="translate(-224 -86)">
    <path class="t" style="stroke-width:6.6" d="M0 0 Q0 -9 8 -9 Q20 -9 24 4 L30 31 Q31 35 36 33 Q42 30 46 34 Q49 37 54 34.6"/>
    <path fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M0 0 Q0 -9 8 -9 Q20 -9 24 4 L30 31 Q31 35 36 33 Q42 30 46 34 Q49 37 54 34.6"/>
    <path fill="none" stroke="#8a8272" stroke-width="1" stroke-dasharray="2.2 2" d="M1 -4 Q2 -8 8 -8 Q19 -8 23 4 L29 29"/>
  </g>

  <!-- Polished every morning. -->
  <g id="glint" data-parent="building" transform="translate(-128 -86)">
    <path stroke="#e6b422" stroke-width="1" stroke-linejoin="round" fill="#fffbe0" d="M0 -8 L1.8 -1.8 L8 0 L1.8 1.8 L0 8 L-1.8 1.8 L-8 0 L-1.8 -1.8 Z"/>
