<svg xmlns="http://www.w3.org/2000/svg" viewBox="-312 -596 328 602" data-rig="static">
  <title>Bankiershuis aan de Gouden Bocht: zandsteen, een koperen plaat en een telex achter het raam</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .k { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; }
    .j { stroke: #c2b497; stroke-width: 2; stroke-linecap: round; fill: none; }
  </style>

