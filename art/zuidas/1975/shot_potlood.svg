<svg xmlns="http://www.w3.org/2000/svg" viewBox="-19 -12 38 24" data-rig="static">
  <title>Een vlijmscherp potlood met een noteringsbriefje eraan</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <!-- Origin in the middle: it turns over and over on its way. -->
  <g id="pencil" transform="translate(0 0)">
    <path class="o" style="stroke-width:1.5" fill="#ff9ec4" d="M-7.4 -7 L-1.6 -7.6 L-0.4 6.4 L-6.2 7 Z"/>
    <path fill="none" stroke="#c9588a" stroke-width="1" stroke-linecap="round" d="M-5.8 -4.8 L-3 -5.1 M-4.8 4.6 L-2 4.3"/>
    <path class="t" style="stroke-width:5" d="M-15.5 0 L7 0"/>
    <path fill="none" stroke="#f0c53a" stroke-width="2.8" d="M-12 0 L7 0"/>
    <path fill="none" stroke="#c9c9d2" stroke-width="2.8" d="M-13.5 0 L-12 0"/>
    <path fill="none" stroke="#ff8f9a" stroke-width="2.8" stroke-linecap="round" d="M-15.5 0 L-13.5 0"/>
    <path class="o" style="stroke-width:1.3" fill="#e9dcc3" d="M6.8 -2.5 L17 0 L6.8 2.5 Z"/>
    <path class="n" fill="#2b1b16" d="M12.4 -1.15 L17.6 0 L12.4 1.15 Z"/>
  </g>
</svg>
