<svg xmlns="http://www.w3.org/2000/svg" viewBox="-46 -140 118 146" data-rig="humanoid">
  <title>De hoekman: staat in zijn hoek, maakt de prijs en gooit met potloden</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .p { stroke: #6f86ba; stroke-width: 1; stroke-linecap: round; fill: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm, upper half: held out in front of his chest. Joint at the shoulder. -->
  <g id="arm_back" data-parent="torso" transform="translate(-4 -72)">
    <g transform="rotate(11.8)">
      <path class="o" fill="#1c2947" d="M-4 -6 L22 -6.5 Q28.5 -6.5 28.5 0 Q28.5 6.5 22 6.5 L-4 6 Z"/>
    </g>
  </g>

  <!-- The pencil he is about to throw, with a price slip already on it. Joint in his fingers. -->
  <g id="prop" data-parent="throw" transform="translate(33 -88)">
    <path class="o" style="stroke-width:1.5" fill="#ff9ec4" d="M5.4 -7 L11.2 -7.6 L12.4 6.2 L6.6 6.8 Z"/>
    <path fill="none" stroke="#c9588a" stroke-width="1" stroke-linecap="round" d="M7 -4.8 L9.8 -5.1 M8 4.4 L10.8 4.1"/>
    <path class="t" style="stroke-width:5" d="M-7.5 1 L15.5 -1"/>
    <path fill="none" stroke="#f0c53a" stroke-width="2.8" d="M-4.2 0.7 L15.5 -1"/>
    <path fill="none" stroke="#c9c9d2" stroke-width="2.8" d="M-5.6 0.83 L-4.2 0.7"/>
    <path fill="none" stroke="#ff8f9a" stroke-width="2.8" stroke-linecap="round" d="M-7.5 1 L-5.6 0.83"/>
    <path class="o" style="stroke-width:1.3" fill="#e9dcc3" d="M15.3 -3.5 L25.5 -1.9 L15.7 1.5 Z"/>
    <path class="n" fill="#2b1b16" d="M21 -2.75 L26.3 -1.9 L21.3 -0.3 Z"/>
  </g>

  <!-- Forearm and hand: he aims like a darts player, little finger out. Joint at the elbow. -->
  <g id="throw" data-parent="arm_back" transform="translate(20 -67)">
    <path class="o" style="stroke-width:1.8" fill="#dba27f" d="M12.6 -24.4 L13.4 -31.6 Q15.4 -33.2 16.8 -31.2 L16.8 -24 Z"/>
    <g transform="rotate(-58.2)">
      <path class="o" fill="#1c2947" d="M0 -6 L17 -6 L17 6 L0 6 Q-6 6 -6 0 Q-6 -6 0 -6 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#fffdf5" d="M17 -5.4 L20.6 -5.4 L20.6 5.4 L17 5.4 Z"/>
      <circle class="n" fill="#f0c53a" cx="18.8" cy="2.6" r="1.1"/>
      <circle class="o" fill="#efc09a" cx="24.7" cy="0" r="4.6"/>
    </g>
    <circle data-mount="hand" fill="none" cx="22" cy="-21.6" r="1"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#1d1a1c" d="M-5.5 33 L5 33 Q12 33.5 13 37 L13 38 L-6 38 Z"/>
    <path class="o" fill="#1c2947" d="M-6 -3 L6 -3 L5.6 33.5 L-5.6 33.5 Z"/>
  </g>
  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#2b2326" d="M-5.5 33 L5 33 Q12 33.5 13 37 L13 38 L-6 38 Z"/>
    <path class="n" fill="#6b6266" d="M5 34.6 Q9.4 34.6 10.8 36.4 L6 36 Z"/>
    <path class="o" fill="#26365c" d="M-6 -3 L6 -3 L5.6 33.5 L-5.6 33.5 Z"/>
    <path class="p" d="M-2.2 0 L-2.2 31 M2.6 0 L2.6 31"/>
    <path class="t" style="stroke:#141f3a;stroke-width:1.4" d="M0.2 4 L0.2 31"/>
  </g>

  <!-- Three-piece suit. The waistcoat does the heavy lifting. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#ead9aa" d="M-2 -36 Q13 -36 19 -24 Q25.5 -10 22.5 2 Q19.5 9.5 8 9.5 L-4 9.5 Z"/>
    <path class="t" style="stroke:#b9a36a;stroke-width:1.4" d="M6.5 -8.5 L13.5 -7.6"/>
    <path class="t" style="stroke-width:1.4" d="M9.5 -30 Q19.5 -18 20 -4 Q19.6 4 16.8 9"/>
    <circle class="o" style="stroke-width:1.2" fill="#f0c53a" cx="12" cy="-24.6" r="1.6"/>
    <circle class="o" style="stroke-width:1.2" fill="#f0c53a" cx="16.6" cy="-15.6" r="1.6"/>
    <circle class="o" style="stroke-width:1.2" fill="#f0c53a" cx="18.4" cy="-5.6" r="1.6"/>
    <circle class="o" style="stroke-width:1.2" fill="#f0c53a" cx="17.2" cy="3.6" r="1.6"/>
    <!-- collar and bow tie -->
    <path class="o" style="stroke-width:1.6" fill="#fffdf5" d="M3.5 -38 L14 -37 L10 -29.5 Z"/>
    <path class="o" style="stroke-width:1.5" fill="#2f9e9a" d="M9.6 -33.6 L5 -37 L5 -30.4 Z M9.6 -33.6 L14.6 -36.6 L14.4 -30 Z"/>
    <circle class="o" style="stroke-width:1.3" fill="#3fb8a8" cx="9.6" cy="-33.6" r="1.7"/>
    <!-- the jacket, open, with the ammunition in the breast pocket -->
    <path class="o" fill="#26365c" d="M-17 9 Q-19.5 -14 -16.5 -30 Q-13.5 -37.5 -3 -37.5 L3.5 -37 Q8 -24 6 -8 Q5 2 2 9 Z"/>
    <path class="p" d="M-14.4 -17 L-15 7 M-10 -17 L-10.8 7 M-5.6 -6 L-6.2 7 M-1 -10 L-1.8 7"/>
    <path class="o" style="stroke-width:1.8" fill="#34497a" d="M3.5 -37 L-3.5 -37.5 L-8 -29 L5.9 -15 Q7.6 -26 3.5 -37 Z"/>
    <path class="o" style="stroke-width:1.1" fill="#f0c53a" d="M-15.7 -20.5 L-15.7 -27 L-14.6 -30.4 L-13.5 -27 L-13.5 -20.5 Z"/>
    <path class="o" style="stroke-width:1.1" fill="#d9534f" d="M-13.2 -20.5 L-13.2 -28.4 L-12.1 -31.8 L-11 -28.4 L-11 -20.5 Z"/>
    <path class="o" style="stroke-width:1.1" fill="#3fb8a8" d="M-10.7 -20.5 L-10.7 -27 L-9.6 -30.4 L-8.5 -27 L-8.5 -20.5 Z"/>
    <path class="n" fill="#2b1b16" d="M-15.1 -28.8 L-14.6 -30.6 L-14.1 -28.8 Z M-12.6 -30.2 L-12.1 -32 L-11.6 -30.2 Z M-10.1 -28.8 L-9.6 -30.6 L-9.1 -28.8 Z"/>
    <path class="o" style="stroke-width:1.4" fill="#34497a" d="M-16.8 -20.8 L-7.4 -21.2 L-7.4 -18.6 L-16.8 -18.2 Z"/>
  </g>

  <!-- His watch chain, from a waistcoat button to the pocket. Joint at the button. -->
  <g id="chain" data-parent="torso" transform="translate(16.6 -55.6)">
    <path fill="none" stroke="#2b1b16" stroke-width="3" stroke-linecap="round" d="M0 0 Q-1.5 9.5 -8.6 6.6"/>
    <path fill="none" stroke="#f0c53a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1.6 1.2" d="M0 0 Q-1.5 9.5 -8.6 6.6"/>
    <circle class="o" style="stroke-width:1.4" fill="#f0c53a" cx="-9.6" cy="7.6" r="2.7"/>
    <circle class="n" fill="#fffbe0" cx="-10.2" cy="7" r="1"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#dba27f" x="-5" y="-7" width="11" height="10" rx="2"/>
    <ellipse class="o" fill="#efc09a" cx="2" cy="-20.5" rx="18.5" ry="17"/>
    <path fill="none" stroke="#c98a6a" stroke-width="1.3" stroke-linecap="round" d="M-1 -7.6 Q4.5 -4.4 10.5 -5.2"/>
    <!-- what is left of his hair, and three strands combed over the rest -->
    <path class="o" fill="#c4c2bb" d="M-5 -25.5 Q-12 -29 -16.3 -24 Q-17.6 -14 -13.5 -7.6 Q-9 -5.2 -6.5 -8 Q-4.5 -15 -5 -25.5 Z"/>
    <path class="t" style="stroke:#8f8d88;stroke-width:1.3" d="M-14 -29.5 Q-2 -40 11.5 -34.6 M-12 -32.4 Q-1 -41 9 -36.6 M-15.6 -26.4 Q-4 -37.4 13.6 -32"/>
    <ellipse class="o" style="stroke-width:1.8" fill="#efc09a" cx="-4.6" cy="-16.4" rx="3" ry="3.8"/>
    <path class="t" style="stroke-width:1.1" d="M-5.5 -17.8 Q-3.5 -16.8 -4.9 -14.8"/>
    <!-- one more behind his ear -->
    <path class="t" style="stroke-width:4.6" d="M-13.8 -18.6 L2.2 -24.4"/>
    <path fill="none" stroke="#d9534f" stroke-width="2.3" stroke-linecap="round" d="M-13.8 -18.6 L2.2 -24.4"/>
    <path class="o" style="stroke-width:1.1" fill="#e9dcc3" d="M1.8 -25.7 L7 -26.2 L2.7 -23.1 Z"/>
    <path class="n" fill="#2b1b16" d="M5.2 -26 L7.3 -26.3 L5.7 -24.9 Z"/>
    <!-- he looks over his half-moon glasses, one eye shut to aim -->
    <path fill="none" stroke="#8f8d88" stroke-width="3" stroke-linecap="round" d="M5.4 -28.6 L11.8 -29.6 M15.4 -29.4 L20 -27.8"/>
    <circle class="n" fill="#2b1b16" cx="9.2" cy="-23.4" r="1.8"/>
    <path class="t" style="stroke-width:1.8" d="M14.8 -23.2 Q17.2 -21.6 19.6 -23.2"/>
    <path fill="none" stroke="#b98a1c" stroke-width="1.2" stroke-linecap="round" d="M4.6 -20 L-2.6 -18.4"/>
    <path fill="#cfe9f2" fill-opacity="0.8" stroke="#b98a1c" stroke-width="1.3" stroke-linejoin="round" d="M4.6 -20 L13.2 -20 A4.3 4.3 0 0 1 4.6 -20 Z"/>
    <path fill="#cfe9f2" fill-opacity="0.8" stroke="#b98a1c" stroke-width="1.3" stroke-linejoin="round" d="M14.8 -20 L21.4 -20 A3.3 3.3 0 0 1 14.8 -20 Z"/>
    <path class="o" fill="#e9a98a" d="M19.8 -19.6 Q27.8 -16 20.8 -12"/>
    <ellipse class="n" fill="#f29b8e" fill-opacity="0.5" cx="3.6" cy="-11.6" rx="3.2" ry="2"/>
    <path class="o" style="stroke-width:1.8" fill="#d2d0c9" d="M7.5 -11.6 Q14 -15.2 22.5 -11.2 Q24 -6.2 19 -6.8 Q15.5 -8.8 12.5 -6.8 Q7 -5.8 7.5 -11.6 Z"/>
    <path class="t" style="stroke-width:1.5" d="M12 -4.6 Q14.6 -3.4 17.2 -4.8"/>
  </g>

  <!-- The near arm, with the hand in his jacket pocket. It stays there. Joint at the shoulder. -->
  <g id="arm_front" data-parent="torso" transform="translate(1 -71)">
    <g transform="rotate(8)">
      <path class="o" style="stroke-width:1.6" fill="#fffdf5" d="M-5.4 21 L5.4 21 L5.4 25.5 L-5.4 25.5 Z"/>
      <path class="o" fill="#26365c" d="M-6.2 -3 Q0 -7 6.2 -3 L6.4 22 L-6.4 22 Z"/>
      <path class="p" d="M-2.2 -3.6 L-2.2 20.4 M2.6 -3.6 L2.6 20.4"/>
      <!-- the pocket, its flap pushed up by his wrist, and the thumb he leaves outside -->
      <path class="o" fill="#26365c" d="M-9.5 25.2 L9.5 25.2 L9 33 Q0 35 -9 33 Z"/>
      <path class="p" d="M-5 26.5 L-5 32.6 M0 26.5 L0 33.2 M5 26.5 L5 32.6"/>
      <path class="o" style="stroke-width:1.8" fill="#34497a" d="M-10 22.6 L3 23.8 L3 27.4 L-10 26.4 Z"/>
      <path class="o" style="stroke-width:1.7" fill="#efc09a" d="M3.6 24.4 Q8.6 21.6 10.4 24.2 Q10.8 27 7.4 27.4 L3.8 27.6 Z"/>
    </g>
  </g>
</svg>
