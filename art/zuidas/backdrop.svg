    <!-- Young trees in planters. -->
    <rect fill="#b7bec2" x="393" y="587" width="22" height="11" rx="2"/><path fill="#9a8b7b" d="M402.5 587 L403 574 L405 574 L405.5 587 Z"/><circle fill="#a5cf9a" cx="404" cy="566" r="13"/><circle fill="#97c48d" cx="410" cy="571" r="8.5"/>
