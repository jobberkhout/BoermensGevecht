    <path fill="none" stroke="#c2dcdd" stroke-width="2" d="M420 212 L466 212 M420 236 L482 236 M420 262 L488 262 M420 288 L488 288 M420 314 L488 314 M420 340 L488 340 M420 366 L488 366 M420 392 L488 392 M420 418 L488 418 M420 444 L488 444 M420 470 L488 470 M420 496 L488 496 M420 522 L488 522"/>
