    <path fill="none" stroke="#bdc7ce" stroke-width="2" d="M490 574 v24 M510 574 v24 M530 574 v24 M550 574 v24 M570 574 v24 M590 574 v24 M490 586 L590 586"/>
    <path fill="#e8bdb1" d="M490 568 h10 v6 h-10 Z M510 568 h10 v6 h-10 Z M530 568 h10 v6 h-10 Z M550 568 h10 v6 h-10 Z M570 568 h10 v6 h-10 Z"/>
