<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -136 96 142" data-rig="humanoid">
  <title>Deurink: boer achter een uitgetilde deeldeur met zandloper en kattenluik</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(-21 -38)"/>

  <!-- The far arm reaches round the back of the door. Hidden until the door moves away from him. -->
  <g id="arm_back" data-parent="torso" transform="translate(-30 -72)">
    <path class="o" fill="#274f86" d="M2 -4.5 L22 4.5 L18 13.5 L-2.5 5.5 Q-6.5 3 -5.5 -1.5 Q-3 -5.5 2 -4.5 Z"/>
    <circle class="o" fill="#dba27f" cx="24.5" cy="11" r="4.4"/>
  </g>

  <!-- Brown corduroy, thick woollen socks, klompen. -->
  <g id="leg_back" data-parent="hips" transform="translate(-26 -38)">
    <path class="o" fill="#4d3f31" d="M-7.5 -3 L7.5 -3 L6.5 26 L-6.5 26 Z"/>
    <path class="o" fill="#bdb6a6" d="M-5.5 25 L5.5 25 L5 31 L-5 31 Z"/>
    <path class="o" fill="#d9a826" d="M-8 38 L-8 33 Q-8 29.5 -3 29.5 L4 29.5 Q12 30 17.5 32.5 Q19 36 15 38 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(-16 -38)">
    <path class="o" fill="#6b5741" d="M-7.5 -3 L7.5 -3 L6.5 26 L-6.5 26 Z"/>
    <path class="t" style="stroke:#58462f" d="M-2.5 -1 L-2.2 24 M2.5 -1 L2.2 24"/>
    <path class="o" fill="#e4dece" d="M-5.5 25 L5.5 25 L5 31 L-5 31 Z"/>
    <path class="t" style="stroke:#b9b2a2" d="M-5 27.6 L5 27.6"/>
    <path class="o" fill="#f2c230" d="M-8 38 L-8 33 Q-8 29.5 -3 29.5 L4 29.5 Q12 30 17.5 32.5 Q19 36 15 38 Z"/>
    <path class="t" style="stroke:#c9981a" d="M-1 31.4 Q6 31 12 34"/>
  </g>

  <!-- A blue kiel, cut wide, with the red farmer's neckerchief. -->
  <g id="torso" data-parent="hips" transform="translate(-21 -40)">
    <path class="o" fill="#2f5f9e" d="M-17 8 Q-20.5 -14 -16.5 -30 Q-13 -37 0 -37 Q14 -37 17.5 -30 Q21.5 -13 18.5 8 Z"/>
    <path class="n" fill="#274f86" d="M-15.8 6.8 Q-18.6 -14 -15.2 -29 Q-11 -20 -10.5 6.8 Z"/>
    <path class="t" style="stroke:#1d3f6e" d="M-16.9 2.5 L18.7 2.5"/>
    <path class="o" fill="#d9342b" d="M-9.5 -37.5 Q1 -32 11.5 -37.5 L7.5 -28 Q2 -25 -3.5 -28 Z"/>
    <circle class="n" fill="#ffffff" cx="-3.2" cy="-33.4" r="0.9"/>
    <circle class="n" fill="#ffffff" cx="2" cy="-30.4" r="0.9"/>
    <circle class="n" fill="#ffffff" cx="6.8" cy="-33" r="0.9"/>
  </g>

  <!-- The near arm: elbow back, hand on the edge of the door. -->
  <g id="arm_front" data-parent="torso" transform="translate(-11 -72)">
    <path class="o" fill="#2f5f9e" d="M-3.4 13.2 L3 21 L-3.4 26.8 L-10.2 19 Z"/>
    <circle class="o" fill="#efb896" cx="-0.5" cy="27" r="4.6"/>
    <path class="o" fill="#2f5f9e" d="M-5.5 -4 Q0 -7.5 5.5 -3.5 Q5.5 8 0.5 18.5 Q-4.5 23 -10.5 19.5 Q-12 9 -5.5 -4 Z"/>
  </g>

  <!-- The door of the deel, lifted off its hinges. Joint where he holds it, on the edge. -->
  <g id="door" data-parent="hips" transform="translate(-9 -55)">
    <rect class="o" fill="#1f5a2a" x="0" y="-73" width="45" height="128" rx="1.5"/>
    <path class="n" fill="#246430" d="M12 -71.6 L21.8 -71.6 L21.8 53.6 L12 53.6 Z M34.5 -71.6 L43.6 -71.6 L43.6 53.6 L34.5 53.6 Z"/>
    <path class="t" style="stroke:#143f1c" d="M11.25 -72 L11.25 54 M22.5 -72 L22.5 54 M33.75 -72 L33.75 54"/>
    <!-- the hourglass of the farm's shutters -->
    <path class="n" fill="#f4ecdc" d="M7.5 -22 L37.5 -22 L22.5 2 Z M7.5 26 L37.5 26 L22.5 2 Z"/>
    <path class="t" style="stroke:#d3c8ac;stroke-width:1.2" d="M11.25 -21.2 L11.25 -17 M33.75 -21.2 L33.75 -17 M22.5 -21.2 L22.5 25.2 M11.25 25.2 L11.25 21 M33.75 25.2 L33.75 21"/>
    <!-- strap hinges; their eyes stick out past the edge, the pins stayed behind on the farm -->
    <path class="o" style="stroke-width:1.6" fill="#3a3a3a" d="M45 -61.2 L28 -60 Q24.5 -58 28 -56 L45 -54.8 Q49.2 -54.8 49.2 -58 Q49.2 -61.2 45 -61.2 Z"/>
    <circle class="n" fill="#141414" cx="46.2" cy="-58" r="1.2"/>
    <circle class="n" fill="#9aa0a4" cx="40" cy="-58" r="0.9"/>
    <circle class="n" fill="#9aa0a4" cx="34.5" cy="-58" r="0.9"/>
    <circle class="n" fill="#9aa0a4" cx="29.5" cy="-58" r="0.9"/>
    <path class="o" style="stroke-width:1.6" fill="#3a3a3a" d="M45 29.8 L28 31 Q24.5 33 28 35 L45 36.2 Q49.2 36.2 49.2 33 Q49.2 29.8 45 29.8 Z"/>
    <circle class="n" fill="#141414" cx="46.2" cy="33" r="1.2"/>
    <circle class="n" fill="#9aa0a4" cx="40" cy="33" r="0.9"/>
    <circle class="n" fill="#9aa0a4" cx="34.5" cy="33" r="0.9"/>
    <circle class="n" fill="#9aa0a4" cx="29.5" cy="33" r="0.9"/>
    <!-- the cat flap, and whoever came along behind it -->
    <rect class="o" style="stroke-width:1.6" fill="#e4dece" x="6" y="39.5" width="14" height="13" rx="2"/>
    <rect class="n" fill="#241d17" x="8.2" y="41.6" width="9.6" height="8.8" rx="1"/>
    <circle class="n" fill="#ffd21f" cx="11" cy="46.4" r="1.4"/>
    <circle class="n" fill="#ffd21f" cx="15" cy="46.4" r="1.4"/>
    <circle class="n" fill="#241d17" cx="11" cy="46.4" r="0.55"/>
    <circle class="n" fill="#241d17" cx="15" cy="46.4" r="0.55"/>
    <!-- his fingers round the edge -->
    <path class="n" fill="#efb896" d="M-3 5.5 L2.2 5.5 Q4.2 5.5 4.2 6.9 Q4.2 8.2 2.6 8.3 Q4.2 8.4 4.2 9.8 Q4.2 11.1 2.6 11.2 Q4.2 11.3 4.2 12.7 Q4.2 14.5 2.2 14.5 L-3 14.5 Z"/>
    <path class="t" style="stroke-width:1.5" d="M-1.4 5.5 L2.2 5.5 Q4.2 5.5 4.2 6.9 Q4.2 8.2 2.6 8.3 Q4.2 8.4 4.2 9.8 Q4.2 11.1 2.6 11.2 Q4.2 11.3 4.2 12.7 Q4.2 14.5 2.2 14.5 L-1.4 14.5 M0.4 8.3 L2.6 8.3 M0.4 11.2 L2.6 11.2"/>
  </g>

  <!-- The flap itself. Joint on its top edge; it swings by squashing upwards. -->
  <g id="flap" data-parent="door" transform="translate(4 -13)">
    <rect class="o" style="stroke-width:1.4" fill="#a9b4b0" x="-4.9" y="-0.5" width="9.8" height="9" rx="1"/>
    <path class="n" fill="#cfd8d4" d="M-3.4 1.2 L-1.4 1.2 L-2.6 7 L-4 7 Z"/>
  </g>

  <!-- His head comes round the door: drawn over it. -->
  <g id="head" data-parent="torso" transform="translate(-20 -76)">
    <rect class="o" fill="#dba27f" x="-4.5" y="-6" width="10" height="9" rx="2"/>
    <ellipse class="o" fill="#efb896" cx="2" cy="-21" rx="18" ry="17.5"/>
    <ellipse class="o" fill="#efb896" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <ellipse class="n" fill="#e58a6e" fill-opacity="0.5" cx="5" cy="-14" rx="4" ry="2.4"/>
    <!-- brown hair under the cap that runs on into a ringbaard: jaw and chin, no moustache -->
    <path class="o" fill="#7a5230" d="M-16 -27 Q-19 -15 -12.5 -9 L-10.5 -22 Z"/>
    <path class="o" fill="#7a5230" d="M-11 -14.5 Q-10.5 -2.3 3 -2.3 Q17 -2.3 20 -11.5 Q13.5 -7 5.5 -8 Q-2.5 -8.6 -6.5 -14.5 Z"/>
    <!-- flat cap -->
    <path class="o" fill="#6b5b4b" d="M-17 -25 Q-19 -41.5 0 -42.5 Q16 -43 20 -34 L29 -30.5 L28 -27 L17 -29.5 Q0 -34.5 -17 -25 Z"/>
    <path class="t" style="stroke:#544538" d="M-10 -33.5 Q2 -39 15 -35"/>
    <circle class="n" fill="#544538" cx="1" cy="-41" r="1.6"/>
    <circle class="n" fill="#2b1b16" cx="9.5" cy="-20" r="2"/>
    <circle class="n" fill="#2b1b16" cx="17.5" cy="-20" r="1.8"/>
    <!-- worried eyebrows -->
    <path class="t" style="stroke:#7a5230;stroke-width:2.6" d="M5 -24.6 L12.3 -26.6 M15 -26.6 L20.3 -25"/>
    <path class="o" fill="#e9a487" d="M19.5 -19 Q26 -15.5 20 -12"/>
    <path class="t" style="stroke-width:1.9" d="M10.5 -10 Q13.5 -11.4 16.5 -10.2"/>
  </g>
</svg>
