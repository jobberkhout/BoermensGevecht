<svg xmlns="http://www.w3.org/2000/svg" viewBox="-316 -596 332 602" data-rig="static">
  <title>De Saksische boerderij van de jaren zeventig: rieten kap, vakwerk en hooi op de hilde</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- (0,0) is the foot of the doorway, where units come out. The farmhouse stands behind it, to the left. -->
  <g id="building" transform="translate(0 0)">
    <!-- flagpole -->
    <path class="t" style="stroke-width:5" d="M-288 -462 L-288 -552"/>
    <circle class="o" fill="#ffd21f" cx="-288" cy="-555" r="4.5"/>

    <!-- a television aerial on the thatch: it is 1975 after all -->
    <path class="t" style="stroke-width:3.2" d="M-58 -504 L-58 -556 M-80 -550 L-36 -550 M-75 -541 L-41 -541 M-70 -532 L-46 -532"/>
    <path class="t" style="stroke-width:2" d="M-58 -522 Q-70 -514 -66 -506"/>

    <!-- crossed gable boards at the end of the ridge -->
    <path class="t" style="stroke-width:6.5" d="M-24 -498 L-2 -530 M-6 -498 L-28 -530"/>
    <path fill="none" stroke="#f4ecdc" stroke-width="3" stroke-linecap="round" d="M-24 -498 L-2 -530 M-6 -498 L-28 -530"/>

