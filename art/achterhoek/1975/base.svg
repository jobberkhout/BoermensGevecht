    <rect class="o" fill="#6b4f33" x="-100" y="-134" width="98" height="12" rx="2"/>
    <rect class="o" fill="#241d17" x="-90" y="-122" width="76" height="122"/>
    <rect class="o" fill="#7a5a3a" x="-102" y="-134" width="12" height="134"/>
