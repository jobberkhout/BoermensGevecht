    <path class="o" fill="#edcb58" d="M-286 -146 Q-286 -176 -262 -186 Q-244 -204 -222 -190 Q-200 -186 -196 -146 Z"/>
    <path class="t" style="stroke:#c39a2b;stroke-width:2.2" d="M-272 -156 Q-264 -172 -250 -176 M-246 -154 Q-238 -174 -224 -180 M-222 -154 Q-216 -166 -206 -168"/>
    <path class="t" style="stroke-width:6" d="M-40 -146 L-22 -284 M-22 -146 L-4 -284"/>
    <path fill="none" stroke="#a8743f" stroke-width="3" stroke-linecap="round" d="M-40 -146 L-22 -284 M-22 -146 L-4 -284 M-37 -168 L-19 -168 M-34 -192 L-16 -192 M-31 -216 L-13 -216 M-28 -240 L-10 -240 M-25 -264 L-7 -264"/>
    <path class="t" style="stroke-width:3.4;stroke:#7a5a3a" d="M-150 -270 L-176 -160"/>
