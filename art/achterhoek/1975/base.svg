    <rect class="o" fill="#a8553c" x="-286" y="-24" width="184" height="24"/>
    <path class="t" style="stroke:#c4775e;stroke-width:2.2" d="M-280 -12 L-264 -12 M-150 -14 L-134 -14 M-124 -8 L-110 -8"/>
    <rect class="o" fill="#6b4f33" x="-286" y="-76" width="28" height="8"/>
    <rect class="o" fill="#6b4f33" x="-162" y="-118" width="60" height="8"/>
    <rect class="o" fill="#6b4f33" x="-162" y="-46" width="60" height="8"/>
    <rect class="o" fill="#1f5a2a" x="-258" y="-120" width="96" height="120"/>
    <path class="o" fill="#1f5a2a" d="M-258 -120 Q-210 -140 -162 -120 Z"/>
    <path class="t" style="stroke:#f4ecdc;stroke-width:5" d="M-252 -112 L-168 -112 L-168 -6 L-252 -6 Z M-210 -124 L-210 -6 M-252 -112 L-210 -6 M-168 -112 L-210 -6"/>
