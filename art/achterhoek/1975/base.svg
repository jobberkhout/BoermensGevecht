    <rect class="o" style="stroke-width:2.4" fill="#9aa59f" x="-150" y="-46.5" width="14" height="4.5" rx="2"/>
    <path class="o" fill="#c7cfca" d="M-130 -10 L-130 -32 Q-130 -38 -125.5 -39 L-125.5 -43 L-116.5 -43 L-116.5 -39 Q-112 -38 -112 -32 L-112 -10 Z"/>
    <rect class="o" style="stroke-width:2.4" fill="#9aa59f" x="-128" y="-46.5" width="14" height="4.5" rx="2"/>
    <path class="t" style="stroke:#8b9690" d="M-152 -22 L-134 -22 M-130 -22 L-112 -22"/>

