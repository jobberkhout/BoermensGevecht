<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -118 232 122" data-rig="static">
  <title>Carbidbus: carbidschieten met een melkbus, op het moment van de knal</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- On the floor: the tin of carbide, a bucket of water, the rack and a stack of spare lids. Origin = middle of the floor. -->
  <g id="props" transform="translate(0 0)">
    <rect class="o" fill="#6f8fa8" x="-66" y="-16" width="13" height="16" rx="1.5"/>
    <rect class="o" fill="#8fa9bd" x="-67.5" y="-19.5" width="16" height="4.5" rx="1.8"/>
    <rect class="n" fill="#f4ecdc" x="-64" y="-12.5" width="9" height="8"/>
    <path class="n" fill="#e8742a" d="M-59.5 -11.5 L-56.8 -8.5 L-59.5 -5.5 L-62.2 -8.5 Z"/>
    <path class="t" d="M-50.5 -13 Q-44 -23 -37.5 -13"/>
    <path class="o" fill="#b9c2bd" d="M-51.5 -13.5 L-36.5 -13.5 L-38.5 0 L-49.5 0 Z"/>
    <path class="n" fill="#8fc7e0" d="M-49.8 -11.8 L-38.2 -11.8 L-38.6 -9 L-49.4 -9 Z"/>
    <!-- the rack: two trestles and a rail -->
    <path class="t" style="stroke-width:7.6" d="M12 -1 L30 -28 M33 -1 L15 -25 M50 -1 L66 -41 M71 -1 L55 -37 M15 -26 L66 -42"/>
    <path fill="none" stroke="#8a6a46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M12 -1 L30 -28 M33 -1 L15 -25 M50 -1 L66 -41 M71 -1 L55 -37 M15 -26 L66 -42"/>
    <!-- spare lids -->
    <rect class="o" fill="#9aa59f" x="78" y="-4.5" width="23" height="4.5" rx="2"/>
    <rect class="o" fill="#b9c2bd" x="77" y="-9" width="23" height="4.5" rx="2"/>
    <path class="o" fill="#d5dcd8" d="M80 -9 Q80 -15 88.5 -15 Q97 -15 97 -9 Z"/>
    <rect class="o" style="stroke-width:2" fill="#8b9690" x="85.3" y="-18.5" width="6.4" height="4" rx="1.6"/>
  </g>

  <!-- The one who would rather not be here: fingers in his ears, eyes shut. Joint at his feet. -->
  <g id="b_body" transform="translate(-84 0)">
    <g transform="translate(84 0)">
      <path class="o" fill="#f2c230" d="M-96 -1 Q-96 -7 -89 -7 L-85 -7 Q-83 -4 -85 -1 Z"/>
      <path class="o" fill="#f2c230" d="M-84 -1 Q-84 -7 -78 -7 L-74 -7 Q-69 -5 -71 -1 Z"/>
      <path class="o" fill="#3d3a36" d="M-94 -29 L-74 -29 L-75 -6 L-83 -6 L-84 -19 L-85 -6 L-93 -6 Z"/>
      <path class="o" fill="#274f86" d="M-98 -25 Q-100 -47 -94 -56 Q-84 -60 -74 -56 Q-69 -47 -70 -25 Z"/>
      <path class="t" d="M-78 -56 L-76.5 -26"/>
      <circle class="n" fill="#e6b422" cx="-80.5" cy="-44" r="1.5"/>
      <circle class="n" fill="#e6b422" cx="-80" cy="-35" r="1.5"/>
      <path class="o" fill="#c9c2b0" d="M-91 -52 L-98 -38 L-93 -36 L-88 -50 Z"/>
      <path class="o" fill="#d9d2c0" d="M-92 -56.5 Q-84 -52 -76 -56.5 L-77 -49.5 Q-84 -46.5 -91 -49.5 Z"/>
    </g>
  </g>

  <g id="b_head" data-parent="b_body" transform="translate(-84 -57)">
    <g transform="translate(84 57)">
      <circle class="o" fill="#efc09a" cx="-83" cy="-70" r="12.5"/>
      <path class="o" fill="#efc09a" d="M-71.8 -72.5 Q-65.5 -69.5 -71.5 -66"/>
      <path class="o" fill="#6b5b4b" d="M-96.5 -74 Q-97 -84.5 -83 -84.5 Q-71 -84.5 -70 -77 L-63.5 -75.5 L-64 -73 L-72 -74 Q-84 -77.5 -96.5 -74 Z"/>
      <path class="t" style="stroke:#544538" d="M-92 -79.5 Q-83 -82.5 -74 -78.5"/>
      <path class="t" style="stroke-width:2.4" d="M-83 -76 L-76 -74.5"/>
      <path class="t" style="stroke-width:1.9" d="M-81 -73 L-77 -71 L-81 -69"/>
      <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M-80.5 -65.5 L-72.5 -66 L-73 -61.5 L-80 -61 Z"/>
      <path class="t" style="stroke-width:1.2" d="M-77.8 -65.7 L-77.6 -61.2 M-75.2 -65.8 L-75.2 -61.4"/>
    </g>
  </g>

  <!-- His arm: elbow out, a finger in his ear. Joint at the shoulder. -->
  <g id="b_arm" data-parent="b_body" transform="translate(-86 -53)">
    <g transform="translate(86 53)">
      <path class="o" fill="#2f5f9e" d="M-84.5 -56.7 L-99.5 -62.7 L-102.5 -55.3 L-87.5 -49.3 Z"/>
      <path class="o" fill="#2f5f9e" d="M-97.9 -57.2 L-90.9 -69.2 L-97.1 -72.8 L-104.1 -60.8 Z"/>
      <path class="n" fill="#2f5f9e" d="M-98.5 -61 L-95.5 -58.5 L-99.5 -57 L-101.5 -59.5 Z"/>
      <circle class="o" fill="#efc09a" cx="-93.5" cy="-71.5" r="4.4"/>
    </g>
  </g>

  <!-- The one with the nerve, and the burning rag on a stick. -->
  <g id="a_body" transform="translate(-22 0)">
    <g transform="translate(22 0)">
      <path class="o" fill="#f2c230" d="M-34 -1 Q-34 -7 -27 -7 L-23 -7 Q-21 -4 -23 -1 Z"/>
      <path class="o" fill="#f2c230" d="M-22 -1 Q-22 -7 -16 -7 L-12 -7 Q-7 -5 -9 -1 Z"/>
      <path class="o" fill="#6b5741" d="M-32 -31 L-12 -31 L-13 -6 L-21 -6 L-22 -20 L-23 -6 L-31 -6 Z"/>
      <path class="o" fill="#c46a2a" d="M-35 -29 Q-37 -50 -32 -58 Q-22 -62 -12 -58 Q-7 -50 -9 -29 Z"/>
      <path class="t" style="stroke:#e08c4a" d="M-35.6 -37 L-8.6 -37 M-35.4 -45 L-8.4 -45 M-33.5 -53 L-10.5 -53"/>
      <path class="t" d="M-17 -59.5 L-16 -29.5"/>
      <path class="o" fill="#d9342b" d="M-29 -55 L-40 -51.5 L-38.5 -46 L-28 -50 Z"/>
      <path class="o" fill="#d9342b" d="M-30 -58.5 Q-22 -54 -14 -58.5 L-15 -51.5 Q-22 -48.5 -29 -51.5 Z"/>
    </g>
  </g>

  <g id="a_head" data-parent="a_body" transform="translate(-22 -59)">
    <g transform="translate(22 59)">
      <path class="o" fill="#e3b94d" d="M-33 -76 Q-38 -63 -32 -56.5 L-27.5 -68 Z"/>
      <circle class="o" fill="#efc09a" cx="-21" cy="-72" r="12.5"/>
      <path class="o" fill="#efc09a" d="M-9.8 -74.5 Q-3.5 -71.5 -9.5 -68"/>
      <path class="o" fill="#2f9140" d="M-34 -75 Q-34.5 -87.5 -21 -87.5 Q-8.5 -87.5 -8 -76 Q-21 -80.5 -34 -75 Z"/>
      <path class="o" fill="#ffd21f" d="M-34 -75 Q-21 -80.5 -8 -76 L-8.3 -71.8 Q-21 -76.3 -33.7 -70.8 Z"/>
      <circle class="o" fill="#ffd21f" cx="-22" cy="-90" r="4.2"/>
      <path class="t" style="stroke-width:2" d="M-18.5 -70.5 L-12 -70"/>
      <circle class="n" fill="#2b1b16" cx="-15" cy="-66.8" r="1.6"/>
      <ellipse class="o" style="stroke-width:1.4" fill="#e87b9a" cx="-10.8" cy="-61.2" rx="2" ry="2.5"/>
      <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M-18 -63 Q-13.5 -58.5 -9.5 -63.2 Q-13.5 -64.4 -18 -63 Z"/>
    </g>
  </g>

  <!-- The churn, lying on the rack with its mouth up. Joint in its middle. -->
  <g id="churn" transform="translate(42 -42)">
    <g transform="rotate(-20)">
      <path class="t" style="stroke-width:2.6" d="M8 -13 Q13 -21 18 -11"/>
      <path class="o" fill="#b9c2bd" d="M-29 -13 L14 -13 Q19 -12 22 -8 L28 -8 L28 -10.5 L32 -10.5 L32 10.5 L28 10.5 L28 8 L22 8 Q19 12 14 13 L-29 13 Q-32 13 -32 10 L-32 -10 Q-32 -13 -29 -13 Z"/>
      <path class="n" fill="#dbe2de" d="M-27 -10.3 L13 -10.3 Q16 -9.8 18 -7.8 L-27 -7.8 Z"/>
      <path class="n" fill="#9aa59f" d="M-28.5 8 L14 8 Q17 9 13 10.6 L-28.5 10.6 Z"/>
      <path class="t" style="stroke:#8b9690;stroke-width:2.4" d="M-21 -12.5 L-21 12.5 M6 -12.5 L6 12.5"/>
      <path class="n" fill="#4d4d4d" fill-opacity="0.55" d="M-31 0 Q-24 -1 -22.5 7 Q-25 12 -31 11.5 Z"/>
      <circle class="n" fill="#2b1b16" cx="-27.5" cy="6.5" r="2"/>
    </g>
    <circle data-mount="muzzle" fill="none" cx="33" cy="-12" r="1"/>
  </g>

  <!-- His arm with the stick. Joint at the shoulder. In the drawing the flame is at the touch-hole. -->
  <g id="a_arm" data-parent="a_body" transform="translate(-14 -52)">
    <g transform="translate(14 52)">
      <path class="o" fill="#f4ecdc" d="M-17.5 -53.5 L-12 -57.5 L-0.5 -45.5 L-6.5 -39.5 Z"/>
      <path class="t" style="stroke-width:5.4" d="M-12 -50 L10 -28"/>
      <path fill="none" stroke="#a8743f" stroke-width="2.6" stroke-linecap="round" d="M-12 -50 L10 -28"/>
      <path class="t" style="stroke-width:7.4" d="M6.5 -31.5 L10 -28"/>
      <path fill="none" stroke="#5c4329" stroke-width="4.4" stroke-linecap="round" d="M6.5 -31.5 L10 -28"/>
      <circle class="o" fill="#efc09a" cx="-3" cy="-41.5" r="4.2"/>
    </g>
  </g>

  <g id="flame" data-parent="a_arm" transform="translate(10 -28)">
    <path class="o" style="stroke-width:2" fill="#ff9a1f" d="M0 2.5 Q-6.5 -1 -3.5 -8.5 Q-2 -5 -0.5 -7.5 Q-1 -13.5 3.5 -17 Q3 -10.5 6.5 -6.5 Q8.5 -1 3 2.5 Z"/>
    <path class="n" fill="#ffd21f" d="M0.5 1 Q-3 -1.5 -1 -5.5 Q0.5 -3 1.5 -6 Q3.5 -3.5 4 -1.5 Q4 0.5 2 1 Z"/>
  </g>

  <g id="smoke" transform="translate(60 -90)">
    <path class="o" fill="#e8e4dc" d="M-15 3 Q-21 -3 -14 -8 Q-13 -17 -3 -15 Q4 -22 11 -14 Q20 -13 18 -4 Q22 4 13 6 Q7 11 0 6.5 Q-8 10 -15 3 Z"/>
    <path class="t" style="stroke:#bdb8ac" d="M-8 -4 Q-3 -9 3 -5 M5 1 Q10 -3 14 0"/>
  </g>

  <!-- The bang. Joint at the churn's mouth. -->
  <g id="flash" transform="translate(77 -55)">
    <path class="o" fill="#ffd21f" d="M25 0 L10.2 4.2 L13.4 13.4 L3.8 9.2 L0 22 L-3.8 9.2 L-12.7 12.7 L-9.2 3.8 L-16 0 L-9.2 -3.8 L-13.4 -13.4 L-4.2 -10.2 L0 -23 L4.2 -10.2 L14.8 -14.8 L10.2 -4.2 Z"/>
    <path class="n" fill="#ff9a1f" d="M11 0 L5 2.1 L7.6 7.6 L2.1 5 L0 11 L-2.1 5 L-7.6 7.6 L-5 2.1 L-11 0 L-5 -2.1 L-7.6 -7.6 L-2.1 -5 L0 -11 L2.1 -5 L7.6 -7.6 L5 -2.1 Z"/>
    <circle class="n" fill="#fffdf5" cx="0" cy="0" r="3.6"/>
  </g>

  <!-- The lid, on its way. Joint in its middle. -->
  <g id="lid" data-parent="churn" transform="translate(98 -66)">
    <g transform="rotate(100)">
      <rect class="o" fill="#b9c2bd" x="-11.5" y="-2" width="23" height="4.5" rx="2"/>
      <path class="o" fill="#d5dcd8" d="M-8.5 -2 Q-8.5 -8.5 0 -8.5 Q8.5 -8.5 8.5 -2 Z"/>
      <rect class="o" style="stroke-width:2" fill="#8b9690" x="-3.2" y="-12" width="6.4" height="4.2" rx="1.6"/>
    </g>
  </g>
</svg>
