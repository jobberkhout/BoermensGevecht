<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -126 104 132" data-rig="humanoid">
  <title>Smijtink: smijt met voederbieten uit de mand op zijn rug</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The wicker basket on his back, full of fodder beets. Joint where it hangs on his shoulders. -->
  <g id="basket" data-parent="torso" transform="translate(-15 -73)">
    <path class="o" fill="#4f9a3c" d="M-20 -12 Q-25 -21 -20.5 -27 Q-16 -21 -17 -12 Z"/>
    <path class="o" fill="#62b04a" d="M-13.5 -14 Q-14 -26 -8 -30 Q-6.5 -22 -10.5 -13 Z"/>
    <path class="o" fill="#4f9a3c" d="M-6 -12 Q-3 -22 3 -23 Q2 -15 -3 -10 Z"/>
    <ellipse class="o" fill="#e9a13b" cx="-19" cy="-8" rx="5.5" ry="6"/>
    <ellipse class="o" fill="#f0b24a" cx="-11.5" cy="-10" rx="6" ry="6.5"/>
    <ellipse class="o" fill="#e9a13b" cx="-4" cy="-8" rx="5" ry="6"/>
    <path class="n" fill="#f8d48a" d="M-14.5 -13.5 Q-11.5 -15.5 -8.5 -13.5 Q-11.5 -12.8 -14.5 -13.5 Z"/>
    <path class="o" fill="#b8843f" d="M-25 -6 L1 -6 L-3 31 L-20 31 Z"/>
    <path class="t" style="stroke:#8a5f28" d="M-24.3 1 L0.3 1 M-23.5 9 L-0.6 9 M-22.6 17 L-1.5 17 M-21.7 25 L-2.4 25"/>
    <path class="t" style="stroke:#8a5f28" d="M-17 -5 L-15.5 30 M-8.5 -5 L-9 30"/>
    <rect class="o" fill="#c9954c" x="-27" y="-9.5" width="30" height="5.5" rx="2.7"/>
  </g>

  <g id="arm_back" data-parent="torso" transform="translate(-10 -72)">
    <path class="o" fill="#d6ccb4" d="M-6.5 -3 Q-8.5 6 -7 13 L6.5 13 Q7.5 6 6.5 -3 Z"/>
    <path class="o" fill="#dba27f" d="M-5.5 13 L-4.5 27 Q0 33 4.5 27 L5.5 13 Z"/>
  </g>

  <!-- Corduroy tucked into rubber boots. -->
  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#4a4034" d="M-8 -3 L8 -3 L7.5 16 L-7.5 16 Z"/>
    <path class="o" fill="#26282b" d="M-7 14 L7 14 L6.5 31 Q13 32 15 36 L15 38 L-8 38 L-8 33 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#5d5142" d="M-8 -3 L8 -3 L7.5 16 L-7.5 16 Z"/>
    <path class="o" fill="#33363a" d="M-7 14 L7 14 L6.5 31 Q13 32 15 36 L15 38 L-8 38 L-8 33 Z"/>
    <path class="n" fill="#4d5157" d="M2 17 L5 17 L4.6 29 L2.4 29 Z"/>
    <path class="t" style="stroke:#5a5e64" d="M-6.6 17.5 L6.6 17.5"/>
    <path class="n" fill="#191a1c" d="M-7.3 35.8 L14.3 35.8 L14.3 37.4 L-7.3 37.4 Z"/>
  </g>

  <!-- A striped farmer's shirt, trousers hoisted over the belly on green braces. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#f4ecdc" d="M-17 6 Q-21 -14 -17 -30 Q-13 -37 0 -37 Q14 -37 18 -30 Q23 -12 18.5 6 Z"/>
    <path fill="none" stroke="#7fa3c9" stroke-width="1.3" d="M-12 -34.5 L-13.5 -9 M-1 -36.5 L-1.5 -9 M4.5 -36.5 L5 -9 M16 -31.5 L18 -9"/>
    <path class="o" fill="#5d5142" d="M-17.7 6 Q-19.6 -3 -18.6 -9 L20.4 -9 Q21.4 -2 18.7 6 Z"/>
    <path class="o" fill="#1f5a2a" d="M-10 -9 L-8.5 -35.5 L-4.5 -36.5 L-5.5 -9 Z"/>
    <path class="o" fill="#2f9140" d="M8.5 -9 L8.5 -36.3 L12.5 -35.5 L13 -9 Z"/>
    <circle class="n" fill="#ffd21f" cx="-7.6" cy="-11.5" r="1.6"/>
    <circle class="n" fill="#ffd21f" cx="10.8" cy="-11.5" r="1.6"/>
    <!-- the strap of the basket -->
    <path class="t" style="stroke:#7a5a3a;stroke-width:3.4" d="M-16.5 -24 Q-13 -36 -3 -37.5"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#dba27f" x="-5" y="-6" width="11" height="9" rx="2"/>
    <ellipse class="o" fill="#efb896" cx="2" cy="-21" rx="18.5" ry="17.5"/>
    <ellipse class="o" fill="#efb896" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <ellipse class="n" fill="#e58a6e" fill-opacity="0.55" cx="4.5" cy="-13" rx="4.2" ry="2.5"/>
    <!-- ginger: a few strands combed over the crown, broad sideburns -->
    <path class="t" style="stroke:#c8642a;stroke-width:2.2" d="M-11 -35.5 Q0 -42 12 -37.5 M-13 -32 Q-2 -39.5 9 -35.5"/>
    <path class="o" fill="#c8642a" d="M-16.5 -24 Q-18.5 -35 -11 -37.5 Q-12.5 -30 -9.5 -24 L-9.5 -9 Q-18 -11 -16.5 -24 Z"/>
    <circle class="n" fill="#2b1b16" cx="9.5" cy="-20" r="1.9"/>
    <circle class="n" fill="#2b1b16" cx="17.5" cy="-20" r="1.7"/>
    <path class="t" style="stroke:#a84f1e;stroke-width:2.8" d="M5 -25.5 L12.5 -24 M15 -24 L20.5 -25.5"/>
    <path class="o" fill="#e9a487" d="M19.5 -19 Q26.5 -15.5 20 -11.5"/>
    <!-- walrus moustache -->
    <path class="o" fill="#c8642a" d="M6.5 -11.5 Q13 -15.5 20 -11.5 Q23.5 -8.5 22 -4.5 Q17.5 -8 13.5 -7.5 Q9.5 -6.5 5 -4 Q3 -8.5 6.5 -11.5 Z"/>
  </g>

  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#efb896" d="M-6 15 L12 9.5 L15 17.5 L-2 25.5 Z"/>
    <path class="o" fill="#f4ecdc" d="M-6.5 -3 Q-8.5 6 -7 14 Q-1 18.5 6 15 Q7.5 6 6.5 -3 Z"/>
    <path fill="none" stroke="#7fa3c9" stroke-width="1.3" d="M-2.5 -2.5 L-3 14.5 M2.5 -2.5 L2.5 14.8"/>
    <path class="o" fill="#e6dcc6" d="M-8 12.5 Q-1 17.5 7 13 L7.5 17.5 Q0 22.5 -7.5 17.5 Z"/>
    <circle class="o" fill="#efb896" cx="17.5" cy="12.5" r="5.2"/>
    <circle data-mount="hand" fill="none" cx="20" cy="5" r="1"/>
  </g>

  <!-- The beet in his hand, ready to go. -->
  <g id="prop" data-parent="arm_front" transform="translate(27.5 -59.5)">
    <g transform="rotate(32)">
      <path class="o" fill="#4f9a3c" d="M-3 -17 Q-9 -24 -6 -30.5 Q-1.5 -25 -0.5 -17 Z"/>
      <path class="o" fill="#62b04a" d="M0.5 -17.5 Q1.5 -27 8 -29 Q8 -21 3.5 -16.5 Z"/>
      <path class="o" fill="#e9a13b" d="M0 -18.5 Q9 -18 8.5 -10 Q7.5 -1.5 0 3.5 Q-7.5 -1.5 -8.5 -10 Q-9 -18 0 -18.5 Z"/>
      <path class="n" fill="#f6c768" d="M-5.5 -14 Q-2 -17 2 -16 Q-2 -14.5 -4.5 -10.5 Z"/>
      <path class="t" style="stroke:#c47f24" d="M-5.5 -6.5 Q0 -4 5.5 -6.5"/>
      <ellipse class="o" fill="#efb896" cx="-3.2" cy="-1.5" rx="2.8" ry="4"/>
    </g>
  </g>
</svg>
