<svg xmlns="http://www.w3.org/2000/svg" viewBox="-46 -142 94 148" data-rig="humanoid">
  <title>Verschrikkerink: lopende vogelverschrikker met een laseroog</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The arms are one stick through the sleeves, so they stick out sideways. Joint at the shoulder. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="t" style="stroke-width:5.6" d="M0 0 L-27 1"/>
    <path class="t" style="stroke:#7a5a3a;stroke-width:3" d="M0 0 L-27 1"/>
    <path class="o" fill="#d9b441" d="M-17 -3.5 L-30 -7.5 L-26.5 -2.5 L-32.5 0.5 L-26.5 3 L-30 8.5 L-17 5 Z"/>
    <path class="o" fill="#4a6a8f" d="M5 -5.5 L-19 -4.5 L-20 5 L-16 9.5 L-13 5 L-9.5 10.5 L-6.5 5 L-2.5 9.5 L5 6 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#74583a" d="M-6 -3 L6 -3 L5 26 L-5 26 Z"/>
    <rect class="o" fill="#7a857f" x="-2" y="27" width="4.5" height="8"/>
    <path class="o" fill="#9aa59f" d="M-7 38 L-7 35.5 Q-7 33.5 -4 33.5 L6 33.5 Q12.5 34.5 14 38 Z"/>
    <path class="o" fill="#d9b441" d="M-6.5 24 L6.5 24 L7.5 30.5 L4.5 28 L2.5 32 L0 28.5 L-2.5 32 L-4.5 28 L-7.5 30.5 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#8a6a46" d="M-6 -3 L6 -3 L5 26 L-5 26 Z"/>
    <path class="n" fill="#9c7b55" d="M1.5 -1 L4.6 -1 L4 23 L1.8 23 Z"/>
    <!-- a knee patch -->
    <rect class="o" style="stroke-width:1.6" fill="#2f9140" x="-4.2" y="8" width="7.4" height="7.4" rx="1"/>
    <path class="t" style="stroke:#f4ecdc;stroke-width:1.1" d="M-4.2 11.7 L-2.8 11.7 M1.8 11.7 L3.2 11.7 M-0.5 8 L-0.5 9.4 M-0.5 14 L-0.5 15.4"/>
    <!-- steel shin and foot, straw spilling over them -->
    <rect class="o" fill="#8b9690" x="-2" y="27" width="4.5" height="8"/>
    <path class="o" fill="#b9c2bd" d="M-7 38 L-7 35.5 Q-7 33.5 -4 33.5 L6 33.5 Q12.5 34.5 14 38 Z"/>
    <path class="o" fill="#e6c24a" d="M-6.5 24 L6.5 24 L7.5 30.5 L4.5 28 L2.5 32 L0 28.5 L-2.5 32 L-4.5 28 L-7.5 30.5 Z"/>
  </g>

  <!-- An old patched coat on a cross-pole, stuffed with straw, a rope for a belt. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#e6c24a" d="M-12 2 L-13.5 11 L-9.5 7 L-7 12 L-4.5 7 L-1.5 12.5 L1 7 L4 12 L6.5 7 L9.5 11.5 L12.5 2 Z"/>
    <path class="o" fill="#e6c24a" d="M-8 -34 L-11 -42 L-6 -38.5 L-4 -44 L-1 -38.5 L2 -44 L4.5 -38.5 L9 -42 L7.5 -34 Z"/>
    <path class="o" fill="#5b7fa6" d="M-13.5 5 Q-16 -14 -13.5 -30 Q-10 -37 0 -37 Q11 -37 14.5 -30 Q17 -14 13.5 5 L10 2 L7 6.5 L3.5 2 L0 6.5 L-3.5 2 L-7 6.5 L-10 2 Z"/>
    <path class="t" style="stroke:#3f5f85" d="M2 -36 L1.5 2.5"/>
    <circle class="n" fill="#ffd21f" cx="5.4" cy="-27" r="1.7"/>
    <circle class="n" fill="#d9342b" cx="5.2" cy="-18" r="1.7"/>
    <!-- patches, one of them a little status panel -->
    <rect class="o" style="stroke-width:1.6" fill="#c94a38" x="-11" y="-28" width="8.4" height="8.4" rx="1"/>
    <path class="t" style="stroke:#f4ecdc;stroke-width:1.1" d="M-11 -23.8 L-9.5 -23.8 M-4.1 -23.8 L-2.6 -23.8 M-6.8 -28 L-6.8 -26.5 M-6.8 -21.1 L-6.8 -19.6"/>
    <rect class="o" style="stroke-width:1.6" fill="#34424b" x="-10.5" y="-15.5" width="10" height="7" rx="1.5"/>
    <circle class="n" fill="#7fd35b" cx="-7.7" cy="-12" r="1.2"/>
    <circle class="n" fill="#ff4a3d" cx="-3.8" cy="-12" r="1.2"/>
    <rect class="o" style="stroke-width:1.6" fill="#e6c24a" x="6" y="-12" width="6.6" height="6.6" rx="1"/>
    <!-- rope belt -->
    <path class="t" style="stroke-width:4.6" d="M-14.4 -3 Q0 0.5 14.2 -3 M6 -1.6 L8 6 M6 -1.6 L4.4 5.4"/>
    <path class="t" style="stroke:#c9a26b;stroke-width:2.2" d="M-14.4 -3 Q0 0.5 14.2 -3 M6 -1.6 L8 6 M6 -1.6 L4.4 5.4"/>
  </g>

  <!-- A sack for a head on a spring, a straw hat with a crow's feather in the band. -->
  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <path class="t" style="stroke-width:5" d="M-3.5 3 L4.5 1 L-3.5 -1 L4.5 -3 L-3.5 -5 L4.5 -7"/>
    <path class="t" style="stroke:#c9cdd0;stroke-width:2.2" d="M-3.5 3 L4.5 1 L-3.5 -1 L4.5 -3 L-3.5 -5 L4.5 -7"/>
    <path class="o" fill="#e6c24a" d="M-11 -31 L-21 -28 L-15 -24 L-22 -19.5 L-15 -16.5 L-20 -11 L-10 -11 Z"/>
    <path class="o" fill="#d9b87a" d="M-11 -6 Q-17 -20 -12 -32 Q-5 -41 7 -40 Q20 -37 21 -23 Q21 -11 13 -6 Q7 -3.5 0.5 -4 Q-6 -3.5 -11 -6 Z"/>
    <path class="o" fill="#c9a26b" d="M-10 -8.5 Q0.5 -5 12 -8.5 L13.5 -3 Q9.5 -0.5 7 -4 Q4 0 0.5 -4 Q-3 0 -6 -4 Q-8.5 -0.5 -11.5 -3 Z"/>
    <path class="t" style="stroke:#7a5a3a;stroke-width:2.2" d="M-10.4 -8 Q0.5 -4.4 12.4 -8"/>
    <path class="t" style="stroke:#b99a5c" d="M-10 -26 L-5 -28 M-12.5 -17 L-7.5 -18.5 M-4 -12 L0.5 -12.6"/>
    <!-- a stitched mouth that has seen it all -->
    <path class="t" style="stroke-width:2" d="M5 -13 Q12 -10.5 19.5 -14"/>
    <path class="t" d="M7.6 -14.4 L7.6 -10 M11.2 -13.6 L11.2 -9.2 M14.8 -13.8 L14.8 -9.6 M17.8 -15.2 L17.8 -11.2"/>
    <!-- the far eye is a button -->
    <circle class="o" style="stroke-width:1.8" fill="#3a3a3a" cx="18.4" cy="-23" r="2.7"/>
    <path class="t" style="stroke:#c9cdd0;stroke-width:1.1" d="M17.2 -24.2 L19.6 -21.8 M19.6 -24.2 L17.2 -21.8"/>
    <!-- the near eye is not -->
    <circle class="o" fill="#8b9690" cx="8" cy="-23.5" r="6.6"/>
    <circle class="o" style="stroke-width:1.6" fill="#ff3b2f" cx="8" cy="-23.5" r="3.9"/>
    <circle class="n" fill="#ffe1d6" cx="9.3" cy="-24.9" r="1.3"/>
    <!-- straw hat -->
    <path class="o" fill="#edcb58" d="M-25 -35 Q-22 -40.5 -10 -41 L14 -41 Q27 -39.5 31 -33.5 Q32 -30.5 29 -30 Q14 -35.5 2 -35.5 Q-10 -35.5 -22 -31.5 Q-26 -32 -25 -35 Z"/>
    <path class="o" fill="#e6c24a" d="M-11 -39 Q-12 -53.5 2 -54 Q15 -54 15.5 -39.5 Q2 -42.5 -11 -39 Z"/>
    <path class="o" fill="#b3402f" d="M-11.3 -43 Q2 -46.5 15.6 -43.5 L15.5 -39.5 Q2 -42.5 -11 -39 Z"/>
    <path class="t" style="stroke:#c39a2b" d="M-6 -49.5 L-2 -50.5 M4 -51.5 L8 -50.9 M-18 -35.6 L-14 -37 M21 -35.6 L25 -34 M-4 -38.2 L1 -38.6"/>
    <path class="o" style="stroke-width:1.8" fill="#2b2b2b" d="M-8 -43.5 Q-17.5 -52 -13.5 -62.5 Q-6 -54 -5.4 -44 Z"/>
    <path class="t" style="stroke:#7a7a7a;stroke-width:1.1" d="M-7.2 -45 Q-12 -52 -12.6 -59"/>
    <circle data-mount="muzzle" fill="none" cx="13" cy="-23.5" r="1"/>
  </g>

  <!-- The glow of the laser eye. It swells before a shot. Joint in the middle of the eye. -->
  <g id="glow" data-parent="head" transform="translate(9 -99.5)">
    <circle class="n" fill="#ff3b2f" fill-opacity="0.36" cx="0" cy="0" r="8.6"/>
    <circle class="n" fill="#ffd9cf" fill-opacity="0.85" cx="0" cy="0" r="1.8"/>
  </g>

  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="t" style="stroke-width:5.6" d="M0 0 L27 1"/>
    <path class="t" style="stroke:#8a6a46;stroke-width:3" d="M0 0 L27 1"/>
    <path class="o" fill="#e6c24a" d="M17 -3.5 L30 -7.5 L26.5 -2.5 L32.5 0.5 L26.5 3 L30 8.5 L17 5 Z"/>
    <path class="o" fill="#5b7fa6" d="M-5 -5.5 L19 -4.5 L20 5 L16 9.5 L13 5 L9.5 10.5 L6.5 5 L2.5 9.5 L-5 6 Z"/>
    <path class="n" fill="#7396bd" d="M-2 -3.5 L16 -2.7 L16 -1.1 L-2 -1.7 Z"/>
  </g>
</svg>
