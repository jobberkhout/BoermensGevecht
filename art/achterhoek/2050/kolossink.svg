<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -236 166 242" data-rig="humanoid">
  <title>Kolossink: een kolos van silo, trekkerwielen en koppigheid, met opa aan de hendels. Niet online.</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -72)"/>

  <!-- The far arm. Down to the elbow it stays hidden behind the silo. Joint at the shoulder. -->
  <g id="arm_back" data-parent="torso" transform="translate(0 -156)">
    <g transform="rotate(53.13)">
      <rect class="o" fill="#1f5a2a" x="-6" y="-7.5" width="62" height="15" rx="5"/>
    </g>
  </g>

  <!-- Its forearm: a hydraulic cylinder with a bale clamp for a fist. Joint at the elbow. -->
  <g id="forearm_back" data-parent="arm_back" transform="translate(30 -116)">
    <g transform="rotate(20.56)">
      <rect class="o" fill="#aab2b6" x="18" y="-3.4" width="20" height="6.8" rx="1.5"/>
      <rect class="o" fill="#237832" x="-5" y="-7.5" width="27" height="15" rx="4.5"/>
      <rect class="o" fill="#e0b400" x="19" y="-8.5" width="5.5" height="17" rx="2"/>
      <rect class="o" fill="#3a3a3a" x="35" y="-13" width="7" height="26" rx="2"/>
      <path class="o" fill="#8b9690" d="M41 -13 L55 -15 Q59 -14.6 58.5 -11 L57.5 -6.8 L53.5 -7.6 L54 -10 L41 -8.4 Z"/>
      <path class="o" fill="#8b9690" d="M41 13 L55 15 Q59 14.6 58.5 11 L57.5 6.8 L53.5 7.6 L54 10 L41 8.4 Z"/>
      <circle class="o" style="stroke-width:1.8" fill="#e0b400" cx="0" cy="0" r="5"/>
    </g>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-12 -72)">
    <g transform="translate(12 72)">
      <rect class="o" fill="#3a3a3a" x="-19" y="-76" width="14" height="46" rx="3"/>
      <path class="o" fill="#237832" d="M-24 -70 L0 -70 L-2 -44 L-22 -44 Z"/>
      <rect class="o" fill="#237832" x="-21" y="-40" width="18" height="30" rx="3"/>
      <circle class="o" fill="#e0b400" cx="-12" cy="-41" r="9.5"/>
      <circle class="n" fill="#c9981a" cx="-12" cy="-41" r="5.2"/>
      <circle class="n" fill="#2b1b16" cx="-12" cy="-41" r="2"/>
      <rect class="o" fill="#1f5a2a" x="-24" y="-17" width="24" height="8" rx="2.5"/>
      <path class="o" fill="#8b9690" d="M-27 0 L-27 -8 Q-27 -13 -20 -13 L-1 -13 Q15 -11 21 -4 L20 0 Z"/>
      <path class="n" fill="#727d78" d="M-25.8 -1.2 L-25.8 -4.4 L19.6 -4.4 L18.9 -1.2 Z"/>
    </g>
  </g>

  <!-- Not online: the cable hangs loose, plug and all. Joint where it leaves the silo. -->
  <g id="plug" data-parent="torso" transform="translate(-46 -104)">
    <g transform="translate(46 104)">
      <path class="t" style="stroke-width:5" d="M-44 -104 Q-58 -104 -58 -92 L-58 -80"/>
      <path class="t" style="stroke:#e0442c;stroke-width:2.4" d="M-44 -104 Q-58 -104 -58 -92 L-58 -80"/>
      <path class="t" style="stroke-width:4" d="M-60.6 -69 L-60.6 -62 M-55.4 -69 L-55.4 -62"/>
      <path class="t" style="stroke:#c9cdd0;stroke-width:1.8" d="M-60.6 -69 L-60.6 -62 M-55.4 -69 L-55.4 -62"/>
      <path class="o" style="stroke-width:2" fill="#fffdf5" d="M-64 -82 L-52 -82 L-53 -71 Q-58 -67.5 -63 -71 Z"/>
    </g>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(16 -72)">
    <g transform="translate(-16 72)">
      <rect class="o" fill="#4d4d4d" x="9" y="-76" width="14" height="46" rx="3"/>
      <path class="o" fill="#2f9140" d="M4 -70 L28 -70 L26 -44 L6 -44 Z"/>
      <path class="n" fill="#48ad59" d="M20 -67.6 L25.4 -67.6 L24 -46.4 L19.4 -46.4 Z"/>
      <!-- the shin is a hydraulic cylinder -->
      <path class="t" style="stroke-width:5" d="M28.5 -38 L28.5 -15"/>
      <path class="t" style="stroke:#c9cdd0;stroke-width:2.4" d="M28.5 -38 L28.5 -15"/>
      <rect class="o" fill="#2f9140" x="7" y="-40" width="18" height="30" rx="3"/>
      <path class="n" fill="#48ad59" d="M19 -37 L22.4 -37 L22.4 -13.5 L19 -13.5 Z"/>
      <!-- the knee is a wheel hub -->
      <circle class="o" fill="#ffd21f" cx="16" cy="-41" r="9.5"/>
      <circle class="n" fill="#e0b400" cx="16" cy="-41" r="5.4"/>
      <circle class="n" fill="#2b1b16" cx="16" cy="-41" r="2"/>
      <circle class="n" fill="#2b1b16" cx="16" cy="-48.2" r="1"/>
      <circle class="n" fill="#2b1b16" cx="23.2" cy="-41" r="1"/>
      <circle class="n" fill="#2b1b16" cx="16" cy="-33.8" r="1"/>
      <circle class="n" fill="#2b1b16" cx="8.8" cy="-41" r="1"/>
      <rect class="o" fill="#237832" x="4" y="-17" width="24" height="8" rx="2.5"/>
      <!-- steel klompen -->
      <path class="o" fill="#aab2b6" d="M1 0 L1 -8 Q1 -13 8 -13 L27 -13 Q43 -11 49 -4 L48 0 Z"/>
      <path class="n" fill="#8b9690" d="M2.2 -1.2 L2.2 -4.4 L47.6 -4.4 L46.9 -1.2 Z"/>
      <path class="t" style="stroke:#e9eef0;stroke-width:2" d="M24 -10.2 Q35 -9.4 42 -5.8"/>
      <circle class="n" fill="#2b1b16" cx="6.5" cy="-8.6" r="1.1"/>
      <circle class="n" fill="#2b1b16" cx="12.5" cy="-9.4" r="1.1"/>
    </g>
  </g>

  <!-- A corrugated silo for a body, with opa's cab let into the chest. Joint at the waist. -->
  <g id="torso" data-parent="hips" transform="translate(0 -84)">
    <g transform="translate(0 84)">
      <!-- exhaust stack, up through the roof -->
      <rect class="o" fill="#4d4d4d" x="-41" y="-210" width="9" height="34" rx="2.5"/>
      <path class="n" fill="#6f6f6f" d="M-38.6 -207.5 L-36.8 -207.5 L-36.8 -190 L-38.6 -190 Z"/>
      <!-- pelvis: an axle housing with a hub for each leg -->
      <path class="o" fill="#1f5a2a" d="M-33 -90 L33 -90 L29 -62 L-29 -62 Z"/>
      <circle class="o" style="stroke-width:2" fill="#e0b400" cx="-12" cy="-72" r="6.5"/>
      <circle class="o" style="stroke-width:2" fill="#ffd21f" cx="16" cy="-72" r="7"/>
      <circle class="n" fill="#2b1b16" cx="16" cy="-72" r="1.8"/>
      <!-- the silo -->
      <rect class="o" fill="#2f9140" x="-46" y="-178" width="92" height="92" rx="3"/>
      <path class="n" fill="#237832" d="M-44.7 -176.7 L-33.5 -176.7 L-33.5 -87.3 L-44.7 -87.3 Z"/>
      <path class="n" fill="#48ad59" d="M27 -176.7 L34.5 -176.7 L34.5 -87.3 L27 -87.3 Z"/>
      <path class="t" style="stroke:#1f5a2a;stroke-width:1.5" d="M-44.7 -168 L44.7 -168 M-44.7 -158 L44.7 -158 M-44.7 -148 L44.7 -148 M-44.7 -138 L44.7 -138 M-44.7 -128 L44.7 -128 M-44.7 -118 L44.7 -118 M-44.7 -109 L44.7 -109"/>
      <path class="n" fill="#ffd21f" d="M-44.7 -102 L44.7 -102 L44.7 -92 L-44.7 -92 Z"/>
      <path class="n" fill="#e0b400" d="M-44.7 -102 L-33.5 -102 L-33.5 -92 L-44.7 -92 Z"/>
      <path class="t" d="M-44.7 -102 L44.7 -102 M-44.7 -92 L44.7 -92"/>
      <rect class="o" fill="#237832" x="-48" y="-181" width="96" height="6.5" rx="2.5"/>
      <rect class="o" fill="#237832" x="-48" y="-91.5" width="96" height="6.5" rx="2.5"/>
      <!-- cone roof, galvanized -->
      <path class="o" fill="#c9cdd0" d="M-48 -180 L-30 -192 L32 -192 L48 -180 Z"/>
      <path class="t" style="stroke:#9aa3a7" d="M-22 -191 L-28 -181.5 M-2 -191 L-4 -181.5 M20 -191 L24 -181.5"/>
      <!-- beacon -->
      <rect class="o" style="stroke-width:1.8" fill="#3a3a3a" x="-22.5" y="-194.5" width="11" height="3.6" rx="1.2"/>
      <path class="o" style="stroke-width:2" fill="#ff8a1f" d="M-21 -194.5 L-21 -198 Q-17 -204.5 -13 -198 L-13 -194.5 Z"/>
      <path class="n" fill="#ffc37a" d="M-19 -197.6 Q-18.4 -200.2 -16.4 -200.8 Q-17.6 -199 -17.4 -197.6 Z"/>
      <!-- the cab: a window in the chest, with a little eave -->
      <rect class="o" fill="#cdeaf8" x="12" y="-162" width="32" height="38" rx="5"/>
      <path class="n" fill="#ffffff" fill-opacity="0.75" d="M15.5 -158.5 L22 -158.5 L15.5 -146 Z"/>
      <path class="n" fill="#34424b" d="M13.3 -131 L42.7 -131 L42.7 -128 Q42.7 -125.3 40 -125.3 L16 -125.3 Q13.3 -125.3 13.3 -128 Z"/>
      <path class="o" fill="#237832" d="M9 -167 L47 -167 L49 -161.5 L9 -161.5 Z"/>
      <!-- no signal, and proud of it -->
      <rect class="o" style="stroke-width:2" fill="#fffdf5" x="16" y="-122" width="24" height="19" rx="3"/>
      <circle class="n" fill="#2b1b16" cx="28" cy="-106.5" r="1.7"/>
      <path class="t" style="stroke-width:2" d="M24.82 -109.68 A4.5 4.5 0 0 1 31.18 -109.68 M22.34 -112.16 A8 8 0 0 1 33.66 -112.16 M19.87 -114.63 A11.5 11.5 0 0 1 36.13 -114.63"/>
      <path class="t" style="stroke:#d9342b;stroke-width:3" d="M19.5 -105.2 L36.5 -119.8"/>
      <!-- the only telephone on board has a dial -->
      <path class="o" style="stroke-width:2" fill="#e8e0cf" d="M-43 -110 L-41 -124 Q-40.5 -127 -37 -127 L-27 -127 Q-23.5 -127 -23 -124 L-21 -110 Z"/>
      <circle class="o" style="stroke-width:1.6" fill="#fffdf5" cx="-32" cy="-117.5" r="5.6"/>
      <circle class="n" fill="#2b1b16" cx="-28.4" cy="-117.5" r="0.9"/>
      <circle class="n" fill="#2b1b16" cx="-30.2" cy="-114.4" r="0.9"/>
      <circle class="n" fill="#2b1b16" cx="-33.8" cy="-114.4" r="0.9"/>
      <circle class="n" fill="#2b1b16" cx="-35.6" cy="-117.5" r="0.9"/>
      <circle class="n" fill="#2b1b16" cx="-33.8" cy="-120.6" r="0.9"/>
      <circle class="n" fill="#2b1b16" cx="-30.2" cy="-120.6" r="0.9"/>
      <path class="t" d="M-45.5 -128.5 q-3.4 2 0 4 q3.4 2 0 4 q-3.4 2 0 4 q3.4 2 0 4"/>
      <path class="o" style="stroke-width:1.8" fill="#3a3a3a" d="M-45 -130.5 Q-45 -134.5 -41 -134.5 L-23 -134.5 Q-19 -134.5 -19 -130.5 L-19 -128.5 L-24 -128.5 L-24.6 -130.6 L-39.4 -130.6 L-40 -128.5 L-45 -128.5 Z"/>
    </g>
  </g>

  <!-- A puff from the stack. Joint on top of the pipe; it swells and drifts up. -->
  <g id="smoke" data-parent="torso" transform="translate(-36.5 -213)">
    <circle class="o" style="stroke-width:1.8" fill="#c9cdd0" cx="-3" cy="-6" r="4.4"/>
    <circle class="o" style="stroke-width:1.8" fill="#dfe3e6" cx="3" cy="-8.5" r="5.2"/>
    <circle class="n" fill="#dfe3e6" cx="-0.5" cy="-7" r="3.6"/>
  </g>

  <!-- The rain flap on the stack. Joint at its hinge; every puff kicks it open. -->
  <g id="flap" data-parent="torso" transform="translate(-31.5 -211)">
    <path class="o" style="stroke-width:1.8" fill="#3a3a3a" d="M-11.5 -1.8 L0.5 -1.8 L0.5 1 L-11.5 1 Z"/>
    <circle class="n" fill="#2b1b16" cx="2.6" cy="-0.4" r="1.6"/>
  </g>

  <!-- The beacon's flash. Joint in the lamp; it blinks by shrinking to nothing. -->
  <g id="flash" data-parent="torso" transform="translate(-17 -199)">
    <path class="t" style="stroke-width:4.4" d="M0 -8 L0 -12 M-7 -5 L-10.5 -7.5 M7 -5 L10.5 -7.5"/>
    <path class="t" style="stroke:#ffb347;stroke-width:2.2" d="M0 -8 L0 -12 M-7 -5 L-10.5 -7.5 M7 -5 L10.5 -7.5"/>
  </g>

  <!-- An old bonnet for a head: headlights for eyes, the grille for a mouth. Joint at the neck. -->
  <g id="head" data-parent="torso" transform="translate(16 -192)">
    <g transform="translate(-16 192)">
      <!-- the aerial snapped off long ago -->
      <path class="t" style="stroke-width:2" d="M0 -219 L-7 -228.5 L-13 -222.5"/>
      <circle class="n" fill="#d9342b" cx="-13" cy="-222.5" r="2"/>
      <rect class="o" fill="#3a3a3a" x="4" y="-197" width="26" height="7.5" rx="2"/>
      <path class="o" fill="#2f9140" d="M-5 -195 L-5 -216 Q-5 -220 -1 -220 L36 -220 Q42 -220 42 -214 L42 -198 Q42 -195 39 -195 Z"/>
      <path class="t" style="stroke-width:2" d="M0 -210.5 L10 -210.5 M0 -206.5 L10 -206.5 M0 -202.5 L10 -202.5"/>
      <circle class="o" style="stroke-width:2" fill="#fff3b0" cx="24" cy="-209.5" r="5.6"/>
      <circle class="o" style="stroke-width:2" fill="#fff3b0" cx="36" cy="-210" r="4.6"/>
      <circle class="n" fill="#2b1b16" cx="26" cy="-209.5" r="2.1"/>
      <circle class="n" fill="#2b1b16" cx="37.4" cy="-210" r="1.8"/>
      <path class="t" style="stroke-width:3" d="M17.5 -216.6 L28.5 -214 M32 -214.2 L41 -216.4"/>
      <path class="o" style="stroke-width:1.8" fill="#3a3a3a" d="M24 -202.6 L42 -202.6 L42 -197.5 Q42 -196 40 -196 L24 -196 Z"/>
      <path class="t" style="stroke:#c9cdd0;stroke-width:1.5" d="M28 -201.8 L28 -196.8 M32 -201.8 L32 -196.8 M36 -201.8 L36 -196.8 M40 -201.8 L40 -197"/>
    </g>
  </g>

  <!-- Its flat cap, cut from an old mudguard. Joint at the back of the head, so it can hop. -->
  <g id="cap" data-parent="head" transform="translate(6 -220)">
    <g transform="translate(-6 220)">
      <path class="o" fill="#6b5b4b" d="M-9 -217.5 Q-11 -229.5 12 -229 Q30 -228.5 37 -222.5 L51 -219.5 L50.5 -216 L36 -217.5 Q16 -222.5 -9 -217.5 Z"/>
      <path class="t" style="stroke:#544538" d="M-2 -223.5 Q14 -227.5 30 -223"/>
      <circle class="n" fill="#3d3128" cx="13" cy="-227.6" r="1.3"/>
    </g>
  </g>

  <!-- Opa at the levers. Joint at his seat: he rocks back and forth as he works them. -->
  <g id="opa" data-parent="torso" transform="translate(26 -126)">
    <g transform="translate(-26 126)">
      <path class="t" style="stroke-width:2.2" d="M38 -126 L40 -139"/>
      <circle class="o" style="stroke-width:1.4" fill="#ffd21f" cx="40.2" cy="-140" r="2.3"/>
      <path class="o" style="stroke-width:1.8" fill="#2f5f9e" d="M17 -125.5 L18 -137 Q19 -141 24 -141 L28 -141 Q32 -141 32.5 -137 L33.5 -125.5 Z"/>
      <path class="t" style="stroke-width:5.4" d="M28 -136.5 L38 -138.6"/>
      <path class="t" style="stroke:#2f5f9e;stroke-width:3" d="M28 -136.5 L36.6 -138.3"/>
      <circle class="o" style="stroke-width:1.4" fill="#efc09a" cx="39" cy="-138.8" r="2.4"/>
      <path class="n" fill="#d9342b" d="M21 -141.6 L30.5 -141.6 L26 -137.2 Z"/>
      <circle class="o" style="stroke-width:1.8" fill="#efc09a" cx="26" cy="-148.5" r="7.6"/>
      <path class="o" style="stroke-width:1.5" fill="#efc09a" d="M32.8 -149.4 Q36.6 -147.2 33 -145.4"/>
      <path class="t" style="stroke-width:4" d="M28.8 -143.9 Q31.6 -142.4 34 -144.2"/>
      <path class="t" style="stroke:#f4f1ea;stroke-width:2.2" d="M28.8 -143.9 Q31.6 -142.4 34 -144.2"/>
      <circle class="n" fill="#2b1b16" cx="29.8" cy="-149.6" r="1.2"/>
      <path class="o" style="stroke-width:1.8" fill="#6b5b4b" d="M17.6 -150.5 Q16.8 -158.6 26 -158.4 Q32 -158.2 34.6 -154.4 L40 -152.8 L39.8 -150.9 L34 -151.8 Q26 -154.6 17.6 -150.5 Z"/>
    </g>
  </g>

  <!-- The near arm: a tractor rear wheel for a shoulder. Joint in its hub. -->
  <g id="arm_front" data-parent="torso" transform="translate(-8 -154)">
    <g transform="translate(8 154)">
      <path class="t" style="stroke-width:5" d="M-18.5 -146 L-18.5 -114"/>
      <path class="t" style="stroke:#c9cdd0;stroke-width:2.4" d="M-18.5 -146 L-18.5 -114"/>
      <rect class="o" fill="#2f9140" x="-16" y="-158" width="16" height="54" rx="4.5"/>
      <path class="n" fill="#48ad59" d="M-5.4 -130 L-2.2 -130 L-2.2 -108 L-5.4 -108 Z"/>
      <circle class="o" fill="#2b2b2b" cx="-8" cy="-154" r="22"/>
      <circle class="t" style="stroke:#5a5a5a;stroke-width:4;stroke-linecap:butt;stroke-dasharray:3.5 6.24" cx="-8" cy="-154" r="18.6"/>
      <circle class="o" fill="#ffd21f" cx="-8" cy="-154" r="12.6"/>
      <circle class="n" fill="#e0b400" cx="-8" cy="-154" r="7.4"/>
      <circle class="n" fill="#2b1b16" cx="-8" cy="-159" r="1"/>
      <circle class="n" fill="#2b1b16" cx="-3.2" cy="-155.5" r="1"/>
      <circle class="n" fill="#2b1b16" cx="-5.1" cy="-150" r="1"/>
      <circle class="n" fill="#2b1b16" cx="-10.9" cy="-150" r="1"/>
      <circle class="n" fill="#2b1b16" cx="-12.8" cy="-155.5" r="1"/>
      <circle class="o" style="stroke-width:1.8" fill="#c9981a" cx="-8" cy="-154" r="2.8"/>
    </g>
  </g>

  <!-- Its forearm, with a front-loader bucket for a fist. Joint at the elbow. -->
  <g id="forearm_front" data-parent="arm_front" transform="translate(-8 -108)">
    <g transform="rotate(60.95)">
      <rect class="o" fill="#c9cdd0" x="24" y="-3.8" width="19" height="7.6" rx="1.5"/>
      <rect class="o" fill="#2f9140" x="-5" y="-8.5" width="32" height="17" rx="5"/>
      <path class="n" fill="#48ad59" d="M1 -6 L22 -6 L22 -3 L1 -3 Z"/>
      <rect class="o" fill="#ffd21f" x="23" y="-9.5" width="6" height="19" rx="2"/>
    </g>
    <g transform="translate(8 108)">
      <!-- the far tooth and the far rim show over the near side plate -->
      <path class="o" style="stroke-width:2" fill="#aab2b6" d="M57 -60 L67 -54.4 L59.5 -54.6 Z"/>
      <path class="o" fill="#c9981a" d="M11 -97 L16 -100 Q33 -72 60 -58 L55 -55 Q28 -69 11 -97 Z"/>
      <path class="o" fill="#ffd21f" d="M11 -97 Q1 -80 6 -62 L55 -55 Q28 -69 11 -97 Z"/>
      <path class="n" fill="#e0b400" d="M8.6 -64.6 Q4.8 -79 11.2 -91 Q10.6 -77 15 -63.8 Z"/>
      <path class="t" style="stroke-width:5.5" d="M6.6 -61.6 L54.5 -54.8"/>
      <path class="t" style="stroke:#8b9690;stroke-width:2.6" d="M6.6 -61.6 L54.5 -54.8"/>
      <path class="o" style="stroke-width:2" fill="#c9cdd0" d="M51.5 -57.4 L63 -50.6 L53 -51 Z"/>
      <circle class="o" fill="#3a3a3a" cx="12.4" cy="-71.3" r="5.6"/>
      <circle class="n" fill="#c9cdd0" cx="12.4" cy="-71.3" r="2"/>
      <circle class="o" fill="#ffd21f" cx="-8" cy="-108" r="8"/>
      <circle class="n" fill="#2b1b16" cx="-8" cy="-108" r="2"/>
    </g>
  </g>
</svg>
