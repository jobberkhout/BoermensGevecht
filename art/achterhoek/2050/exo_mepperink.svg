<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -132 98 138" data-rig="humanoid">
  <title>Exo-Mepperink: boer in een zelf gelast exoskelet van trekkeronderdelen</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm: sleeve, a green strut and a steel clamp for a hand. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#274f86" d="M-6 -3 Q-8 10 -6 20 Q-1 24 5 20 Q7 8 6 -3 Z"/>
    <path class="o" fill="#237832" d="M-5.5 13 L13 9 L14.5 16 L-2 22.5 Z"/>
    <path class="o" fill="#8b9690" d="M13 7.5 L21 5 L22 9 L17.5 11.5 L22.5 14 L21.5 18 L13.5 16.5 Z"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#274f86" d="M-7 -3 L7 -3 L6 30 L-6 30 Z"/>
    <rect class="o" fill="#237832" x="-2.5" y="2" width="5" height="27" rx="2"/>
    <circle class="o" fill="#e0b400" cx="0" cy="14" r="4.6"/>
    <path class="o" fill="#d9a826" d="M-8 38 L-8 33 Q-8 29.5 -3 29.5 L5 29.5 Q14 31 16 36 L15 38 Z"/>
    <rect class="o" fill="#1f5a2a" x="-7.5" y="26.5" width="14" height="5" rx="1.8"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#2f5f9e" d="M-7 -3 L7 -3 L6 30 L-6 30 Z"/>
    <!-- hydraulic piston behind the strut -->
    <path class="t" style="stroke:#2b1b16;stroke-width:4.4" d="M-4.6 6 L-4.6 23"/>
    <path class="t" style="stroke:#c9cdd0;stroke-width:2" d="M-4.6 6 L-4.6 23"/>
    <rect class="o" fill="#2f9140" x="-2.5" y="2" width="5" height="27" rx="2"/>
    <circle class="o" fill="#ffd21f" cx="0" cy="14" r="4.8"/>
    <circle class="n" fill="#2b1b16" cx="0" cy="14" r="1.5"/>
    <!-- klompen, bolted into the frame -->
    <path class="o" fill="#f2c230" d="M-8 38 L-8 33 Q-8 29.5 -3 29.5 L5 29.5 Q14 31 16 36 L15 38 Z"/>
    <path class="t" style="stroke:#c9981a" d="M0 32.5 Q6 32.5 10.5 35"/>
    <rect class="o" fill="#237832" x="-7.5" y="26.5" width="14" height="5" rx="1.8"/>
    <circle class="n" fill="#ffd21f" cx="-4" cy="29" r="1.1"/>
    <circle class="n" fill="#ffd21f" cx="3.5" cy="29" r="1.1"/>
  </g>

  <!-- Kiel and zakdoek, with an engine on his back and a tractor grille for a chest plate. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <rect class="o" fill="#4d4d4d" x="-27" y="-58" width="5.5" height="26" rx="2"/>
    <path class="o" fill="#3a3a3a" d="M-29.5 -58 L-19 -61.5 L-19 -58.5 L-29.5 -55 Z"/>
    <rect class="o" fill="#3a3a3a" x="-30.5" y="-35" width="18" height="31" rx="3.5"/>
    <path class="t" style="stroke:#6b6b6b;stroke-width:1.8" d="M-27.5 -28 L-17 -28 M-27.5 -22 L-17 -22 M-27.5 -16 L-17 -16 M-27.5 -10 L-17 -10"/>
    <path class="o" fill="#2f5f9e" d="M-14 6 Q-17 -14 -14 -30 Q-11 -37 0 -37 Q12 -37 15 -30 Q18 -14 14 6 Z"/>
    <!-- shoulder straps of the frame -->
    <path class="o" fill="#237832" d="M-11.5 -22 L-6.5 -22 L-6 -36.4 L-10.5 -35 Z"/>
    <path class="o" fill="#237832" d="M8 -22 L13 -22 L12.5 -34.6 L8 -36.6 Z"/>
    <!-- zakdoek -->
    <path class="o" fill="#d9342b" d="M-8 -37 Q0.5 -33 9 -37 L4 -28.5 Q0.5 -26.5 -3 -28.5 Z"/>
    <circle class="n" fill="#ffffff" cx="-3" cy="-33.6" r="0.9"/>
    <circle class="n" fill="#ffffff" cx="2.8" cy="-32" r="0.9"/>
    <!-- chest plate: a bonnet front, grille and headlight included -->
    <path class="o" fill="#2f9140" d="M-13 -23 L15 -23 Q17 -23 17 -20 L16.5 -6 Q16.5 -4 14 -4 L-12.5 -4 Q-14.5 -4 -14.5 -6 L-15 -20 Q-15 -23 -13 -23 Z"/>
    <path class="n" fill="#48ad59" d="M-11.5 -20.8 L13.6 -20.8 Q14.8 -20.8 15 -19.4 L-12.8 -19.4 Q-12.6 -20.6 -11.5 -20.8 Z"/>
    <path class="t" style="stroke-width:1.8" d="M-10 -16 L3.5 -16 M-10 -12.6 L3.5 -12.6"/>
    <circle class="o" style="stroke-width:1.8" fill="#fff3b0" cx="10.5" cy="-14.2" r="3.2"/>
    <path class="n" fill="#ffd21f" d="M-14.2 -9.4 L16.4 -9.4 L16.3 -6.6 L-14.3 -6.6 Z"/>
    <path class="t" d="M-14.2 -9.4 L16.4 -9.4"/>
    <!-- hip frame with its two hubs -->
    <path class="o" fill="#237832" d="M-15 -2.5 L15 -2.5 L14.4 5.5 L-14.4 5.5 Z"/>
    <circle class="o" style="stroke-width:2" fill="#ffd21f" cx="-6" cy="1.6" r="3.6"/>
    <circle class="o" style="stroke-width:2" fill="#ffd21f" cx="6.5" cy="1.6" r="3.6"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#dba27f" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#efc09a" cx="2" cy="-21" rx="18" ry="17.5"/>
    <ellipse class="o" fill="#efc09a" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <!-- stubble -->
    <path class="n" fill="#8a6a4a" fill-opacity="0.55" d="M-9 -14 Q-9 -3.5 3 -3.5 Q17 -3.5 19.5 -13 Q12 -8 5 -9 Q-3 -9.5 -9 -14 Z"/>
    <path class="o" fill="#7a5236" d="M-16 -26 Q-18 -14 -12 -9 L-10.5 -22 Z"/>
    <!-- flat cap, welding goggles pushed up on it -->
    <path class="o" fill="#6b5b4b" d="M-16.5 -24 Q-18.5 -42 2 -42 Q16.5 -42 20 -32 L31.5 -28 L31 -24.5 L19 -27 Q2 -33 -16.5 -24 Z"/>
    <path class="t" style="stroke:#544538" d="M-10 -34 Q2 -39 14 -34.5"/>
    <path class="t" style="stroke-width:3.4" d="M-16.4 -29.5 Q-4 -37.5 8 -37"/>
    <circle class="o" fill="#3a3a3a" cx="11.5" cy="-36.5" r="5.6"/>
    <circle class="n" fill="#9fd3f2" cx="11.5" cy="-36.5" r="3.4"/>
    <path class="n" fill="#ffffff" d="M9.6 -38.6 Q11 -39.6 12.6 -39 Q11 -38.4 10.2 -37 Z"/>
    <circle class="n" fill="#2b1b16" cx="9.5" cy="-20" r="1.9"/>
    <circle class="n" fill="#2b1b16" cx="17.5" cy="-20" r="1.7"/>
    <path class="t" style="stroke-width:2.2" d="M5.5 -25.5 L12.5 -24 M15 -24 L20 -25.5"/>
    <path class="o" fill="#efc09a" d="M19.5 -18 Q25 -14.5 20 -12"/>
    <!-- a grin with a straw in the corner of it -->
    <path class="o" fill="#ffffff" d="M7 -10.5 Q13 -5 19 -11 Q13 -12.5 7 -10.5 Z"/>
    <path class="t" style="stroke:#c39a2b;stroke-width:2" d="M16.5 -9.4 L29 -13.5"/>
  </g>

  <!-- A puff from the exhaust. Joint on top of the pipe; it grows and drifts up. -->
  <g id="smoke" data-parent="torso" transform="translate(-24 -102)">
    <circle class="o" style="stroke-width:1.8" fill="#c9cdd0" cx="-3" cy="-6" r="4.4"/>
    <circle class="o" style="stroke-width:1.8" fill="#dfe3e6" cx="3" cy="-8.5" r="5.2"/>
    <circle class="n" fill="#dfe3e6" cx="-0.5" cy="-7" r="3.6"/>
  </g>

  <!-- The pitchfork on its piston rod. It slides in and out of the forearm along x. -->
  <g id="prop" data-parent="arm_front" transform="translate(27 -54)">
    <path class="t" style="stroke-width:5.4" d="M-12 0 L7 0"/>
    <path class="t" style="stroke:#c9cdd0;stroke-width:2.6" d="M-12 0 L7 0"/>
    <path class="t" style="stroke-width:5.6" d="M7 -10 L7 10 M7 -10 L22 -11 M7 0 L23 0 M7 10 L22 11"/>
    <path class="t" style="stroke:#aab2b6;stroke-width:2.6" d="M7 -10 L7 10 M7 -10 L22 -11 M7 0 L23 0 M7 10 L22 11"/>
  </g>

  <!-- The near arm: a hydraulic cylinder for a forearm. Joint at the shoulder hub. -->
  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#2f9140" d="M-6 -2 Q-7.5 8 -6 20 L6 20 Q7.5 8 6 -2 Z"/>
    <path class="n" fill="#48ad59" d="M1.5 1 L4.5 1 L4.8 14 L2 14 Z"/>
    <path class="o" fill="#2f9140" d="M-4 12.5 L20 12.5 Q22 12.5 22 14.5 L22 21.5 Q22 23.5 20 23.5 L-4 23.5 Z"/>
    <path class="n" fill="#48ad59" d="M0 14.6 L17 14.6 L17 16.4 L0 16.4 Z"/>
    <path class="o" fill="#ffd21f" d="M17.5 12.5 L20 12.5 Q22 12.5 22 14.5 L22 21.5 Q22 23.5 20 23.5 L17.5 23.5 Z"/>
    <circle class="o" fill="#ffd21f" cx="0" cy="18" r="5.2"/>
    <circle class="n" fill="#2b1b16" cx="0" cy="18" r="1.6"/>
    <circle class="o" fill="#ffd21f" cx="0" cy="0" r="6.8"/>
    <path class="t" style="stroke-width:1.8" d="M0 -6.8 L0 -2.6 M0 6.8 L0 2.6 M-6.8 0 L-2.6 0 M6.8 0 L2.6 0"/>
    <circle class="o" style="stroke-width:1.8" fill="#e0b400" cx="0" cy="0" r="2.6"/>
  </g>
</svg>
