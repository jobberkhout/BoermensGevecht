<svg xmlns="http://www.w3.org/2000/svg" viewBox="-116 -124 228 130" data-rig="vehicle">
  <title>De Vreter: zelfrijdende combine, de boer ligt te slapen in de cabine</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="chassis" transform="translate(0 0)"/>

  <!-- The unloading pipe, sticking out of the grain tank towards the back. Joint at its foot. -->
  <g id="spout" data-parent="body" transform="translate(-34 -92)">
    <path class="t" style="stroke-width:10.5" d="M0 0 L-50 -13 L-58 -5"/>
    <path class="t" style="stroke:#ffd21f;stroke-width:6" d="M0 0 L-50 -13 L-58 -5"/>
    <path class="t" style="stroke:#e0b400;stroke-width:2" d="M-12 -0.4 L-44 -8.8"/>
  </g>

  <!-- Chaff blown out of the back while it drives. Joint at the hood it comes out of. -->
  <g id="chaff" data-parent="body" transform="translate(-106 -46)">
    <path class="t" style="stroke-width:3.6" d="M-1 -7 L-5 -10 M-2 1 L-7 0 M0 8 L-4 12 M-7 -4 L-9 -1"/>
    <path class="t" style="stroke:#edcb58;stroke-width:1.8" d="M-1 -7 L-5 -10 M-2 1 L-7 0 M0 8 L-4 12 M-7 -4 L-9 -1"/>
  </g>

  <!-- The hull with the grain tank on top, and the cab seen from the inside. Joint in the middle. -->
  <g id="body" data-parent="chassis" transform="translate(-12 -50)">
    <g transform="translate(12 50)">
      <rect class="o" fill="#3a3a3a" x="-88" y="-37" width="120" height="12" rx="3"/>
      <!-- straw hood at the back -->
      <path class="o" fill="#1f5a2a" d="M-97 -64 L-108 -60 L-108 -40 L-97 -35 Z"/>
      <!-- grain tank, heaped -->
      <path class="o" fill="#f2c230" d="M-69 -93 Q-36 -114 -1 -93 Z"/>
      <path class="n" fill="#ffe27a" d="M-48 -100 Q-36 -106.5 -22 -101.5 Q-34 -103.5 -44 -98 Z"/>
      <path class="t" style="stroke:#c9981a;stroke-width:1.4" d="M-56 -95.5 L-54 -95.5 M-44 -96 L-42 -96 M-30 -97 L-28 -97 M-16 -95 L-14 -95 M-38 -101 L-36 -101 M-24 -100 L-22 -100 M-50 -99 L-48 -99"/>
      <rect class="o" fill="#237832" x="-72" y="-95" width="74" height="10" rx="2.5"/>
      <!-- hull -->
      <path class="o" fill="#2f9140" d="M-98 -34 L-98 -76 Q-98 -86 -88 -86 L22 -86 L26 -34 Z"/>
      <path class="n" fill="#48ad59" d="M-94 -78 Q-94 -82.5 -88 -82.5 L20 -82.5 L20.3 -79 L-94 -79 Z"/>
      <path class="n" fill="#237832" d="M-96.7 -52 L24.6 -52 L25.9 -35.3 L-96.7 -35.3 Z"/>
      <path class="n" fill="#ffd21f" d="M-96.7 -52 L24.6 -52 L24.9 -47.6 L-96.7 -47.6 Z"/>
      <path class="t" d="M-96.7 -52 L24.6 -52 M-96.7 -47.6 L24.9 -47.6"/>
      <path class="t" d="M-58 -79 L-58 -52 M-20 -79 L-20 -52"/>
      <path class="t" style="stroke-width:2.2" d="M-90 -72 L-74 -72 M-90 -67 L-74 -67 M-90 -62 L-74 -62"/>
      <path class="t" style="stroke-width:2" d="M-26 -66 L-26 -60"/>
      <!-- the cab: its base and what is inside it -->
      <path class="o" fill="#2f9140" d="M-2 -64 L-2 -78 L48 -78 L48 -70 Q48 -64 42 -64 Z"/>
      <path class="n" fill="#237832" d="M-0.7 -65.3 L-0.7 -69 L46.7 -69 Q46.4 -65.6 42 -65.3 Z"/>
      <path class="o" fill="#34424b" d="M2 -78 L2 -106 L38 -106 L46 -78 Z"/>
      <!-- seat and dashboard; there is no steering wheel any more -->
      <path class="o" fill="#5a5a5a" d="M4 -78 L4 -98 Q4 -101 7 -101 L8.6 -101 L10.6 -78 Z"/>
      <path class="o" fill="#5a5a5a" d="M33 -78 L35.6 -88 L42.2 -88 L44.6 -78 Z"/>
    </g>
  </g>

  <!-- The boer: flat out in his seat, cap over his eyes, klompen on the dashboard. Joint at the seat. -->
  <g id="driver" data-parent="body" transform="translate(14 -80)">
    <g transform="translate(-14 80)">
      <!-- legs up, klompen against the windscreen -->
      <path class="o" fill="#274f86" d="M19 -83.5 L33.4 -93.6 L36.6 -89.4 L23 -78.6 Z"/>
      <path class="o" fill="#f2c230" d="M31.6 -92 Q30.6 -101.4 37.4 -103 Q42.6 -102.4 41.4 -96.6 L38.4 -89.4 Q34.4 -88 31.6 -92 Z"/>
      <path class="t" style="stroke:#c9981a" d="M35 -99.6 Q38 -100 39.6 -97.4"/>
      <!-- slumped body, hand on his belly -->
      <path class="o" fill="#2f5f9e" d="M7.6 -89.4 L18 -91.4 L26.4 -81.4 L22.6 -77.6 L10.6 -78.4 Z"/>
      <circle class="o" style="stroke-width:1.8" fill="#f0c19a" cx="20.6" cy="-84.6" r="2.7"/>
      <!-- head back, mouth open, cap pulled over his eyes -->
      <circle class="o" fill="#f0c19a" cx="12.4" cy="-95.4" r="7.4"/>
      <ellipse class="n" fill="#2b1b16" cx="17" cy="-91.6" rx="1.4" ry="1.9"/>
      <path class="o" fill="#2f9140" d="M4.8 -96.4 Q4 -104.4 11.6 -104.6 Q17.6 -104.4 19.4 -99.4 L24.4 -96.4 L23.4 -93.6 L17.6 -95.4 Q11 -99.4 4.8 -96.4 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#ffd21f" d="M12.4 -104.2 Q17.6 -103.6 19.4 -99.4 L14.6 -99 Z"/>
    </g>
  </g>

  <!-- He snores a bubble. Joint at his nose. -->
  <g id="bubble" data-parent="driver" transform="translate(19.4 -93.4)">
    <circle class="o" style="stroke-width:1.6" fill="#e3f4fb" fill-opacity="0.9" cx="4" cy="-4.4" r="4"/>
    <path class="n" fill="#ffffff" d="M2.2 -6.6 Q3.8 -7.8 5.6 -7 Q3.8 -6.4 3 -5 Z"/>
  </g>

  <!-- Glass, pillars and roof: drawn over the driver. -->
  <g id="cab" data-parent="body" transform="translate(22 -92)">
    <g transform="translate(-22 92)">
      <path class="n" fill="#bfe6f5" fill-opacity="0.2" d="M2 -78 L2 -106 L38 -106 L46 -78 Z"/>
      <path class="n" fill="#ffffff" fill-opacity="0.4" d="M26.4 -98 L28.6 -105 L32 -105 L30 -98 Z"/>
      <path class="o" fill="#2f9140" d="M-1 -77 L-1 -106 L3.6 -106 L3.6 -77 Z"/>
      <path class="o" fill="#2f9140" d="M36 -106 L40.4 -106 L48.6 -77 L44 -77 Z"/>
      <path class="o" fill="#2f9140" d="M-5 -105 Q-5 -113 3 -113 L38 -113 Q46.5 -113 46.5 -105 Z"/>
      <path class="n" fill="#48ad59" d="M-1.5 -110.5 L38 -110.5 Q42 -110.5 43 -108.5 L-2.6 -108.5 Q-2.4 -110 -1.5 -110.5 Z"/>
      <!-- the dome that does the steering -->
      <path class="o" fill="#f4f4ee" d="M4 -113 Q4 -120.5 11.5 -120.5 Q19 -120.5 19 -113 Z"/>
      <circle class="n" fill="#3fc8f0" cx="14.6" cy="-116.4" r="1.7"/>
      <!-- mirror -->
      <path class="t" style="stroke-width:2" d="M44 -93 L53 -96"/>
      <rect class="o" fill="#34424b" x="52" y="-102" width="4.6" height="11" rx="1.5"/>
    </g>
  </g>

  <g id="beacon" data-parent="cab" transform="translate(32 -113)">
    <path class="o" fill="#ff9a1f" d="M-4.4 0 Q-4.4 -6.6 0 -6.6 Q4.4 -6.6 4.4 0 Z"/>
  </g>

  <!-- The header: feeder, an eye that does not blink, and a jaw full of teeth. Joint where it hangs from the hull. -->
  <g id="header" data-parent="chassis" transform="translate(28 -46)">
    <g transform="translate(-28 46)">
      <path class="o" fill="#2f9140" d="M24 -60 L58 -42 L58 -18 L24 -34 Z"/>
      <path class="n" fill="#48ad59" d="M27 -55.6 L56 -40.2 L56 -37.4 L27 -52.6 Z"/>
      <!-- the arm that carries the reel -->
      <path class="t" style="stroke-width:7" d="M60 -53 L82 -42"/>
      <path class="t" style="stroke:#237832;stroke-width:3.4" d="M60 -53 L82 -42"/>
      <!-- trough -->
      <path class="o" fill="#2f9140" d="M54 -57 L62 -57 Q66 -57 66 -51 L66 -25 Q68 -13.5 80 -12.5 L99 -11.5 Q105 -11 105 -6.5 L105 -3 L54 -3 Z"/>
      <path class="n" fill="#237832" d="M55.3 -55.7 L60 -55.7 L60 -4.3 L55.3 -4.3 Z"/>
      <path class="n" fill="#ffd21f" d="M60 -8.6 L103.7 -8.6 L103.7 -5 L60 -5 Z"/>
      <path class="t" d="M60 -8.6 L103.7 -8.6"/>
      <!-- teeth -->
      <path class="o" style="stroke-width:2" fill="#eef1f2" d="M69 -12.6 L73.5 -22.5 L78 -12.4 Z M78 -12.4 L82.5 -22.5 L87 -12 Z M87 -12 L91.5 -22 L96 -11.6 Z M96 -11.6 L100.5 -20.5 L104.4 -9.6 Z"/>
      <!-- the eye, under a heavy brow -->
      <circle class="o" fill="#fff3b0" cx="45.4" cy="-49.4" r="7.8"/>
      <circle class="n" fill="#2b1b16" cx="48.2" cy="-47.6" r="3.3"/>
      <circle class="n" fill="#ffffff" cx="49.4" cy="-48.9" r="1"/>
      <path class="o" fill="#1f5a2a" d="M34.6 -60.6 L55.6 -52.2 L54.6 -47.8 L33.8 -56 Z"/>
    </g>
  </g>

  <!-- The reel. It turns as the machine drives, and faster when it bites. Joint at its hub. -->
  <g id="reel" data-parent="header" transform="translate(82 -42)">
    <path class="t" style="stroke-width:2.2" d="M16 0 L8 13.86 L-8 13.86 L-16 0 L-8 -13.86 L8 -13.86 Z"/>
    <path class="t" style="stroke-width:2.6" d="M0 0 L16 0 M0 0 L8 13.86 M0 0 L-8 13.86 M0 0 L-16 0 M0 0 L-8 -13.86 M0 0 L8 -13.86"/>
    <g>
      <path class="o" style="stroke-width:1.8" fill="#ffd21f" d="M14.6 -5.4 L19.4 -5.4 L23.4 0 L19.4 5.4 L14.6 5.4 Z"/>
    </g>
    <g transform="rotate(60)">
      <path class="o" style="stroke-width:1.8" fill="#ffd21f" d="M14.6 -5.4 L19.4 -5.4 L23.4 0 L19.4 5.4 L14.6 5.4 Z"/>
    </g>
    <g transform="rotate(120)">
      <path class="o" style="stroke-width:1.8" fill="#ffd21f" d="M14.6 -5.4 L19.4 -5.4 L23.4 0 L19.4 5.4 L14.6 5.4 Z"/>
    </g>
    <g transform="rotate(180)">
      <path class="o" style="stroke-width:1.8" fill="#ffd21f" d="M14.6 -5.4 L19.4 -5.4 L23.4 0 L19.4 5.4 L14.6 5.4 Z"/>
    </g>
    <g transform="rotate(240)">
      <path class="o" style="stroke-width:1.8" fill="#ffd21f" d="M14.6 -5.4 L19.4 -5.4 L23.4 0 L19.4 5.4 L14.6 5.4 Z"/>
    </g>
    <g transform="rotate(300)">
      <path class="o" style="stroke-width:1.8" fill="#ffd21f" d="M14.6 -5.4 L19.4 -5.4 L23.4 0 L19.4 5.4 L14.6 5.4 Z"/>
    </g>
    <circle class="o" fill="#ffd21f" cx="0" cy="0" r="5"/>
    <circle class="n" fill="#2b1b16" cx="0" cy="0" r="1.7"/>
  </g>

  <g id="wheel_back" data-parent="chassis" transform="translate(-70 -17)">
    <circle class="o" fill="#2b2b2b" cx="0" cy="0" r="17"/>
    <circle class="n" style="stroke:#474747" fill="none" stroke-width="4.4" stroke-dasharray="4.4 4.6" cx="0" cy="0" r="14"/>
    <circle class="o" fill="#ffd21f" cx="0" cy="0" r="8.6"/>
    <path class="t" style="stroke-width:2" d="M0 -8.6 L0 -3.4 M0 8.6 L0 3.4 M-8.6 0 L-3.4 0 M8.6 0 L3.4 0"/>
    <circle class="o" fill="#e0b400" cx="0" cy="0" r="3.4"/>
  </g>

  <g id="wheel_front" data-parent="chassis" transform="translate(14 -26)">
    <circle class="o" fill="#2b2b2b" cx="0" cy="0" r="26"/>
    <circle class="n" style="stroke:#474747" fill="none" stroke-width="6.4" stroke-dasharray="6 6.2" cx="0" cy="0" r="21.8"/>
    <circle class="o" fill="#ffd21f" cx="0" cy="0" r="14"/>
    <path class="t" style="stroke-width:2.2" d="M0 -14 L0 -5.6 M0 14 L0 5.6 M-14 0 L-5.6 0 M14 0 L5.6 0 M-9.9 -9.9 L-4 -4 M9.9 9.9 L4 4 M-9.9 9.9 L-4 4 M9.9 -9.9 L4 -4"/>
    <circle class="o" fill="#e0b400" cx="0" cy="0" r="5.6"/>
  </g>
</svg>
