<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -126 100 132" data-rig="humanoid">
  <title>Balink: boer in overall die een roze ingepakte kuilbaal voor zich uit rolt</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(-23 -38)"/>

  <!-- The far arm reaches across to the top of the bale; only the hand and wrist show past his chest. -->
  <g id="arm_back" data-parent="torso" transform="translate(-32 -72)">
    <path class="o" fill="#dba27f" d="M17.5 -1.2 L32.5 1 L31.5 8.2 L16.5 6 Z"/>
    <circle class="o" fill="#dba27f" cx="35" cy="5" r="4.4"/>
    <path class="o" fill="#235a30" d="M0.8 -5.4 L19.6 -1.9 L18.4 7.2 L-0.8 5.4 Q-5.5 4 -5.5 0 Q-5.5 -5 0.8 -5.4 Z"/>
  </g>

  <!-- Green overall over work boots. -->
  <g id="leg_back" data-parent="hips" transform="translate(-28 -38)">
    <path class="o" fill="#26282b" d="M-6.5 23 L6.5 23 L6.5 31 Q13 32 15.5 35.5 L15.5 38 L-8 38 L-8 32 Z"/>
    <path class="o" fill="#235a30" d="M-7 -3 L7 -3 L6.5 26.5 L-6.5 26.5 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(-18 -38)">
    <path class="o" fill="#33363a" d="M-6.5 23 L6.5 23 L6.5 31 Q13 32 15.5 35.5 L15.5 38 L-8 38 L-8 32 Z"/>
    <path class="n" fill="#191a1c" d="M-7.3 35.8 L14.8 35.8 L14.8 37.4 L-7.3 37.4 Z"/>
    <path class="t" style="stroke:#5a5e64" d="M9 32 Q10.2 34 9.2 35.6"/>
    <path class="t" style="stroke:#c9cdd0;stroke-width:1.3" d="M1.5 28.6 L5.6 29.2 M1.8 31 L5.8 31.5"/>
    <path class="o" fill="#2c7a3e" d="M-7 -3 L7 -3 L6.5 26.5 L-6.5 26.5 Z"/>
    <path class="n" fill="#3f9b57" d="M1 -1 L5 -1 L4.6 24.5 L1.5 24.5 Z"/>
  </g>

  <g id="torso" data-parent="hips" transform="translate(-23 -40)">
    <path class="o" fill="#2c7a3e" d="M-15.5 8 Q-18.5 -14 -15 -30 Q-12 -37 0 -37 Q13 -37 16 -30 Q19.5 -13 16.5 8 Z"/>
    <path class="n" fill="#235a30" d="M-14.5 7 Q-17 -14 -14 -29 Q-10 -20 -9.5 7 Z"/>
    <path class="t" style="stroke:#1f5a2a" d="M-15.7 -3 L17.3 -3"/>
    <!-- a T-shirt under the open collar -->
    <path class="o" fill="#f4ecdc" d="M-7 -37.5 Q1 -33 9.5 -37.5 L6 -30.5 Q1.5 -28.5 -3 -30.5 Z"/>
    <path class="o" fill="#2c7a3e" d="M-10 -37 L-4 -36.2 L-2.5 -28 L-9 -31 Z"/>
    <path class="o" fill="#2c7a3e" d="M12 -37 L6.5 -36.2 L4.5 -28 L10.5 -31 Z"/>
  </g>

  <!-- The red zakdoek of his grandfather's day, these days in the back pocket. Joint at the pocket. -->
  <g id="rag" data-parent="torso" transform="translate(-34 -42)">
    <path class="o" fill="#d9342b" d="M-3.2 -1 L3.2 -1 Q4.2 4 5 9.5 L1.8 7.6 L-0.4 12 L-2.6 8 L-5.6 10 Q-4.5 4 -3.2 -1 Z"/>
    <circle class="n" fill="#ffffff" cx="-1.5" cy="3.4" r="0.8"/>
    <circle class="n" fill="#ffffff" cx="1.7" cy="5" r="0.8"/>
    <circle class="n" fill="#ffffff" cx="-1.2" cy="7.2" r="0.8"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(-22 -76)">
    <rect class="o" fill="#dba27f" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#efc09a" cx="2" cy="-21" rx="18" ry="17.5"/>
    <!-- a ginger mullet: short under the cap, long in the neck -->
    <path class="o" fill="#c8642a" d="M-16 -27 Q-19.5 -17 -18 -8 Q-17.5 -3 -19 0.5 Q-12.5 2.5 -6 -1 Q-5.5 -6 -9.5 -10 L-10.5 -22 Z"/>
    <ellipse class="o" fill="#efc09a" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <!-- an earbud -->
    <circle class="n" fill="#ffffff" cx="-8.4" cy="-18.6" r="1.8"/>
    <path fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" d="M-8 -17.4 L-7.2 -13.4"/>
    <circle class="n" fill="#d98a5f" cx="3.5" cy="-15" r="0.9"/>
    <circle class="n" fill="#d98a5f" cx="6.5" cy="-13" r="0.9"/>
    <circle class="n" fill="#d98a5f" cx="2.6" cy="-11.4" r="0.9"/>
    <!-- cap with a yellow front -->
    <path class="o" fill="#2f9140" d="M-16.5 -24 Q-18 -42 2 -42 Q18 -42 20.5 -29 Q2 -34 -16.5 -24 Z"/>
    <path class="o" fill="#ffd21f" d="M6 -41.5 Q18 -41 20.5 -29 L7 -32.5 Z"/>
    <path class="o" fill="#237832" d="M18 -32.5 L32 -28 L31 -24.5 L17.5 -27 Z"/>
    <circle class="n" fill="#2b1b16" cx="9.5" cy="-20" r="1.9"/>
    <circle class="n" fill="#2b1b16" cx="17.5" cy="-20" r="1.7"/>
    <path class="t" style="stroke-width:2.2;stroke:#a84f1e" d="M5.5 -25.2 L12.5 -24.2 M15 -24.2 L20 -25.4"/>
    <path class="o" fill="#efc09a" d="M19.5 -18 Q25 -14.5 20 -12"/>
    <!-- the thin moustache that goes with the mullet -->
    <path class="t" style="stroke:#c8642a;stroke-width:2.4" d="M11.5 -10.6 Q16 -12.4 20.8 -10.2"/>
    <path class="t" style="stroke-width:1.9" d="M11.5 -6.8 L17 -7.3"/>
  </g>

  <!-- The near arm: sleeve rolled up, elbow back, hand on top of the bale. -->
  <g id="arm_front" data-parent="torso" transform="translate(-13 -72)">
    <path class="o" fill="#efc09a" d="M-9.6 11.6 L4.9 4.8 L8.1 11.6 L-6.4 18.4 Z"/>
    <circle class="o" fill="#efc09a" cx="8.5" cy="7" r="4.6"/>
    <path class="o" fill="#2c7a3e" d="M-5.5 -4 Q0 -7.5 5.5 -3.5 Q4.5 8 -2.5 18.5 Q-7.5 22 -13 17.5 Q-12.5 7 -5.5 -4 Z"/>
    <path class="t" style="stroke:#1f5a2a" d="M-12.4 12.6 Q-7 16.6 -0.6 14"/>
  </g>

  <!-- The bale, seen on its flat end. This part stays upright: colour, shade and shine. Joint in the middle. -->
  <g id="bale" transform="translate(9 -33)">
    <circle class="o" fill="#f29bbd" cx="0" cy="0" r="33"/>
    <path class="n" fill="#e283ab" d="M-29.6 11 Q-18 31 0 31.2 Q18 31 29.6 11 Q17 25 0 25 Q-17 25 -29.6 11 Z"/>
    <path class="n" fill="#f9c9de" d="M-27.5 -12 Q-21 -26.5 -6 -30.6 Q-17.5 -23.5 -23 -10.5 Z"/>
  </g>

  <!-- What turns: the folds of the wrap, a tear taped shut with silage sticking out anyway, and his own muddy handprints. -->
  <g id="bale_wrap" data-parent="bale" transform="translate(9 -33)">
    <path class="t" style="stroke:#d5699b" d="M0.5 -6 Q2 -16 -0.5 -28 M5 -3.5 Q13 -9 21.5 -17 M6.5 1 Q16 2 27.5 -1.5 M4 5 Q9.5 13.5 17.5 21.5 M-0.5 6.5 Q-1.5 16 2 27.5 M-5 4 Q-12 10 -19.5 20 M-6.5 0 Q-16 0.5 -27.5 3.5 M-4.5 -4.5 Q-11 -10.5 -20 -19"/>
    <circle class="n" fill="#d5699b" cx="0" cy="0" r="2.6"/>
    <path fill="none" stroke="#7a9a3a" stroke-width="1.8" stroke-linecap="round" d="M13.5 -21.5 L16 -24.5 M14.8 -19.2 L18.6 -20.6 M11.5 -22.8 L12.6 -26.6"/>
    <g transform="translate(9.5 -17) rotate(28)">
      <rect class="o" style="stroke-width:1.4" fill="#c9cdd0" x="-5.6" y="-1.8" width="11.2" height="3.6" rx="0.8"/>
      <rect class="o" style="stroke-width:1.4" fill="#dfe6ea" x="-1.8" y="-5.6" width="3.6" height="11.2" rx="0.8"/>
    </g>
    <g transform="translate(-7 18) rotate(200)">
      <ellipse class="n" fill="#8a6f4e" fill-opacity="0.85" cx="0" cy="1.5" rx="3" ry="2.6"/>
      <path fill="none" stroke="#8a6f4e" stroke-opacity="0.85" stroke-width="1.5" stroke-linecap="round" d="M-2.6 -1.6 L-3.4 -4.2 M-0.9 -2.2 L-1.1 -5.4 M0.9 -2.2 L1.2 -5.2 M2.5 -1.5 L3.5 -4 M3.4 1.2 L5.4 0.2"/>
    </g>
    <g transform="translate(18.5 8.5) rotate(110)">
      <ellipse class="n" fill="#8a6f4e" fill-opacity="0.85" cx="0" cy="1.5" rx="3" ry="2.6"/>
      <path fill="none" stroke="#8a6f4e" stroke-opacity="0.85" stroke-width="1.5" stroke-linecap="round" d="M-2.6 -1.6 L-3.4 -4.2 M-0.9 -2.2 L-1.1 -5.4 M0.9 -2.2 L1.2 -5.2 M2.5 -1.5 L3.5 -4 M3.4 1.2 L5.4 0.2"/>
    </g>
  </g>
</svg>
