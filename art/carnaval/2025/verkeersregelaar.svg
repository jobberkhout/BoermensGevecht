<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -134 98 140" data-rig="humanoid">
  <title>De Verkeersregelaar: vrijwilliger in een oranje hesje met een dranghek voor zich, keycord met certificaat, fluitje in de mond, hand omhoog: hier komt niemand langs</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(-20 -38)"/>

  <!-- The far arm reaches forward to the top of the barrier. Only its fingers show, and those are drawn on the barrier. -->
  <g id="arm_back" data-parent="torso" transform="translate(-28 -72)">
    <path class="o" fill="#24508f" d="M-6 -3 Q-8 9 -5 19 L6 19 Q8 9 6 -3 Z"/>
  </g>

  <!-- Dark trousers and safety shoes: he takes this seriously. -->
  <g id="leg_back" data-parent="hips" transform="translate(-25 -38)">
    <path class="o" fill="#2c2c36" d="M-7 -3 L7 -3 L6 30 L-6 30 Z"/>
    <path class="o" fill="#1a1a20" d="M-7.4 33 Q-7.4 30.4 -4 30.4 L4 30.4 Q12 31 14 34.6 L14 38 L-7.4 38 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(-15 -38)">
    <path class="o" fill="#383846" d="M-7 -3 L7 -3 L6 30 L-6 30 Z"/>
    <path class="t" style="stroke:#55556a" d="M0.5 0 L0.5 28"/>
    <path class="o" fill="#22222a" d="M-7.4 33 Q-7.4 30.4 -4 30.4 L4 30.4 Q12 31 14 34.6 L14 38 L-7.4 38 Z"/>
    <path class="n" fill="#5d6074" d="M5 32.6 Q10 33 12.4 35 L6 34.6 Z"/>
  </g>

  <!-- The orange vest over his kiel, with the reflective stripes, and the lanyard with his certificate. -->
  <g id="torso" data-parent="hips" transform="translate(-20 -40)">
    <path class="o" fill="#2f62b0" d="M-15 7 Q-18 -14 -14.6 -30 Q-11.6 -37 0 -37 Q12.6 -37 15.6 -30 Q19 -14 15 7 Z"/>
    <path class="o" fill="#f47a20" d="M-15.4 7 Q-17.6 -12 -14.4 -28 L-8 -36 L-3 -36 L-1 -18 L5 -18 L8 -36 L12 -36 Q16 -30 16.4 -20 Q18.4 -6 15.4 7 Z"/>
    <path class="n" fill="#d9621a" d="M-14.4 6 Q-16.4 -12 -13.6 -27 L-10.4 -31 Q-12 -14 -9.4 6 Z"/>
    <path class="n" fill="#e6ecef" d="M-16.4 -6 L17.4 -6 L17.4 -1.6 L-16.6 -1.6 Z M-16.4 -14 L17 -14 L17 -10 L-16.6 -10 Z"/>
    <path class="t" style="stroke:#a9b4ba;stroke-width:1" d="M-16.4 -6 L17.4 -6 M-16.6 -1.6 L17.4 -1.6 M-16.4 -14 L17 -14 M-16.6 -10 L17 -10"/>
    <!-- the red farmer's handkerchief, neatly tucked in -->
    <path class="o" style="stroke-width:1.8" fill="#d8342b" d="M-5 -36.6 Q1.6 -33 8 -36.6 L5 -30 L-1.6 -30 Z"/>
    <circle class="n" fill="#ffffff" cx="1.6" cy="-33.2" r="0.8"/>
    <!-- the lanyard and the card from the online course: a photo and a tick -->
    <path fill="none" stroke="#2b1b16" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="M-6 -35 L-1 -16 M9 -35 L4 -16"/>
    <path fill="none" stroke="#2f9a48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M-6 -35 L-1 -16 M9 -35 L4 -16"/>
    <rect class="o" style="stroke-width:1.8" fill="#ffffff" x="-4.4" y="-17" width="11.6" height="13.6" rx="1.4"/>
    <rect class="n" fill="#bcd6ee" x="-2.8" y="-15.2" width="4.4" height="5.2"/>
    <circle class="n" fill="#f0c0a0" cx="-0.6" cy="-13" r="1.5"/>
    <path fill="none" stroke="#2f9a48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M2.6 -13 L4 -11.4 L6 -14.6"/>
    <path fill="none" stroke="#9aa3b2" stroke-width="1" stroke-linecap="round" d="M-2.6 -7.6 L5.8 -7.6 M-2.6 -5.6 L4 -5.6"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(-19 -76)">
    <rect class="o" fill="#e3a284" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#f0b897" cx="2" cy="-21" rx="18" ry="17.6"/>
    <ellipse class="o" fill="#f0b897" cx="-8.6" cy="-18.6" rx="3.4" ry="4.8"/>
    <!-- a grey flat-top, cut short for the occasion -->
    <path class="o" fill="#8a8a90" d="M-16.4 -18 Q-19 -30 -15.6 -36.6 L-12 -40.4 L16 -40.4 Q19.6 -36.6 19.4 -30.6 Q12 -34 4 -33.4 Q-6 -33 -10.4 -24 Q-12 -19 -16.4 -18 Z"/>
    <path class="n" fill="#a8a8ae" d="M-11 -38.6 L14 -38.6 L14.6 -36.6 L-12 -36.6 Z"/>
    <!-- stern: eyebrows down, eyes narrowed, a moustache of authority -->
    <path class="t" style="stroke-width:2.6" d="M5.4 -27.4 L12.4 -24.6 M15.4 -24.6 L20.6 -27"/>
    <path class="n" fill="#2b1b16" d="M7.6 -21.4 Q10 -23 12.4 -21.4 Q10 -20 7.6 -21.4 Z M15.4 -21.4 Q17.4 -22.8 19.4 -21.4 Q17.4 -20 15.4 -21.4 Z"/>
    <path class="o" fill="#f0b897" d="M20 -18.4 Q24.6 -15.4 20.4 -13"/>
    <path class="o" style="stroke-width:1.8" fill="#6e6a66" d="M8.6 -12.6 Q13.6 -15.4 20 -12.4 Q19.4 -9.4 15.6 -10.4 Q12 -9 8.6 -12.6 Z"/>
    <ellipse class="n" fill="#e5583f" fill-opacity="0.4" cx="5" cy="-12" rx="3.6" ry="2.4"/>
    <!-- the steward's cap: navy, a reflective band, and a short peak -->
    <path class="o" fill="#1d2a4a" d="M-15.6 -30 Q-17.4 -48 2 -48.6 Q19 -49 19.4 -33 Z"/>
    <path class="n" fill="#2c3d66" d="M-10 -44 Q0 -47.4 10 -46 Q2 -45 -8 -41 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#f47a20" d="M-16.6 -36 Q2 -40.6 19.6 -38 L19.6 -33 Q2 -35.6 -16.2 -31 Z"/>
    <path class="n" fill="#e6ecef" d="M-15.6 -34.4 Q2 -38.4 19 -35.8 L19 -34.6 Q2 -37.2 -15.6 -33.2 Z"/>
    <path class="o" style="stroke-width:2" fill="#14203a" d="M15 -33.6 L28 -31.4 Q29.6 -29 27 -28.6 L14.6 -30 Z"/>
  </g>

  <!-- The whistle, in his mouth at all times, on a cord. Joint at his lips. -->
  <g id="whistle" data-parent="head" transform="translate(-4 -86)">
    <path fill="none" stroke="#2b1b16" stroke-width="1" stroke-linecap="round" d="M9 4.4 Q6 14 1 22"/>
    <path class="o" style="stroke-width:1.6" fill="#c4ccd2" d="M-1 -1.8 L6 -1.8 L6 1.8 L-1 1.8 Z"/>
    <circle class="o" style="stroke-width:1.6" fill="#c4ccd2" cx="9" cy="1.4" r="3.8"/>
    <circle class="n" fill="#ffffff" cx="8" cy="0.4" r="1"/>
    <path class="n" fill="#2b1b16" d="M3 -1.8 L5 -1.8 L5 -0.2 L3 -0.2 Z"/>
  </g>

  <!-- The barrier: one section of galvanised dranghek, a good deal wider than it is tall, held upright in
       front of him at an angle. Joint at the middle of its feet. -->
  <g id="barrier" data-parent="torso" transform="translate(16 -2)">
    <g transform="translate(-16 2)">
      <!-- the flat feet, sticking out either side of each end -->
      <path class="o" fill="#8e979f" d="M-15 -1 L3 -5 L5 -3 L-13 1.6 Z M33 -5 L48 -8.4 L49.6 -6.4 L34.6 -3 Z"/>
      <!-- the frame: a tube all round, the two end tubes going down to the feet -->
      <path fill="none" stroke="#2b1b16" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M-5 -3 L-5 -70 L41 -63 L41 -6 M-5 -16 L41 -22"/>
      <path fill="none" stroke="#c4ccd2" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="M-5 -3 L-5 -70 L41 -63 L41 -6 M-5 -16 L41 -22"/>
      <path fill="none" stroke="#eef2f4" stroke-width="1.2" stroke-linecap="round" d="M-5.9 -64 L-5.9 -20 M2 -70.2 L30 -66"/>
      <!-- the bars, well apart -->
      <path fill="none" stroke="#2b1b16" stroke-width="3.4" stroke-linecap="round" d="M2.7 -66.2 L2.7 -19.4 M10.3 -65.1 L10.3 -20.4 M18.0 -63.9 L18.0 -21.4 M25.7 -62.7 L25.7 -22.4 M33.3 -61.6 L33.3 -23.4"/>
      <path fill="none" stroke="#c4ccd2" stroke-width="1.4" stroke-linecap="round" d="M2.7 -66.2 L2.7 -19.4 M10.3 -65.1 L10.3 -20.4 M18.0 -63.9 L18.0 -21.4 M25.7 -62.7 L25.7 -22.4 M33.3 -61.6 L33.3 -23.4"/>
      <!-- the hook that joins it to the next section -->
      <path fill="none" stroke="#2b1b16" stroke-width="3.4" stroke-linecap="round" d="M41 -56 Q46 -56 46 -51.6 L46 -49 M41 -30 Q46 -30 46 -25.6 L46 -23"/>
      <path fill="none" stroke="#c4ccd2" stroke-width="1.4" stroke-linecap="round" d="M41 -56 Q46 -56 46 -51.6 L46 -49 M41 -30 Q46 -30 46 -25.6 L46 -23"/>
      <!-- the far hand, over the top rail -->
      <path class="o" style="stroke-width:1.8" fill="#e3a284" d="M2 -68.4 Q2 -74.4 4.8 -74.4 Q7.4 -74.4 7.4 -71.8 Q7.6 -74.8 10.2 -74.8 Q12.8 -74.8 12.8 -71.8 Q13.2 -74.4 15.6 -74.4 Q18.2 -74.4 18.2 -67.6 Z"/>
    </g>
  </g>

  <!-- The near arm, straight out over the barrier, hand up: stop. -->
  <g id="arm_front" data-parent="torso" transform="translate(-13 -72)">
    <path fill="none" stroke="#2b1b16" stroke-width="12.6" stroke-linecap="round" stroke-linejoin="round" d="M0 2 L24 -4"/>
    <path fill="none" stroke="#2f62b0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M0 2 L24 -4"/>
    <path class="n" fill="#4a7cc8" d="M2 -0.6 L20 -5 L20.8 -3 L2.8 1.2 Z"/>
    <!-- the hand, flat, palm to the enemy -->
    <path class="o" fill="#f0b897" d="M25 -3 L25 -16 Q25 -19.4 27.6 -19.4 Q30.2 -19.4 30.2 -16.4 L30.6 -8 L33.4 -10 Q35.6 -11 36.2 -8.6 L32 -1 Q30 1.4 26.6 0.6 Q25 -0.2 25 -3 Z"/>
    <path class="t" style="stroke-width:1.1" d="M27.6 -16 L27.6 -10"/>
  </g>
</svg>
