      <path class="o" style="stroke-width:1.8" fill="#f2b096" d="M-137 -55 Q-131 -55 -131 -51 Q-132 -48.6 -136 -49 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#2b1b16" d="M-143 -62 L-147 -66 L-142 -64 Z M-133 -63 L-131 -67.6 L-130.6 -62.6 Z"/>
      <circle class="n" fill="#2b1b16" cx="-134" cy="-57" r="1.2"/>
      <!-- a clown -->
      <path class="o" style="stroke-width:2.2" fill="#f6c21c" d="M-124 -14 L-124 -42 Q-124 -50 -116 -50 L-110 -50 Q-104 -50 -104 -42 L-104 -14 Z"/>
      <circle class="n" fill="#d8342b" cx="-114" cy="-40" r="2"/>
      <circle class="n" fill="#2f62b0" cx="-114" cy="-30" r="2"/>
      <circle class="o" style="stroke-width:2.2" fill="#f2b096" cx="-113" cy="-58" r="8"/>
      <path class="o" style="stroke-width:1.8" fill="#2f9a48" d="M-121 -60 Q-126 -66 -121 -68 Q-118 -66 -116 -64 Q-114 -70 -110 -66 Q-106 -68 -106 -62 Q-112 -63 -121 -60 Z"/>
      <circle class="o" style="stroke-width:1.4" fill="#d8342b" cx="-105.6" cy="-56.6" r="2.4"/>
      <circle class="n" fill="#2b1b16" cx="-109" cy="-59" r="1.2"/>
      <!-- a lampshade -->
      <path class="o" style="stroke-width:2.2" fill="#2f62b0" d="M-100 -14 L-100 -40 Q-100 -48 -92 -48 L-86 -48 Q-80 -48 -80 -40 L-80 -14 Z"/>
      <circle class="o" style="stroke-width:2.2" fill="#e9a183" cx="-89" cy="-56" r="8"/>
      <path class="o" style="stroke-width:2" fill="#f3e2b0" d="M-95 -74 L-84 -74 L-80 -62 L-99 -62 Z"/>
      <path class="t" style="stroke:#c8322a;stroke-width:1.6" d="M-99 -62 L-80 -62"/>
      <circle class="n" fill="#2b1b16" cx="-85" cy="-57" r="1.2"/>
     </g>
    </g>
  </g>

  <!-- The crowd fence they queue behind. -->
  <g id="queue_fence" transform="translate(-128 -14)">
    <g transform="translate(128 14)">
     <g transform="translate(-14 0)">
      <path fill="none" stroke="#2b1b16" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" d="M-152 -14 L-152 -40 L-94 -40 L-94 -14 M-152 -20 L-94 -20"/>
      <path fill="none" stroke="#c4ccd2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M-152 -14 L-152 -40 L-94 -40 L-94 -14 M-152 -20 L-94 -20"/>
      <path fill="none" stroke="#2b1b16" stroke-width="2.8" stroke-linecap="round" d="M-145 -38 L-145 -22 M-138 -38 L-138 -22 M-131 -38 L-131 -22 M-124 -38 L-124 -22 M-117 -38 L-117 -22 M-110 -38 L-110 -22 M-103 -38 L-103 -22"/>
      <path fill="none" stroke="#c4ccd2" stroke-width="1.1" stroke-linecap="round" d="M-145 -38 L-145 -22 M-138 -38 L-138 -22 M-131 -38 L-131 -22 M-124 -38 L-124 -22 M-117 -38 L-117 -22 M-110 -38 L-110 -22 M-103 -38 L-103 -22"/>
      <path class="o" style="stroke-width:2" fill="#8e979f" d="M-158 -14 L-146 -14 L-146 -11 L-158 -11 Z M-100 -14 L-88 -14 L-88 -11 L-100 -11 Z"/>
     </g>
    </g>
  </g>

  <!-- Bunting across the front, under the lower deck. Joint in its middle, so it sways. -->
  <g id="bunting" transform="translate(-196 -120)">
    <g transform="translate(196 120)">
      <path fill="none" stroke="#2b1b16" stroke-width="1.4" d="M-296 -130 Q-246 -112 -196 -124 Q-146 -112 -96 -130"/>
      <path class="o" style="stroke-width:1.6" fill="#d8342b" d="M-286 -125.7 L-276 -123.0 L-281.4 -112.0 Z M-232 -118.2 L-222 -118.8 L-227.4 -107.2 Z M-178 -119.7 L-168 -118.6 L-173.4 -107.6 Z M-124 -121.3 L-114 -123.5 L-119.4 -110.3 Z"/>
      <path class="o" style="stroke-width:1.6" fill="#f6c21c" d="M-268 -121.3 L-258 -119.7 L-263.4 -108.7 Z M-214 -119.7 L-204 -121.3 L-209.4 -108.7 Z M-160 -118.2 L-150 -118.3 L-155.4 -107.2 Z M-106 -125.7 L-96 -129.0 L-101.4 -114.7 Z"/>
