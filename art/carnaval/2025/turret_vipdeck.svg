<svg xmlns="http://www.w3.org/2000/svg" viewBox="-108 -114 224 118" data-rig="static">
  <title>Het VIP-deck: twee gasten met een polsbandje en een uitsmijter op het verhoogde deck van de tent; ze gooien met consumptiemunten</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!--
    Het VIP-deck: the raised deck at the side of the party tent, behind a rope. A bouncer at the rope, a
    guest in a tiger onesie holding his wristband up for everyone to see, and a guest with a lampshade on
    her head who throws drink tokens over the rail. A high table with a white cover between them.
    Origin = the middle of the floor.
  -->
  <g id="deck" transform="translate(0 0)">
    <!-- a string of party lights along the top -->
    <path fill="none" stroke="#2b1b16" stroke-width="1.4" d="M-104 -98 Q-58 -86 -10 -96 Q40 -86 108 -98"/>
    <circle class="o" style="stroke-width:1.4" fill="#ffe27a" cx="-86" cy="-92" r="2.6"/>
    <circle class="o" style="stroke-width:1.4" fill="#ff8a6a" cx="-62" cy="-89.6" r="2.6"/>
    <circle class="o" style="stroke-width:1.4" fill="#ffe27a" cx="-36" cy="-91" r="2.6"/>
    <circle class="o" style="stroke-width:1.4" fill="#8ad08a" cx="18" cy="-91.6" r="2.6"/>
    <circle class="o" style="stroke-width:1.4" fill="#ffe27a" cx="44" cy="-89.6" r="2.6"/>
    <circle class="o" style="stroke-width:1.4" fill="#ff8a6a" cx="70" cy="-91" r="2.6"/>
    <circle class="o" style="stroke-width:1.4" fill="#ffe27a" cx="94" cy="-95" r="2.6"/>
    <!-- the deck: planks on the floor of the tent, a red carpet on top -->
    <rect class="o" fill="#9a6a3c" x="-106" y="-14" width="218" height="13" rx="1.5"/>
    <path class="t" style="stroke:#7a4e28;stroke-width:1.2" d="M-104 -7.6 L110 -7.6 M-70 -14 L-70 -1 M-30 -14 L-30 -7.6 M10 -7.6 L10 -1 M50 -14 L50 -7.6 M90 -7.6 L90 -1"/>
    <rect class="o" fill="#c8322a" x="-106" y="-17" width="218" height="5" rx="1.5"/>
    <path class="n" fill="#e0483c" d="M-104 -16 L110 -16 L110 -14.6 L-104 -14.6 Z"/>
  </g>

  <!-- The bouncer: wide, black, arms folded, sunglasses at night. Joint at his feet. -->
  <g id="bouncer" transform="translate(-74 -15)">
    <g transform="translate(74 15)">
      <path class="o" fill="#22222a" d="M-87 -46 L-61 -46 L-62 -18 L-71 -18 L-74 -36 L-77 -18 L-86 -18 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#111116" d="M-87 -19 L-77 -19 Q-71 -18 -70.6 -15 L-87 -15 Z M-74 -19 L-64 -19 Q-58 -18 -57.6 -15 L-74 -15 Z"/>
      <path class="o" fill="#2b2b33" d="M-91 -44 Q-97 -68 -90 -80 Q-74 -86 -57 -80 Q-51 -68 -57 -44 Z"/>
      <path class="n" fill="#3a3a44" d="M-62 -78 Q-56 -68 -60 -48 L-63 -48 Q-60 -66 -65 -78 Z"/>
      <!-- the arms, folded across his chest -->
      <path class="o" fill="#2b2b33" d="M-94 -77 Q-99 -66 -94 -58 L-86 -60 Q-89 -68 -86 -77 Z"/>
      <path class="o" fill="#d9946f" d="M-92 -66 Q-74 -70 -56 -62 L-57 -55 Q-74 -60 -91 -57 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#d9946f" d="M-58 -64 Q-54 -64 -53.6 -59.6 Q-54 -55.6 -58 -56 Z"/>
      <path class="t" style="stroke:#a86a4a;stroke-width:1.1" d="M-82 -64 Q-74 -64 -66 -60.6"/>
    </g>
  </g>

  <g id="bouncer_head" data-parent="bouncer" transform="translate(-74 -82)">
    <g transform="translate(74 86)">
      <rect class="o" fill="#c9805c" x="-80" y="-90" width="12" height="7" rx="2"/>
      <circle class="o" fill="#d9946f" cx="-73" cy="-97" r="11.6"/>
      <ellipse class="o" fill="#d9946f" cx="-83" cy="-96" rx="2.6" ry="3.6"/>
      <path class="n" fill="#ecb08c" d="M-80 -106 Q-73 -109.4 -66 -105.6 Q-73 -107 -78.6 -104 Z"/>
      <!-- sunglasses, at night, inside a tent -->
      <path class="o" style="stroke-width:1.8" fill="#15151a" d="M-73 -101 L-61.6 -101 Q-61.4 -96 -65.6 -95.6 Q-69 -95.4 -69.6 -98.6 L-73 -98.6 Z"/>
      <path class="t" style="stroke-width:1.8" d="M-73 -100 L-83 -99"/>
      <path class="t" style="stroke-width:1.8" d="M-69 -89.6 L-64 -90"/>
      <!-- the earpiece and its curly wire -->
      <circle class="o" style="stroke-width:1.4" fill="#e9eef1" cx="-83.6" cy="-95" r="1.6"/>
      <path fill="none" stroke="#e9eef1" stroke-width="1.2" stroke-linecap="round" d="M-84 -93 Q-86 -91 -84 -90 Q-82 -89 -84 -87.6 Q-86 -86.4 -84 -85"/>
    </g>
  </g>

  <!-- The rope: two brass posts and red velvet, in front of the bouncer's legs. -->
  <g id="rope" transform="translate(-77 -17)">
    <g transform="translate(77 17)">
      <path fill="none" stroke="#2b1b16" stroke-width="5.4" stroke-linecap="round" d="M-102 -44 Q-78 -26 -52 -44"/>
      <path fill="none" stroke="#b8242a" stroke-width="2.8" stroke-linecap="round" d="M-102 -44 Q-78 -26 -52 -44"/>
      <path class="o" style="stroke-width:2" fill="#e6b422" d="M-105 -46 L-99 -46 L-99.6 -19 L-104.4 -19 Z M-55 -46 L-49 -46 L-49.6 -19 L-54.4 -19 Z"/>
      <path class="o" style="stroke-width:2" fill="#c99410" d="M-107 -17 Q-107 -20 -102 -20 Q-97 -20 -97 -17 Z M-57 -17 Q-57 -20 -52 -20 Q-47 -20 -47 -17 Z"/>
      <circle class="o" style="stroke-width:2" fill="#f6c21c" cx="-102" cy="-48" r="3.4"/>
      <circle class="o" style="stroke-width:2" fill="#f6c21c" cx="-52" cy="-48" r="3.4"/>
    </g>
  </g>

  <!-- Guest B, in a tiger onesie, a beer in one hand. Joint at his feet. -->
  <g id="b_body" transform="translate(-28 -15)">
    <g transform="translate(28 15)">
      <path class="o" fill="#f08a24" d="M-38 -42 L-18 -42 L-19 -18 L-26 -18 L-28 -32 L-30 -18 L-37 -18 Z"/>
      <path class="t" style="stroke-width:2" d="M-37 -30 L-33 -30 M-23 -28 L-19.4 -28"/>
      <path class="o" style="stroke-width:1.8" fill="#2b2b33" d="M-38 -19 L-30 -19 Q-25 -18 -24.4 -15 L-38 -15 Z M-27 -19 L-19 -19 Q-14 -18 -13.4 -15 L-27 -15 Z"/>
      <path class="o" fill="#f08a24" d="M-40 -40 Q-43 -60 -38 -70 L-18 -70 Q-13 -60 -16 -40 Z"/>
      <path class="n" fill="#fff3dc" d="M-30 -66 L-22 -66 Q-19 -54 -22 -42 L-30 -42 Q-27 -54 -30 -66 Z"/>
      <path class="t" style="stroke-width:2.2" d="M-40.6 -60 L-35 -58 M-41 -50 L-35 -49 M-17 -62 L-21 -60 M-16 -52 L-20 -51"/>
      <!-- the far arm with the beer -->
      <path class="o" fill="#e07a1a" d="M-38 -66 Q-46 -58 -44 -48 L-39 -48 Q-40 -56 -34 -62 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M-48 -54 L-40 -54 L-41 -42 L-47 -42 Z"/>
      <path class="n" fill="#f6c21c" d="M-47.4 -50 L-40.6 -50 L-41.2 -43 L-46.8 -43 Z"/>
      <circle class="o" style="stroke-width:1.8" fill="#f2b096" cx="-41.4" cy="-48" r="3"/>
    </g>
  </g>

  <g id="b_head" data-parent="b_body" transform="translate(-28 -70)">
    <g transform="translate(28 70)">
      <!-- the hood, with ears -->
      <path class="o" fill="#f08a24" d="M-40 -88 Q-44 -92 -40 -96 Q-36 -97 -34 -92 Z M-22 -92 Q-20 -97 -16 -96 Q-12 -92 -16 -88 Z"/>
      <circle class="o" fill="#f08a24" cx="-28" cy="-81" r="13"/>
      <path class="t" style="stroke-width:2.2" d="M-36 -92 L-34 -88 M-28 -94 L-28 -90 M-20 -92 L-22 -88"/>
      <circle class="o" fill="#f2b096" cx="-26" cy="-79" r="9"/>
      <!-- eyes shut, grinning: this is the best night of his life -->
      <path class="t" style="stroke-width:1.6" d="M-25 -82 Q-23.4 -84 -21.8 -82 M-19 -82 Q-17.6 -83.6 -16.4 -82"/>
      <path class="o" style="stroke-width:1.6" fill="#7a1f1f" d="M-24 -76 Q-20 -74 -17 -76.4 Q-18 -71.4 -20.6 -71.6 Q-23.6 -72 -24 -76 Z"/>
      <ellipse class="n" fill="#e5583f" fill-opacity="0.5" cx="-27.6" cy="-76.6" rx="2.6" ry="1.6"/>
    </g>
  </g>

  <!-- His near arm, straight up: the wristband, for everyone to see. Joint at the shoulder. -->
  <g id="b_arm" data-parent="b_body" transform="translate(-21 -66)">
    <g transform="translate(21 66)">
      <path class="o" fill="#f08a24" d="M-25 -63 L-17 -67 L-3 -90 L-10 -94 Z"/>
      <path class="t" style="stroke-width:2" d="M-17 -72 L-12 -70 M-12 -80 L-7.4 -78"/>
      <circle class="o" fill="#f2b096" cx="-5" cy="-97" r="4.6"/>
      <!-- the wristband: gold -->
      <rect class="o" style="stroke-width:1.8" fill="#f6c21c" x="-12" y="-94" width="10" height="4.6" rx="1.4" transform="rotate(30 -7 -91.6)"/>
    </g>
  </g>

  <!-- The high table, in its white stretch cover with a bow, a pile of tokens and two glasses on it. -->
  <g id="table" transform="translate(4 -15)">
    <g transform="translate(-4 15)">
      <path class="o" fill="#ffffff" d="M-10 -54 L18 -54 Q8 -44 7 -36 Q9 -26 14 -17 L-6 -17 Q-1 -26 1 -36 Q0 -44 -10 -54 Z"/>
      <path class="t" style="stroke:#c9ced4;stroke-width:1.2" d="M-4 -52 Q3 -44 3 -36 M13 -52 Q6 -44 5 -36 M4 -34 Q3 -26 -1 -19 M5 -34 Q7 -26 10 -19"/>
      <path class="o" style="stroke-width:1.8" fill="#d8342b" d="M4 -37 L-1 -40.4 L-1 -33 Z M4 -37 L9 -40.4 L9 -33 Z"/>
      <ellipse class="o" fill="#ffffff" cx="4" cy="-55" rx="15" ry="3.2"/>
      <!-- the pile of tokens -->
      <rect class="o" style="stroke-width:1.4" fill="#2f9a48" x="-4" y="-60" width="9" height="3" rx="1.4"/>
      <rect class="o" style="stroke-width:1.4" fill="#d8342b" x="-3" y="-63" width="9" height="3" rx="1.4"/>
      <rect class="o" style="stroke-width:1.4" fill="#f6c21c" x="-4.6" y="-66" width="9" height="3" rx="1.4"/>
      <!-- two glasses -->
      <path class="o" style="stroke-width:1.6" fill="#ffffff" d="M9 -68 L15 -68 L14.4 -57.6 L9.6 -57.6 Z"/>
      <path class="n" fill="#f6c21c" d="M9.6 -64 L14.4 -64 L14 -58.4 L10 -58.4 Z"/>
    </g>
  </g>

  <!-- Guest A, lampshade on her head, red dress, gold wristband: she throws. Joint at her feet. -->
  <g id="a_body" transform="translate(44 -15)">
    <g transform="translate(-44 15)">
      <path class="o" fill="#e9a183" d="M37 -38 L43 -38 L42.6 -19 L37.6 -19 Z M45 -38 L51 -38 L50.6 -19 L45.6 -19 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#2b2b33" d="M36 -20 L43 -20 Q47 -19 47.4 -15 L36 -15 Z M44.6 -20 L51.6 -20 Q55.6 -19 56 -15 L44.6 -15 Z"/>
      <path class="o" fill="#d8342b" d="M38 -68 L50 -68 Q53 -56 52 -50 Q58 -42 56 -34 L32 -34 Q31 -42 36 -50 Q35 -56 38 -68 Z"/>
      <circle class="n" fill="#ffffff" cx="40" cy="-40" r="1.4"/>
      <circle class="n" fill="#ffffff" cx="48" cy="-44" r="1.4"/>
      <circle class="n" fill="#ffffff" cx="43" cy="-55" r="1.4"/>
      <circle class="n" fill="#ffffff" cx="52" cy="-38" r="1.4"/>
      <!-- the far arm, hand on her hip -->
      <path class="o" fill="#e9a183" d="M38 -64 Q31 -58 34 -50 L38 -51 Q36 -57 41 -61 Z"/>
    </g>
  </g>

  <g id="a_head" data-parent="a_body" transform="translate(44 -68)">
    <g transform="translate(-44 68)">
      <circle class="o" fill="#f2b096" cx="45" cy="-77" r="9.6"/>
      <!-- blonde curls under the shade -->
      <path class="o" style="stroke-width:1.8" fill="#f2d16b" d="M35.4 -78 Q33 -84 37 -86 L52 -86 Q56 -82 54.6 -78 Q52 -82 49 -82 Q42 -82 39 -79 Q38 -74 35.4 -78 Z"/>
      <circle class="n" fill="#2b1b16" cx="49" cy="-77.6" r="1.3"/>
      <path class="t" style="stroke-width:1.4" d="M46.6 -81 L50.4 -81.6"/>
      <path class="o" style="stroke-width:1.6" fill="#7a1f1f" d="M47 -71.6 Q50 -70.4 52.6 -72 Q52 -68.4 49.6 -68.4 Q47.4 -68.6 47 -71.6 Z"/>
      <ellipse class="n" fill="#e5583f" fill-opacity="0.5" cx="45.6" cy="-73" rx="2.4" ry="1.5"/>
    </g>
  </g>

  <!-- The lampshade: pleated, with a fringe of tassels that swings. Joint where it sits on her head. -->
  <g id="a_shade" data-parent="a_head" transform="translate(45 -86)">
    <g transform="translate(-45 86)">
      <path class="o" fill="#f3e2b0" d="M38 -100 L52 -100 L58 -86 L32 -86 Z"/>
      <path class="t" style="stroke:#d9c48a;stroke-width:1.2" d="M41 -99 L37 -87 M45 -99.4 L44 -87 M49 -99 L51 -87 M53 -98 L56 -88"/>
      <path class="t" style="stroke:#c8322a;stroke-width:2.2" d="M32.6 -86 L57.4 -86"/>
      <path fill="none" stroke="#c8322a" stroke-width="1.6" stroke-linecap="round" d="M34 -85 L34 -81 M38 -85 L38 -81 M42 -85 L42 -81 M46 -85 L46 -81 M50 -85 L50 -81 M54 -85 L54 -81"/>
    </g>
  </g>

  <!-- Her near arm, up and back with a token between finger and thumb. Joint at the shoulder. -->
  <g id="a_arm" data-parent="a_body" transform="translate(48 -64)">
    <g transform="translate(-48 64)">
      <path fill="none" stroke="#2b1b16" stroke-width="8.6" stroke-linecap="round" stroke-linejoin="round" d="M48 -64 L56 -60 L62 -70"/>
      <path fill="none" stroke="#e9a183" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" d="M48 -64 L56 -60 L62 -70"/>
      <rect class="o" style="stroke-width:1.6" fill="#f6c21c" x="58" y="-69.4" width="7" height="3.6" rx="1" transform="rotate(-56 61.6 -67.6)"/>
      <circle class="o" style="stroke-width:1.8" fill="#e9a183" cx="63" cy="-72.6" r="3.4"/>
    </g>
  </g>

  <!-- The token she is about to flick. Joint in her fingers. -->
  <g id="a_token" data-parent="a_arm" transform="translate(64 -76)">
    <circle class="o" style="stroke-width:1.8" fill="#2f9a48" cx="2" cy="-2" r="4.2"/>
    <circle class="n" fill="#ffffff" fill-opacity="0.6" cx="1" cy="-3" r="1.2"/>
    <circle data-mount="muzzle" fill="none" cx="2" cy="-2" r="1"/>
  </g>
</svg>
