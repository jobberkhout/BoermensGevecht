<svg xmlns="http://www.w3.org/2000/svg" viewBox="-21 -18 40 36" data-rig="static">
  <title>Een hoempa: een dikke koperen muzieknoot met een paar snippers confetti erachteraan</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <g id="note" transform="translate(0 0)">
    <!-- confetti trailing behind it -->
    <rect class="o" style="stroke-width:1.2" fill="#d8342b" x="-17" y="-6" width="5" height="3.4" rx="0.6" transform="rotate(-25 -14.5 -4.3)"/>
    <rect class="o" style="stroke-width:1.2" fill="#2f9a48" x="-16" y="5" width="4.4" height="3.2" rx="0.6" transform="rotate(30 -13.8 6.6)"/>
    <rect class="o" style="stroke-width:1.2" fill="#f6c21c" x="-11.4" y="-13" width="4" height="3" rx="0.6" transform="rotate(15 -9.4 -11.5)"/>
    <rect class="o" style="stroke-width:1.2" fill="#2f62b0" x="-20" y="-0.6" width="3.6" height="2.8" rx="0.6" transform="rotate(-40 -18.2 0.8)"/>
    <!-- the note: a fat head, a stem and a curly flag, all in brass -->
    <path class="o" fill="#e3b341" d="M3 7 L3 -14 Q5 -14 7 -11 Q12 -6 13 -1 Q13.4 3 11 5 Q11.6 1 10 -2 Q8 -5 6.4 -6 L6.4 7 Z"/>
    <ellipse class="o" fill="#e3b341" cx="-1" cy="9" rx="8" ry="5.8" transform="rotate(-22 -1 9)"/>
    <ellipse class="n" fill="#fbe7a6" cx="-3" cy="7" rx="3.6" ry="1.8" transform="rotate(-22 -3 7)"/>
    <path class="n" fill="#fbe7a6" d="M4.4 -11 L5.4 -10 L5.4 3 L4.4 3 Z"/>
  </g>
</svg>
