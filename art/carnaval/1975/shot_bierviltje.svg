<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17 -17 34 34" data-rig="static">
  <title>Een bierviltje: rond karton met rode en groene ringen en een gele ster, al een beetje doorweekt</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <g id="viltje" transform="translate(0 0)">
    <circle class="o" style="stroke-width:1.8" fill="#c9b48a" cx="0.8" cy="1.6" r="13.4"/>
    <circle class="o" style="stroke-width:1.8" fill="#f6efdc" cx="0" cy="0" r="13.4"/>
    <circle class="n" style="stroke:#d8342b" fill="none" stroke-width="2.2" cx="0" cy="0" r="10.4"/>
    <circle class="n" style="stroke:#2f9a48" fill="none" stroke-width="1.4" cx="0" cy="0" r="7.8"/>
    <path class="o" style="stroke-width:1.3" fill="#f6c21c" d="M0 -6 L1.7 -2.2 L5.7 -1.9 L2.6 0.8 L3.6 4.8 L0 2.6 L-3.6 4.8 L-2.6 0.8 L-5.7 -1.9 L-1.7 -2.2 Z"/>
    <!-- a ring where a glass stood on it -->
    <path fill="none" stroke="#c9b48a" stroke-width="1.2" stroke-linecap="round" d="M-9 6 Q-4 11.4 3 10.6"/>
  </g>
</svg>
