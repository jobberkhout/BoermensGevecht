<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -118 224 122" data-rig="static">
  <title>De Pronkzitting: een tonprater in zijn ton tussen twee leden van de Raad van Elf met veren op hun mutsen, achter een tafel met bierpullen. Eentje schiet bierviltjes weg</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- A: the council member on the left, green jacket, red cap with a yellow feather. Seated; joint at his seat. -->
  <g id="a_body" transform="translate(-66 -34)">
    <g transform="translate(66 34)">
      <path class="o" fill="#2f9a48" d="M-82 -30 Q-84 -54 -78 -63 Q-68 -68 -56 -63 Q-50 -54 -51 -30 Z"/>
      <path class="n" fill="#257a3a" d="M-81 -31 Q-83 -52 -78 -61 Q-75 -48 -75 -31 Z"/>
      <path class="o" fill="#f4f4f0" d="M-68 -66 L-60 -66 L-58 -46 L-64 -42 L-69 -46 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#f6c21c" d="M-70 -66 L-66 -66 L-63 -50 L-68 -44 L-72 -52 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#f6c21c" d="M-58 -66 L-56 -64 L-55 -50 L-59 -46 L-61 -52 Z"/>
      <path class="o" style="stroke-width:1.6" fill="#d8342b" d="M-66 -64 L-60.5 -62 L-66 -59.6 Z M-60.5 -62 L-55.4 -64 L-55.4 -59.6 Z"/>
      <path class="t" style="stroke:#d8342b;stroke-width:2" d="M-62 -58 L-62 -52"/>
      <circle class="o" style="stroke-width:1.6" fill="#f6c21c" cx="-62" cy="-49" r="3.4"/>
    </g>
  </g>

  <g id="a_head" data-parent="a_body" transform="translate(-63 -65)">
    <g transform="translate(63 65)">
      <circle class="o" fill="#f0bd9c" cx="-63" cy="-76" r="12.5"/>
      <ellipse class="o" fill="#f0bd9c" cx="-72" cy="-75" rx="2.8" ry="3.8"/>
      <ellipse class="n" fill="#e8786a" fill-opacity="0.6" cx="-58" cy="-70" rx="3.4" ry="2.2"/>
      <!-- laughing at everything, eyes squeezed shut -->
      <path class="t" style="stroke-width:2" d="M-58 -78 Q-55.6 -80.6 -53 -78"/>
      <ellipse class="o" style="stroke-width:2" fill="#e0442c" cx="-50" cy="-73" rx="3.4" ry="3"/>
      <path class="o" style="stroke-width:2" fill="#7a2a20" d="M-60 -68 Q-56 -60.4 -50.4 -66.4 Q-55 -66 -60 -68 Z"/>
      <!-- the velvet cap of the Raad van Elf, and its feather -->
      <path class="o" fill="#f6c21c" d="M-70 -87 Q-80 -94 -90 -100 Q-94 -102 -92 -98 Q-88 -94 -88 -90 Q-92 -92 -94 -90 Q-90 -86 -84 -86 Q-88 -84 -88 -82 Q-80 -82 -72 -84 Z"/>
      <path class="t" style="stroke:#c99a12;stroke-width:1.2" d="M-72 -86 Q-82 -90 -90 -98"/>
      <path class="o" fill="#d8342b" d="M-77 -80 Q-80 -92 -64 -93 Q-48 -93 -48 -82 Q-63 -86 -77 -80 Z"/>
      <path class="n" fill="#e8574a" d="M-72 -87 Q-64 -91 -54 -89 Q-63 -88.4 -70 -85 Z"/>
      <path class="o" style="stroke-width:2" fill="#f6c21c" d="M-77.6 -83.6 Q-63 -88 -47.6 -84 L-47.6 -80.6 Q-63 -84.4 -77 -80 Z"/>
    </g>
  </g>

  <!-- B: the council member on the right, red jacket, green cap with a white feather. He keeps the beer mats. -->
  <g id="b_body" transform="translate(64 -34)">
    <g transform="translate(-64 34)">
      <path class="o" fill="#d8342b" d="M50 -30 Q48 -54 54 -63 Q64 -68 76 -63 Q82 -54 81 -30 Z"/>
      <path class="n" fill="#b52a22" d="M51 -31 Q49 -52 54 -61 Q57 -48 57 -31 Z"/>
      <path class="o" fill="#f4f4f0" d="M64 -66 L72 -66 L74 -46 L68 -42 L63 -46 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#f6c21c" d="M62 -66 L66 -66 L69 -50 L64 -44 L60 -52 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#f6c21c" d="M74 -66 L76 -64 L77 -50 L73 -46 L71 -52 Z"/>
      <path class="o" style="stroke-width:1.6" fill="#2f9a48" d="M66 -64 L71.5 -62 L66 -59.6 Z M71.5 -62 L76.6 -64 L76.6 -59.6 Z"/>
      <path class="t" style="stroke:#2f9a48;stroke-width:2" d="M70 -58 L70 -52"/>
      <circle class="o" style="stroke-width:1.6" fill="#f6c21c" cx="70" cy="-49" r="3.4"/>
    </g>
  </g>

  <g id="b_head" data-parent="b_body" transform="translate(66 -65)">
    <g transform="translate(-66 65)">
      <circle class="o" fill="#f2c4a4" cx="66" cy="-76" r="12.5"/>
      <ellipse class="o" fill="#f2c4a4" cx="57" cy="-75" rx="2.8" ry="3.8"/>
      <ellipse class="n" fill="#e8786a" fill-opacity="0.6" cx="71" cy="-70" rx="3.4" ry="2.2"/>
      <!-- a grin with a gap in it, a moustache, and one eye on the enemy -->
      <circle class="n" fill="#2b1b16" cx="72.6" cy="-78.4" r="1.6"/>
      <path class="t" style="stroke-width:1.8" d="M69.6 -82.6 Q72.6 -84.4 75.4 -82.4"/>
      <ellipse class="o" style="stroke-width:2" fill="#e0442c" cx="78.6" cy="-73" rx="3.4" ry="3"/>
      <path class="o" style="stroke-width:1.8" fill="#6b4226" d="M67 -69.6 Q72 -72 78.4 -69 Q79 -66.6 77.4 -66 Q72.6 -68 68 -66.8 Q66 -68 67 -69.6 Z"/>
      <path class="t" style="stroke-width:1.8" d="M68.6 -64 Q72.4 -62 76 -64.4"/>
      <!-- the velvet cap, green, with a white feather -->
      <path class="o" fill="#f4f4f0" d="M58 -87 Q48 -94 38 -100 Q34 -102 36 -98 Q40 -94 40 -90 Q36 -92 34 -90 Q38 -86 44 -86 Q40 -84 40 -82 Q48 -82 56 -84 Z"/>
      <path class="t" style="stroke:#c9c4bc;stroke-width:1.2" d="M56 -86 Q46 -90 38 -98"/>
      <path class="o" fill="#2f9a48" d="M52 -80 Q49 -92 65 -93 Q81 -93 81 -82 Q66 -86 52 -80 Z"/>
      <path class="n" fill="#4cb565" d="M57 -87 Q65 -91 75 -89 Q66 -88.4 59 -85 Z"/>
      <path class="o" style="stroke-width:2" fill="#f6c21c" d="M51.4 -83.6 Q66 -88 81.4 -84 L81.4 -80.6 Q66 -84.4 52 -80 Z"/>
    </g>
  </g>

  <!-- The tonprater, in a loud check jacket. Joint at his waist, inside the barrel. -->
  <g id="tp_body" transform="translate(0 -44)">
    <g transform="translate(0 44)">
      <path class="o" fill="#f6c21c" d="M-15 -36 Q-17 -58 -12 -68 Q0 -73 12 -68 Q17 -58 15 -36 Z"/>
      <path class="t" style="stroke:#2f9a48;stroke-width:1.4" d="M-15 -60 L15 -60 M-16 -50 L16 -50 M-8 -70 L-8 -38 M2 -72 L2 -38 M10 -70 L10 -38"/>
      <path class="o" style="stroke-width:1.8" fill="#f4f4f0" d="M-3 -71 L7 -71 L5 -60 L2 -57 L-1 -60 Z"/>
      <!-- the big bow tie, red with white spots -->
      <path class="o" style="stroke-width:1.8" fill="#d8342b" d="M2 -66 L-8 -71 L-8 -61 Z M2 -66 L12 -71 L12 -61 Z"/>
      <circle class="o" style="stroke-width:1.6" fill="#d8342b" cx="2" cy="-66" r="2.4"/>
      <circle class="n" fill="#ffffff" cx="-5" cy="-67.6" r="0.9"/>
      <circle class="n" fill="#ffffff" cx="-5.4" cy="-63.4" r="0.9"/>
      <circle class="n" fill="#ffffff" cx="9" cy="-67.6" r="0.9"/>
      <circle class="n" fill="#ffffff" cx="9.4" cy="-63.4" r="0.9"/>
    </g>
  </g>

  <g id="tp_head" data-parent="tp_body" transform="translate(1 -71)">
    <g transform="translate(-1 71)">
      <rect class="o" fill="#e3a98a" x="-3.6" y="-76" width="9" height="6" rx="2"/>
      <circle class="o" fill="#f0bd9c" cx="1" cy="-84" r="12.8"/>
      <ellipse class="o" fill="#f0bd9c" cx="-9" cy="-83" rx="2.8" ry="3.8"/>
      <!-- the joke glasses: bushy brows, round specs and a nose to match -->
      <path class="o" style="stroke-width:1.6" fill="#2b1b16" d="M1 -93 Q6 -96 11 -93.4 L10.6 -91 Q6 -93 1.4 -90.6 Z M12.4 -93.4 Q16 -95.4 19 -93 L18.6 -90.8 Q15.6 -92.4 12.8 -91 Z"/>
      <circle class="o" style="stroke-width:1.8" fill="#ffffff" cx="6.4" cy="-86" r="4.2"/>
      <circle class="o" style="stroke-width:1.8" fill="#ffffff" cx="15.4" cy="-86.2" r="3.4"/>
      <circle class="n" fill="#2b1b16" cx="7.4" cy="-86" r="1.6"/>
      <circle class="n" fill="#2b1b16" cx="16" cy="-86.2" r="1.3"/>
      <path class="t" style="stroke-width:1.6" d="M-2 -86.4 L2.2 -86 M10.6 -86 L12 -86"/>
      <path class="o" fill="#f2a08a" d="M11 -84 Q20 -86 22 -79 Q21 -75.4 15 -76.6 Q11.6 -78 11 -84 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#2b1b16" d="M9 -76 Q15 -79 20.6 -75.6 Q19 -73.4 15 -74 Q11 -73.4 9 -76 Z"/>
      <!-- a bowler hat a size too small -->
      <path class="o" fill="#2b2b2e" d="M-8 -95.6 Q-8 -106 1.6 -106 Q11 -106 11 -96 Z"/>
      <path class="o" fill="#2b2b2e" d="M-12 -95 Q1.6 -98.6 15 -95.4 L14.6 -93.2 Q1.6 -96 -11.6 -92.8 Z"/>
      <path class="n" fill="#d8342b" d="M-7.6 -98.6 Q1.6 -100.6 10.8 -98.6 L10.8 -96.8 Q1.6 -98.6 -7.6 -96.8 Z"/>
    </g>
  </g>

  <!-- His mouth, for the chatter. Joint at the corner of his mouth. -->
  <g id="tp_mouth" data-parent="tp_head" transform="translate(14 -74)">
    <g transform="translate(-14 74)">
      <path class="o" style="stroke-width:1.8" fill="#7a2a20" d="M9 -74.6 Q14.4 -67.4 20 -74.2 Q14.4 -73.2 9 -74.6 Z"/>
      <path class="n" fill="#e8786a" d="M12 -71.4 Q14.6 -73 17.4 -71.6 Q14.6 -69.6 12 -71.4 Z"/>
    </g>
  </g>

  <!-- The two tables either side, cloths in the club colours, mugs on top and a stack of beer mats in front of B. -->
  <g id="tables" transform="translate(0 0)">
    <rect class="o" fill="#8a6440" x="-106" y="-38" width="80" height="7" rx="2"/>
    <path class="o" fill="#2f9a48" d="M-104 -31 L-28 -31 L-28 -14 L-104 -14 Z"/>
    <path class="n" fill="#f6c21c" d="M-104 -19 L-28 -19 L-28 -15.6 L-104 -15.6 Z"/>
    <path class="t" style="stroke:#257a3a" d="M-84 -30 L-84 -20 M-64 -30 L-64 -20 M-44 -30 L-44 -20"/>
    <path class="t" style="stroke-width:4.4" d="M-100 -14 L-100 0 M-32 -14 L-32 0"/>
    <path fill="none" stroke="#8a6440" stroke-width="2" stroke-linecap="round" d="M-100 -14 L-100 0 M-32 -14 L-32 0"/>

    <rect class="o" fill="#8a6440" x="26" y="-38" width="80" height="7" rx="2"/>
    <path class="o" fill="#d8342b" d="M28 -31 L104 -31 L104 -14 L28 -14 Z"/>
    <path class="n" fill="#f6c21c" d="M28 -19 L104 -19 L104 -15.6 L28 -15.6 Z"/>
    <path class="t" style="stroke:#b52a22" d="M48 -30 L48 -20 M68 -30 L68 -20 M88 -30 L88 -20"/>
    <path class="t" style="stroke-width:4.4" d="M32 -14 L32 0 M100 -14 L100 0"/>
    <path fill="none" stroke="#8a6440" stroke-width="2" stroke-linecap="round" d="M32 -14 L32 0 M100 -14 L100 0"/>

    <!-- beer mugs: the far left, A's, and B's -->
    <g>
      <path class="o" style="stroke-width:2" fill="none" d="M-86 -50 Q-80 -50 -80 -45 Q-80 -41 -86 -41"/>
      <rect class="o" style="stroke-width:2" fill="#f2b632" x="-97" y="-54" width="12" height="16" rx="1.5"/>
      <path class="o" style="stroke-width:2" fill="#ffffff" d="M-98 -54 Q-98 -59 -94 -58 Q-91 -61 -88 -58 Q-84 -59 -84 -54 Z"/>
      <path class="n" fill="#f9d77a" d="M-95 -52 L-93 -52 L-93 -41 L-95 -41 Z"/>
    </g>
    <g>
      <path class="o" style="stroke-width:2" fill="none" d="M-34 -50 Q-28 -50 -28 -45 Q-28 -41 -34 -41"/>
      <rect class="o" style="stroke-width:2" fill="#f2b632" x="-45" y="-54" width="12" height="16" rx="1.5"/>
      <path class="o" style="stroke-width:2" fill="#ffffff" d="M-46 -54 Q-46 -59 -42 -58 Q-39 -61 -36 -58 Q-32 -59 -32 -54 Z"/>
      <path class="n" fill="#f9d77a" d="M-43 -52 L-41 -52 L-41 -41 L-43 -41 Z"/>
    </g>
    <g>
      <path class="o" style="stroke-width:2" fill="none" d="M44 -50 Q50 -50 50 -45 Q50 -41 44 -41"/>
      <rect class="o" style="stroke-width:2" fill="#f2b632" x="33" y="-54" width="12" height="16" rx="1.5"/>
      <path class="o" style="stroke-width:2" fill="#ffffff" d="M32 -54 Q32 -59 36 -58 Q39 -61 42 -58 Q46 -59 46 -54 Z"/>
      <path class="n" fill="#f9d77a" d="M35 -52 L37 -52 L37 -41 L35 -41 Z"/>
    </g>
    <!-- the stack of beer mats -->
    <rect class="o" style="stroke-width:1.8" fill="#f6efdc" x="84" y="-41.6" width="18" height="3.6" rx="1.4"/>
    <rect class="o" style="stroke-width:1.8" fill="#f6efdc" x="83" y="-45" width="18" height="3.6" rx="1.4"/>
    <rect class="o" style="stroke-width:1.8" fill="#f6efdc" x="85" y="-48.4" width="18" height="3.6" rx="1.4"/>
    <path class="n" fill="#d8342b" d="M86 -47.4 L101 -47.4 L101 -46.2 L86 -46.2 Z M84.6 -44 L99.6 -44 L99.6 -42.8 L84.6 -42.8 Z"/>
  </g>

  <!-- The barrel the tonprater speaks from, the club's star painted on it. -->
  <g id="barrel" transform="translate(0 0)">
    <path class="o" fill="#a8743f" d="M-19 -46 Q-25 -24 -19 0 L19 0 Q25 -24 19 -46 Z"/>
    <path class="t" style="stroke:#8a5a2e" d="M-11 -45 Q-14 -24 -11 -1 M0 -45 L0 -1 M11 -45 Q14 -24 11 -1"/>
    <path class="o" fill="#5a5a5e" d="M-21.6 -38 Q0 -35 21.6 -38 L22.6 -33 Q0 -30 -22.6 -33 Z"/>
    <path class="o" fill="#5a5a5e" d="M-22.6 -12 Q0 -9 22.6 -12 L21.6 -7 Q0 -4 -21.6 -7 Z"/>
    <path class="o" style="stroke-width:2.2" fill="#c08850" d="M-20 -48 Q0 -44 20 -48 L19 -44 Q0 -40 -19 -44 Z"/>
    <circle class="o" style="stroke-width:2" fill="#d8342b" cx="0" cy="-21.6" r="8.4"/>
    <path class="o" style="stroke-width:1.4" fill="#f6c21c" d="M0 -27.4 L1.7 -23.6 L5.8 -23.3 L2.7 -20.6 L3.6 -16.6 L0 -18.8 L-3.6 -16.6 L-2.7 -20.6 L-5.8 -23.3 L-1.7 -23.6 Z"/>
  </g>

  <!-- A's arm, for slapping the table. Joint at the shoulder. -->
  <g id="a_arm" data-parent="a_body" transform="translate(-58 -60)">
    <g transform="translate(58 60)">
      <path class="o" fill="#2f9a48" d="M-61 -63 L-54 -40 L-46 -42 L-53 -64 Z"/>
      <path class="o" fill="#2f9a48" d="M-55 -45 L-44 -44 L-44 -37 L-56 -38 Z"/>
      <ellipse class="o" style="stroke-width:2" fill="#f0bd9c" cx="-41.6" cy="-40.6" rx="4.4" ry="3.6"/>
    </g>
  </g>

  <!-- The tonprater's arms: one waves, one makes the point. Joints at the shoulders. -->
  <g id="tp_arm_back" data-parent="tp_body" transform="translate(-10 -66)">
    <g transform="translate(10 66)">
      <path class="o" fill="#f6c21c" d="M-8 -68 L-22 -60 L-19 -54 L-5 -62 Z"/>
      <path class="o" fill="#f6c21c" d="M-22 -60 L-28 -74 L-22 -76 L-17 -62 Z"/>
      <path class="o" style="stroke-width:2" fill="#f0bd9c" d="M-30 -76 L-31 -84 L-28.6 -84.4 L-27.6 -79 L-26.6 -85.6 L-24 -85.4 L-24.4 -79.6 L-22 -84 L-19.8 -83 L-22 -76 Z"/>
    </g>
  </g>

  <g id="tp_arm_front" data-parent="tp_body" transform="translate(10 -66)">
    <g transform="translate(-10 66)">
      <path class="o" fill="#f6c21c" d="M8 -68 L22 -58 L18 -52 L5 -62 Z"/>
      <path class="o" fill="#f6c21c" d="M22 -58 L28 -70 L22 -72.6 L17 -60 Z"/>
      <ellipse class="o" style="stroke-width:2" fill="#f0bd9c" cx="25.6" cy="-74.6" rx="4" ry="3.6"/>
      <path class="o" style="stroke-width:1.8" fill="#f0bd9c" d="M25 -77 L26 -86 L28.6 -86 L28.4 -77 Z"/>
    </g>
  </g>

  <!-- B's flicking arm, a beer mat ready between his fingers. Joint at the shoulder. -->
  <g id="b_arm" data-parent="b_body" transform="translate(74 -60)">
    <g transform="translate(-74 60)">
      <path class="o" fill="#d8342b" d="M71 -63 L86 -50 L81 -44 L67 -56 Z"/>
      <path class="o" fill="#d8342b" d="M85 -51 L94 -58 L98 -53 L88 -45 Z"/>
      <ellipse class="o" style="stroke-width:2" fill="#f2c4a4" cx="97" cy="-58" rx="4" ry="3.6"/>
    </g>
  </g>

  <!-- The beer mat in his fingers, about to go. -->
  <g id="b_mat" data-parent="b_arm" transform="translate(100 -62)">
    <g transform="translate(-100 62)">
      <ellipse class="o" style="stroke-width:1.8" fill="#f6efdc" cx="100.6" cy="-63.6" rx="6.4" ry="4.4" transform="rotate(-30 100.6 -63.6)"/>
      <ellipse class="n" style="stroke:#d8342b" fill="none" stroke-width="1.2" cx="100.6" cy="-63.6" rx="4.4" ry="2.8" transform="rotate(-30 100.6 -63.6)"/>
      <path class="o" style="stroke-width:1.8" fill="#f2c4a4" d="M96 -61 L99.4 -65 L101.4 -63.6 L98 -59.6 Z"/>
    </g>
    <!-- Where the mat leaves his fingers, in the part's own coordinates: a marker is only read as a direct child of its part. -->
    <circle data-mount="muzzle" fill="none" cx="1" cy="-2" r="1"/>
  </g>
</svg>
