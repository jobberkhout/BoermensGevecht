<svg xmlns="http://www.w3.org/2000/svg" viewBox="-314 -596 332 602" data-rig="static">
  <title>De residentie: het bruine café van de carnavalsvereniging, vol papieren slingers, een spandoek met het embleem op het dak en het plaatsnaambord met een narrenkap in plaats van een naam</title>
