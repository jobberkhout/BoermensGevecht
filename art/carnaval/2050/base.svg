<svg xmlns="http://www.w3.org/2000/svg" viewBox="-312 -596 328 602" data-rig="static">
  <title>De Carnavalskoepel: een geklimatiseerde glazen koepel op een feestgebouw, met tourniquets bij de deur, een rij voor het tijdslotbord en een discobal onder het glas</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- (0,0) is the foot of the doorway, where units come out. The building stands behind it, to the left. -->
  <g id="building" transform="translate(0 0)">
    <!-- the flagpole on the flat part of the roof -->
    <path class="t" style="stroke-width:5" d="M-286 -446 L-286 -552"/>
    <circle class="o" fill="#f6c21c" cx="-286" cy="-555" r="4.5"/>

    <!-- the climate unit on the roof: it keeps the inside at exactly the right temperature -->
    <rect class="o" fill="#c9d1dc" x="-262" y="-478" width="54" height="32" rx="4"/>
    <path class="n" fill="#e6ebf0" d="M-259 -475 L-212 -475 L-212 -471 L-259 -471 Z"/>
    <circle class="o" style="stroke-width:2.4" fill="#5b6270" cx="-244" cy="-462" r="11"/>
    <path class="t" style="stroke:#9aa3ad;stroke-width:1.4" d="M-226 -470 L-214 -470 M-226 -465 L-214 -465 M-226 -460 L-214 -460 M-226 -455 L-214 -455"/>

    <!-- inside the dome: a dark party sky with confetti, before the glass goes over it -->
    <path class="n" fill="#2a2540" d="M-186 -446 A90 146 0 0 1 -6 -446 Z"/>
    <g class="n">
      <rect fill="#d8342b" x="-160" y="-490" width="5" height="3" transform="rotate(30 -158 -489)"/>
      <rect fill="#f6c21c" x="-132" y="-540" width="5" height="3" transform="rotate(-20 -130 -539)"/>
      <rect fill="#2f9a48" x="-52" y="-532" width="5" height="3" transform="rotate(50 -50 -531)"/>
      <rect fill="#d8342b" x="-112" y="-566" width="5" height="3" transform="rotate(-50 -110 -565)"/>
      <circle fill="#7ff0f0" cx="-76" cy="-560" r="2"/>
      <circle fill="#fff27a" cx="-150" cy="-512" r="2"/>
      <rect fill="#f6c21c" x="-40" y="-470" width="5" height="3" transform="rotate(-40 -38 -469)"/>
      <rect fill="#d8342b" x="-70" y="-462" width="5" height="3" transform="rotate(15 -68 -461)"/>
      <rect fill="#2f9a48" x="-150" y="-462" width="5" height="3" transform="rotate(-30 -148 -461)"/>
      <circle fill="#7ff0f0" cx="-120" cy="-470" r="2"/>
      <circle fill="#ff6fae" cx="-30" cy="-490" r="2"/>
      <circle fill="#fff27a" cx="-166" cy="-470" r="2"/>
    </g>
    
    <!-- the inside of the two open floors: party rooms, lights strung under each ceiling -->
    <rect class="o" fill="#2a2540" x="-296" y="-440" width="290" height="440"/>
    <path class="t" style="stroke:#3a3354;stroke-width:2.4" d="M-260 -428 L-260 -300 M-200 -428 L-200 -300 M-100 -428 L-100 -300 M-40 -428 L-40 -300 M-260 -280 L-260 -150 M-200 -280 L-200 -150 M-100 -280 L-100 -150 M-40 -280 L-40 -150"/>
    <path class="t" style="stroke:#5b4a60;stroke-width:1.6" d="M-290 -426 Q-224 -410 -150 -426 Q-76 -410 -10 -426 M-290 -280 Q-224 -264 -150 -280 Q-76 -264 -10 -280"/>
    <g class="n">
      <circle fill="#d8342b" cx="-262" cy="-418" r="3.4"/>
      <circle fill="#f6c21c" cx="-224" cy="-414" r="3.4"/>
      <circle fill="#2f9a48" cx="-186" cy="-418" r="3.4"/>
      <circle fill="#d8342b" cx="-114" cy="-418" r="3.4"/>
      <circle fill="#f6c21c" cx="-76" cy="-414" r="3.4"/>
      <circle fill="#2f9a48" cx="-38" cy="-418" r="3.4"/>
      <circle fill="#d8342b" cx="-262" cy="-272" r="3.4"/>
      <circle fill="#f6c21c" cx="-224" cy="-268" r="3.4"/>
      <circle fill="#2f9a48" cx="-186" cy="-272" r="3.4"/>
      <circle fill="#d8342b" cx="-114" cy="-272" r="3.4"/>
      <circle fill="#f6c21c" cx="-76" cy="-268" r="3.4"/>
      <circle fill="#2f9a48" cx="-38" cy="-272" r="3.4"/>
    </g>

    <!-- serpentines hanging from the ceilings -->
    <path fill="none" stroke="#f6c21c" stroke-width="2.2" stroke-linecap="round" d="M-242 -430 Q-236 -424 -242 -418 Q-248 -412 -242 -406 Q-236 -400 -242 -394"/>
    <path fill="none" stroke="#2f9a48" stroke-width="2.2" stroke-linecap="round" d="M-150 -432 Q-144 -426 -150 -420 Q-156 -414 -150 -408"/>
    <path fill="none" stroke="#d8342b" stroke-width="2.2" stroke-linecap="round" d="M-58 -430 Q-52 -424 -58 -418 Q-64 -412 -58 -406 Q-52 -400 -58 -394"/>
    <path fill="none" stroke="#d8342b" stroke-width="2.2" stroke-linecap="round" d="M-242 -284 Q-236 -278 -242 -272 Q-248 -266 -242 -260 Q-236 -254 -242 -248"/>
    <path fill="none" stroke="#f6c21c" stroke-width="2.2" stroke-linecap="round" d="M-150 -284 Q-144 -278 -150 -272 Q-156 -266 -150 -260"/>
    <path fill="none" stroke="#2f9a48" stroke-width="2.2" stroke-linecap="round" d="M-58 -284 Q-52 -278 -58 -272 Q-64 -266 -58 -260 Q-52 -254 -58 -248"/>

    <!-- the floors, each with a strip of light in the carnival colours under its edge -->
    <rect class="o" fill="#f4f1ea" x="-300" y="-296" width="300" height="12" rx="2"/>
    <rect class="n" fill="#d8342b" x="-297" y="-288.4" width="98" height="2.6"/>
    <rect class="n" fill="#f6c21c" x="-199" y="-288.4" width="98" height="2.6"/>
    <rect class="n" fill="#2f9a48" x="-101" y="-288.4" width="98" height="2.6"/>
    <rect class="o" fill="#f4f1ea" x="-300" y="-146" width="300" height="12" rx="2"/>
    <rect class="n" fill="#d8342b" x="-297" y="-138.4" width="98" height="2.6"/>
    <rect class="n" fill="#f6c21c" x="-199" y="-138.4" width="98" height="2.6"/>
    <rect class="n" fill="#2f9a48" x="-101" y="-138.4" width="98" height="2.6"/>

    <!-- the roof edge, under the dome -->
    <rect class="o" fill="#f4f1ea" x="-306" y="-452" width="314" height="14" rx="3"/>
    <path class="n" fill="#2f62b0" d="M-303 -442 L5 -442 L5 -440.6 L-303 -440.6 Z"/>
    <path class="t" style="stroke:#2f62b0;stroke-width:3" d="M-302 -445 L4 -445"/>
    <rect class="o" style="stroke-width:2.6" fill="#c9d1dc" x="-194" y="-458" width="196" height="8" rx="3"/>
    <circle class="n" fill="#7ff0f0" cx="-180" cy="-454" r="1.8"/>
    <circle class="n" fill="#4dff9a" cx="-172" cy="-454" r="1.8"/>

    <!-- the white columns, left and right -->
    <rect class="o" fill="#f4f1ea" x="-300" y="-440" width="12" height="440"/>
    <rect class="o" fill="#f4f1ea" x="-14" y="-440" width="12" height="306"/>
    <path class="n" fill="#dcd6c8" d="M-297 -436 L-293 -436 L-293 -4 L-297 -4 Z M-11 -436 L-7 -436 L-7 -138 L-11 -138 Z"/>

    <!-- ground floor: the white front, the time-slot board, the queue and the turnstiles -->
    <rect class="o" fill="#f4f1ea" x="-288" y="-134" width="188" height="134"/>
    <rect class="o" style="stroke-width:2.6" fill="#2f62b0" x="-288" y="-12" width="188" height="12"/>
    <!-- the board: four time slots, each with its own icon, and the cells that say who may come in -->
    <rect class="o" fill="#3a3550" x="-280" y="-126" width="112" height="76" rx="6"/>
    <rect class="n" fill="#1f2433" x="-274" y="-120" width="100" height="64" rx="3"/>
    <!-- a clock -->
    <circle fill="none" stroke="#7ff0f0" stroke-width="1.6" cx="-264" cy="-110" r="4.4"/>
    <path fill="none" stroke="#7ff0f0" stroke-width="1.4" stroke-linecap="round" d="M-264 -110 L-264 -113 M-264 -110 L-261.6 -109"/>
    <!-- a beer mug -->
    <path class="n" fill="#fff27a" d="M-268 -100 L-261.6 -100 L-261.6 -92.4 L-268 -92.4 Z M-261.6 -98.6 Q-258.4 -98.6 -258.4 -96.2 Q-258.4 -93.8 -261.6 -93.8 L-261.6 -95 Q-259.6 -95 -259.6 -96.2 Q-259.6 -97.4 -261.6 -97.4 Z"/>
    <!-- a jester's cap -->
    <path class="n" fill="#ff6fae" d="M-269 -78 Q-268 -84 -264.6 -84 Q-261 -84 -260 -78 Z M-269 -78 L-271 -84 L-267 -81 Z M-260 -78 L-258 -84 L-262 -81 Z"/>
    <!-- a star -->
    <path class="n" fill="#4dff9a" d="M-264 -71.6 L-262.8 -68.6 L-259.6 -68.4 L-262 -66.4 L-261.2 -63.2 L-264 -65 L-266.8 -63.2 L-266 -66.4 L-268.4 -68.4 L-265.2 -68.6 Z"/>
    <!-- the cells: green, open; red, full; grey, past -->
    <g class="n">
      <rect fill="#5b6270" x="-253" y="-114" width="11" height="8" rx="1.6"/>
      <rect fill="#5b6270" x="-239" y="-114" width="11" height="8" rx="1.6"/>
      <rect fill="#ff4a3d" x="-225" y="-114" width="11" height="8" rx="1.6"/>
      <rect fill="#ff4a3d" x="-211" y="-114" width="11" height="8" rx="1.6"/>
      <rect fill="#4dff9a" x="-197" y="-114" width="11" height="8" rx="1.6"/>
      <rect fill="#5b6270" x="-253" y="-100" width="11" height="8" rx="1.6"/>
      <rect fill="#ff4a3d" x="-239" y="-100" width="11" height="8" rx="1.6"/>
      <rect fill="#ff4a3d" x="-225" y="-100" width="11" height="8" rx="1.6"/>
      <rect fill="#4dff9a" x="-211" y="-100" width="11" height="8" rx="1.6"/>
      <rect fill="#4dff9a" x="-197" y="-100" width="11" height="8" rx="1.6"/>
      <rect fill="#ff4a3d" x="-253" y="-86" width="11" height="8" rx="1.6"/>
      <rect fill="#ff4a3d" x="-239" y="-86" width="11" height="8" rx="1.6"/>
      <rect fill="#ff4a3d" x="-225" y="-86" width="11" height="8" rx="1.6"/>
      <rect fill="#ff4a3d" x="-211" y="-86" width="11" height="8" rx="1.6"/>
      <rect fill="#ff4a3d" x="-197" y="-86" width="11" height="8" rx="1.6"/>
      <rect fill="#4dff9a" x="-253" y="-72" width="11" height="8" rx="1.6"/>
      <rect fill="#4dff9a" x="-239" y="-72" width="11" height="8" rx="1.6"/>
      <rect fill="#4dff9a" x="-225" y="-72" width="11" height="8" rx="1.6"/>
      <rect fill="#ff4a3d" x="-211" y="-72" width="11" height="8" rx="1.6"/>
      <rect fill="#4dff9a" x="-197" y="-72" width="11" height="8" rx="1.6"/>
    </g>
    <!-- the queue for it, behind posts and a red rope -->
    <path class="t" style="stroke-width:3" d="M-274 -32 L-274 -12 M-232 -32 L-232 -12 M-190 -32 L-190 -12"/>
    <path fill="none" stroke="#2b1b16" stroke-width="4.6" stroke-linecap="round" d="M-274 -30 Q-253 -20 -232 -30 Q-211 -20 -190 -30"/>
    <path fill="none" stroke="#d8342b" stroke-width="2.4" stroke-linecap="round" d="M-274 -30 Q-253 -20 -232 -30 Q-211 -20 -190 -30"/>
    <circle class="o" style="stroke-width:2" fill="#f1c54a" cx="-274" cy="-33" r="3.4"/>
    <circle class="o" style="stroke-width:2" fill="#f1c54a" cx="-232" cy="-33" r="3.4"/>
    <circle class="o" style="stroke-width:2" fill="#f1c54a" cx="-190" cy="-33" r="3.4"/>
    <!-- the turnstiles: scan your wristband, and push -->
    <rect class="o" style="stroke-width:2.6" fill="#c9d1dc" x="-162" y="-50" width="16" height="38" rx="3"/>
    <rect class="o" style="stroke-width:2" fill="#1f2433" x="-159" y="-47" width="10" height="7" rx="1.6"/>
    <rect class="o" style="stroke-width:2.6" fill="#c9d1dc" x="-130" y="-50" width="16" height="38" rx="3"/>
    <rect class="o" style="stroke-width:2" fill="#1f2433" x="-127" y="-47" width="10" height="7" rx="1.6"/>

    <!-- the doorway units come out of, hung with pennants -->
    <rect class="o" fill="#2f62b0" x="-100" y="-134" width="98" height="12" rx="2"/>
    <rect class="o" fill="#1b2227" x="-90" y="-122" width="76" height="122"/>
    <path class="t" style="stroke-width:1.8" d="M-88 -120 Q-52 -106 -16 -120"/>
    <g class="o" style="stroke-width:1.6">
      <path fill="#d8342b" d="M-84 -118 L-76 -115 L-81 -108 Z"/>
      <path fill="#f6c21c" d="M-70 -113 L-62 -111 L-67 -104 Z"/>
      <path fill="#2f9a48" d="M-56 -111 L-48 -111 L-52 -103 Z"/>
      <path fill="#d8342b" d="M-42 -111 L-34 -113 L-37 -104 Z"/>
      <path fill="#f6c21c" d="M-28 -115 L-20 -118 L-23 -108 Z"/>
    </g>
    <rect class="o" fill="#f4f1ea" x="-102" y="-134" width="12" height="134"/>
    <rect class="o" fill="#f4f1ea" x="-14" y="-134" width="12" height="134"/>

    <!-- the paved square in front -->
    <rect class="o" style="stroke-width:2.6" fill="#c9c2b0" x="-306" y="0" width="310" height="6"/>

    <circle data-mount="turret0" fill="none" cx="-150" cy="-146" r="1"/>
    <circle data-mount="turret1" fill="none" cx="-150" cy="-296" r="1"/>
    <circle data-mount="flag" fill="none" cx="-286" cy="-548" r="1"/>
  </g>

  <!-- The dome: a tall bell of tinted glass on a lattice of white struts, like a cheese cover over the party. Joint at its foot. -->
  <g id="dome" data-parent="building" transform="translate(-96 -450)">
    <g transform="translate(96 450)">
      <path class="n" fill="#bfe8f7" fill-opacity="0.38" d="M-186 -446 A90 146 0 0 1 -6 -446 Z"/>
      <path fill="none" stroke="#2b1b16" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" d="M-176.3 -484 L-129.3 -484 L-62.7 -484 L-15.7 -484 M-150.3 -522 L-96.0 -522 L-41.7 -522 M-118.1 -558 L-73.9 -558 M-186.0 -446 L-176.3 -484 M-159.6 -446 L-176.3 -484 M-159.6 -446 L-129.3 -484 M-96.0 -446 L-129.3 -484 M-96.0 -446 L-62.7 -484 M-32.4 -446 L-62.7 -484 M-32.4 -446 L-15.7 -484 M-6.0 -446 L-15.7 -484 M-176.3 -484 L-150.3 -522 M-129.3 -484 L-150.3 -522 M-129.3 -484 L-96.0 -522 M-62.7 -484 L-96.0 -522 M-62.7 -484 L-41.7 -522 M-15.7 -484 L-41.7 -522 M-150.3 -522 L-118.1 -558 M-96.0 -522 L-118.1 -558 M-96.0 -522 L-73.9 -558 M-41.7 -522 L-73.9 -558 M-118.1 -558 L-96.0 -592 M-73.9 -558 L-96.0 -592"/>
      <path fill="none" stroke="#fbf8f0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M-176.3 -484 L-129.3 -484 L-62.7 -484 L-15.7 -484 M-150.3 -522 L-96.0 -522 L-41.7 -522 M-118.1 -558 L-73.9 -558 M-186.0 -446 L-176.3 -484 M-159.6 -446 L-176.3 -484 M-159.6 -446 L-129.3 -484 M-96.0 -446 L-129.3 -484 M-96.0 -446 L-62.7 -484 M-32.4 -446 L-62.7 -484 M-32.4 -446 L-15.7 -484 M-6.0 -446 L-15.7 -484 M-176.3 -484 L-150.3 -522 M-129.3 -484 L-150.3 -522 M-129.3 -484 L-96.0 -522 M-62.7 -484 L-96.0 -522 M-62.7 -484 L-41.7 -522 M-15.7 -484 L-41.7 -522 M-150.3 -522 L-118.1 -558 M-96.0 -522 L-118.1 -558 M-96.0 -522 L-73.9 -558 M-41.7 -522 L-73.9 -558 M-118.1 -558 L-96.0 -592 M-73.9 -558 L-96.0 -592"/>
      <path class="o" style="stroke-width:3.2" fill="none" d="M-186 -446 A90 146 0 0 1 -6 -446"/>
      <circle class="o" style="stroke-width:2.2" fill="#f6c21c" cx="-96" cy="-591" r="4"/>
    </g>
  </g>

  <!-- The shine on the glass. Joint in its middle. -->
  <g id="glint" data-parent="dome" transform="translate(-158 -510)">
    <path class="n" fill="#ffffff" fill-opacity="0.85" d="M-6 14 Q-6 -2 6 -14 Q0 -2 0 14 Z"/>
  </g>

  <!-- The mirror ball, hanging from the top strut under the glass. Joint where it hangs. -->
  <g id="mirror_ball" data-parent="building" transform="translate(-96 -517)">
    <path class="t" style="stroke:#9aa3ad;stroke-width:1.6" d="M0 -4 L0 4"/>
    <circle class="o" style="stroke-width:2.4" fill="#c9d1dc" cx="0" cy="15" r="11.6"/>
    <path class="t" style="stroke:#8a919c;stroke-width:1.1" d="M-10.6 10 L10.6 10 M-11.6 15 L11.6 15 M-10.6 20 L10.6 20 M-7 25 L7 25 M-7 5.4 L7 5.4 M-4.4 4 Q-7 15 -4.4 26 M4.4 4 Q7 15 4.4 26 M0 3.4 L0 26.6"/>
    <path class="n" fill="#ffffff" d="M-7.4 6.4 L-4.4 6.4 L-4.4 9.4 L-7.4 9.4 Z M-4 11 L-0.6 11 L-0.6 14 L-4 14 Z"/>
    <path class="n" fill="#7ff0f0" d="M4.4 15.6 L7.4 15.6 L7.4 18.6 L4.4 18.6 Z"/>
    <path class="n" fill="#ff6fae" d="M-7.4 20.4 L-4.4 20.4 L-4.4 23.4 L-7.4 23.4 Z"/>
  </g>

  <!-- A sparkle off the ball. Joint in its middle. -->
  <g id="sparkle" data-parent="mirror_ball" transform="translate(-80 -510)">
    <path class="n" fill="#ffffff" d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6 Z"/>
  </g>

  <!-- The fan in the climate unit. Joint at its hub. -->
  <g id="fan" data-parent="building" transform="translate(-244 -462)">
    <path class="n" fill="#c9d1dc" d="M0 0 Q-2 -8 2 -9 Q5 -6 0 0 Z M0 0 Q8 -2 9 2 Q6 5 0 0 Z M0 0 Q2 8 -2 9 Q-5 6 0 0 Z M0 0 Q-8 2 -9 -2 Q-6 -5 0 0 Z"/>
    <circle class="o" style="stroke-width:1.6" fill="#9aa3ad" cx="0" cy="0" r="2.2"/>
  </g>

  <!-- The slot that is open right now, blinking: come in. Joint in its middle. -->
  <g id="slot_now" data-parent="building" transform="translate(-191.5 -96)">
    <rect fill="none" stroke="#ffffff" stroke-width="1.8" x="-7.6" y="-6" width="15.2" height="12" rx="2.4"/>
  </g>

  <!-- The arms of the turnstiles, turning a third each time someone goes through. Joints at their hubs. -->
  <g id="turn_a" data-parent="building" transform="translate(-146 -36)">
    <path class="t" style="stroke-width:5" d="M0 0 L16 0 M0 0 L-8 -13.8 M0 0 L-8 13.8"/>
    <path fill="none" stroke="#e6ebf0" stroke-width="2.4" stroke-linecap="round" d="M0 0 L16 0 M0 0 L-8 -13.8 M0 0 L-8 13.8"/>
    <circle class="o" style="stroke-width:2" fill="#9aa3ad" cx="0" cy="0" r="3.4"/>
  </g>
  <g id="turn_b" data-parent="building" transform="translate(-114 -36)">
    <path class="t" style="stroke-width:5" d="M0 0 L16 0 M0 0 L-8 -13.8 M0 0 L-8 13.8"/>
    <path fill="none" stroke="#e6ebf0" stroke-width="2.4" stroke-linecap="round" d="M0 0 L16 0 M0 0 L-8 -13.8 M0 0 L-8 13.8"/>
    <circle class="o" style="stroke-width:2" fill="#9aa3ad" cx="0" cy="0" r="3.4"/>
  </g>

  <!-- The scanners on the turnstiles: green, go. Joints in their middles. -->
  <g id="scan_a" data-parent="building" transform="translate(-154 -43.5)">
    <circle class="n" fill="#4dff9a" cx="0" cy="0" r="2.6"/>
  </g>
  <g id="scan_b" data-parent="building" transform="translate(-122 -43.5)">
    <circle class="n" fill="#ff4a3d" cx="0" cy="0" r="2.6"/>
  </g>
</svg>
