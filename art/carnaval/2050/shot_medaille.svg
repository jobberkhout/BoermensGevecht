<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -19 32 37" data-rig="static">
  <title>Een antieke medaille aan een lint in rood, geel en groen</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <!-- An old medal of the council, a little worn, on its striped ribbon. Origin = its middle. -->
  <g id="medal" transform="translate(0 0)">
    <path class="o" fill="#d8342b" d="M-7 -17 L7 -17 L7 -6 L0 -2 L-7 -6 Z"/>
    <path class="n" fill="#f6c21c" d="M-2.4 -16 L2.4 -16 L2.4 -4.4 L0 -3 L-2.4 -4.4 Z"/>
    <path class="n" fill="#2f9a48" d="M-6 -16 L-4 -16 L-4 -5.6 L-6 -6.6 Z M4 -16 L6 -16 L6 -6.6 L4 -5.6 Z"/>
    <path class="t" d="M-7 -17 L7 -17 L7 -6 L0 -2 L-7 -6 Z"/>
    <circle class="o" style="stroke-width:1.6" fill="#c9a23a" cx="0" cy="-2" r="2.4"/>
    <circle class="o" fill="#d9a52a" cx="0" cy="7" r="9.6"/>
    <circle class="n" fill="#f1c54a" cx="0" cy="7" r="7"/>
    <path class="n" fill="#b8862a" d="M0 1.6 L1.5 5.2 L5.2 5.4 L2.4 7.8 L3.4 11.4 L0 9.4 L-3.4 11.4 L-2.4 7.8 L-5.2 5.4 L-1.5 5.2 Z"/>
    <path class="n" fill="#fff3b0" d="M-5.6 3.6 Q-4 1 -1 0.4 Q-3.6 2 -4.4 4.4 Z"/>
    <!-- the patina of sixty seasons -->
    <path class="n" fill="#8a6a1f" fill-opacity="0.45" d="M3 12.6 Q6 11.4 7 8.6 Q7.4 11.6 4.4 13.4 Z"/>
  </g>
</svg>
