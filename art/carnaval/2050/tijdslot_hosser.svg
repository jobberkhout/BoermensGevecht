<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -138 108 144" data-rig="humanoid">
  <title>De Tijdslot-hosser: een slimme boerenkiel met lichtgevende emblemen, een polsbandje om te scannen en een alcoholvrij biertje aan een ketting om zijn nek</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm in the darker blue of the kiel, hanging loose. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#24508f" d="M-7 -3 Q-10 10 -7 23 L6 23 Q8 10 7 -3 Z"/>
    <path class="o" fill="#24508f" d="M-7 21 L6 21 L5 26 L-6 26 Z"/>
    <circle class="o" fill="#d9a07c" cx="-0.5" cy="30" r="4.6"/>
  </g>

  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#2a3352" d="M-7 -3 L7 -3 L6 29 L-6 29 Z"/>
    <path class="o" fill="#e4e4e4" d="M-7 33.5 Q-7 30.5 -4 30.5 L4 30.5 Q11 31 13 35 L13 38 L-7 38 Z"/>
    <path class="n" fill="#c4c4c4" d="M-6 36 L12.5 36 L12.5 37.6 L-6 37.6 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#38446a" d="M-7 -3 L7 -3 L6 29 L-6 29 Z"/>
    <path class="n" fill="#4a5884" d="M1.5 -1 L5 -1 L4.5 27 L1.5 27 Z"/>
    <path class="o" fill="#fafafa" d="M-7 33.5 Q-7 30.5 -4 30.5 L4 30.5 Q11 31 13 35 L13 38 L-7 38 Z"/>
    <path class="n" fill="#d6d6d6" d="M-6 36 L12.5 36 L12.5 37.6 L-6 37.6 Z"/>
  </g>

  <!-- The kiel: the blue farmer's smock, wide and long, with a glowing star and a glowing beer mug sewn in. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#2f62b0" d="M-15 -37 Q-2 -40 14 -37 Q19 -24 22 -8 Q25 2 24 9 Q12 12.6 0 11.6 Q-12 12.6 -22.6 9 Q-23.4 0 -20.6 -10 Q-19 -24 -15 -37 Z"/>
    <path class="n" fill="#1d3f7a" d="M-21.2 7.8 Q-22 0 -19.4 -10 Q-17.8 -22 -14 -35 Q-12.6 -14 -12.8 10.4 Q-17 9.8 -21.2 7.8 Z"/>
    <!-- the gathered yoke, stitched in white, and the pleats below it -->
    <path class="t" style="stroke:#dfe8f7;stroke-width:1.3" d="M-15.4 -27 Q0 -24 17 -27 M-15 -24.4 Q0 -21.4 17.8 -24.4"/>
    <path class="t" style="stroke:#1d3f7a;stroke-width:1.2" d="M-3 -19.6 L-4 -6 M3 -19.6 L4 -4 M9 -20 L11 -6"/>
    <path class="t" style="stroke:#dfe8f7;stroke-width:1.2" d="M-21 6.4 Q0 10.6 23 6.4"/>
    <!-- the glowing star on the chest -->
    <circle class="n" fill="#fff27a" fill-opacity="0.32" cx="-10" cy="-16" r="6"/>
    <path class="n" fill="#fff6a8" d="M-10 -20.4 L-8.8 -17.3 L-5.6 -17.1 L-8.1 -15.1 L-7.2 -12 L-10 -13.8 L-12.8 -12 L-11.9 -15.1 L-14.4 -17.1 L-11.2 -17.3 Z"/>
    <!-- the glowing beer mug on the belly -->
    <circle class="n" fill="#7dffb2" fill-opacity="0.28" cx="-7.6" cy="-0.4" r="7.6"/>
    <path class="n" fill="#b8ffd6" d="M-12 -5 L-4.6 -5 L-4.6 4.2 Q-4.6 5.2 -5.6 5.2 L-11 5.2 Q-12 5.2 -12 4.2 Z"/>
    <path class="n" fill="#b8ffd6" d="M-4.6 -3 Q-1.2 -3 -1.2 0 Q-1.2 3 -4.6 3 L-4.6 1.6 Q-2.6 1.6 -2.6 0 Q-2.6 -1.6 -4.6 -1.6 Z"/>
    <path class="n" fill="#2f62b0" d="M-10 -2.8 L-8.8 -2.8 L-8.8 3.2 L-10 3.2 Z M-7.4 -2.8 L-6.2 -2.8 L-6.2 3.2 L-7.4 3.2 Z"/>
    <!-- eleven, as two strokes, glowing on the hem -->
    <circle class="n" fill="#fff27a" fill-opacity="0.3" cx="15" cy="0.4" r="5.4"/>
    <path class="t" style="stroke:#fff6a8;stroke-width:2.2" d="M13.2 -2.6 L13.2 3.4 M16.8 -2.6 L16.8 3.4"/>
    <!-- the red farmer's handkerchief, knotted at the front -->
    <path class="o" fill="#d8342b" d="M-14 -38 Q0 -33 16 -38 L16 -33 Q0 -28 -14 -33 Z"/>
    <path class="o" fill="#d8342b" d="M-3 -32.6 L8 -33.6 L1.6 -23 Z"/>
    <g class="n" fill="#ffffff">
      <circle cx="-9" cy="-35.6" r="0.9"/>
      <circle cx="-3" cy="-34" r="0.9"/>
      <circle cx="3" cy="-34" r="0.9"/>
      <circle cx="10" cy="-35.4" r="0.9"/>
      <circle cx="2" cy="-30.4" r="0.9"/>
      <circle cx="3.4" cy="-27" r="0.8"/>
    </g>
  </g>

  <!-- The alcohol-free beer, on a chain round his neck so nobody swaps it. Joint at his throat. -->
  <g id="beer" data-parent="torso" transform="translate(3 -74)">
    <path fill="none" stroke="#2b1b16" stroke-width="3" stroke-linecap="round" d="M-10 -1 Q-5 14 1 25 M12 -1 Q8 14 3 25"/>
    <path fill="none" stroke="#f1c54a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1.6 1.6" d="M-10 -1 Q-5 14 1 25 M12 -1 Q8 14 3 25"/>
    <circle class="o" style="stroke-width:1.6" fill="#f1c54a" cx="2" cy="25.6" r="2"/>
    <!-- the bottle: brown glass, a blue label, a white cap -->
    <path class="o" style="stroke-width:2" fill="#8a4a1c" d="M0 27 L4 27 L4 31 Q8 33 8 37 L8 47 Q8 49 6 49 L-2 49 Q-4 49 -4 47 L-4 37 Q-4 33 0 31 Z"/>
    <rect class="o" style="stroke-width:1.6" fill="#f4f4f4" x="-0.6" y="26" width="5.2" height="2.6" rx="0.8"/>
    <rect class="o" style="stroke-width:1.5" fill="#6fb6ff" x="-4" y="38" width="12" height="7" rx="1"/>
    <path class="n" fill="#ffffff" d="M0.4 41.6 Q2 39.6 3.6 41.6 Q2 43.6 0.4 41.6 Z"/>
    <path class="n" fill="#c97a40" d="M-2.6 36 L-1.4 34 L-1.4 37 Z"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#d9a07c" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#f1c09a" cx="2" cy="-21" rx="18.5" ry="17.5"/>
    <ellipse class="o" fill="#f1c09a" cx="-8.5" cy="-18" rx="3.4" ry="4.8"/>
    <!-- short hair at the back, under the cap -->
    <path class="o" fill="#7a4a26" d="M-17 -16 Q-19 -26 -14 -31 L-8 -27 Q-11 -22 -12 -12 Q-16 -11 -17 -16 Z"/>
    <!-- red cheeks, of course -->
    <ellipse class="n" fill="#e8615a" fill-opacity="0.55" cx="8" cy="-12.5" rx="4.2" ry="2.6"/>
    <!-- the eye, bright: it is his time slot -->
    <circle class="n" fill="#2b1b16" cx="12" cy="-22.5" r="2.1"/>
    <path class="t" style="stroke-width:2" d="M8 -28.6 Q12 -31 16 -28.8"/>
    <!-- a round nose -->
    <path class="o" fill="#f1c09a" d="M19 -21 Q25.5 -18.5 20.5 -14"/>
    <!-- singing: Alaaf! -->
    <path class="o" style="stroke-width:1.8" fill="#7a2a2a" d="M9.6 -11.8 Q8.6 -3.6 14.4 -3 Q20.2 -3.6 19.6 -11.2 Q14.6 -12.8 9.6 -11.8 Z"/>
    <path class="n" fill="#e8615a" d="M11.4 -5.6 Q14.4 -7.8 17.8 -5.8 Q14.6 -3.8 11.4 -5.6 Z"/>
  </g>

  <!-- The jester's cap: three floppy points in red, yellow and green, each with a glowing bell. Joint at the crown. -->
  <g id="cap" data-parent="head" transform="translate(3 -110)">
    <path class="o" fill="#2f9a48" d="M-12 3 Q-24 -2 -30 8 Q-31 14 -27 17 Q-24 6 -14 9 Z"/>
    <path class="o" fill="#f6c21c" d="M-6 0 Q-10 -14 -3 -20 Q2 -24 6 -21 Q-2 -16 3 -2 Z"/>
    <path class="o" fill="#d8342b" d="M6 0 Q12 -14 22 -13 Q28 -12 29 -6 Q22 -9 16 4 Z"/>
    <path class="o" fill="#2f62b0" d="M-21 8 Q-19 -6 1 -6 Q19 -6 21 6 Q0 1 -21 8 Z"/>
    <path class="o" style="stroke-width:2" fill="#d8342b" d="M-21 7.5 Q0 0.5 21 5.5 L21.6 9.4 Q0 4.6 -21 11.6 Z"/>
    <circle class="n" fill="#fff27a" fill-opacity="0.35" cx="-27" cy="18.5" r="5"/>
    <circle class="o" style="stroke-width:1.6" fill="#fff6a8" cx="-27" cy="18.5" r="2.8"/>
    <circle class="n" fill="#fff27a" fill-opacity="0.35" cx="7" cy="-21" r="5"/>
    <circle class="o" style="stroke-width:1.6" fill="#fff6a8" cx="7" cy="-21" r="2.8"/>
    <circle class="n" fill="#fff27a" fill-opacity="0.35" cx="30" cy="-5" r="5"/>
    <circle class="o" style="stroke-width:1.6" fill="#fff6a8" cx="30" cy="-5" r="2.8"/>
  </g>

  <!-- The near arm, wrist held out to the scanner: the band glows green. -->
  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <path class="o" fill="#2f62b0" d="M-7 -3 Q-9.5 10 -7 20 Q-1 25 6 21 Q8 8 7 -3 Z"/>
    <path class="o" fill="#2f62b0" d="M-6 13 L9 5.6 L12.4 14 L-2 23.4 Z"/>
    <path class="n" fill="#2f62b0" d="M-5 13.6 L4 9.6 L5 19 L-2 22 Z"/>
    <path class="n" fill="#1d3f7a" d="M-6.2 10 Q-7.6 4 -6 -1 L-3.6 -1 Q-4.6 5 -3.8 12 Z"/>
    <circle class="o" fill="#f1c09a" cx="16.6" cy="7.6" r="4.8"/>
    <!-- the wristband: scan me -->
    <rect class="o" style="stroke-width:1.8" fill="#4dff9a" transform="rotate(-25 11.6 9.8)" x="9.6" y="4.4" width="4.4" height="10.8" rx="1.4"/>
    <circle class="n" fill="#ffffff" cx="11.6" cy="9.8" r="1"/>
  </g>

  <!-- The glow of the band, which blinks when it is checked. Joint in its middle. -->
  <g id="band_glow" data-parent="arm_front" transform="translate(21.6 -62.2)">
    <circle class="n" fill="#7dffb2" fill-opacity="0.4" cx="0" cy="0" r="6.4"/>
  </g>
</svg>
