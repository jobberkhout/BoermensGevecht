<svg xmlns="http://www.w3.org/2000/svg" viewBox="-19 -16 38 34" data-rig="static">
  <title>Een mop: een tekstballon met een ba-dum-tss erin</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <!-- A speech balloon, its tail pointing back at the robot that said it. In it, the rimshot: a snare, a cymbal, the sticks. Origin = its middle. -->
  <g id="balloon" transform="translate(0 0)">
    <path class="o" fill="#fbf8f0" d="M-15 -1 Q-15 -13 1 -13 Q17 -13 17 -1 Q17 10 1 10 Q-3 10 -6 9.4 L-15 15 L-11 6.6 Q-15 3.6 -15 -1 Z"/>
    <path class="n" fill="#ffffff" d="M-11 -6 Q-8 -10.6 -1 -11 Q-7 -9 -9 -4.6 Z"/>
    <!-- the cymbal on its stand -->
    <path class="t" style="stroke-width:1.4" d="M8 -4 L8 6 M5.6 6 L10.4 6"/>
    <ellipse class="o" style="stroke-width:1.5" fill="#f1c54a" cx="8" cy="-4.6" rx="6.2" ry="1.8" transform="rotate(-14 8 -4.6)"/>
    <!-- the snare -->
    <rect class="o" style="stroke-width:1.5" fill="#d8342b" x="-10" y="-1" width="11" height="6.4" rx="1.2"/>
    <path class="t" style="stroke:#fbf8f0;stroke-width:1.2" d="M-7.4 0.4 L-7.4 4 M-4.4 0.4 L-4.4 4 M-1.4 0.4 L-1.4 4"/>
    <rect class="o" style="stroke-width:1.4" fill="#e6ebf0" x="-10.6" y="-2.6" width="12.2" height="2.2" rx="0.8"/>
    <!-- the sticks, mid-rimshot -->
    <path class="t" style="stroke:#a5672e;stroke-width:1.6" d="M-9 -8.6 L-3 -3.6 M3.4 -10 L-1.4 -3.4"/>
    <!-- tss -->
    <path class="t" style="stroke:#e0a812;stroke-width:1.3" d="M13.6 -9.6 L15.4 -11.4 M14.6 -6.6 L16.8 -7.2"/>
  </g>
</svg>
