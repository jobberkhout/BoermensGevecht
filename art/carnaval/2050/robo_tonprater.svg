<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -138 106 144" data-rig="free">
  <title>De Robo-tonprater: een moppenrobot in een ton op een veer, met een rode clownsneus op zijn scherm. Hij vuurt slechte woordgrappen af als tekstballonnen en doet zijn eigen ba-dum-tss</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- Everything hangs from this, so one track can shove the whole act. -->
  <g id="base" transform="translate(0 0)"/>

  <!-- The coil spring the barrel sits on: it bounces along on it. Joint on the road. -->
  <g id="spring" data-parent="base" transform="translate(0 0)">
    <rect class="o" style="stroke-width:2" fill="#5b6270" x="-16" y="-3" width="32" height="4" rx="2"/>
    <path fill="none" stroke="#2b1b16" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" d="M-12 -3 L12 -5 L-12 -7.4 L12 -9.6 L-12 -12"/>
    <path fill="none" stroke="#c9d1dc" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" d="M-12 -3 L12 -5 L-12 -7.4 L12 -9.6 L-12 -12"/>
  </g>

  <!-- The far rim of the barrel and the dark inside, behind the robot. Joint in the middle of the opening. -->
  <g id="barrel_back" data-parent="barrel" transform="translate(0 -66)">
    <ellipse class="o" fill="#d08a4a" cx="0" cy="0" rx="26" ry="6"/>
    <ellipse class="n" fill="#3a2418" cx="0" cy="0.6" rx="22" ry="4.2"/>
  </g>

  <!-- The far arm, explaining the joke with a three-fingered hand. Joint at the shoulder. -->
  <g id="arm_back" data-parent="body" transform="translate(-12 -84)">
    <g transform="translate(12 84)">
      <path class="o" fill="#9aa3ad" d="M-16 -86 L-8 -82 L-14 -70 L-22 -74 Z"/>
      <circle class="o" fill="#c9d1dc" cx="-19" cy="-72" r="4"/>
      <path class="o" fill="#9aa3ad" d="M-23 -73 L-16 -75 L-21 -92 L-27 -90 Z"/>
      <path class="o" style="stroke-width:2" fill="#c9d1dc" d="M-29 -91 Q-30 -98 -27 -101 L-25 -96 L-23 -102 L-21 -96 L-18 -100 Q-17 -94 -20 -90 Z"/>
    </g>
  </g>

  <!-- The robot's body, rising out of the barrel, with the red farmer's handkerchief round its neck. Joint where it sits in the barrel. -->
  <g id="body" data-parent="barrel" transform="translate(0 -66)">
    <g transform="translate(0 66)">
      <rect class="o" fill="#c9d1dc" x="-17" y="-92" width="34" height="44" rx="7"/>
      <path class="n" fill="#9aa3ad" d="M-15.6 -84 L-10 -84 L-10 -50 L-15.6 -50 Z"/>
      <path class="n" fill="#eef1f5" d="M8 -88 L12 -88 L12 -60 L8 -60 Z"/>
      <!-- the chest panel: three lights in the carnival colours -->
      <rect class="o" style="stroke-width:2" fill="#2a2f3d" x="-6" y="-80" width="18" height="9" rx="2.4"/>
      <circle class="n" fill="#ff4a3d" cx="-1.6" cy="-75.5" r="2"/>
      <circle class="n" fill="#ffd21f" cx="3" cy="-75.5" r="2"/>
      <circle class="n" fill="#3fd35b" cx="7.6" cy="-75.5" r="2"/>
      <!-- the neck and the handkerchief -->
      <rect class="o" style="stroke-width:2" fill="#9aa3ad" x="-4" y="-97" width="10" height="7" rx="2"/>
      <path class="o" style="stroke-width:2.2" fill="#d8342b" d="M-15 -93 Q1 -88 17 -93 L17 -88 Q1 -83 -15 -88 Z"/>
      <path class="o" style="stroke-width:2" fill="#d8342b" d="M6 -88 L15 -89 L10 -80 Z"/>
      <g class="n" fill="#ffffff">
        <circle cx="-10" cy="-90" r="0.8"/>
        <circle cx="-4" cy="-88.6" r="0.8"/>
        <circle cx="2" cy="-88.4" r="0.8"/>
        <circle cx="10.4" cy="-85.6" r="0.8"/>
      </g>
    </g>
  </g>

  <!-- The head: a box with a screen for a face, a red clown nose stuck on the screen, and a speaker for a mouth. Joint at the neck. -->
  <g id="head" data-parent="body" transform="translate(2 -94)">
    <g transform="translate(-2 94)">
      <rect class="o" fill="#c9d1dc" x="-16" y="-124" width="36" height="30" rx="7"/>
      <path class="n" fill="#9aa3ad" d="M-14.6 -116 L-10 -116 L-10 -100 L-14.6 -100 Z"/>
      <circle class="o" style="stroke-width:2" fill="#eef1f5" cx="-11" cy="-109" r="3.4"/>
      <rect class="o" style="stroke-width:2.2" fill="#1f2433" x="-5" y="-120" width="23" height="22" rx="5"/>
      <path class="n" fill="#ffffff" fill-opacity="0.18" d="M-2 -118 L5 -118 L-1 -101 L-3 -101 Z"/>
    </g>
    <circle data-mount="muzzle" fill="none" cx="14" cy="-7" r="1"/>
  </g>

  <!-- The eyes on the screen. Joint between them, so they can squint with laughter at their own joke. -->
  <g id="eyes" data-parent="head" transform="translate(8 -112)">
    <g transform="translate(-8 112)">
      <ellipse class="n" fill="#7ff0f0" fill-opacity="0.35" cx="3" cy="-112" rx="3.8" ry="4.6"/>
      <ellipse class="n" fill="#7ff0f0" fill-opacity="0.35" cx="12.4" cy="-112" rx="3.8" ry="4.6"/>
      <ellipse class="n" fill="#bffcfc" cx="3" cy="-112" rx="2.2" ry="3"/>
      <ellipse class="n" fill="#bffcfc" cx="12.4" cy="-112" rx="2.2" ry="3"/>
    </g>
  </g>

  <!-- The speaker it talks through. Joint in its middle, so it can chatter. -->
  <g id="mouth" data-parent="head" transform="translate(9 -102)">
    <rect class="o" style="stroke-width:1.6" fill="#5b6270" x="-6" y="-2.6" width="12" height="5.2" rx="2.4"/>
    <path class="t" style="stroke:#c9d1dc;stroke-width:1.2" d="M-3 -1 L-3 1 M0 -1 L0 1 M3 -1 L3 1"/>
  </g>

  <!-- The red clown nose, stuck on the screen. -->
  <g id="nose" data-parent="head" transform="translate(17 -106)">
    <circle class="o" style="stroke-width:2.2" fill="#e5283f" cx="0" cy="0" r="4.2"/>
    <circle class="n" fill="#ff8a8a" cx="-1.2" cy="-1.4" r="1.2"/>
  </g>

  <!-- A stubby antenna with a bulb, which lights up when the punchline lands. Joint at its foot. -->
  <g id="antenna" data-parent="head" transform="translate(-3 -124)">
    <path class="t" style="stroke-width:3.8" d="M0 0 Q-2.4 -1.6 0 -3.2 Q2.4 -4.8 0 -6.4"/>
    <path fill="none" stroke="#c9d1dc" stroke-width="1.6" stroke-linecap="round" d="M0 0 Q-2.4 -1.6 0 -3.2 Q2.4 -4.8 0 -6.4"/>
  </g>
  <g id="bulb" data-parent="antenna" transform="translate(-3 -130)">
    <circle class="n" fill="#fff27a" fill-opacity="0.35" cx="0" cy="0" r="5.4"/>
    <circle class="o" style="stroke-width:2" fill="#fff27a" cx="0" cy="0" r="3.4"/>
  </g>

  <!-- The barrel: wooden staves, hoops painted red, yellow and green, and a plaque with the fools' eleven. Joint at its foot, on the spring. -->
  <g id="barrel" data-parent="base" transform="translate(0 -12)">
    <g transform="translate(0 12)">
      <path class="o" fill="#c27c3e" d="M-26 -66 Q-34 -39 -26 -12 Q0 -8 26 -12 Q34 -39 26 -66 Q0 -60 -26 -66 Z"/>
      <path class="n" fill="#a3622c" d="M-24.6 -63 Q-31.4 -39 -24.6 -14 Q-20 -13.2 -16 -12.8 Q-21 -39 -16.6 -61.6 Q-21 -62 -24.6 -63 Z"/>
      <path class="t" style="stroke:#8a5426;stroke-width:1.4" d="M-8 -62 Q-11 -39 -8 -10.6 M8 -62 Q11 -39 8 -10.6 M20 -64 Q25 -39 20 -11.6"/>
      <!-- the hoops -->
      <path fill="none" stroke="#2b1b16" stroke-width="6.4" stroke-linecap="round" d="M-29 -55 Q0 -49 29 -55 M-31.4 -37 Q0 -31 31.4 -37 M-29 -20 Q0 -14 29 -20"/>
      <path fill="none" stroke="#d8342b" stroke-width="3.4" stroke-linecap="round" d="M-29 -55 Q0 -49 29 -55"/>
      <path fill="none" stroke="#f6c21c" stroke-width="3.4" stroke-linecap="round" d="M-31.4 -37 Q0 -31 31.4 -37"/>
      <path fill="none" stroke="#2f9a48" stroke-width="3.4" stroke-linecap="round" d="M-29 -20 Q0 -14 29 -20"/>
      <!-- the plaque, with eleven as two upright strokes -->
      <rect class="o" style="stroke-width:2" fill="#fbf8f0" x="-3" y="-47" width="14" height="10" rx="2.6"/>
      <path class="t" style="stroke:#d8342b;stroke-width:2.2" d="M2 -44.4 L2 -39.6 M6 -44.4 L6 -39.6"/>
      <!-- the front lip of the opening -->
      <path class="t" style="stroke:#e6a466;stroke-width:1.6" d="M-23 -63.4 Q0 -58 23 -63.4"/>
    </g>
  </g>

  <!-- The little drum kit bolted to the barrel: a snare, and a cymbal on a stand. Joint at the bracket. -->
  <g id="drum" data-parent="barrel" transform="translate(30 -36)">
    <g transform="translate(-30 36)">
      <path class="t" style="stroke-width:3" d="M28 -38 L33 -38 M40 -40 L40 -56"/>
      <path fill="none" stroke="#c9d1dc" stroke-width="1.4" stroke-linecap="round" d="M40 -41 L40 -55"/>
      <rect class="o" fill="#d8342b" x="31" y="-42" width="18" height="10" rx="2"/>
      <path class="t" style="stroke:#fbf8f0;stroke-width:1.6" d="M35 -39.6 L35 -34.4 M40 -39.6 L40 -34.4 M45 -39.6 L45 -34.4"/>
      <rect class="o" style="stroke-width:2" fill="#eef1f5" x="30" y="-44" width="20" height="3.6" rx="1.4"/>
    </g>
  </g>
  <g id="cymbal" data-parent="drum" transform="translate(40 -57)">
    <ellipse class="o" style="stroke-width:2" fill="#f1c54a" cx="0" cy="0" rx="10.4" ry="2.8"/>
    <path class="n" fill="#fff3b0" d="M-6 -0.8 Q0 -2.2 6 -0.8 Q0 -1.4 -6 -0.8 Z"/>
    <circle class="o" style="stroke-width:1.4" fill="#c9a23a" cx="0" cy="-1.6" r="1.6"/>
  </g>

  <!-- The near arm, with the drumstick for its own rimshot. Joint at the shoulder. -->
  <g id="arm_front" data-parent="body" transform="translate(12 -84)">
    <g transform="translate(-12 84)">
      <path class="o" fill="#c9d1dc" d="M9 -86 L17 -82 L23 -68 L16 -65 Z"/>
      <circle class="o" fill="#eef1f5" cx="20" cy="-67" r="4"/>
      <path class="o" fill="#c9d1dc" d="M17 -69 L30 -66 L29 -59 L17 -63 Z"/>
      <circle class="o" fill="#eef1f5" cx="12" cy="-86" r="5"/>
    </g>
  </g>
  <g id="stick" data-parent="arm_front" transform="translate(30 -62)">
    <path class="t" style="stroke-width:4.4" d="M-4 2 L17 -8"/>
    <path fill="none" stroke="#f1d9a8" stroke-width="2" stroke-linecap="round" d="M-4 2 L17 -8"/>
    <path class="o" style="stroke-width:2" fill="#9aa3ad" d="M-4 -4 Q2 -5 3 0 Q2 5 -4 4 Z"/>
  </g>
</svg>
