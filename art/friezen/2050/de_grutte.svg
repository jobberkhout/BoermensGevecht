<svg xmlns="http://www.w3.org/2000/svg" viewBox="-62 -244 180 250" data-rig="humanoid">
  <title>De Grutte: een naamloze reus in een Hawaïshirt, met een zwaard groter dan een man. Hij vraagt iedereen het wachtwoord en laat niemand door die het niet kan zeggen</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -80)"/>

  <!-- The back arm, raised: one finger up. Say it. Joint at the shoulder. -->
  <g id="arm_back" data-parent="torso" transform="translate(-30 -164)">
    <path class="o" fill="#e5283f" d="M-12 6 Q-18 -6 -12 -16 L2 -12 Q4 0 8 4 Z"/>
    <path class="o" fill="#e9906f" d="M-12 -12 Q-20 -26 -16 -38 L-6 -37 Q-8 -24 0 -12 Z"/>
    <!-- the fist, index finger up -->
    <path class="o" fill="#e9906f" d="M-20 -36 Q-22 -46 -14 -48 L-6 -48 Q0 -46 -2 -38 Q-6 -34 -14 -34 Z"/>
    <path class="o" fill="#e9906f" d="M-14 -47 L-14 -64 Q-10 -68 -8 -64 L-8 -47 Z"/>
    <path class="t" style="stroke-width:1.4" d="M-16 -42 L-6 -42"/>
  </g>

  <!-- Legs like mooring posts: white shorts, sunburnt calves, sandals. -->
  <g id="leg_back" data-parent="hips" transform="translate(-14 -80)">
    <path class="o" fill="#e9e6df" d="M-14 -4 L14 -4 L13 32 L-13 32 Z"/>
    <path class="o" fill="#d9775a" d="M-10 31 L10 31 L9 70 L-9 70 Z"/>
    <path class="o" fill="#8a5a2e" d="M-12 72 L28 72 Q32 80 26 80 L-12 80 Z"/>
    <path class="o" style="stroke-width:2.4" fill="#d9775a" d="M-9 72 Q-9 66 -3 66 L18 66 Q26 68 26 74 L-9 74 Z"/>
    <path class="t" style="stroke:#6a3418;stroke-width:3" d="M2 73 L6 64 L12 73"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(14 -80)">
    <path class="o" fill="#fbf8f0" d="M-14 -4 L14 -4 L13 32 L-13 32 Z"/>
    <path class="n" fill="#e9e6df" d="M3 -2 L11 -2 L10 30 L4 30 Z"/>
    <path class="o" fill="#e9906f" d="M-10 31 L10 31 L9 70 L-9 70 Z"/>
    <!-- the white stripe where the sock used to be -->
    <path class="n" fill="#fbe2d4" d="M-9 60 L9 60 L9 64 L-9 64 Z"/>
    <path class="o" fill="#a5672e" d="M-12 72 L28 72 Q32 80 26 80 L-12 80 Z"/>
    <path class="o" style="stroke-width:2.4" fill="#e9906f" d="M-9 72 Q-9 66 -3 66 L18 66 Q26 68 26 74 L-9 74 Z"/>
    <path class="t" style="stroke:#7a4a26;stroke-width:3" d="M2 73 L6 64 L12 73"/>
  </g>

  <!-- A belly like a terp, in a shirt of red hibiscus. -->
  <g id="torso" data-parent="hips" transform="translate(0 -84)">
    <path class="o" fill="#e5283f" d="M-34 6 Q-40 -30 -36 -66 Q-30 -82 0 -82 Q30 -82 36 -66 Q48 -40 44 -10 Q40 6 30 8 Z"/>
    <path class="n" fill="#c81f33" d="M-32 4 Q-37 -30 -34 -62 Q-26 -40 -24 4 Z"/>
    <!-- the open collar and a tuft of chest hair -->
    <path class="o" style="stroke-width:2.4" fill="#e9906f" d="M-4 -82 L18 -82 L8 -62 Z"/>
    <path class="t" style="stroke:#d9a43a;stroke-width:1.6" d="M5 -72 q-2 -3 0 -5 M9 -72 q2 -3 0 -5 M7 -67 q-2 -3 0 -5"/>
    <path class="o" style="stroke-width:2.4" fill="#ff5a6e" d="M-4 -82 L-10 -74 L4 -70 Z M18 -82 L26 -74 L12 -70 Z"/>
    <!-- hibiscus -->
    <g class="n" fill="#fbf8f0">
      <path d="M-20 -50 l4 -5 l4 5 l-2 5 l-4 0 Z"/>
      <path d="M22 -34 l4 -5 l4 5 l-2 5 l-4 0 Z"/>
      <path d="M-16 -16 l4 -5 l4 5 l-2 5 l-4 0 Z"/>
      <path d="M14 -60 l4 -5 l4 5 l-2 5 l-4 0 Z"/>
    </g>
    <g class="n" fill="#ffd21f">
      <circle cx="-16" cy="-51" r="1.6"/>
      <circle cx="26" cy="-35" r="1.6"/>
      <circle cx="-12" cy="-17" r="1.6"/>
      <circle cx="18" cy="-61" r="1.6"/>
    </g>
    <path class="n" fill="#3fae6a" d="M-6 -36 q5 -5 9 0 q-5 4 -9 0 Z M30 -14 q5 -5 9 0 q-5 4 -9 0 Z M-28 -30 q5 -5 9 0 q-5 4 -9 0 Z"/>
    <!-- the buttons, under strain -->
    <circle class="o" style="stroke-width:1.6" fill="#fbf8f0" cx="12" cy="-50" r="2"/>
    <circle class="o" style="stroke-width:1.6" fill="#fbf8f0" cx="20" cy="-30" r="2"/>
    <circle class="o" style="stroke-width:1.6" fill="#fbf8f0" cx="22" cy="-10" r="2"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(8 -170)">
    <rect class="o" fill="#d9775a" x="-10" y="-6" width="20" height="12" rx="4"/>
    <ellipse class="o" fill="#e9906f" cx="6" cy="-28" rx="24" ry="25"/>
    <ellipse class="o" fill="#e9906f" cx="-14" cy="-24" rx="5" ry="7"/>
    <!-- a beard like a bale of straw -->
    <path class="o" fill="#e8c46a" d="M-12 -24 Q-14 4 4 12 Q22 16 30 -2 Q32 -14 28 -20 Q20 -10 10 -12 Q0 -14 -2 -22 Z"/>
    <path class="t" style="stroke:#c59a3e;stroke-width:1.6" d="M2 -2 L4 8 M10 -2 L12 10 M18 -4 L21 6 M-6 -10 L-4 0"/>
    <!-- the nose, peeling -->
    <path class="o" fill="#e5583f" d="M24 -32 Q36 -28 32 -18 Q26 -16 22 -20 Z"/>
    <path class="n" fill="#fbe2d4" d="M27 -30 Q31 -29 31 -26 Z"/>
    <!-- the mustache -->
    <path class="o" fill="#e8c46a" d="M12 -18 Q22 -22 34 -16 Q34 -10 28 -12 Q22 -14 18 -11 Q12 -10 12 -18 Z"/>
    <!-- the eye, narrowed: and? say it -->
    <path class="t" style="stroke-width:3" d="M14 -36 L24 -35"/>
    <path class="t" style="stroke-width:3.4" d="M10 -44 L26 -40"/>
    <circle class="n" fill="#2b1b16" cx="20" cy="-35" r="2"/>
  </g>

  <!-- The straw hat, a parasol of a hat. Joint at the middle of the brim. -->
  <g id="hat" data-parent="head" transform="translate(12 -218)">
    <path class="o" fill="#e8c46a" d="M-44 2 Q0 -12 46 2 Q46 9 36 8 Q0 -2 -36 8 Q-46 8 -44 2 Z"/>
    <path class="o" fill="#efd27e" d="M-22 -2 Q-24 -24 2 -24 Q26 -24 24 -2 Q0 -8 -22 -2 Z"/>
    <path class="o" style="stroke-width:2.4" fill="#1d5fa8" d="M-22 -6 Q2 -12 24 -6 L24 -1 Q2 -7 -22 -1 Z"/>
    <path class="t" style="stroke:#c59a3e;stroke-width:1.4" d="M-12 -21 L-14 -8 M0 -23 L0 -10 M12 -21 L13 -8 M-36 4 L-30 0 M30 0 L36 4"/>
  </g>

  <!-- What he wants to hear, in a cloud: butter, bread and green cheese. Joint in its middle. -->
  <g id="cloud" data-parent="head" transform="translate(86 -220)">
    <circle class="o" style="stroke-width:2.2" fill="#fbf8f0" cx="-34" cy="16" r="3"/>
    <circle class="o" style="stroke-width:2.2" fill="#fbf8f0" cx="-27" cy="9" r="4.4"/>
    <path class="o" style="stroke-width:2.4" fill="#fbf8f0" d="M-22 4 Q-30 -6 -18 -12 Q-14 -22 0 -19 Q12 -24 18 -14 Q30 -12 26 0 Q30 10 16 12 Q6 18 -4 13 Q-20 16 -22 4 Z"/>
    <!-- butter -->
    <rect class="o" style="stroke-width:1.8" fill="#ffe36e" x="-17" y="-6" width="11" height="9" rx="1.6"/>
    <path class="n" fill="#fff3b0" d="M-15 -4 L-9 -4 L-9 -2.6 L-15 -2.6 Z"/>
    <!-- bread -->
    <path class="o" style="stroke-width:1.8" fill="#c98a45" d="M-3 3 L-3 -4 Q-3 -10 3 -10 Q9 -10 9 -4 L9 3 Z"/>
    <path class="t" style="stroke:#8a5a2e;stroke-width:1.2" d="M0 -6 L2 -8 M4 -5 L6 -7"/>
    <!-- green cheese -->
    <path class="o" style="stroke-width:1.8" fill="#9bd65b" d="M12 3 L12 -3 L22 -6 L22 3 Z"/>
    <circle class="n" fill="#6fae3a" cx="17" cy="-1" r="1.2"/>
  </g>

  <!-- The front arm, reaching forward to the pommel. Joint at the shoulder. -->
  <g id="arm_front" data-parent="torso" transform="translate(28 -164)">
    <path class="o" fill="#e5283f" d="M-10 -10 Q4 -14 14 -10 L14 10 Q2 12 -10 10 Z"/>
    <path class="n" fill="#fbf8f0" d="M0 -4 l3 -3 l3 3 l-1 3 l-3 0 Z"/>
    <path class="o" fill="#e9906f" d="M12 -9 L34 -7 L34 7 L12 9 Z"/>
  </g>

  <!-- The sword: taller than a man, point down on the road in front of him. Joint at his fist on the grip. -->
  <g id="sword" data-parent="arm_front" transform="translate(64 -164)">
    <!-- the blade -->
    <path class="o" fill="#d7dde2" d="M-7 12 L7 12 L6 148 L0 160 L-6 148 Z"/>
    <path class="n" fill="#ffffff" d="M-3 16 L-1 16 L-1 146 L-3 144 Z"/>
    <path class="t" style="stroke:#9aa3ad;stroke-width:1.4" d="M2 18 L2 146"/>
    <!-- the cross guard -->
    <rect class="o" fill="#c98a45" x="-18" y="6" width="36" height="7" rx="3"/>
    <!-- the grip and the pommel -->
    <rect class="o" fill="#6a3418" x="-4" y="-14" width="8" height="20" rx="2"/>
    <circle class="o" fill="#c98a45" cx="0" cy="-17" r="5"/>
    <!-- the fist round the grip -->
    <path class="o" fill="#e9906f" d="M-9 -8 Q-10 -14 -3 -14 L5 -14 Q10 -13 10 -7 L10 2 Q9 6 3 6 L-5 6 Q-10 5 -9 0 Z"/>
    <path class="t" style="stroke-width:1.4" d="M-2 -8 L8 -8 M-2 -3 L8 -3 M-2 2 L8 2"/>
  </g>
</svg>
