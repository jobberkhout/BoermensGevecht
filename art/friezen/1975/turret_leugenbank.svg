<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -118 232 122" data-rig="static">
  <title>De Leugenbank: drie oude mannen in winterjassen, elk met een medaille, die alle drie de tocht van '63 uitreden. Eentje schiet dúmkes uit een trommel</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- The bench, snow under it, a pair of old skates hung over the back. Origin = middle of the floor. -->
  <g id="bench" transform="translate(0 0)">
    <path class="o" fill="#f6fbff" d="M-108 0 Q-106 -12 -94 -12 Q-88 -20 -78 -14 Q-70 -16 -66 0 Z"/>
    <rect class="o" fill="#7a5a3a" x="-90" y="-76" width="7" height="76" rx="1.5"/>
    <rect class="o" fill="#7a5a3a" x="61" y="-76" width="7" height="76" rx="1.5"/>
    <rect class="o" fill="#9c7448" x="-94" y="-74" width="166" height="9" rx="2"/>
    <rect class="o" fill="#9c7448" x="-94" y="-60" width="166" height="9" rx="2"/>
    <!-- the skates, hung on a strap between B and C -->
    <g transform="translate(40 0)">
      <path class="t" style="stroke:#6b4a2a;stroke-width:2.4" d="M-30 -74 L-36 -56 M-30 -74 L-22 -56"/>
      <path class="t" style="stroke-width:3.6" d="M-46 -54 L-30 -54 Q-26 -54 -26 -58"/>
      <path fill="none" stroke="#c3ccd0" stroke-width="1.8" stroke-linecap="round" d="M-46 -54 L-30 -54 Q-26 -54 -26 -58"/>
      <rect class="o" style="stroke-width:1.6" fill="#c9934f" x="-44" y="-58.6" width="14" height="3.4" rx="1"/>
      <path class="t" style="stroke-width:3.6" d="M-30 -52 L-14 -52 Q-10 -52 -10 -56"/>
      <path fill="none" stroke="#c3ccd0" stroke-width="1.8" stroke-linecap="round" d="M-30 -52 L-14 -52 Q-10 -52 -10 -56"/>
      <rect class="o" style="stroke-width:1.6" fill="#c9934f" x="-28" y="-56.6" width="14" height="3.4" rx="1"/>
    </g>
    <!-- seat and legs -->
    <rect class="o" fill="#a8804f" x="-96" y="-34" width="170" height="8" rx="2"/>
    <rect class="o" fill="#7a5a3a" x="-88" y="-27" width="7" height="27"/>
    <rect class="o" fill="#7a5a3a" x="59" y="-27" width="7" height="27"/>
    <!-- crumbs of the dúmkes that went the wrong way -->
    <ellipse class="o" style="stroke-width:1.4" fill="#d9a35f" cx="-30" cy="-2" rx="4" ry="2"/>
    <ellipse class="o" style="stroke-width:1.4" fill="#d9a35f" cx="14" cy="-2" rx="3.4" ry="1.8"/>
  </g>

  <!-- A: the one telling it, pipe in his mouth. "Achttien graden vorst, en ik vooraan." -->
  <g id="a_body" transform="translate(-62 -32)">
    <g transform="translate(62 32)">
      <path class="o" fill="#26282b" d="M-60 -6 L-60 -1 L-44 -1 Q-42 -5 -47 -6 Z"/>
      <path class="o" fill="#4a3f35" d="M-66 -36 L-46 -36 L-46 -26 L-50 -26 L-50 -6 L-59 -6 L-59 -26 L-66 -26 Z"/>
      <path class="o" fill="#5d6270" d="M-75 -30 Q-77 -52 -71 -62 Q-62 -66 -53 -62 Q-48 -52 -49 -30 Z"/>
      <path class="t" style="stroke:#454a56" d="M-58 -62 L-57 -31"/>
      <path class="o" style="stroke-width:1.6" fill="#1d5fa8" d="M-54 -55 L-51 -55 L-51.5 -47 L-53.5 -47 Z"/>
      <circle class="o" style="stroke-width:1.6" fill="#ffd21f" cx="-52.5" cy="-44.5" r="3.4"/>
      <path class="o" fill="#d9342b" d="M-70 -62 Q-62 -57 -54 -62 L-55 -55 Q-62 -52 -69 -55 Z"/>
      <path class="o" fill="#5d6270" d="M-71 -58 Q-80 -50 -80 -40 L-74 -38 Q-73 -48 -67 -54 Z"/>
      <ellipse class="o" style="stroke-width:2" fill="#efc09a" cx="-77" cy="-37" rx="4" ry="3.6"/>
    </g>
  </g>

  <g id="a_head" data-parent="a_body" transform="translate(-62 -64)">
    <g transform="translate(62 64)">
      <circle class="o" fill="#efc09a" cx="-61" cy="-76" r="12.5"/>
      <path class="o" fill="#efc09a" d="M-49.8 -78.5 Q-43.5 -75.5 -49.5 -72"/>
      <path class="o" fill="#4a4a4a" d="M-74.5 -80 Q-75 -90.5 -61 -90.5 Q-49 -90.5 -48 -83 L-41.5 -81.5 L-42 -79 L-50 -80 Q-62 -83.5 -74.5 -80 Z"/>
      <path class="t" style="stroke-width:2.2" d="M-58 -78 L-52.5 -77.6"/>
      <circle class="n" fill="#2b1b16" cx="-54" cy="-74.8" r="1.5"/>
      <path class="o" fill="#f4f4f0" d="M-60 -68 Q-54 -72 -48 -68 Q-46 -64 -49 -63 Q-54 -66 -60 -63 Z"/>
      <path class="t" style="stroke-width:2.6" d="M-52 -64 L-44 -62"/>
      <path class="o" style="stroke-width:1.8" fill="#6b4a2a" d="M-45 -66 L-40 -66 L-40.6 -60.6 Q-42.5 -59.4 -44.4 -60.6 Z"/>
    </g>
  </g>

  <!-- His arm, flung out: it was THIS cold. Joint at the shoulder. -->
  <g id="a_arm" data-parent="a_body" transform="translate(-55 -58)">
    <g transform="translate(55 58)">
      <path class="o" fill="#5d6270" d="M-58 -61 L-44 -72 L-39 -66 L-53 -55 Z"/>
      <path class="o" fill="#5d6270" d="M-45 -71 L-38 -86 L-32 -83 L-39 -68 Z"/>
      <path class="o" style="stroke-width:2" fill="#efc09a" d="M-38 -86 L-36 -94 L-33.5 -93.4 L-34 -88 L-30 -93 L-27.6 -91.4 L-31.6 -86 L-28 -87 L-27 -84.6 L-33 -82 Z"/>
    </g>
  </g>

  <!-- B: rolls his eyes. He was there too, and it was colder. -->
  <g id="b_body" transform="translate(-14 -32)">
    <g transform="translate(14 32)">
      <path class="o" fill="#26282b" d="M-12 -6 L-12 -1 L4 -1 Q6 -5 1 -6 Z"/>
      <path class="o" fill="#3d3a36" d="M-18 -36 L2 -36 L2 -26 L-2 -26 L-2 -6 L-11 -6 L-11 -26 L-18 -26 Z"/>
      <path class="o" fill="#6b4f33" d="M-27 -30 Q-29 -52 -23 -62 Q-14 -66 -5 -62 Q0 -52 -1 -30 Z"/>
      <path class="t" style="stroke:#55402a" d="M-10 -62 L-9 -31"/>
      <path class="o" style="stroke-width:1.6" fill="#1d5fa8" d="M-6 -55 L-3 -55 L-3.5 -47 L-5.5 -47 Z"/>
      <circle class="o" style="stroke-width:1.6" fill="#ffd21f" cx="-4.5" cy="-44.5" r="3.4"/>
      <path class="o" fill="#f4f4f0" d="M-22 -62 Q-14 -57 -6 -62 L-7 -55 Q-14 -52 -21 -55 Z"/>
      <path class="n" fill="#1d5fa8" d="M-19 -59.6 L-16 -58.6 L-16.4 -54.6 L-19.4 -55.6 Z M-12 -58.4 L-9 -59.2 L-9 -55 L-12 -54.4 Z"/>
    </g>
  </g>

  <g id="b_head" data-parent="b_body" transform="translate(-14 -64)">
    <g transform="translate(14 64)">
      <circle class="o" fill="#f2c4a4" cx="-13" cy="-76" r="12.5"/>
      <path class="o" fill="#f2c4a4" d="M-1.8 -78.5 Q4.5 -75.5 -1.5 -72"/>
      <!-- a woolly hat and a frosted grey beard -->
      <path class="o" fill="#2f8a4f" d="M-26 -79 Q-27 -93 -13 -93 Q1 -93 0 -79 Q-13 -84 -26 -79 Z"/>
      <circle class="o" fill="#f4f4f0" cx="-13" cy="-95" r="3.4"/>
      <path class="o" fill="#d8d8d8" d="M-22 -70 Q-21 -60 -11 -60 Q-2 -61 1 -70 Q-6 -66 -11 -67 Q-17 -67 -22 -70 Z"/>
      <!-- eyes rolled to heaven -->
      <circle class="o" style="stroke-width:1.2" fill="#ffffff" cx="-7.5" cy="-76" r="2.6"/>
      <circle class="o" style="stroke-width:1.2" fill="#ffffff" cx="-1.8" cy="-76.2" r="2.2"/>
      <circle class="n" fill="#2b1b16" cx="-7.2" cy="-77.6" r="1.1"/>
      <circle class="n" fill="#2b1b16" cx="-1.6" cy="-77.6" r="1"/>
      <ellipse class="o" style="stroke-width:1.6" fill="#e0442c" cx="1.4" cy="-71.8" rx="2.6" ry="2.2"/>
    </g>
  </g>

  <!-- His elbow, for nudging A. Joint at the shoulder. -->
  <g id="b_arm" data-parent="b_body" transform="translate(-22 -58)">
    <g transform="translate(22 58)">
      <path class="o" fill="#6b4f33" d="M-19 -61 L-32 -52 L-28 -46 L-15 -55 Z"/>
      <path class="o" fill="#6b4f33" d="M-31 -52 L-20 -42 L-24 -37 L-34 -47 Z"/>
      <ellipse class="o" style="stroke-width:2" fill="#f2c4a4" cx="-19.6" cy="-39.6" rx="3.8" ry="3.4"/>
    </g>
  </g>

  <!-- C: the tin of dúmkes on his knees, and the thumb that flicks them. -->
  <g id="c_body" transform="translate(34 -32)">
    <g transform="translate(-34 32)">
      <path class="o" fill="#26282b" d="M36 -6 L36 -1 L52 -1 Q54 -5 49 -6 Z"/>
      <path class="o" fill="#4a3f35" d="M30 -36 L50 -36 L50 -26 L46 -26 L46 -6 L37 -6 L37 -26 L30 -26 Z"/>
      <path class="o" fill="#2c3e5c" d="M21 -30 Q19 -52 25 -62 Q34 -66 43 -62 Q48 -52 47 -30 Z"/>
      <path class="t" style="stroke:#22324a" d="M38 -62 L39 -31"/>
      <path class="o" style="stroke-width:1.6" fill="#1d5fa8" d="M42 -55 L45 -55 L44.5 -47 L42.5 -47 Z"/>
      <circle class="o" style="stroke-width:1.6" fill="#ffd21f" cx="43.5" cy="-44.5" r="3.4"/>
      <path class="o" fill="#e3b23c" d="M26 -62 Q34 -57 42 -62 L41 -55 Q34 -52 27 -55 Z"/>
      <!-- the biscuit tin, blue with a white band, lid off -->
      <rect class="o" fill="#1d5fa8" x="40" y="-46" width="22" height="13" rx="2"/>
      <rect class="n" fill="#f4f4f0" x="41.4" y="-41.6" width="19.2" height="3.4"/>
      <path class="o" style="stroke-width:1.6" fill="#d9a35f" d="M43 -46 Q45 -50 49 -48 Q52 -51 56 -48 Q59 -50 60 -46 Z"/>
    </g>
  </g>

  <g id="c_head" data-parent="c_body" transform="translate(34 -64)">
    <g transform="translate(-34 64)">
      <circle class="o" fill="#efc09a" cx="35" cy="-76" r="12.5"/>
      <path class="o" fill="#efc09a" d="M46.2 -78.5 Q52.5 -75.5 46.5 -72"/>
      <path class="o" fill="#6b5b4b" d="M21.5 -80 Q21 -90.5 35 -90.5 Q47 -90.5 48 -83 L54.5 -81.5 L54 -79 L46 -80 Q34 -83.5 21.5 -80 Z"/>
      <path class="t" style="stroke-width:2.2" d="M38 -78.6 L44 -79.4"/>
      <circle class="n" fill="#2b1b16" cx="42" cy="-75" r="1.5"/>
      <ellipse class="o" style="stroke-width:1.6" fill="#e0442c" cx="48.6" cy="-71.6" rx="2.6" ry="2.2"/>
      <!-- cheeks full of biscuit -->
      <ellipse class="n" fill="#e8786a" fill-opacity="0.55" cx="39" cy="-69" rx="4.6" ry="3.6"/>
      <path class="t" style="stroke-width:1.8" d="M40 -66 Q43.5 -64.4 47 -66.6"/>
    </g>
  </g>

  <!-- His flicking arm. Joint at the shoulder; the dúmke leaves from his thumb. -->
  <g id="c_arm" data-parent="c_body" transform="translate(42 -58)">
    <g transform="translate(-42 58)">
      <path class="o" fill="#2c3e5c" d="M39 -61 L52 -52 L48 -46 L35 -55 Z"/>
      <path class="o" fill="#2c3e5c" d="M51 -53 L60 -60 L64 -55 L54 -47 Z"/>
      <ellipse class="o" style="stroke-width:2" fill="#efc09a" cx="63" cy="-59.4" rx="4" ry="3.6"/>
      <path class="o" style="stroke-width:1.6" fill="#efc09a" d="M64 -62 L66 -67 L68.4 -66 L66.6 -61 Z"/>
      <rect class="o" style="stroke-width:1.4" fill="#d9a35f" x="65.6" y="-71.6" width="7" height="3.6" rx="1.6" transform="rotate(-20 69 -70)"/>
    </g>
    <circle data-mount="muzzle" fill="none" cx="28" cy="-13" r="1"/>
  </g>
</svg>
