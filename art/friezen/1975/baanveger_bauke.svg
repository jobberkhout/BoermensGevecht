<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -142 110 148" data-rig="humanoid">
  <title>Baanveger Bauke: op schaatsen, in bontmuts, achter een brede houten sneeuwschuif met sneeuw erop</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(-20 -43)"/>

  <!-- The far arm, reaching for the handle. -->
  <g id="arm_back" data-parent="torso" transform="translate(-26 -77)">
    <path class="o" fill="#2c2a2e" d="M-5 -4 Q1 -7 6 -2 L22 10 L17 17 L-3 6 Q-8 1 -5 -4 Z"/>
    <ellipse class="o" fill="#d9342b" cx="21" cy="13.5" rx="5.4" ry="5"/>
  </g>

  <!-- Corduroy breeches, thick socks, and Frisian skates with the curl in front. -->
  <g id="leg_back" data-parent="hips" transform="translate(-25 -43)">
    <path class="o" fill="#5b4a3a" d="M-7.5 -3 L7.5 -3 L8 15 Q0 19 -8 15 Z"/>
    <path class="o" fill="#bdb6a6" d="M-6 15 L6 15 L5.5 33 L-5.5 33 Z"/>
    <path class="o" fill="#26282b" d="M-6.5 32 L6 32 Q9.5 33 10.5 36.5 L10.5 39 L-7 39 L-7 35 Z"/>
    <rect class="o" style="stroke-width:2" fill="#c9934f" x="-12" y="38.5" width="25" height="3.4" rx="1.2"/>
    <path class="t" style="stroke-width:4.2" d="M-15 43 L16 43 Q24.5 43 24 36.5 Q23.6 32 19 33.2"/>
    <path fill="none" stroke="#c3ccd0" stroke-width="2" stroke-linecap="round" d="M-15 43 L16 43 Q24.5 43 24 36.5 Q23.6 32 19 33.2"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(-15 -43)">
    <path class="o" fill="#6b5741" d="M-7.5 -3 L7.5 -3 L8 15 Q0 19 -8 15 Z"/>
    <path class="t" style="stroke:#58462f" d="M-2.5 -1 L-2.5 14 M2.5 -1 L2.5 14"/>
    <path class="o" fill="#e4dece" d="M-6 15 L6 15 L5.5 33 L-5.5 33 Z"/>
    <path class="t" style="stroke:#b9b2a2" d="M-5.4 19 L5.4 19 M-5.4 23 L5.4 23"/>
    <path class="o" fill="#33363a" d="M-6.5 32 L6 32 Q9.5 33 10.5 36.5 L10.5 39 L-7 39 L-7 35 Z"/>
    <rect class="o" style="stroke-width:2" fill="#d9a35f" x="-12" y="38.5" width="25" height="3.4" rx="1.2"/>
    <path class="t" style="stroke-width:4.2" d="M-15 43 L16 43 Q24.5 43 24 36.5 Q23.6 32 19 33.2"/>
    <path fill="none" stroke="#dfe5e8" stroke-width="2" stroke-linecap="round" d="M-15 43 L16 43 Q24.5 43 24 36.5 Q23.6 32 19 33.2"/>
  </g>

  <!-- A long black coat buttoned to the chin, and a fat red scarf. -->
  <g id="torso" data-parent="hips" transform="translate(-20 -45)">
    <path class="o" fill="#3a383d" d="M-17 14 Q-21 -12 -16 -30 Q-12 -37 0 -37 Q14 -37 18 -30 Q22 -12 18.5 14 Z"/>
    <path class="n" fill="#2c2a2e" d="M-16 13 Q-19 -12 -15 -28 Q-10 -14 -9.5 13 Z"/>
    <path class="t" style="stroke:#1f1d21" d="M5 -30 L5 13"/>
    <circle class="n" fill="#8b9690" cx="8" cy="-20" r="1.6"/>
    <circle class="n" fill="#8b9690" cx="8" cy="-9" r="1.6"/>
    <circle class="n" fill="#8b9690" cx="8" cy="2" r="1.6"/>
    <path class="o" fill="#d9342b" d="M-14 -36 Q2 -28 17 -36 L16 -28 Q2 -21 -13 -28 Z"/>
    <path class="o" fill="#d9342b" d="M-12 -30 L-17 -10 L-10 -9 L-6 -27 Z"/>
    <path class="t" style="stroke:#a8231c" d="M-15 -13 L-9 -12"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(-19 -81)">
    <rect class="o" fill="#dba27f" x="-4.5" y="-6" width="10" height="9" rx="2"/>
    <ellipse class="o" fill="#f0bd9c" cx="2" cy="-21" rx="18" ry="17.5"/>
    <ellipse class="n" fill="#e8786a" fill-opacity="0.55" cx="6" cy="-13" rx="4.4" ry="2.6"/>
    <!-- a fur hat with the ear flaps down, tied under his chin -->
    <path class="o" fill="#7a5a3a" d="M-18 -24 Q-21 -46 2 -47 Q23 -47 21 -26 Q2 -33 -18 -24 Z"/>
    <path class="t" style="stroke:#5b4228" d="M-12 -30 L-11 -42 M-4 -32 L-3 -45 M4 -32 L5 -45 M12 -31 L13 -43"/>
    <path class="o" fill="#8e6c48" d="M-19 -26 Q-22 -12 -14 -2 L-8 -4 Q-12 -14 -11 -26 Z"/>
    <path class="t" style="stroke:#5b4228;stroke-width:1.4" d="M-17 -20 L-13 -21 M-16 -14 L-12 -15 M-14 -8 L-10.5 -9"/>
    <path class="t" style="stroke:#c9b48f;stroke-width:1.6" d="M-11 -3 Q-2 4 12 -2"/>
    <!-- eyebrows white with frost, eyes screwed up against the wind -->
    <path class="o" style="stroke-width:1.4" fill="#f4f4f0" d="M5 -27 L13 -28.6 L12.6 -25.6 L5.6 -24.4 Z M15 -28.4 L21 -27.2 L20.6 -24.8 L15.2 -25.6 Z"/>
    <path class="t" style="stroke-width:2.2" d="M7 -21 Q9.5 -22.6 12 -21 M15.5 -21.2 Q18 -22.6 20.5 -21"/>
    <ellipse class="o" fill="#e0442c" cx="21" cy="-15.5" rx="4.2" ry="3.6"/>
    <!-- his pipe -->
    <path class="t" style="stroke-width:3.4" d="M14 -8 L25 -6"/>
    <path class="o" fill="#6b4a2a" d="M24 -11 L31 -11 L30 -3 Q27.5 -1 25 -3 Z"/>
    <path class="o" style="stroke-width:1.6" fill="#3a2a1c" d="M24 -11 L31 -11 L30.6 -9 L24.4 -9 Z"/>
  </g>

  <!-- The smoke from his pipe. Joint at the bowl. -->
  <g id="smoke" data-parent="head" transform="translate(9 -94)">
    <circle class="n" fill="#ffffff" fill-opacity="0.85" cx="1" cy="-3" r="3"/>
    <circle class="n" fill="#ffffff" fill-opacity="0.7" cx="4" cy="-9" r="2.4"/>
    <circle class="n" fill="#ffffff" fill-opacity="0.55" cx="2" cy="-14" r="1.8"/>
  </g>

  <!-- The near arm, both mittens on the handle. -->
  <g id="arm_front" data-parent="torso" transform="translate(-11 -77)">
    <path class="o" fill="#3a383d" d="M-5 -4 Q1 -7 6 -2 L18 12 L12 18 L-3 6 Q-8 1 -5 -4 Z"/>
    <ellipse class="o" fill="#d9342b" cx="16" cy="15" rx="5.6" ry="5.2"/>
  </g>

  <!-- The snow scraper: a broad pine board on a long handle, held out at the enemy, snow heaped on it. Joint where he holds it. -->
  <g id="scraper" data-parent="hips" transform="translate(5 -62)">
    <path class="t" style="stroke-width:6.4" d="M-2 0 L16 4"/>
    <path fill="none" stroke="#a8743f" stroke-width="3.4" stroke-linecap="round" d="M-2 0 L16 4"/>
    <ellipse class="o" fill="#d9342b" cx="-1" cy="0" rx="5.2" ry="5"/>
    <g transform="translate(0 9)">
    <rect class="o" fill="#e0b86e" x="12" y="-44" width="30" height="96" rx="3"/>
    <path class="n" fill="#c9a058" d="M14 -42 L21 -42 L21 50 L14 50 Z"/>
    <path class="t" style="stroke:#a8743f" d="M22 -44 L22 52 M32 -44 L32 52"/>
    <path class="t" style="stroke:#a8743f;stroke-width:1.2" d="M26 -30 Q28 -26 26 -22 M36 6 Q38 10 36 14 M17 20 Q19 24 17 28"/>
    <!-- a strip of broom bristles along the bottom, and the nails -->
    <rect class="o" fill="#8b6a3a" x="11" y="44" width="32" height="5" rx="1.5"/>
    <path class="o" style="stroke-width:1.8" fill="#d9b25a" d="M12 48.5 L42 48.5 L44 53 L10 53 Z"/>
    <path class="t" style="stroke:#a8843a;stroke-width:1.1" d="M15 49 L14 53 M19 49 L18.6 53 M23 49 L23 53 M27 49 L27.4 53 M31 49 L31.6 53 M35 49 L36 53 M39 49 L40.4 53"/>
    <circle class="n" fill="#5c6461" cx="17" cy="-38" r="1.2"/>
    <circle class="n" fill="#5c6461" cx="37" cy="-38" r="1.2"/>
    <circle class="n" fill="#5c6461" cx="17" cy="40" r="1.2"/>
    <circle class="n" fill="#5c6461" cx="37" cy="40" r="1.2"/>
    <!-- snow heaped on the top and pushed up against the front -->
    <path class="o" fill="#f6fbff" d="M10 -43 Q11 -51 18 -50 Q21 -56 28 -53 Q34 -58 39 -51 Q45 -51 44 -43 Z"/>
    <path class="o" fill="#f6fbff" d="M42 53 L42 20 Q49 21 51 30 Q57 34 56 43 Q60 47 59 53 Z"/>
    <path class="n" fill="#cfe4f4" d="M43.4 51 L43.4 25 Q47 27 48.5 34 Q52 38 52 45 Q54 48 53.5 51 Z"/>
    <circle class="n" fill="#f6fbff" cx="57" cy="20" r="2"/>
    <circle class="n" fill="#f6fbff" cx="53" cy="14" r="1.4"/>
    </g>
  </g>
</svg>
