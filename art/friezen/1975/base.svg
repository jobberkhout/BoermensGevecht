    <rect class="o" fill="#6b4f33" x="-300" y="-296" width="300" height="12" rx="2"/>
    <rect class="o" fill="#6b4f33" x="-300" y="-146" width="300" height="12" rx="2"/>
    <rect class="o" fill="#7a5a3a" x="-298" y="-438" width="12" height="438"/>
    <rect class="o" fill="#7a5a3a" x="-14" y="-438" width="12" height="304"/>
    <path class="t" style="stroke:#4a3622;stroke-width:5" d="M-286 -396 L-258 -436 M-14 -396 L-42 -436 M-286 -250 L-262 -284 M-14 -250 L-38 -284"/>
    <path class="n" fill="#f6fbff" d="M-300 -296 Q-290 -302 -278 -298 L-276 -296 Z M-24 -296 Q-12 -302 0 -297 L0 -296 Z M-300 -146 Q-292 -151 -282 -147 L-280 -146 Z"/>

