<svg xmlns="http://www.w3.org/2000/svg" viewBox="-316 -596 332 602" data-rig="static">
  <title>Een Friese stelpboerderij op een terp in de sneeuw: blauwe pannen, ijspegels, zwanen op het ûleboerd en de schaatsen bij de deur</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- (0,0) is the foot of the doorway, where units come out. The farm stands behind it, to the left, on its terp. -->
  <g id="building" transform="translate(0 0)">
    <!-- flagpole -->
    <path class="t" style="stroke-width:5" d="M-288 -462 L-288 -552"/>
    <circle class="o" fill="#ffd21f" cx="-288" cy="-555" r="4.5"/>

    <!-- the chimney, snow on its cap -->
    <rect class="o" fill="#9c4a32" x="-118" y="-548" width="22" height="50"/>
    <path class="t" style="stroke:#7a3424" d="M-118 -536 L-96 -536 M-118 -522 L-96 -522 M-107 -548 L-107 -536 M-112 -536 L-112 -522 M-102 -522 L-102 -508"/>
    <path class="o" fill="#f6fbff" d="M-122 -548 Q-121 -557 -112 -556 Q-106 -561 -100 -556 Q-92 -556 -92 -548 Z"/>

    <!-- the ûleboerd at the end of the ridge, with its two white swans -->
    <path class="o" fill="#1f5a2a" d="M-30 -500 L-30 -538 Q-20 -548 -10 -538 L-10 -500 Z"/>
    <path class="o" style="stroke-width:1.6" fill="#ffffff" d="M-29 -510 Q-30 -517 -25 -518 L-23 -518 Q-22 -524 -24 -528 Q-23.5 -532.5 -20 -531 L-17 -529.6 L-20.4 -528.6 Q-19.6 -523 -20.6 -517.4 Q-17 -516 -17.4 -510 Z"/>
    <g transform="translate(-40 0) scale(-1 1)">
      <path class="o" style="stroke-width:1.6" fill="#ffffff" d="M-29 -510 Q-30 -517 -25 -518 L-23 -518 Q-22 -524 -24 -528 Q-23.5 -532.5 -20 -531 L-17 -529.6 L-20.4 -528.6 Q-19.6 -523 -20.6 -517.4 Q-17 -516 -17.4 -510 Z"/>
    </g>
    <circle class="o" style="stroke-width:1.6" fill="#ffd21f" cx="-20" cy="-541" r="3.2"/>

    <!-- the steep roof of blue glazed tiles -->
    <path class="o" fill="#3b5a86" d="M-316 -440 L-262 -506 L-36 -506 L16 -440 Z"/>
    <path class="t" style="stroke:#2c466c;stroke-width:2.2" d="M-305 -453 L5 -453 M-294 -466 L-6 -466 M-283 -479 L-16 -479 M-272 -492 L-26 -492"/>
    <path class="t" style="stroke:#2c466c" d="M-240 -506 L-246 -492 M-200 -506 L-204 -492 M-160 -506 L-162 -492 M-120 -506 L-120 -492 M-80 -506 L-78 -492 M-50 -506 L-46 -492 M-250 -479 L-256 -466 M-210 -479 L-214 -466 M-170 -479 L-172 -466 M-130 -479 L-130 -466 M-90 -479 L-88 -466 M-50 -479 L-46 -466 M-12 -479 L-6 -466"/>
