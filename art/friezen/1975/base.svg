  <!-- Smoke from the stove. -->
  <g id="smoke" transform="translate(-107 -566)">
    <circle class="o" style="stroke-width:2" fill="#e6e6e6" cx="0" cy="0" r="7"/>
    <circle class="o" style="stroke-width:2" fill="#eeeeee" cx="8" cy="-10" r="5.4"/>
    <circle class="o" style="stroke-width:2" fill="#f4f4f4" cx="3" cy="-20" r="4"/>
  </g>

</svg>
