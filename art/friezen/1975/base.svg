    <rect class="o" fill="#f4f4f0" x="-262" y="-112" width="44" height="52"/>
    <rect class="n" fill="#9fc7e4" x="-257" y="-107" width="34" height="42"/>
    <path class="t" style="stroke:#f4f4f0;stroke-width:3" d="M-240 -107 L-240 -65 M-257 -86 L-223 -86"/>
    <rect class="o" fill="#1f5a2a" x="-276" y="-112" width="14" height="52"/>
    <rect class="o" fill="#1f5a2a" x="-218" y="-112" width="14" height="52"/>
    <path class="o" fill="#f6fbff" d="M-280 -60 Q-276 -66 -240 -64 Q-204 -66 -200 -60 Z"/>
    <rect class="o" fill="#f4f4f0" x="-178" y="-112" width="44" height="52"/>
    <rect class="n" fill="#9fc7e4" x="-173" y="-107" width="34" height="42"/>
    <path class="t" style="stroke:#f4f4f0;stroke-width:3" d="M-156 -107 L-156 -65 M-173 -86 L-139 -86"/>
    <rect class="o" fill="#1f5a2a" x="-192" y="-112" width="14" height="52"/>
    <rect class="o" fill="#1f5a2a" x="-134" y="-112" width="14" height="52"/>
    <path class="o" fill="#f6fbff" d="M-196 -60 Q-192 -66 -156 -64 Q-120 -66 -116 -60 Z"/>
    <!-- a cat in the window, watching the snow -->
    <path class="o" style="stroke-width:2" fill="#2b2b2b" d="M-168 -66 Q-170 -80 -164 -84 L-166 -91 L-161 -87 L-157 -91 L-157 -84 Q-152 -80 -154 -66 Z"/>
    <circle class="n" fill="#ffd21f" cx="-163" cy="-82" r="1.3"/>
    <circle class="n" fill="#ffd21f" cx="-158.6" cy="-82" r="1.3"/>

    <!-- the stand for the milk churns, snow on the lids -->
    <rect class="o" fill="#7a5a3a" x="-296" y="-40" width="44" height="6"/>
    <path class="t" style="stroke-width:4" d="M-292 -34 L-292 0 M-256 -34 L-256 0"/>
    <path class="o" fill="#b9c2bd" d="M-292 -40 L-292 -62 Q-292 -68 -287.5 -69 L-287.5 -73 L-278.5 -73 L-278.5 -69 Q-274 -68 -274 -62 L-274 -40 Z"/>
    <path class="o" fill="#c7cfca" d="M-272 -40 L-272 -62 Q-272 -68 -267.5 -69 L-267.5 -73 L-258.5 -73 L-258.5 -69 Q-254 -68 -254 -62 L-254 -40 Z"/>
    <path class="o" style="stroke-width:2" fill="#f6fbff" d="M-290 -73 Q-288 -79 -283 -78 Q-278 -80 -276 -73 Z M-270 -73 Q-268 -79 -263 -78 Q-258 -80 -256 -73 Z"/>

    <!-- the doorway units come out of, icicles on the lintel, the skates by the door -->
    <rect class="o" fill="#6b4f33" x="-100" y="-134" width="98" height="12" rx="2"/>
    <rect class="o" fill="#241d17" x="-90" y="-122" width="76" height="122"/>
    <rect class="o" fill="#7a5a3a" x="-102" y="-134" width="12" height="134"/>
    <path class="o" style="stroke-width:2" fill="#cfe8f7" d="M-84 -122 L-81 -108 L-78 -122 Z M-62 -122 L-58 -102 L-54 -122 Z M-36 -122 L-33 -112 L-30 -122 Z"/>
    <path class="t" style="stroke:#6b4a2a;stroke-width:2" d="M-96 -112 L-104 -94 M-96 -112 L-88 -94"/>
    <circle class="n" fill="#2b1b16" cx="-96" cy="-112" r="1.6"/>
    <path class="t" style="stroke-width:3.4" d="M-116 -92 L-98 -92 Q-94 -92 -94 -96 M-104 -88 L-86 -88 Q-82 -88 -82 -92"/>
    <path fill="none" stroke="#c3ccd0" stroke-width="1.6" stroke-linecap="round" d="M-116 -92 L-98 -92 Q-94 -92 -94 -96 M-104 -88 L-86 -88 Q-82 -88 -82 -92"/>
    <rect class="o" style="stroke-width:1.4" fill="#c9934f" x="-114" y="-96" width="14" height="3" rx="1"/>
    <rect class="o" style="stroke-width:1.4" fill="#c9934f" x="-102" y="-92" width="14" height="3" rx="1"/>

    <!-- the terp under it all, deep in snow, and drifts against the walls -->
    <path class="o" fill="#f6fbff" d="M-316 4 Q-316 -22 -300 -26 Q-290 -16 -276 -18 Q-262 -12 -250 -14 Q-230 -6 -210 -10 Q-180 -2 -150 -6 Q-128 -2 -104 -4 L-104 4 Z"/>
    <path class="n" fill="#d6e9f6" d="M-312 2 Q-300 -8 -280 -8 Q-250 -2 -220 -4 Q-170 2 -120 -1 L-120 2 Z"/>
    <path class="o" fill="#f6fbff" d="M-6 4 Q-6 -10 2 -12 Q12 -10 14 4 Z"/>

    <circle data-mount="turret0" fill="none" cx="-150" cy="-148" r="1"/>
    <circle data-mount="turret1" fill="none" cx="-150" cy="-298" r="1"/>
    <circle data-mount="flag" fill="none" cx="-286" cy="-548" r="1"/>
