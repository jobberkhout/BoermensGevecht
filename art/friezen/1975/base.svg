    <path class="o" fill="#f6fbff" d="M-296 -466 Q-300 -474 -290 -476 Q-284 -486 -274 -480 L-282 -458 Q-290 -458 -296 -466 Z"/>
    <path class="o" fill="#f6fbff" d="M-6 -470 Q0 -480 6 -470 Q10 -462 4 -458 Q-4 -460 -6 -470 Z"/>

