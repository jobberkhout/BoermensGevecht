    <path class="t" style="stroke:#44403c;stroke-width:2.4" d="M-262 -426 L-262 -296 M-226 -426 L-226 -296 M-190 -426 L-190 -296 M-116 -426 L-116 -296 M-80 -426 L-80 -296 M-44 -426 L-44 -296 M-262 -284 L-262 -146 M-226 -284 L-226 -146 M-190 -284 L-190 -146 M-116 -284 L-116 -146 M-80 -284 L-80 -146 M-44 -284 L-44 -146"/>

