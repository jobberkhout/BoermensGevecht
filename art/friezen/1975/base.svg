    <path class="t" style="stroke:#b39a3a;stroke-width:2.2" d="M-272 -156 Q-264 -170 -250 -174 M-246 -154 Q-238 -170 -226 -176"/>
    <path class="t" style="stroke:#6b4a2a;stroke-width:2" d="M-40 -270 L-46 -252 M-40 -270 L-34 -252"/>
    <path class="t" style="stroke-width:3.4" d="M-58 -250 L-42 -250 Q-38 -250 -38 -254 M-42 -248 L-26 -248 Q-22 -248 -22 -252"/>
    <path fill="none" stroke="#c3ccd0" stroke-width="1.6" stroke-linecap="round" d="M-58 -250 L-42 -250 Q-38 -250 -38 -254 M-42 -248 L-26 -248 Q-22 -248 -22 -252"/>

