<svg xmlns="http://www.w3.org/2000/svg" viewBox="-108 -116 224 120" data-rig="static">
  <title>De Brugwachter: een brugwachter bij een opgehaalde brug, met het tolklompje aan zijn hengel, en twee vissers in de regen</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- The quay, the canal, and the white drawbridge, raised. Origin = middle of the floor. -->
  <g id="scene" transform="translate(0 0)">
    <!-- the canal -->
    <rect class="o" fill="#3f7f8c" x="-104" y="-11" width="216" height="11"/>
    <path class="t" style="stroke:#6fb0bc;stroke-width:1.4" d="M-90 -5 L-78 -5 M-40 -4 L-26 -4 M12 -6 L24 -6 M60 -4 L70 -4 M96 -6 L106 -6"/>
    <!-- the quay along the water -->
    <rect class="o" fill="#9a8f84" x="-104" y="-18" width="216" height="8"/>
    <path class="t" style="stroke:#7d7368;stroke-width:1.2" d="M-80 -18 L-80 -10 M-52 -18 L-52 -10 M-24 -18 L-24 -10 M4 -18 L4 -10 M32 -18 L32 -10 M60 -18 L60 -10 M88 -18 L88 -10"/>
    <!-- the raised deck, white with a blue edge, its railing pointing at the sky -->
    <g transform="rotate(-76 -90 -18)">
      <rect class="o" fill="#ffffff" x="-90" y="-24" width="70" height="8" rx="1"/>
      <path class="n" fill="#1d5fa8" d="M-88 -19.6 L-22 -19.6 L-22 -17.6 L-88 -17.6 Z"/>
      <path class="t" style="stroke-width:2" d="M-86 -24 L-86 -34 L-26 -34 L-26 -24 M-66 -24 L-66 -34 M-46 -24 L-46 -34"/>
    </g>
    <!-- the post, the balance beam on top (its back end down, its front end up), and the counterweight -->
    <rect class="o" fill="#ffffff" x="-66" y="-92" width="8" height="74" rx="1"/>
    <path class="o" fill="#ffffff" d="M-90 -104 L-34 -82 L-36 -77 L-92 -99 Z"/>
    <path class="t" style="stroke-width:1.2" d="M-84 -101 L-82 -97 M-74 -97 L-72 -93 M-64 -93 L-62 -89 M-54 -89 L-52 -85 M-44 -85 L-42 -81"/>
    <rect class="o" fill="#1d5fa8" x="-42" y="-84" width="12" height="10" rx="1"/>
    <circle class="o" fill="#2b1b16" cx="-62" cy="-92" r="3"/>
    <!-- the chain from the front of the beam to the end of the deck -->
    <path class="t" style="stroke-width:1.4;stroke-dasharray:2 2" d="M-90 -102 L-76 -86"/>
  </g>

  <!-- The drizzle, coming down all the time. -->
  <g id="rain" transform="translate(0 -60)">
    <path class="t" style="stroke:#9fc3d6;stroke-width:1.4" d="M-96 -40 L-99 -32 M-48 -46 L-51 -38 M-20 -30 L-23 -22 M8 -44 L5 -36 M52 -40 L49 -32 M84 -34 L81 -26 M100 -46 L97 -38 M-80 -10 L-83 -2 M24 -14 L21 -6 M70 -6 L67 2"/>
  </g>

  <!-- The bridge keeper: navy coat, peaked cap, a moustache of authority. Joint at his feet. -->
  <g id="keeper" transform="translate(-20 -18)">
    <g transform="translate(20 18)">
      <path class="o" fill="#26262c" d="M-30 -18 L-30 -24 L-23 -24 L-22 -18 Z M-18 -18 L-18 -24 L-11 -24 L-10 -18 Z"/>
      <path class="o" fill="#2d3e7a" d="M-30 -24 L-29 -40 L-12 -40 L-11 -24 Z"/>
      <path class="o" fill="#2d3e7a" d="M-33 -38 Q-35 -56 -30 -64 L-12 -64 Q-6 -56 -8 -38 Z"/>
      <path class="t" style="stroke:#1d2a5a;stroke-width:1.2" d="M-20 -62 L-20 -40"/>
      <circle class="n" fill="#f2c94c" cx="-18" cy="-56" r="1.3"/>
      <circle class="n" fill="#f2c94c" cx="-18" cy="-48" r="1.3"/>
    </g>
  </g>

  <g id="keeper_head" data-parent="keeper" transform="translate(-21 -64)">
    <g transform="translate(21 64)">
      <rect class="o" fill="#d99c7d" x="-24" y="-68" width="7" height="6" rx="2"/>
      <circle class="o" fill="#f0c0a0" cx="-20" cy="-77" r="11"/>
      <!-- the cap with its badge: blue and white, a little bridge on it -->
      <path class="o" fill="#2d3e7a" d="M-32 -80 Q-32 -93 -20 -93 Q-8 -93 -8 -82 L-1 -80 Q-2 -77 -8 -78 L-32 -78 Z"/>
      <path class="o" style="stroke-width:1.4" fill="#ffffff" d="M-23 -88 L-16 -88 L-16 -84 L-23 -84 Z"/>
      <path class="n" fill="#1d5fa8" d="M-22 -86.6 L-17 -86.6 L-17 -85.4 L-22 -85.4 Z"/>
      <circle class="n" fill="#2b1b16" cx="-14" cy="-76" r="1.5"/>
      <path class="o" fill="#f0c0a0" d="M-9.5 -75 Q-6 -72.4 -9.5 -70.6"/>
      <!-- the moustache -->
      <path class="o" style="stroke-width:1.6" fill="#8a8a90" d="M-17 -70 Q-13 -72.6 -8 -70 Q-8.6 -67 -12 -68 Q-15 -67 -17 -70 Z"/>
    </g>
  </g>

  <!-- The rod with the toll clog on its line. Joint in his hands; he swings it out over the water. -->
  <g id="rod" data-parent="keeper" transform="translate(-8 -54)">
    <path fill="none" stroke="#2b1b16" stroke-width="5" stroke-linecap="round" d="M0 0 L44 -40"/>
    <path fill="none" stroke="#c49a5a" stroke-width="2.4" stroke-linecap="round" d="M0 0 L44 -40"/>
    <circle class="o" fill="#f0c0a0" cx="0" cy="0" r="4.2"/>
    <circle class="o" fill="#f0c0a0" cx="7" cy="-6" r="4"/>
  </g>

  <!-- The clog on its line. Joint at the tip of the rod, so it swings. -->
  <g id="clog" data-parent="rod" transform="translate(36 -94)">
    <path fill="none" stroke="#2b1b16" stroke-width="1.2" d="M0 0 L0 14"/>
    <path class="o" fill="#f2d14b" d="M-9 18 Q-10 14 -4 14 L6 14 Q12 14 12 19 Q12 23 6 23 L-6 23 Q-9 23 -9 18 Z"/>
    <path class="n" fill="#2b1b16" d="M-6 16 L2 16 L2 18 L-6 18 Z"/>
    <circle class="o" style="stroke-width:1.2" fill="#e6b422" cx="-2" cy="16" r="2.4"/>
    <circle data-mount="muzzle" fill="none" cx="2" cy="19" r="1"/>
  </g>

  <!-- Angler A, in oilskins on the edge of the quay, asleep under his hood. Joint where he sits. -->
  <g id="angler_a" transform="translate(48 -18)">
    <g transform="translate(-48 18)">
      <path class="o" fill="#2f7a46" d="M40 -18 L40 -6 L46 -6 L47 -18 Z M50 -18 L50 -6 L56 -6 L57 -18 Z"/>
      <path class="o" fill="#ffd21f" d="M37 -18 Q34 -38 40 -44 L54 -44 Q60 -36 58 -18 Z"/>
      <path class="t" style="stroke:#c99a00" d="M48 -42 L48 -20"/>
      <circle class="o" fill="#e9a487" cx="48" cy="-50" r="8.4"/>
      <path class="o" fill="#ffd21f" d="M38 -50 Q38 -61 48 -61 Q58 -61 58 -51 Q48 -55 38 -50 Z"/>
      <path class="o" fill="#ffd21f" d="M35 -50 Q48 -55 61 -51 Q58 -48 48 -50 Q40 -48 35 -50 Z"/>
      <path class="t" style="stroke-width:1.4" d="M50 -47 L54 -47"/>
      <path class="t" style="stroke-width:1.4" d="M51 -43 Q53 -42 55 -43"/>
      <!-- his rod, propped on his knee -->
      <path fill="none" stroke="#2b1b16" stroke-width="3" stroke-linecap="round" d="M52 -26 L92 -50"/>
      <path fill="none" stroke="#8a5a2b" stroke-width="1.4" stroke-linecap="round" d="M52 -26 L92 -50"/>
      <path fill="none" stroke="#2b1b16" stroke-width="0.9" d="M92 -50 L94 -9"/>
    </g>
  </g>

  <!-- His float, bobbing. -->
  <g id="float_a" transform="translate(94 -9)">
    <circle class="o" style="stroke-width:1.4" fill="#d8342c" cx="0" cy="0" r="2.6"/>
    <path class="n" fill="#ffffff" d="M-2.4 0 L2.4 0 L2 1.8 L-2 1.8 Z"/>
  </g>

  <!-- Angler B, with the thermos, watching the keeper rather than the water. Joint where he sits. -->
  <g id="angler_b" transform="translate(77 -18)">
    <g transform="translate(-72 18)">
      <path class="o" fill="#2f7a46" d="M64 -18 L64 -6 L70 -6 L71 -18 Z M74 -18 L74 -6 L80 -6 L81 -18 Z"/>
      <path class="o" fill="#ff9a1f" d="M61 -18 Q58 -36 64 -42 L78 -42 Q84 -34 82 -18 Z"/>
      <circle class="o" fill="#f0c0a0" cx="71" cy="-48" r="8"/>
      <path class="o" fill="#ff9a1f" d="M62 -48 Q62 -58 71 -58 Q80 -58 80 -49 Q71 -53 62 -48 Z"/>
      <path class="o" fill="#ff9a1f" d="M59 -48 Q71 -52 83 -49 Q80 -46 71 -48 Q63 -46 59 -48 Z"/>
      <circle class="n" fill="#2b1b16" cx="68" cy="-46" r="1.3"/>
      <circle class="n" fill="#2b1b16" cx="74" cy="-46" r="1.2"/>
      <path class="t" style="stroke-width:1.4" d="M69 -41 L74 -41"/>
      <!-- the thermos -->
      <rect class="o" style="stroke-width:1.8" fill="#d8342c" x="82" y="-28" width="7" height="12" rx="1.5"/>
      <rect class="o" style="stroke-width:1.4" fill="#d7dde2" x="81.5" y="-31" width="8" height="3" rx="1"/>
    </g>
  </g>
</svg>
