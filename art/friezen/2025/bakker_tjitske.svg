<svg xmlns="http://www.w3.org/2000/svg" viewBox="-54 -136 112 142" data-rig="humanoid">
  <title>Bakker Tjitske: bakkersschort onder een open regenjas, meel op de wangen, een sûkerbôle in de hand en een mand vol</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm, down at her side, with the basket of loaves hooked over it. -->
  <g id="arm_back" data-parent="torso" transform="translate(-9 -72)">
    <path class="o" fill="#c8322a" d="M-6 -3 Q-8 9 -6 16 L6 16 Q7 8 6 -3 Z"/>
    <path class="o" fill="#e9a487" d="M-4.5 15 L-4 27 Q0 32 4 27 L4.5 15 Z"/>
    <circle class="o" fill="#e9a487" cx="0" cy="30" r="4.4"/>
  </g>

  <!-- The basket: wicker, a checked cloth, three more loaves waiting. Joint at the handle in her hand. -->
  <g id="basket" data-parent="arm_back" transform="translate(-9 -36)">
    <path class="o" style="stroke-width:3" fill="none" d="M-12 6 Q-12 -6 0 -6 Q12 -6 12 6"/>
    <path fill="none" stroke="#c99a5a" stroke-width="1.4" d="M-12 6 Q-12 -6 0 -6 Q12 -6 12 6"/>
    <!-- loaves peeking out -->
    <ellipse class="o" fill="#c9873a" cx="-7" cy="6" rx="7" ry="5"/>
    <ellipse class="o" fill="#d9974a" cx="6" cy="5" rx="7.5" ry="5.5"/>
    <circle class="n" fill="#fff6dc" cx="-8" cy="4" r="1.4"/>
    <circle class="n" fill="#fff6dc" cx="5" cy="3" r="1.4"/>
    <circle class="n" fill="#fff6dc" cx="8" cy="6" r="1.2"/>
    <path class="o" fill="#ffffff" d="M-15 7 L15 7 L13 11 L-13 11 Z"/>
    <path class="n" fill="#d8342c" d="M-11 7.5 L-7 7.5 L-7.6 10.6 L-11.2 10.6 Z M-3 7.5 L1 7.5 L0.8 10.6 L-3 10.6 Z M5 7.5 L9 7.5 L8.6 10.6 L5 10.6 Z"/>
    <path class="o" fill="#b77f3f" d="M-14 10 L14 10 L11 25 L-11 25 Z"/>
    <path class="t" style="stroke:#8e5f2a;stroke-width:1.2" d="M-13 15 L13 15 M-12 20 L12 20 M-6 10.5 L-5 24.5 M0 10.5 L0 24.5 M6 10.5 L5 24.5"/>
  </g>

  <!-- Green wellies under her skirt: it rains. -->
  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#d9e2ea" d="M-7 -3 L7 -3 L6 14 L-6 14 Z"/>
    <path class="o" fill="#2f7a46" d="M-6.5 13 L6.5 13 L6.5 31 Q12 31.5 14 35 L14 38 L-7 38 L-7 31 Z"/>
    <path class="t" style="stroke:#225c34" d="M-6 17 L6 17"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#e9eef3" d="M-7 -3 L7 -3 L6 14 L-6 14 Z"/>
    <path class="o" fill="#3a9257" d="M-6.5 13 L6.5 13 L6.5 31 Q12 31.5 14 35 L14 38 L-7 38 L-7 31 Z"/>
    <path class="t" style="stroke:#2f7a46" d="M-6 17 L6 17"/>
    <path class="n" fill="#5cb378" d="M2 15 L4.5 15 L4.5 29 L2 29 Z"/>
  </g>

  <!-- A pale blue dress, the white bakery apron, and the red rain jacket hanging open over all of it. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#c8322a" d="M-17 10 Q-20 -14 -16 -30 Q-12 -37 0 -37 Q14 -37 18 -30 Q22 -13 19 10 Z"/>
    <path class="o" fill="#fbfbf7" d="M-8 10 L-8 -26 Q0 -30 9 -26 L10 10 Z"/>
    <path class="n" fill="#e3e7e9" d="M-7 -6 L9 -6 L9.5 -2 L-7 -2 Z"/>
    <!-- flour on the apron -->
    <circle class="n" fill="#e8dcc4" cx="2" cy="2" r="3"/>
    <circle class="n" fill="#e8dcc4" cx="6" cy="-14" r="2"/>
    <path class="t" style="stroke:#a3241e" d="M-8 -26 L-11 8 M9 -26 L12 8"/>
    <!-- the hood of the jacket, down -->
    <path class="o" fill="#c8322a" d="M-14 -36 Q-20 -36 -20 -28 Q-18 -24 -12 -27 Z"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#e9a487" x="-4" y="-6" width="9" height="9" rx="2"/>
    <!-- the bun -->
    <circle class="o" fill="#e6c25a" cx="-14" cy="-32" r="7"/>
    <ellipse class="o" fill="#f6c6a6" cx="2" cy="-20" rx="19" ry="18"/>
    <ellipse class="o" fill="#f6c6a6" cx="-9" cy="-18" rx="3.4" ry="4.8"/>
    <path class="o" fill="#e6c25a" d="M-17 -16 Q-21 -38 0 -39.5 Q19 -40 21 -28 Q10 -31 0 -30 Q-10 -29 -12 -18 Q-14 -12 -17 -16 Z"/>
    <!-- the white bakery cap -->
    <path class="o" fill="#ffffff" d="M-12 -34 Q-12 -46 4 -46 Q19 -46 18 -33 Q4 -37 -12 -34 Z"/>
    <path class="t" style="stroke:#c9ced4;stroke-width:1.2" d="M-4 -44 L-3 -36 M4 -45 L4 -36 M11 -44 L11 -35"/>
    <!-- rosy cheeks, and flour on one of them -->
    <ellipse class="n" fill="#e5583f" fill-opacity="0.45" cx="7" cy="-12" rx="4.4" ry="2.8"/>
    <ellipse class="n" fill="#ffffff" fill-opacity="0.9" cx="14" cy="-11" rx="3.6" ry="2.2"/>
    <circle class="n" fill="#ffffff" fill-opacity="0.9" cx="18.5" cy="-13" r="1.2"/>
    <circle class="n" fill="#2b1b16" cx="10" cy="-21" r="2"/>
    <circle class="n" fill="#2b1b16" cx="18" cy="-20.5" r="1.8"/>
    <path class="t" d="M6.5 -26 Q10 -28 13 -26 M15.5 -26 Q18 -27.5 20.5 -26"/>
    <path class="o" fill="#f6c6a6" d="M20.5 -18.5 Q25 -15.5 20.5 -13.5"/>
    <!-- a proud grin -->
    <path class="o" style="stroke-width:1.8" fill="#7a1f1f" d="M8.5 -8.5 Q14 -6 19 -9 Q17.5 -2.5 13 -3 Q9.5 -3.5 8.5 -8.5 Z"/>
    <path class="n" fill="#ffffff" d="M10 -7.6 Q14 -5.8 17.6 -8 L17.2 -6.5 Q14 -5 10.5 -6.4 Z"/>
  </g>

  <!-- The near arm, elbow bent, holding up a loaf of sûkerbôle for all to see. -->
  <g id="arm_front" data-parent="torso" transform="translate(11 -72)">
    <path class="o" fill="#c8322a" d="M-6 -3 Q-8 6 -6.5 13 L6 13 Q7 6 6 -3 Z"/>
    <path fill="none" stroke="#2b1b16" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" d="M0 13 L0.5 18.5 L12 9"/>
    <path fill="none" stroke="#f6c6a6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M0 13 L0.5 18.5 L12 9"/>
    <path class="o" fill="#c8322a" d="M-6.5 10 L6 10 L6.2 14 L-6.6 14 Z"/>
    <circle data-mount="hand" fill="none" cx="16" cy="2" r="1"/>
  </g>

  <!-- The loaf in her hand: it goes with the throw, and another comes out of the basket. -->
  <g id="loaf" data-parent="arm_front" transform="translate(27 -65)">
    <ellipse class="o" fill="#c9873a" cx="2" cy="-2" rx="10" ry="7"/>
    <path class="n" fill="#e2a85a" d="M-6 -6 Q2 -10 9 -6 Q2 -7.4 -6 -4 Z"/>
    <circle class="o" style="stroke-width:1.2" fill="#fff6dc" cx="-2" cy="-3" r="1.8"/>
    <circle class="o" style="stroke-width:1.2" fill="#fff6dc" cx="4" cy="-5" r="1.6"/>
    <circle class="o" style="stroke-width:1.2" fill="#fff6dc" cx="6" cy="1" r="1.6"/>
    <path class="o" style="stroke-width:1.2" fill="#e0a13a" d="M-3 4.5 Q-3.4 9 -2 9.6 Q-0.6 9 -1 4.6 Z"/>
    <circle class="o" fill="#f6c6a6" cx="-5" cy="3" r="4.2"/>
  </g>
</svg>
