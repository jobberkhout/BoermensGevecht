<svg xmlns="http://www.w3.org/2000/svg" viewBox="-116 -172 232 178" data-rig="static">
  <title>De Bezemwagen: de oude bus die achter de tocht aan rijdt en iedereen oppikt die er niet meer tegenaan kon, met een bezem voorop</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- A puff from the exhaust at the back. -->
  <g id="puff" transform="translate(-100 -30)">
    <circle class="n" fill="#c9ced4" cx="-4" cy="-4" r="6"/>
    <circle class="n" fill="#dde1e5" cx="-10" cy="-10" r="4.4"/>
    <circle class="n" fill="#c9ced4" cx="2" cy="-8" r="3.6"/>
  </g>

  <!-- The bus: old and round, cream and Frisian blue, with skates and a pile of blankets on the roof rack. -->
  <g id="bus" transform="translate(0 -26)">
    <g transform="translate(0 26)">
      <!-- roof rack and what is on it -->
      <path class="t" style="stroke-width:2.4" d="M-80 -126 L-80 -134 L40 -134 L40 -126 M-60 -134 L-60 -126 M-20 -134 L-20 -126 M20 -134 L20 -126"/>
      <rect class="o" fill="#d8342c" x="-74" y="-146" width="40" height="12" rx="4"/>
      <path class="t" style="stroke:#a3241e;stroke-width:1.4" d="M-62 -146 L-62 -134 M-50 -146 L-50 -134"/>
      <rect class="o" fill="#2f7a46" x="-70" y="-156" width="32" height="10" rx="4"/>
      <!-- a pair of skates tied on top, blades up -->
      <path class="o" style="stroke-width:2" fill="#2b2b30" d="M-20 -140 L-4 -140 L-4 -146 Q-6 -150 -12 -150 L-20 -150 Z"/>
      <path class="o" style="stroke-width:1.6" fill="#d7dde2" d="M-26 -139 L2 -139 Q6 -139 6 -143 L8 -143 Q8 -137 2 -137 L-26 -137 Z"/>
      <path class="o" style="stroke-width:2" fill="#2b2b30" d="M6 -140 L22 -140 L22 -146 Q20 -150 14 -150 L6 -150 Z"/>
      <path class="o" style="stroke-width:1.6" fill="#d7dde2" d="M0 -139 L28 -139 Q32 -139 32 -143 L34 -143 Q34 -137 28 -137 L0 -137 Z"/>
      <!-- the body -->
      <path class="o" fill="#f4efe6" d="M-100 -30 L-100 -104 Q-100 -126 -78 -126 L52 -126 Q76 -126 84 -104 L94 -64 Q96 -56 96 -48 L96 -30 Z"/>
      <path class="n" fill="#1d5fa8" d="M-98 -58 L95 -58 L96 -34 L-98 -34 Z"/>
      <path class="t" style="stroke-width:2" d="M-98 -58 L95 -58"/>
      <path class="n" fill="#ffffff" d="M-98 -52 L96 -52 L96 -49 L-98 -49 Z"/>
      <!-- the windows -->
      <rect class="o" fill="#bfe6f5" x="-88" y="-112" width="30" height="34" rx="4"/>
      <rect class="o" fill="#bfe6f5" x="-50" y="-112" width="30" height="34" rx="4"/>
      <rect class="o" fill="#bfe6f5" x="-12" y="-112" width="30" height="34" rx="4"/>
      <rect class="o" fill="#bfe6f5" x="26" y="-112" width="30" height="34" rx="4"/>
      <path class="o" fill="#bfe6f5" d="M62 -112 L76 -112 Q82 -112 84 -104 L90 -78 L62 -78 Z"/>
      <!-- the door at the back, and the headlight up front -->
      <path class="t" style="stroke-width:2" d="M-96 -74 L-92 -74 M-96 -40 L-92 -40"/>
      <circle class="o" fill="#fff3b0" cx="88" cy="-44" r="5"/>
      <rect class="o" fill="#c9ced4" x="-104" y="-34" width="204" height="7" rx="3"/>
      <!-- exhaust -->
      <rect class="o" fill="#5a5a60" x="-108" y="-30" width="10" height="4" rx="1.5"/>

      <!-- passengers: woolly caps, red noses, blankets over the sills -->
      <circle class="o" fill="#f3b996" cx="-73" cy="-92" r="8"/>
      <path class="o" fill="#1d5fa8" d="M-81 -94 Q-81 -104 -73 -104 Q-65 -104 -65 -94 Z"/>
      <circle class="o" style="stroke-width:1.6" fill="#ffffff" cx="-73" cy="-105" r="3"/>
      <circle class="n" fill="#2b1b16" cx="-69" cy="-91" r="1.3"/>
      <circle class="n" fill="#e5583f" cx="-66" cy="-88" r="1.6"/>
      <path class="t" style="stroke-width:1.4" d="M-72 -85 Q-69 -83 -66 -85"/>

      <circle class="o" fill="#e9a487" cx="-35" cy="-92" r="8"/>
      <path class="o" fill="#d8342c" d="M-43 -94 Q-43 -104 -35 -104 Q-27 -104 -27 -94 Z"/>
      <circle class="n" fill="#2b1b16" cx="-31" cy="-91" r="1.3"/>
      <circle class="n" fill="#e5583f" cx="-28" cy="-88" r="1.6"/>
      <!-- this one has a mug of hot chocolate -->
      <path class="o" style="stroke-width:1.6" fill="#ffffff" d="M-30 -86 L-22 -86 L-22.6 -79 L-29.4 -79 Z"/>
      <path class="t" style="stroke:#9aa3aa;stroke-width:1.2" d="M-27 -89 Q-28 -92 -26 -94"/>

      <!-- asleep against the glass -->
      <circle class="o" fill="#f0c0a0" cx="3" cy="-90" r="8"/>
      <path class="o" fill="#2f7a46" d="M-5 -92 Q-5 -102 3 -102 Q11 -102 11 -92 Z"/>
      <path class="t" style="stroke-width:1.4" d="M4 -90 L8 -90"/>
      <path class="t" style="stroke-width:1.4" d="M3 -84 Q6 -83 8 -85"/>

      <circle class="o" fill="#f3b996" cx="41" cy="-92" r="8"/>
      <path class="o" fill="#ffd21f" d="M33 -94 Q33 -104 41 -104 Q49 -104 49 -94 Z"/>
      <circle class="n" fill="#2b1b16" cx="45" cy="-91" r="1.3"/>
      <path class="t" style="stroke-width:1.4" d="M42 -85 Q45 -82 48 -85"/>

      <!-- the driver: cap, moustache, eyes on the road -->
      <circle class="o" fill="#e9a487" cx="72" cy="-92" r="7.4"/>
      <path class="o" fill="#2d3e7a" d="M64 -94 Q64 -103 72 -103 Q80 -103 80 -96 L85 -94 L64 -94 Z"/>
      <path class="o" style="stroke-width:1.4" fill="#8a8a90" d="M73 -87 Q76 -89 80 -87 Q79 -85 76 -86 Q74 -85 73 -87 Z"/>
      <circle class="n" fill="#2b1b16" cx="76" cy="-92" r="1.2"/>

      <!-- the blankets over the sills -->
      <path class="o" fill="#d8342c" d="M-90 -80 L-56 -80 L-58 -66 Q-73 -62 -88 -66 Z"/>
      <path class="t" style="stroke:#a3241e;stroke-width:1.2" d="M-82 -80 L-83 -66 M-72 -80 L-72 -64 M-62 -80 L-62 -66 M-89 -74 L-57 -74"/>
      <path class="o" fill="#2f7a46" d="M-52 -80 L-18 -80 L-20 -66 Q-35 -62 -50 -66 Z"/>
      <path class="t" style="stroke:#225c34;stroke-width:1.2" d="M-44 -80 L-45 -66 M-34 -80 L-34 -64 M-24 -80 L-24 -66 M-51 -74 L-19 -74"/>
      <path class="o" fill="#ffd21f" d="M24 -80 L58 -80 L56 -66 Q41 -62 26 -66 Z"/>
      <path class="t" style="stroke:#c99a00;stroke-width:1.2" d="M32 -80 L31 -66 M42 -80 L42 -64 M52 -80 L52 -66 M25 -74 L57 -74"/>
    </g>
  </g>

  <!-- Two of them wave out of the windows: we are back! -->
  <g id="arm_a" data-parent="bus" transform="translate(-62 -84)">
    <path fill="none" stroke="#2b1b16" stroke-width="8" stroke-linecap="round" d="M0 0 L-3 -22"/>
    <path fill="none" stroke="#1d5fa8" stroke-width="4.4" stroke-linecap="round" d="M0 0 L-3 -22"/>
    <circle class="o" fill="#d8342c" cx="-3" cy="-26" r="4.6"/>
  </g>
  <g id="arm_c" data-parent="bus" transform="translate(51 -84)">
    <path fill="none" stroke="#2b1b16" stroke-width="8" stroke-linecap="round" d="M0 0 L3 -22"/>
    <path fill="none" stroke="#ffd21f" stroke-width="4.4" stroke-linecap="round" d="M0 0 L3 -22"/>
    <circle class="o" fill="#ffffff" cx="3" cy="-26" r="4.6"/>
  </g>

  <!-- The broom, the badge of the broom wagon, lashed to the front bumper. -->
  <g id="broom" data-parent="bus" transform="translate(84 -30)">
    <path fill="none" stroke="#2b1b16" stroke-width="7" stroke-linecap="round" d="M-10 0 L18 -2"/>
    <path fill="none" stroke="#c49a5a" stroke-width="3.6" stroke-linecap="round" d="M-10 0 L18 -2"/>
    <path class="o" fill="#e0b54a" d="M16 -8 Q30 -20 32 -26 L32 22 Q28 16 16 6 Z"/>
    <path class="t" style="stroke:#b88a2a;stroke-width:1.4" d="M18 -4 L31 -18 M19 -1 L31 -8 M19 2 L31 4 M18 5 L31 14"/>
    <path class="o" style="stroke-width:2" fill="#d8342c" d="M13 -6 L18 -6 L18 6 L13 6 Z"/>
    <path class="t" style="stroke-width:1.4" d="M0 -3 L2 3 M6 -3 L8 3"/>
  </g>

  <g id="wheel_a" data-parent="bus" transform="translate(-62 -18)">
    <circle class="o" fill="#2b2b2b" cx="0" cy="0" r="17"/>
    <circle class="o" fill="#d7dde2" cx="0" cy="0" r="8"/>
    <circle class="n" fill="#8e979f" cx="0" cy="0" r="3"/>
  </g>
  <g id="wheel_b" data-parent="bus" transform="translate(56 -18)">
    <circle class="o" fill="#2b2b2b" cx="0" cy="0" r="17"/>
    <circle class="o" fill="#d7dde2" cx="0" cy="0" r="8"/>
    <circle class="n" fill="#8e979f" cx="0" cy="0" r="3"/>
  </g>
</svg>
