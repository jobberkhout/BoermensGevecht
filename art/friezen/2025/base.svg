<svg xmlns="http://www.w3.org/2000/svg" viewBox="-312 -596 328 602" data-rig="static">
  <title>De Stjelp: een Friese boerderij onder een grote schilddak in de regen, met een melkrobot in de stal en de schaatsen klaar bij de deur</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!--
    De Stjelp: the Frisian farm with one great pyramid roof over house and barn alike, here stacked up to
    hold two lofts. Dark glazed tiles, red brick, white trim. An ûleboerd with two swans in the top of the
    roof, the village wind turbine on its ridge, a milking robot at work behind the stable window, and a
    pair of skates on a nail by the door: it might freeze tonight. It will not. It rains.
    Origin = the gate on the road; the building stands to the left of it.
  -->
  <g id="building" transform="translate(0 0)">
    <!-- flagpole, on the low roof on the left -->
    <path fill="none" stroke="#2b1b16" stroke-width="7" stroke-linecap="round" d="M-288 -462 L-288 -552"/>
    <path fill="none" stroke="#d5d8de" stroke-width="2.6" stroke-linecap="round" d="M-288 -462 L-288 -552"/>
    <circle class="o" fill="#f2c230" cx="-288" cy="-556" r="4.6"/>

    <!-- the low hipped roof of the side wing, under the flag -->
    <path class="o" fill="#2f3a4a" d="M-306 -446 L-292 -470 L-196 -470 L-182 -446 Z"/>
    <path class="t" style="stroke:#45526a;stroke-width:1.4" d="M-300 -458 L-188 -458"/>

    <!-- the great pyramid roof of the stjelp -->
    <path class="o" fill="#2f3a4a" d="M-200 -446 L-140 -558 L-62 -558 L14 -446 Z"/>
    <path class="n" fill="#3c4a60" d="M-190 -452 L-138 -550 L-128 -550 L-176 -452 Z"/>
    <path class="t" style="stroke:#45526a;stroke-width:1.4" d="M-186 -470 L2 -470 M-172 -494 L-12 -494 M-160 -518 L-30 -518 M-148 -540 L-48 -540"/>
    <!-- glistening wet -->
    <path class="t" style="stroke:#8fa6c4;stroke-width:2" d="M-120 -530 L-110 -530 M-70 -506 L-56 -506 M-150 -482 L-136 -482 M-40 -478 L-28 -478"/>
    <!-- the ûleboerd: a white board in the top of the roof, two swans facing each other -->
    <path class="o" fill="#ffffff" d="M-124 -558 L-101 -584 L-78 -558 L-82 -528 L-120 -528 Z"/>
    <path class="o" style="stroke-width:2" fill="#1d5fa8" d="M-116 -556 L-101 -574 L-86 -556 L-88 -532 L-114 -532 Z"/>
    <path class="n" fill="#ffffff" d="M-112 -538 Q-112 -546 -106 -546 Q-104 -552 -106 -556 Q-103 -558 -102 -554 Q-102 -546 -106 -540 Q-104 -536 -110 -536 Z"/>
    <path class="n" fill="#ffffff" d="M-90 -538 Q-90 -546 -96 -546 Q-98 -552 -96 -556 Q-99 -558 -100 -554 Q-100 -546 -96 -540 Q-98 -536 -92 -536 Z"/>
    <!-- the mast of the village wind turbine on the ridge (its rotor is a part of its own) -->
    <path class="o" fill="#e9eef3" d="M-34 -506 L-28 -506 L-29 -562 L-33 -562 Z"/>

    <!-- the front of the farm: red brick, white trim -->
    <path class="o" fill="#9a3f2e" d="M-298 0 L-298 -446 L-4 -446 L-4 0 Z"/>
    <path class="t" style="stroke:#86352a;stroke-width:1.2" d="M-298 -420 L-292 -420 M-10 -420 L-4 -420 M-298 -380 L-292 -380 M-10 -380 L-4 -380 M-298 -250 L-292 -250 M-10 -250 L-4 -250 M-298 -200 L-292 -200 M-10 -200 L-4 -200"/>
    <rect class="o" fill="#f4efe6" x="-304" y="-458" width="312" height="12" rx="3"/>
    <!-- the gutter, overflowing -->
    <path class="o" style="stroke-width:2" fill="#8e979f" d="M-304 -446 L8 -446 L8 -440 L-304 -440 Z"/>
    <rect class="o" fill="#c9c2b6" x="-298" y="-14" width="294" height="14"/>

    <!-- two open floors for the turrets: hay lofts -->
    <rect class="o" fill="#33283a" x="-288" y="-432" width="276" height="140"/>
    <path class="n" fill="#43354a" d="M-286 -306 L-14 -306 L-14 -294 L-286 -294 Z"/>
    <rect class="o" fill="#33283a" x="-288" y="-282" width="276" height="140"/>
    <path class="n" fill="#43354a" d="M-286 -156 L-14 -156 L-14 -144 L-286 -144 Z"/>
    <path class="t" style="stroke:#8f84a6" d="M-150 -432 L-150 -416 M-150 -282 L-150 -266"/>
    <circle class="o" style="stroke-width:2" fill="#fff2b0" cx="-150" cy="-412" r="5"/>
    <circle class="o" style="stroke-width:2" fill="#fff2b0" cx="-150" cy="-262" r="5"/>
    <rect class="o" fill="#f4efe6" x="-300" y="-292" width="300" height="10" rx="3"/>
    <rect class="o" fill="#f4efe6" x="-300" y="-142" width="300" height="10" rx="3"/>

    <!-- the stable window: a cow, and the milking robot reaching under her -->
    <rect class="o" fill="#f4efe6" x="-288" y="-124" width="96" height="84" rx="3"/>
    <rect class="o" style="stroke-width:2" fill="#bfe6f5" x="-282" y="-118" width="84" height="72"/>
    <path class="n" fill="#dfe8ee" d="M-282 -76 L-198 -76 L-198 -46 L-282 -46 Z"/>
    <!-- the cow: black and white, looking out -->
    <path class="o" style="stroke-width:2.2" fill="#ffffff" d="M-276 -46 L-276 -86 Q-276 -96 -264 -96 L-230 -96 L-230 -46 Z"/>
    <path class="n" fill="#2b1b16" d="M-272 -92 Q-262 -94 -258 -86 Q-262 -78 -272 -80 Z M-246 -94 L-232 -94 L-232 -70 Q-240 -66 -246 -76 Z"/>
    <path class="o" style="stroke-width:2.2" fill="#ffffff" d="M-238 -100 Q-238 -112 -226 -112 Q-214 -112 -214 -100 L-214 -86 Q-214 -78 -226 -78 Q-238 -78 -238 -86 Z"/>
    <path class="n" fill="#2b1b16" d="M-232 -112 L-222 -112 L-226 -100 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#f3b3b8" d="M-234 -88 Q-234 -80 -226 -80 Q-218 -80 -218 -88 Z"/>
    <circle class="n" fill="#2b1b16" cx="-231" cy="-98" r="1.8"/>
    <circle class="n" fill="#2b1b16" cx="-221" cy="-98" r="1.8"/>
    <path class="o" style="stroke-width:1.8" fill="#2b1b16" d="M-240 -106 L-246 -110 L-242 -102 Z M-212 -106 L-206 -110 L-210 -102 Z"/>
    <path class="t" style="stroke-width:1.4" d="M-282 -82 L-198 -82 M-240 -118 L-240 -46"/>

    <!-- the downpipe, gurgling into the puddle -->
    <path fill="none" stroke="#2b1b16" stroke-width="7" d="M-293 -440 L-293 -20 L-282 -14"/>
    <path fill="none" stroke="#8e979f" stroke-width="3" d="M-293 -440 L-293 -20 L-282 -14"/>

    <!-- the skates, on a nail by the door: just in case -->
    <circle class="o" style="stroke-width:1.6" fill="#8e979f" cx="-130" cy="-122" r="2.4"/>
    <path class="t" style="stroke:#ffffff;stroke-width:3" d="M-130 -122 L-144 -100 M-130 -122 L-116 -98"/>
    <path class="t" style="stroke-width:1.2" d="M-130 -122 L-144 -100 M-130 -122 L-116 -98"/>
    <path class="o" style="stroke-width:2.2" fill="#6b4a2f" d="M-152 -100 L-136 -100 L-136 -80 Q-136 -76 -142 -76 L-152 -76 Z"/>
    <path class="t" style="stroke:#ffffff;stroke-width:1.4" d="M-150 -96 L-138 -96 M-150 -91 L-138 -91 M-150 -86 L-138 -86"/>
    <path class="o" style="stroke-width:2" fill="#e9eef3" d="M-160 -74 L-130 -74 Q-124 -74 -124 -80 L-121 -80 Q-121 -71 -130 -71 L-160 -71 Z"/>
    <path class="o" style="stroke-width:2.2" fill="#5a3a22" d="M-124 -98 L-108 -98 L-108 -78 Q-108 -74 -114 -74 L-124 -74 Z"/>
    <path class="t" style="stroke:#ffffff;stroke-width:1.4" d="M-122 -94 L-110 -94 M-122 -89 L-110 -89 M-122 -84 L-110 -84"/>
    <path class="o" style="stroke-width:2" fill="#e9eef3" d="M-132 -72 L-102 -72 Q-96 -72 -96 -78 L-93 -78 Q-93 -69 -102 -69 L-132 -69 Z"/>

    <!-- the barn door: a white frame, the doors folded back in green and white, and the doorway -->
    <rect class="o" fill="#f4efe6" x="-94" y="-130" width="88" height="130" rx="2"/>
    <path class="o" fill="#241b26" d="M-84 0 L-84 -118 L-16 -118 L-16 0 Z"/>
    <path class="o" style="stroke-width:2" fill="#2f7a46" d="M-94 -122 L-102 -118 L-102 -4 L-94 0 Z"/>
    <path class="o" style="stroke-width:2" fill="#2f7a46" d="M-6 -122 L2 -118 L2 -4 L-6 0 Z"/>
    <path class="t" style="stroke:#ffffff;stroke-width:1.6" d="M-101 -112 L-95 -66 L-101 -20 M3 -112 L-5 -66 L3 -20"/>

    <!-- the puddle on the doorstep -->
    <ellipse class="o" style="stroke-width:2" fill="#9fd8f2" cx="-240" cy="-5" rx="44" ry="5"/>
    <path class="t" style="stroke:#ffffff;stroke-width:1.4" d="M-258 -6 L-246 -6 M-232 -4 L-224 -4"/>

    <circle data-mount="turret0" fill="none" cx="-150" cy="-144" r="1"/>
    <circle data-mount="turret1" fill="none" cx="-150" cy="-294" r="1"/>
    <circle data-mount="flag" fill="none" cx="-286" cy="-548" r="1"/>
  </g>

  <!-- The rotor of the village wind turbine, turning slowly in the drizzle. -->
  <g id="rotor" transform="translate(-31 -564)">
    <path class="o" style="stroke-width:2.2" fill="#ffffff" d="M-2 0 L-3 -26 Q0 -30 3 -26 L2 0 Z"/>
    <path class="o" style="stroke-width:2.2" fill="#ffffff" d="M1 -1.6 L23.5 11 Q23.5 16 18.5 14.5 L-1 3.4 Z"/>
    <path class="o" style="stroke-width:2.2" fill="#ffffff" d="M1 1.6 L-18.5 14.5 Q-23.5 16 -23.5 11 L-1 -3.4 Z"/>
    <circle class="o" style="stroke-width:2" fill="#d7dde2" cx="0" cy="0" r="4"/>
  </g>

  <!-- The milking robot's arm, reaching in and out under the cow. -->
  <g id="robot_arm" transform="translate(-200 -58)">
    <path fill="none" stroke="#2b1b16" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M0 0 L-14 -6 L-28 0"/>
    <path fill="none" stroke="#9aa3aa" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="M0 0 L-14 -6 L-28 0"/>
    <circle class="o" style="stroke-width:1.6" fill="#3fa9e0" cx="-14" cy="-6" r="2.6"/>
    <rect class="o" style="stroke-width:1.6" fill="#d7dde2" x="-34" y="-3" width="8" height="5" rx="1"/>
  </g>

  <!-- The rain: drizzle across the whole front. -->
  <g id="rain" transform="translate(0 -300)">
    <path class="t" style="stroke:#9fc3d6;stroke-width:1.6" d="M-296 -260 L-300 -250 M-230 -240 L-234 -230 M-160 -280 L-164 -270 M-60 -250 L-64 -240 M-20 -200 L-24 -190 M-270 -150 L-274 -140 M-200 -120 L-204 -110 M-120 -170 L-124 -160 M-40 -130 L-44 -120 M-300 -40 L-304 -30 M-240 -10 L-244 0 M-170 -60 L-174 -50 M-90 -20 L-94 -10 M-10 -60 L-14 -50 M-280 70 L-284 80 M-210 100 L-214 110 M-140 60 L-144 70 M-60 90 L-64 100 M-300 170 L-304 180 M-230 200 L-234 210 M-150 160 L-154 170 M-70 190 L-74 200 M-20 150 L-24 160 M-260 260 L-264 270 M-180 280 L-184 290 M-100 250 L-104 260 M-30 270 L-34 280"/>
  </g>

  <!-- A drop from the overflowing gutter, falling into the puddle. -->
  <g id="drop" transform="translate(-278 -12)">
    <path class="o" style="stroke-width:1.4" fill="#9fd8f2" d="M0 -6 Q-3 -1 0 1 Q3 -1 0 -6 Z"/>
  </g>
</svg>
