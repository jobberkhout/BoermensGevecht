<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -136 104 142" data-rig="humanoid">
  <title>De Kluner: toerrijder die over het droge kluunt, regenponcho over het schaatspak, stempelkaart om de nek</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm: behind his back, where a tour skater keeps it. -->
  <g id="arm_back" data-parent="torso" transform="translate(-8 -72)">
    <path fill="none" stroke="#2b1b16" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" d="M0 0 L-8 15 L-16 22"/>
    <path fill="none" stroke="#174a8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M0 0 L-8 15 L-16 22"/>
    <circle class="o" fill="#e8a888" cx="-17" cy="23" r="4.2"/>
  </g>

  <!-- The rain poncho: knotted at his throat, the rest of it flapping out behind him like a cape. -->
  <g id="poncho" data-parent="torso" transform="translate(-2 -74)">
    <path class="o" fill="#ffd21f" d="M-4 -2 Q-18 2 -26 14 Q-34 28 -36 42 L-29 38 L-25 45 L-19 38 L-13 44 L-9 34 Q-7 18 -2 8 Z"/>
    <path class="n" fill="#e8b800" d="M-26 18 Q-31 30 -33 40 L-29 38 Q-27 26 -22 16 Z"/>
    <path class="t" style="stroke:#c99a00" d="M-12 10 Q-18 24 -20 36"/>
    <!-- the hood, bunched up behind his neck -->
    <path class="o" fill="#ffd21f" d="M-12 -4 Q-20 -6 -21 2 Q-20 8 -12 7 Z"/>
  </g>

  <!-- Skin-tight tour suit, thick black boots, and the long blades of Frisian tour skates: on the asphalt. -->
  <g id="leg_back" data-parent="hips" transform="translate(-4 -38)">
    <path class="o" fill="#174a8c" d="M-7 -3 L7 -3 L6 26 L-6 26 Z"/>
    <path class="o" fill="#2b2b30" d="M-7 25 L6 25 L7 31 Q8 33.5 12 33.5 L12 35.5 L-7 35.5 Z"/>
    <path class="o" style="stroke-width:1.6" fill="#b9c2c8" d="M-1 35.5 L-1 37 M7 35.5 L7 37"/>
    <path class="o" style="stroke-width:1.8" fill="#d7dde2" d="M-12 36.4 L17 36.4 Q21 36.4 20.5 33 L22 33 Q23.5 38.6 17 38.6 L-12 38.6 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(4 -38)">
    <path class="o" fill="#1d5fa8" d="M-7 -3 L7 -3 L6 26 L-6 26 Z"/>
    <path class="n" fill="#ffffff" d="M2 -2 L5.5 -2 L4.8 24 L1.6 24 Z"/>
    <path class="o" fill="#33333a" d="M-7 25 L6 25 L7 31 Q8 33.5 12 33.5 L12 35.5 L-7 35.5 Z"/>
    <path class="t" style="stroke:#55555e" d="M-3 28 L4 28"/>
    <path class="o" style="stroke-width:1.6" fill="#b9c2c8" d="M-1 35.5 L-1 37 M7 35.5 L7 37"/>
    <path class="o" style="stroke-width:1.8" fill="#eef2f5" d="M-12 36.4 L17 36.4 Q21 36.4 20.5 33 L22 33 Q23.5 38.6 17 38.6 L-12 38.6 Z"/>
  </g>

  <!-- The suit: Frisian blue with a white band, cut for speed, worn for walking. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#1d5fa8" d="M-14 6 Q-17 -14 -14 -30 Q-11 -37 0 -37 Q12 -37 15 -30 Q18 -14 14 6 Z"/>
    <path class="n" fill="#174a8c" d="M-13 5 Q-15.5 -14 -13 -29 Q-9 -20 -8 5 Z"/>
    <path class="n" fill="#ffffff" d="M-13.4 -12 L15.6 -18 L16 -12 L-13.6 -6 Z"/>
    <!-- the knot of the poncho at his throat -->
    <path class="o" style="stroke-width:1.8" fill="#ffd21f" d="M-4 -37 L5 -36 L1 -31 Z"/>
  </g>

  <!-- The stamp card on its string: one box per city, and three stamps so far. -->
  <g id="card" data-parent="torso" transform="translate(3 -73)">
    <path class="t" style="stroke-width:1.2" d="M-5 0 L4 13 M6 0 L8 13"/>
    <rect class="o" style="stroke-width:1.8" fill="#fffdf5" x="-1" y="12" width="15" height="11" rx="1.2"/>
    <path class="t" style="stroke:#9fb4c8;stroke-width:0.9" d="M4 12.6 L4 22.4 M9 12.6 L9 22.4 M-0.4 17.5 L13.4 17.5"/>
    <circle class="n" fill="#d8342c" cx="1.6" cy="15" r="1.5"/>
    <circle class="n" fill="#d8342c" cx="6.5" cy="15" r="1.5"/>
    <circle class="n" fill="#d8342c" cx="1.6" cy="20" r="1.5"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#e8a888" x="-4" y="-6" width="9" height="9" rx="2"/>
    <ellipse class="o" fill="#f3b996" cx="2" cy="-21" rx="18.5" ry="17.5"/>
    <ellipse class="o" fill="#f3b996" cx="-9" cy="-19" rx="3.4" ry="4.8"/>
    <!-- red cheeks from the wind, and a drip on the nose: it is raining, not freezing -->
    <ellipse class="n" fill="#e5583f" fill-opacity="0.5" cx="8" cy="-13" rx="4.4" ry="2.6"/>
    <circle class="n" fill="#2b1b16" cx="9" cy="-19.5" r="2.1"/>
    <circle class="n" fill="#2b1b16" cx="17.5" cy="-19" r="1.9"/>
    <!-- eyebrows: determined -->
    <path class="t" style="stroke-width:2.4" d="M5.5 -24.6 L12 -23 M15 -23.4 L20.5 -24.8"/>
    <path class="o" fill="#f3b996" d="M20.5 -18 Q26 -15 21 -12"/>
    <!-- a drip on the end of his nose -->
    <path class="o" style="stroke-width:1.3" fill="#9fd8f2" d="M24 -11.5 Q21.6 -7.4 24 -6.4 Q26.4 -7.4 24 -11.5 Z"/>
    <!-- grinning through the drizzle -->
    <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M8 -9.5 Q14 -6 19 -9.6 Q17.5 -4 13 -4 Q9 -4.2 8 -9.5 Z"/>
    <!-- the woollen cap: Frisian blue and white, and a red pompom -->
    <path class="o" fill="#1d5fa8" d="M-16.5 -28 Q-18 -47 3 -47 Q22 -47 21 -31 Q2 -36 -16.5 -28 Z"/>
    <path class="n" fill="#ffffff" d="M-14 -39.5 Q3 -44.5 19 -39.5 L20 -35.5 Q3 -40.5 -15.2 -34.5 Z"/>
    <path class="o" fill="#e9eef3" d="M-18 -30 Q2 -36.5 22 -32 L22 -26.5 Q2 -31 -18 -24.5 Z"/>
    <circle class="o" fill="#d8342c" cx="-6" cy="-49" r="6"/>
    <path class="t" style="stroke:#a3241e;stroke-width:1.2" d="M-9 -51 L-4 -47 M-6 -53 L-5 -46 M-9 -48 L-3 -50"/>
  </g>

  <!-- The near arm: behind his back as well, the hand on his lower back. -->
  <g id="arm_front" data-parent="torso" transform="translate(4 -72)">
    <path fill="none" stroke="#2b1b16" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" d="M0 0 L-6 15 L-17 20"/>
    <path fill="none" stroke="#1d5fa8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M0 0 L-6 15 L-17 20"/>
    <circle class="o" fill="#f3b996" cx="-18" cy="20.5" r="4.4"/>
  </g>
</svg>
