<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -124 224 128" data-rig="static">
  <title>De Kubuswoning: een scheve gele kubus op een paal. Binnen schuift alles, dus de bewoners gooien de meubels naar buiten</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!--
    A tilted cube house, stylised to the idea: a yellow cube standing on one corner on a post. Inside, the
    floors slope, so everything slides. She leans out of the window with a kitchen chair, he slides past
    the other window with his coffee, and grandad reads the paper in the armchair that slid out last week.
    Origin = the middle of the floor.
  -->

  <!-- The back of it: the pavement, the post, and the rooms behind the windows. -->
  <g id="house" transform="translate(0 0)">
    <rect class="n" fill="#d9d4c8" x="-110" y="-5" width="220" height="5"/>
    <path class="t" style="stroke:#bfb9ab;stroke-width:1.2" d="M-110 -5 L110 -5 M-80 -5 L-80 0 M-50 -5 L-50 0 M-20 -5 L-20 0 M10 -5 L10 0 M40 -5 L40 0 M70 -5 L70 0"/>
    <!-- the post, with the front door -->
    <rect class="o" fill="#cfc9bb" x="-47" y="-28" width="26" height="28"/>
    <path class="n" fill="#e3ded2" d="M-44 -26 L-38 -26 L-38 -2 L-44 -2 Z"/>
    <rect class="o" style="stroke-width:2" fill="#3d4d5a" x="-38" y="-19" width="11" height="19"/>
    <circle class="n" fill="#f2c230" cx="-30" cy="-9" r="1.2"/>
    <!-- the rooms: warm light, the walls at an angle, the picture hanging straight anyway -->
    <path class="n" fill="#fff0c2" d="M-40.2 -64.4 L-69.4 -81.2 L-69.4 -46.4 L-40.2 -30.8 Z"/>
    <path class="n" fill="#fff0c2" d="M-27.8 -64.4 L1.4 -81.2 L1.4 -46.4 L-27.8 -30.8 Z"/>
    <path class="n" fill="#f1dda0" d="M-69.4 -60 L-40.2 -44 L-40.2 -30.8 L-69.4 -46.4 Z M-27.8 -44 L1.4 -60 L1.4 -46.4 L-27.8 -30.8 Z"/>
    <path class="t" style="stroke:#c9b06a;stroke-width:1.2" d="M-69.4 -60 L-40.2 -44 M-27.8 -44 L1.4 -60"/>
    <path class="t" style="stroke-width:1" d="M-64 -77 L-66.6 -72 M-64 -77 L-61.4 -72"/>
    <rect class="o" style="stroke-width:1.6" fill="#7cc0e0" x="-68" y="-72.6" width="8" height="7" rx="0.6"/>
    <!-- the lamp over the table, hanging straight down -->
    <path class="t" style="stroke-width:1" d="M-12 -72 L-12 -62"/>
    <path class="o" style="stroke-width:1.6" fill="#e8731c" d="M-17 -56 Q-17 -62 -12 -62 Q-7 -62 -7 -56 Z"/>
  </g>

  <!-- B: the husband, sliding past the window with his coffee. Joint at his middle, on the sill. -->
  <g id="b_body" transform="translate(-51 -38)">
    <g transform="rotate(-14)">
      <path class="o" fill="#f4f1ea" d="M-10 2 Q-11 -6 -7 -10 Q0 -13 7 -10 Q11 -6 10 2 Z"/>
      <path class="t" style="stroke:#c9c4b8" d="M0 -10 L0 1"/>
      <!-- his arm, sleeve rolled up, holding the mug up out of harm's way -->
      <path class="o" fill="#f4f1ea" d="M5 -9 L13 -12 L15 -7 L8 -4 Z"/>
      <path fill="none" stroke="#2b1b16" stroke-width="7.4" stroke-linecap="round" d="M14 -10 L16 -19"/>
      <path fill="none" stroke="#efc3a1" stroke-width="4" stroke-linecap="round" d="M14 -10 L16 -19"/>
      <path class="o" style="stroke-width:1.8" fill="#ffffff" d="M12.6 -28 L20 -28 L19.4 -20 L13.2 -20 Z"/>
      <path class="n" fill="#1f8a4c" d="M13 -25 L19.8 -25 L19.6 -23.4 L13.2 -23.4 Z"/>
      <circle class="o" style="stroke-width:1.8" fill="#efc3a1" cx="16.4" cy="-20" r="2.6"/>
    </g>
  </g>

  <g id="b_head" data-parent="b_body" transform="translate(-52 -51)">
    <circle class="o" fill="#efc3a1" cx="1" cy="-6" r="9.6"/>
    <path class="o" style="stroke-width:2" fill="#efc3a1" d="M9.6 -8 Q14 -6 10 -3"/>
    <path class="o" fill="#8e8579" d="M-8.6 -9 Q-9 -16.6 1 -16.6 Q9 -16.6 10.4 -11 Q2 -13 -4 -9 Q-6 -6 -8.6 -9 Z"/>
    <!-- eyes wide: here we go again -->
    <circle class="o" style="stroke-width:1.2" fill="#ffffff" cx="5.4" cy="-7.4" r="2.6"/>
    <circle class="n" fill="#2b1b16" cx="6" cy="-7.4" r="1.1"/>
    <path class="o" style="stroke-width:1.6" fill="#6b5b4b" d="M4 -2.4 Q8 -4.4 11 -2.4 Q8 -0.8 4 -2.4 Z"/>
  </g>

  <!-- The cube itself: three yellow faces round one corner, the windows cut out. -->
  <g id="facade" transform="translate(0 0)">
    <path class="o" fill="#fbe07a" d="M-34 -68 L-75.6 -92 L-34 -116 L7.6 -92 Z"/>
    <path class="o" fill="#d9a21c" fill-rule="evenodd" d="M-34 -68 L-75.6 -92 L-75.6 -44 L-34 -20 Z M-40.2 -64.4 L-69.4 -81.2 L-69.4 -46.4 L-40.2 -30.8 Z"/>
    <path class="o" fill="#f2c230" fill-rule="evenodd" d="M-34 -68 L7.6 -92 L7.6 -44 L-34 -20 Z M-27.8 -64.4 L1.4 -81.2 L1.4 -46.4 L-27.8 -30.8 Z"/>
    <!-- window sills -->
    <path fill="none" stroke="#2b1b16" stroke-width="4.6" stroke-linecap="round" d="M-69.4 -46.4 L-40.2 -30.8 M-27.8 -30.8 L1.4 -46.4"/>
    <path fill="none" stroke="#f4f1ea" stroke-width="2" stroke-linecap="round" d="M-69.4 -46.4 L-40.2 -30.8 M-27.8 -30.8 L1.4 -46.4"/>
    <!-- a small window in the top face -->
    <path class="o" style="stroke-width:2" fill="#7cc0e0" d="M-34 -100 L-46 -93 L-34 -86 L-22 -93 Z"/>
    <path class="n" fill="#ffffff" fill-opacity="0.6" d="M-38 -96 L-34 -98.4 L-31 -96.6 L-35 -94.2 Z"/>

    <!-- grandad's armchair, which slid out last week and stayed out -->
    <path class="o" fill="#6b8a4a" d="M-108 -2 L-108 -40 Q-108 -46 -102 -46 Q-96 -46 -96 -40 L-96 -22 L-74 -22 L-74 -2 Z"/>
    <path class="o" fill="#7d9e58" d="M-100 -26 L-72 -26 Q-68 -26 -68 -20 L-68 -10 L-100 -10 Z"/>
    <path class="o" fill="#5b7840" d="M-104 -10 L-66 -10 L-66 -4 L-104 -4 Z"/>
    <path class="t" style="stroke-width:3" d="M-102 -4 L-102 0 M-70 -4 L-70 0"/>
    <!-- and what came out of the window before the chairs: a lamp, a plant -->
    <path class="o" style="stroke-width:2" fill="#e8731c" d="M14 -6 L22 -16 L28 -11 L20 -2 Z"/>
    <path class="t" style="stroke-width:2.2" d="M21 -6 L44 -4"/>
    <ellipse class="o" style="stroke-width:2" fill="#5d7487" cx="45" cy="-4" rx="2.4" ry="3.6"/>
    <path class="o" style="stroke-width:2" fill="#c9673a" d="M-14 -2 L-16 -12 L-4 -12 L-6 -2 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#4f9a3c" d="M-10 -12 Q-16 -22 -12 -26 Q-9 -20 -10 -12 Z M-10 -12 Q-4 -24 1 -22 Q-3 -16 -10 -12 Z M-10 -12 Q-18 -16 -20 -12 Q-15 -10 -10 -12 Z"/>
  </g>

  <!-- C: grandad in the armchair, cap on, reading the paper. Nothing surprises him any more. Joint at his seat. -->
  <g id="c_body" transform="translate(-90 -24)">
    <path class="o" fill="#3a3f4a" d="M-6 0 L14 -2 L16 4 L-4 6 Z"/>
    <path class="o" fill="#3a3f4a" d="M12 -2 L18 -1 L19 20 L13 20 Z"/>
    <path class="o" fill="#2b2420" d="M12 18 L24 18 Q26 22 24 23 L12 23 Z"/>
    <path class="o" fill="#8a6a4a" d="M-9 2 Q-11 -10 -8 -20 Q-2 -25 5 -22 Q9 -12 8 2 Z"/>
    <path class="t" style="stroke:#6e5238" d="M0 -22 L0 0"/>
  </g>

  <g id="c_head" data-parent="c_body" transform="translate(-88 -48)">
    <circle class="o" fill="#efc3a1" cx="0" cy="-8" r="10"/>
    <path class="o" style="stroke-width:2" fill="#efc3a1" d="M9.4 -9 Q13.6 -6.6 9.6 -4"/>
    <path class="o" fill="#5d6270" d="M-10.6 -10 Q-11 -20 0 -20 Q10 -20 11 -13 L16 -12 L15.6 -9.6 L9 -10.4 Q0 -13.6 -10.6 -10 Z"/>
    <path class="t" style="stroke-width:1.8" d="M3.6 -6 Q6 -4.6 8.4 -6"/>
    <path class="o" style="stroke-width:1.6" fill="#d8d8d8" d="M3 -2.6 Q7 -4.6 11 -2 Q7 0.4 3 -2.6 Z"/>
  </g>

  <!-- The paper, held up in front of him. -->
  <g id="c_paper" data-parent="c_body" transform="translate(-78 -34)">
    <path class="o" style="stroke-width:2" fill="#f4f1ea" d="M-4 -9 L9 -11 L10 7 L-3 9 Z"/>
    <path class="t" style="stroke:#9aa3b2;stroke-width:1" d="M-1 -5 L7 -6.2 M-1 -2 L7 -3.2 M-1 1 L7 -0.2 M-1 4 L5 3.2"/>
    <path class="n" fill="#2b1b16" d="M-1 -8.6 L4 -9.4 L4 -7.6 L-1 -6.8 Z"/>
    <circle class="o" style="stroke-width:1.6" fill="#efc3a1" cx="-3.6" cy="-2" r="2.6"/>
  </g>

  <!-- A: she leans out of the window with the next kitchen chair. Joint at her waist, on the sill. -->
  <g id="a_body" transform="translate(-4 -48)">
    <path class="o" fill="#3f8a5c" d="M-8 6 Q-10 -6 -2 -16 Q5 -24 13 -20 Q18 -14 14 -4 Q10 4 6 8 Z"/>
    <!-- the apron -->
    <path class="o" style="stroke-width:2" fill="#f4f1ea" d="M-3 6 Q-4 -4 2 -12 Q8 -15 11 -10 Q11 -2 6 7 Z"/>
    <path class="t" style="stroke:#7cc0e0;stroke-width:1" d="M0 0 L8 0 M-1 -4 L9 -4 M2 -8 L10 -8 M2 -12 L2 4 M6 -13 L5 6"/>
  </g>

  <g id="a_head" data-parent="a_body" transform="translate(12 -70)">
    <circle class="o" fill="#efc3a1" cx="2" cy="-8" r="10"/>
    <!-- a perm, dyed a colour that is not in nature -->
    <path class="o" fill="#9b2d3a" d="M-9 -6 Q-13 -10 -10 -14 Q-12 -20 -6 -21 Q-3 -25 2 -22 Q7 -24 10 -20 Q14 -18 12 -14 Q8 -16 4 -14 Q0 -12 -3 -8 Q-5 -3 -9 -6 Z"/>
    <circle class="n" fill="#b9404d" cx="-4" cy="-17" r="2"/>
    <circle class="n" fill="#b9404d" cx="4" cy="-20" r="1.8"/>
    <circle class="n" fill="#2b1b16" cx="7.4" cy="-8.6" r="1.4"/>
    <path class="t" style="stroke-width:1.8" d="M4.6 -12.4 L9.6 -11.4"/>
    <path class="o" style="stroke-width:2" fill="#efc3a1" d="M11.4 -8.6 Q15 -6.4 11.6 -4.4"/>
    <!-- shouting: "Pleur op met je stoel!" -->
    <path class="o" style="stroke-width:1.6" fill="#7a2a20" d="M6 -2.6 Q10 -4.4 12 -1.6 Q10 2.4 6 -2.6 Z"/>
  </g>

  <!-- Her arm, sleeve rolled up, the chair hanging from her hand by its back. Joint at the shoulder. -->
  <g id="a_arm" data-parent="a_body" transform="translate(9 -63)">
    <path class="o" fill="#3f8a5c" d="M-4 -3 L6 -5 L8 2 L-2 4 Z"/>
    <path class="o" style="stroke-width:1.8" fill="#357a4e" d="M5 -6 L8.4 -6.6 L10 2.6 L6.6 3.2 Z"/>
    <path fill="none" stroke="#2b1b16" stroke-width="7.4" stroke-linecap="round" d="M8 -1 L22 -2"/>
    <path fill="none" stroke="#efc3a1" stroke-width="4" stroke-linecap="round" d="M8 -1 L22 -2"/>
    <circle data-mount="muzzle" fill="none" cx="26" cy="8" r="1"/>
  </g>

  <!-- The kitchen chair: chrome tubes and a green seat, straight out of 1984. Joint at her hand. -->
  <g id="a_chair" data-parent="a_arm" transform="translate(33 -66)">
    <path class="t" style="stroke-width:4.4" d="M-2 0 L-1 26 M-1 16 L14 16 L14 27 M-1 16 L-3 27"/>
    <path fill="none" stroke="#d6dbe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M-2 0 L-1 26 M-1 16 L14 16 L14 27 M-1 16 L-3 27"/>
    <rect class="o" style="stroke-width:2" fill="#4f9a3c" x="-4.6" y="1" width="7" height="10" rx="2"/>
    <rect class="o" style="stroke-width:2" fill="#4f9a3c" x="-3" y="12.6" width="19" height="4.6" rx="2"/>
    <circle class="o" style="stroke-width:1.8" fill="#efc3a1" cx="-1" cy="0" r="2.8"/>
  </g>
</svg>
