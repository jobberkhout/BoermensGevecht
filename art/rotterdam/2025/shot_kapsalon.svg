<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 40 40" data-rig="static">
  <title>Een vliegende kapsalon in zijn aluminium bakje, de knoflooksaus druipend over de rand</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>
  <!-- Fries, shoarma, melted cheese, lettuce and a dollop of garlic sauce, in an aluminium tray. Origin = the middle. -->
  <g id="kapsalon" transform="translate(0 0)">
    <!-- fries sticking out of the heap -->
    <g class="o" style="stroke-width:1.2" fill="#f2c94c">
      <path d="M-13 -1 L-15 -9 L-12.4 -9.8 L-10.4 -2 Z"/>
      <path d="M11 -1 L14.6 -8.6 L17 -7.4 L13.6 -0.4 Z"/>
      <path d="M2 -6 L4 -14.6 L6.6 -14 L4.8 -5.6 Z"/>
    </g>
    <!-- shoarma -->
    <path class="o" style="stroke-width:1.6" fill="#9a5a2c" d="M-13 0 Q-12 -8 -5 -7.6 Q0 -11.6 6 -8 Q12 -9 13 0 Z"/>
    <path class="n" fill="#6f3d1c" d="M-8 -4 Q-6 -6 -4 -4.6 Z M3 -6 Q5 -7.6 7 -6 Z M8 -3 Q10 -4.6 11 -2.6 Z"/>
    <!-- melted cheese, hanging down in tongues -->
    <path class="o" style="stroke-width:1.6" fill="#f4b23a" d="M-14 -1.6 Q-9 -6 -2 -4.6 Q5 -7.4 12 -4.6 Q15 -3.6 15 -1 L14.6 2 Q13.4 4 12.4 1.4 Q10 -0.6 6 1 Q4.6 4.6 3 1.2 Q-2 -0.6 -6 1 Q-7.6 4 -9 1 Q-12 0.6 -14 -1.6 Z"/>
    <!-- lettuce -->
    <path class="o" style="stroke-width:1.4" fill="#7cc04a" d="M-10 -6.4 L-7.6 -10.6 L-5.4 -7.2 L-2.6 -11.4 L0 -7.4 L2.6 -10.8 L5 -7 L8 -9.6 L9 -5.6 Q0 -3.6 -10 -6.4 Z"/>
    <!-- the tray -->
    <path class="o" fill="#c9d0d6" d="M-17 0 L17 0 L14 8 L-14 8 Z"/>
    <path class="n" fill="#eef2f5" d="M-15 1.4 L-6 1.4 L-7 6.6 L-13.4 6.6 Z"/>
    <path class="t" style="stroke:#8e979f;stroke-width:0.9" d="M-11 4 L-4 4 M3 4 L11 4"/>
    <!-- the garlic sauce: a big dollop on top, and over the edge it goes -->
    <path class="o" style="stroke-width:1.6" fill="#fffbf2" d="M-9 -9 Q-9 -16 -3 -15 Q0 -19.4 5 -16 Q10 -16 9.6 -10 Q8 -7.6 2 -8.2 Q-4 -7 -9 -9 Z"/>
    <path class="o" style="stroke-width:1.4" fill="#fffbf2" d="M-15 -3 Q-18.6 -2 -18 2 L-17.4 9 Q-17 12.6 -15.6 12.4 Q-14.4 12 -14.8 9 L-14.6 5 Q-12.6 7 -12.4 11 Q-12 13 -10.8 12.6 Q-9.6 11.6 -10.6 8 L-12 1 Z"/>
    <path class="o" style="stroke-width:1.2" fill="#fffbf2" d="M-14 14.6 Q-15.4 16.6 -14 17.6 Q-12.6 16.6 -14 14.6 Z"/>
    <path class="n" fill="#ffffff" d="M-4 -13 Q-1 -15.4 2 -13.6 Q-1 -13 -3 -11.6 Z"/>
  </g>
</svg>
