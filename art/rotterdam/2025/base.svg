<svg xmlns="http://www.w3.org/2000/svg" viewBox="-312 -596 328 602" data-rig="static">
  <title>De Markthal: een hoefijzervormige markthal met woningen in de boog, een stapel containers ernaast en een bouwkraan erachter</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!--
    The market hall: a great horseshoe arch of grey stone with flats in it, their windows following the
    curve. The two floors for the turrets are under the arch; the painted ceiling is only a ring of plain
    colour blocks round the inside. On the ground floor: a stack of containers, a market stall in the city's
    green and white, and the doorway. Behind it all, a building crane: the city is never finished.
    Origin = the gate on the road; the building stands to the left of it.
  -->
  <g id="building" transform="translate(0 0)">
    <!-- the building crane, behind everything -->
    <path fill="none" stroke="#2b1b16" stroke-width="13" stroke-linejoin="round" d="M-46 -440 L-46 -582"/>
