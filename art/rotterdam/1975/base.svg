<svg xmlns="http://www.w3.org/2000/svg" viewBox="-312 -596 328 602" data-rig="static">
  <title>De loods aan de kade: een bakstenen havenloods met laadzolders, een kade-kraan erachter en de seinmast met zijn kraaiennest</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
    .k { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .j { stroke: #8e4630; stroke-width: 1.4; stroke-linecap: round; fill: none; }
  </style>

  <!-- (0,0) is the foot of the doorway, where units come out. The shed stands behind it, to the left. -->
  <g id="building" transform="translate(0 0)">
    <!-- behind the shed: the signal mast with its crow's nest and the storm ball -->
    <path class="t" style="stroke-width:7" d="M-150 -452 L-150 -588"/>
    <path fill="none" stroke="#efe6d2" stroke-width="3.6" stroke-linecap="round" d="M-150 -452 L-150 -588"/>
    <path class="t" style="stroke-width:5" d="M-174 -566 L-126 -566"/>
    <path fill="none" stroke="#efe6d2" stroke-width="2.4" stroke-linecap="round" d="M-174 -566 L-126 -566"/>
    <path class="t" style="stroke-width:1.4" d="M-150 -588 L-174 -566 M-150 -588 L-126 -566 M-130 -566 L-130 -552"/>
    <circle class="o" style="stroke-width:2.4" fill="#2b2b2b" cx="-130" cy="-546" r="6"/>
    <circle class="o" style="stroke-width:2.4" fill="#e8c12a" cx="-150" cy="-591" r="3.6"/>
    <!-- the crow's nest: a tub on the mast, the lookout's cap just showing over the rim -->
    <path class="o" fill="#4e4842" d="M-158 -538 Q-158 -548 -150 -548 Q-142 -548 -142 -538 Z"/>
    <path class="o" fill="#4e4842" d="M-144 -541 L-136 -538 L-144 -537.4 Z"/>
    <path class="o" fill="#8a5a32" d="M-166 -538 L-134 -538 L-137 -516 L-163 -516 Z"/>
    <path class="t" style="stroke:#6b4423;stroke-width:1.4" d="M-165 -531 L-135 -531 M-164 -524 L-136 -524"/>

    <!-- behind the shed: the quay crane, its machine house above the roof and the jib up over the doorway -->
    <path class="o" fill="#5d7487" d="M-96 -474 L-28 -474 L-34 -452 L-90 -452 Z"/>
    <rect class="o" fill="#5d7487" x="-92" y="-528" width="58" height="56" rx="3"/>
    <path class="n" fill="#7d93a5" d="M-88 -524 L-38 -524 L-38 -519 L-88 -519 Z"/>
    <path class="t" style="stroke:#46596a;stroke-width:1.6" d="M-84 -508 L-84 -480 M-78 -508 L-78 -480 M-72 -508 L-72 -480"/>
    <!-- its cab, with the crane driver -->
    <path class="o" fill="#efe6d2" d="M-46 -520 L-22 -520 L-18 -496 L-46 -496 Z"/>
    <path class="k" fill="#34424b" d="M-42 -516 L-25 -516 L-22.4 -500 L-42 -500 Z"/>
    <circle class="n" fill="#e0aa84" cx="-33" cy="-506" r="3.6"/>
    <path class="n" fill="#4e4842" d="M-37 -508 Q-37 -512.4 -33 -512.4 Q-29 -512.4 -28.6 -509 L-26 -508 Z"/>
    <!-- the jib -->
    <path class="t" style="stroke-width:7.6" d="M-40 -526 L4 -588 M-30 -512 L10 -582"/>
    <path fill="none" stroke="#5d7487" stroke-width="4" stroke-linecap="round" d="M-40 -526 L4 -588 M-30 -512 L10 -582"/>
    <path class="t" style="stroke:#46596a;stroke-width:1.6" d="M-36 -526 L-25 -520 L-29 -540 L-18 -534 L-22 -554 L-11 -548 L-15 -568 L-4 -562 L-6 -578 L4 -582"/>
    <circle class="o" style="stroke-width:2.4" fill="#46596a" cx="7" cy="-586" r="4.4"/>
    <!-- the counterweight at the back -->
    <rect class="o" fill="#46596a" x="-106" y="-524" width="16" height="26" rx="2"/>

    <!-- the flagpole on the corner -->
    <path class="t" style="stroke-width:5" d="M-288 -454 L-288 -552"/>
    <circle class="o" fill="#e8c12a" cx="-288" cy="-555" r="4.5"/>

    <!-- the roof: corrugated iron, rusted where it always rains -->
    <path class="o" fill="#a14a2e" d="M-306 -448 L-262 -490 L-44 -490 L2 -448 Z"/>
    <path class="t" style="stroke:#7d3520;stroke-width:1.6" d="M-284 -452 L-252 -486 M-254 -452 L-232 -486 M-224 -452 L-210 -486 M-194 -452 L-188 -486 M-164 -452 L-166 -486 M-134 -452 L-144 -486 M-104 -452 L-122 -486 M-74 -452 L-100 -486 M-44 -452 L-76 -486 M-14 -452 L-54 -486"/>
    <path class="n" fill="#c0603c" d="M-258 -486 L-48 -486 L-50 -482 L-256 -482 Z"/>
    <path class="n" fill="#7a5a4a" fill-opacity="0.5" d="M-180 -486 Q-176 -470 -170 -452 L-160 -452 Q-168 -470 -170 -486 Z"/>

    <!-- the front: brick, with a white board under the roof -->
    <rect class="o" fill="#a4553b" x="-296" y="-444" width="292" height="444"/>
    <rect class="o" fill="#efe6d2" x="-302" y="-454" width="304" height="12" rx="3"/>

    <!-- the upper loading floor, empty: dark planks and a hoist chain against the back wall -->
    <rect class="o" fill="#3e3530" x="-290" y="-436" width="280" height="142"/>
    <path class="t" style="stroke:#4c423b;stroke-width:2" d="M-262 -434 L-262 -296 M-226 -434 L-226 -296 M-190 -434 L-190 -296 M-154 -434 L-154 -296 M-118 -434 L-118 -296 M-82 -434 L-82 -296 M-46 -434 L-46 -296"/>
    <path class="n" fill="#2f2824" d="M-288 -308 L-12 -308 L-12 -296 L-288 -296 Z"/>

    <!-- the lower loading floor, the same again -->
    <rect class="o" fill="#3e3530" x="-290" y="-284" width="280" height="140"/>
    <path class="t" style="stroke:#4c423b;stroke-width:2" d="M-262 -282 L-262 -146 M-226 -282 L-226 -146 M-190 -282 L-190 -146 M-154 -282 L-154 -146 M-118 -282 L-118 -146 M-82 -282 L-82 -146 M-46 -282 L-46 -146"/>
    <path class="n" fill="#2f2824" d="M-288 -158 L-12 -158 L-12 -146 L-288 -146 Z"/>

    <!-- floor slabs: timber beams with green-painted edges -->
    <rect class="o" fill="#1f8a4c" x="-300" y="-294" width="300" height="10" rx="2"/>
    <rect class="o" fill="#1f8a4c" x="-300" y="-144" width="300" height="10" rx="2"/>
    <path class="n" fill="#13603a" d="M-298 -287 L-2 -287 L-2 -285 L-298 -285 Z M-298 -137 L-2 -137 L-2 -135 L-298 -135 Z"/>

    <!-- ground floor: the painted sign of the line, a wave with an anchor, on a green panel -->
    <path class="j" d="M-294 -120 L-284 -120 M-294 -100 L-284 -100 M-294 -80 L-284 -80 M-294 -60 L-284 -60 M-294 -40 L-284 -40 M-294 -20 L-284 -20 M-124 -120 L-106 -120 M-124 -100 L-106 -100 M-124 -80 L-106 -80 M-124 -60 L-106 -60 M-124 -40 L-106 -40 M-124 -20 L-106 -20"/>
    <path class="j" d="M-289 -130 L-289 -120 M-289 -100 L-289 -80 M-289 -60 L-289 -40 M-115 -130 L-115 -120 M-115 -110 L-115 -100 M-115 -90 L-115 -80 M-115 -70 L-115 -60 M-115 -50 L-115 -40 M-115 -30 L-115 -20"/>
    <rect class="o" fill="#1f8a4c" x="-280" y="-122" width="152" height="94" rx="3"/>
    <rect class="n" fill="#13603a" x="-276" y="-118" width="144" height="4"/>
    <path fill="none" stroke="#f4f1e8" stroke-width="7" stroke-linecap="round" d="M-252 -48 Q-238 -62 -224 -48 Q-210 -34 -196 -48 Q-182 -62 -168 -48 Q-154 -34 -140 -48"/>
    <path fill="none" stroke="#f4f1e8" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round" d="M-204 -104 L-204 -62 M-218 -94 L-190 -94 M-222 -74 Q-204 -52 -186 -74"/>
    <circle fill="none" stroke="#f4f1e8" stroke-width="4.4" cx="-204" cy="-108" r="5"/>
    <!-- a bollard and a coil of rope by the wall -->
    <path class="o" fill="#2f3b44" d="M-270 0 L-268 -14 L-252 -14 L-250 0 Z"/>
    <rect class="o" style="stroke-width:2.4" fill="#3d4b56" x="-272" y="-19" width="24" height="6" rx="2.6"/>
    <ellipse class="o" fill="#c9a46a" cx="-150" cy="-7" rx="20" ry="7"/>
    <ellipse class="t" style="stroke:#8c6a3a" cx="-150" cy="-8" rx="13" ry="4"/>
    <ellipse class="t" style="stroke:#8c6a3a" cx="-150" cy="-8.4" rx="6" ry="1.8"/>

    <!-- the doorway units come out of: a big sliding door, rolled aside -->
    <rect class="o" fill="#efe6d2" x="-104" y="-132" width="100" height="132"/>
    <rect class="o" fill="#231d19" x="-92" y="-120" width="76" height="120"/>
    <path class="n" fill="#2f2722" d="M-90 -118 L-84 -118 L-84 -2 L-90 -2 Z"/>
    <path class="o" style="stroke-width:2.4" fill="#5d7487" d="M-108 -136 L0 -136 L0 -130 L-108 -130 Z"/>
    <path class="o" fill="#1f8a4c" d="M-124 -128 L-96 -128 L-96 -2 L-124 -2 Z"/>
    <path class="t" style="stroke:#13603a;stroke-width:2.4" d="M-122 -126 L-98 -4 M-122 -4 L-98 -126"/>
    <path class="t" style="stroke:#13603a;stroke-width:2" d="M-124 -66 L-96 -66"/>
    <circle class="o" style="stroke-width:1.6" fill="#3a3a3a" cx="-118" cy="-131" r="2.6"/>
    <circle class="o" style="stroke-width:1.6" fill="#3a3a3a" cx="-102" cy="-131" r="2.6"/>
    <rect class="o" fill="#8f959c" x="-108" y="-6" width="108" height="6"/>

    <circle data-mount="turret0" fill="none" cx="-150" cy="-144" r="1"/>
    <circle data-mount="turret1" fill="none" cx="-150" cy="-294" r="1"/>
    <circle data-mount="flag" fill="none" cx="-286" cy="-548" r="1"/>
  </g>

  <!-- The crane's hook on its cables, swaying. Joint at the jib tip. -->
  <g id="hook" data-parent="building" transform="translate(8 -584)">
    <path class="t" style="stroke-width:1.4" d="M-1.6 0 L-1.6 76 M1.6 0 L1.6 76"/>
    <rect class="o" style="stroke-width:2.2" fill="#e8c12a" x="-6" y="74" width="12" height="9" rx="2"/>
    <path class="t" style="stroke-width:5" d="M0 83 L0 88 Q0 95 -5 95 Q-9 95 -9 90"/>
    <path fill="none" stroke="#9aa5ad" stroke-width="2.4" stroke-linecap="round" d="M0 83 L0 88 Q0 95 -5 95 Q-9 95 -9 90"/>
  </g>

  <!-- A gull gliding over the roof. -->
  <g id="gull" transform="translate(-88 -562)">
    <path class="o" style="stroke-width:2.2" fill="#f4f4f0" d="M-16 -2 Q-8 -10 0 -2 Q8 -10 16 -2 Q8 -5 0 1 Q-8 -5 -16 -2 Z"/>
    <path class="n" fill="#a9b4bc" d="M-14 -3.6 Q-9 -7.6 -5 -5 Q-10 -4.6 -14 -3.6 Z M14 -3.6 Q9 -7.6 5 -5 Q10 -4.6 14 -3.6 Z"/>
    <path class="n" fill="#f2c230" d="M1 -1 L5 0 L1 1.4 Z"/>
  </g>
</svg>
