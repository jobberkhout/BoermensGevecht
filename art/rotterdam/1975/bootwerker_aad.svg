<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -134 108 140" data-rig="humanoid">
  <title>Bootwerker Aad: platte pet, mouwen opgerold, zijn bootwerkershaak in de vuist en een Rotterdamse fooi voor wie erom vraagt</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <g id="hips" transform="translate(0 -38)"/>

  <!-- The far arm: sleeve rolled up past the elbow, fist on his hip. -->
  <g id="arm_back" data-parent="torso" transform="translate(-10 -72)">
    <g transform="rotate(24)">
      <path class="o" fill="#7f9db6" d="M-6.5 -3 Q-8.5 5 -7.5 10 L7 10 Q8 5 6.5 -3 Z"/>
      <rect class="o" fill="#a9c1d4" x="-8" y="8.5" width="16" height="6" rx="3"/>
      <path class="o" fill="#d29a74" d="M-5.5 14 Q-6.8 20 -5 25 L5 25 Q6.6 20 5.5 14 Z"/>
      <circle class="o" fill="#d29a74" cx="0" cy="27" r="5.4"/>
    </g>
  </g>

  <!-- Navy work trousers and heavy boots with steel toes. -->
  <g id="leg_back" data-parent="hips" transform="translate(-5 -38)">
    <path class="o" fill="#24345a" d="M-8 -3 L8 -3 L7 29 L-7 29 Z"/>
    <path class="o" fill="#3b2a20" d="M-8.5 38 L-8.5 30 Q-8.5 27.5 -4.5 27.5 L5 27.5 Q8.5 27.5 9 30.5 Q15.5 31.5 17 35 L17 38 Z"/>
  </g>

  <g id="leg_front" data-parent="hips" transform="translate(5 -38)">
    <path class="o" fill="#2c3e66" d="M-8 -3 L8 -3 L7 29 L-7 29 Z"/>
    <path class="t" style="stroke:#1d2b4c" d="M1 0 L1 27"/>
    <path class="o" fill="#4a3426" d="M-8.5 38 L-8.5 30 Q-8.5 27.5 -4.5 27.5 L5 27.5 Q8.5 27.5 9 30.5 Q15.5 31.5 17 35 L17 38 Z"/>
    <path class="n" fill="#241912" d="M-7.8 35.6 L16.3 35.6 L16.3 37.3 L-7.8 37.3 Z"/>
    <path class="n" fill="#8a7a6c" d="M10 31.2 Q14 32 15.6 34.4 L11 34 Z"/>
  </g>

  <!-- A pale blue work shirt with the collar open, green braces, and a green-and-white neckerchief. Broad as a door. -->
  <g id="torso" data-parent="hips" transform="translate(0 -40)">
    <path class="o" fill="#9cb8d0" d="M-17 8 Q-20.5 -14 -17 -30 Q-13 -38 0 -38 Q14 -38 18 -30 Q21.5 -14 17.5 8 Z"/>
    <path class="n" fill="#86a5bf" d="M-16 7 Q-19 -14 -16 -29 Q-11 -20 -10.5 7 Z"/>
    <!-- trousers up to the belly -->
    <path class="o" fill="#2c3e66" d="M-18 8 Q-19.4 0 -18.6 -7 L19.2 -7 Q20 0 18 8 Z"/>
    <path class="t" style="stroke:#1d2b4c" d="M1 -6 L1 7"/>
    <!-- the braces -->
    <path class="o" fill="#1f8a4c" d="M-11 -6.5 L-9.4 -36.6 L-5 -37.4 L-6.2 -6.5 Z"/>
    <path class="o" fill="#1f8a4c" d="M7.8 -6.5 L7.6 -37.2 L12 -36.4 L12.6 -6.5 Z"/>
    <rect class="o" style="stroke-width:1.6" fill="#b9c2bd" x="-11.4" y="-10" width="5.6" height="4" rx="1"/>
    <rect class="o" style="stroke-width:1.6" fill="#b9c2bd" x="7.4" y="-10" width="5.6" height="4" rx="1"/>
    <!-- the breast pocket, with the stub of a pencil and the work card -->
    <path class="t" style="stroke:#6d8aa3" d="M-1 -26 L6 -26 L6 -17 L-1 -17"/>
    <path class="n" fill="#e8c76a" d="M0.5 -30 L2.6 -30 L2.6 -26 L0.5 -26 Z"/>
    <!-- the open collar, a little chest hair -->
    <path class="o" fill="#d29a74" d="M-6 -38 L1 -29 L8 -38 Z"/>
    <path class="t" style="stroke-width:1.2" d="M-1 -34.6 L0 -33 M2 -35 L2.6 -33.2 M0.6 -32 L1.4 -30.6"/>
    <path class="o" fill="#b5cbdc" d="M-8 -38.6 L1 -29 L-1 -27 L-10.6 -36 Z"/>
    <path class="o" fill="#b5cbdc" d="M10 -38.6 L1 -29 L3 -27 L12.4 -36 Z"/>
  </g>

  <g id="head" data-parent="torso" transform="translate(1 -76)">
    <rect class="o" fill="#c48a64" x="-5.5" y="-6" width="12" height="9" rx="2"/>
    <!-- the neckerchief, knotted at the front -->
    <path class="o" fill="#f2f2ec" d="M-11 -3 Q2 3 15 -3 L14.5 2.6 Q2 8 -10.6 2.6 Z"/>
    <path class="n" fill="#1f8a4c" d="M-10.8 -1.6 Q2 4.2 14.8 -1.6 L14.7 0.8 Q2 6.4 -10.7 0.8 Z"/>
    <path class="o" fill="#1f8a4c" d="M12 1 L19 2 L17.5 9 L13 6.5 Z"/>
    <!-- a big square head on a short neck -->
    <path class="o" fill="#e0aa84" d="M-16 -24 Q-16 -38.5 2 -38.5 Q20 -38.5 20.5 -24 L20.5 -13 Q20 -3.5 8 -3 L-2 -3 Q-15.5 -3.5 -16 -14 Z"/>
    <ellipse class="o" fill="#e0aa84" cx="-10" cy="-18" rx="3.6" ry="5"/>
    <!-- a day's stubble on that jaw -->
    <path class="n" fill="#8a6650" fill-opacity="0.32" d="M-6 -12 Q-4 -5 4 -4.4 Q15 -4 19 -10 L19.6 -14 Q15 -9 9 -10.5 Q2 -12 -6 -12 Z"/>
    <!-- the flat cap, pulled down to the eyebrows -->
    <path class="o" fill="#4e4842" d="M-18 -24 Q-21 -38 -8 -42.5 Q6 -46 16.5 -38.5 L25.5 -33.5 Q28 -30.5 24 -29 Q16 -29.6 9 -28.4 Q-5 -26 -18 -24 Z"/>
    <path class="n" fill="#6a625a" d="M-12 -38 Q-2 -43.5 10 -40.6 Q0 -41 -9 -35.4 Z"/>
    <path class="t" style="stroke:#2f2b27" d="M9.6 -28.6 Q15 -35 16.5 -38.5"/>
    <path class="t" style="stroke:#6a625a;stroke-width:1.2" d="M-14 -30 L-11 -29.6 M-8 -32.8 L-5 -32 M-2 -35 L1 -34.2"/>
    <!-- low brows, narrow eyes -->
    <path class="t" style="stroke-width:3" d="M5.6 -24.2 L13 -23 M15.4 -23 L20.4 -24.2"/>
    <path class="t" style="stroke-width:1.8" d="M7.2 -19.8 Q9.8 -21.4 12.4 -19.8 M15.6 -19.8 Q17.6 -21.2 19.6 -19.8"/>
    <circle class="n" fill="#2b1b16" cx="10" cy="-19" r="1.6"/>
    <circle class="n" fill="#2b1b16" cx="17.8" cy="-19" r="1.4"/>
    <!-- a nose that has been broken twice -->
    <path class="o" fill="#d49a74" d="M19 -20 Q22 -17.6 25.5 -14 Q26 -11 22 -10.6 Q19.4 -11.4 19.4 -13"/>
    <!-- the grin, and the stub of a roll-up in the corner -->
    <path class="o" style="stroke-width:2" fill="#7a2a20" d="M7.6 -8.2 Q14 -5.6 20.4 -9 Q15 -10 7.6 -8.2 Z"/>
    <path class="n" fill="#ffffff" d="M10.4 -8.3 L14 -8.7 L13.8 -7.1 L10.6 -7.3 Z"/>
    <path class="o" style="stroke-width:1.6" fill="#f4f1e8" d="M5 -8.6 L9.4 -9.4 L9.8 -7.2 L5.4 -6.4 Z"/>
    <circle class="n" fill="#e0602c" cx="5" cy="-7.5" r="1.3"/>
  </g>

  <!-- The near arm, bent forward: sleeve rolled above a forearm like a ham, an anchor on it. -->
  <g id="arm_front" data-parent="torso" transform="translate(10 -72)">
    <g transform="rotate(-38)">
      <path class="o" fill="#9cb8d0" d="M-6.5 -3.5 Q-8.5 5 -7.5 10 L7.5 10 Q8.5 5 6.5 -3.5 Z"/>
      <rect class="o" fill="#c3d5e3" x="-8.5" y="8.5" width="17" height="6.4" rx="3.2"/>
      <path class="t" style="stroke:#8aa8c0;stroke-width:1.2" d="M-6 11.7 L6 11.7"/>
      <path class="o" fill="#e0aa84" d="M-6 14.5 Q-7.6 20.5 -5.4 26.5 L5.4 26.5 Q7.6 20.5 6 14.5 Z"/>
      <path fill="none" stroke="#3d5a8a" stroke-width="1.2" stroke-linecap="round" d="M0 16.6 L0 23.6 M-2 18 L2 18 M-3 21.4 Q0 25.6 3 21.4"/>
      <circle class="n" fill="#3d5a8a" cx="0" cy="16.2" r="0.9"/>
    </g>
  </g>

  <!-- The cargo hook: a wooden grip in his fist, the steel hook curling out forward. Joint in his fist. -->
  <g id="hook" data-parent="arm_front" transform="translate(28 -50)">
    <rect class="o" fill="#a8743f" x="-2.6" y="-10" width="5.2" height="20" rx="2.4"/>
    <path class="t" style="stroke-width:6.4" d="M4 -1 L13 -2 Q23 -3 23 -12 Q23 -19 16.5 -19.5"/>
    <path fill="none" stroke="#a7b1b8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="M4 -1 L13 -2 Q23 -3 23 -12 Q23 -19 16.5 -19.5"/>
    <path class="o" style="stroke-width:1.8" fill="#c9d1d6" d="M17.6 -22 L11.6 -19.2 L17.4 -17.4 Z"/>
    <path fill="none" stroke="#dfe5e8" stroke-width="1" stroke-linecap="round" d="M14 -3.4 Q20.8 -4.6 21 -11"/>
    <circle class="o" fill="#e0aa84" cx="0" cy="0" r="5.8"/>
    <path class="t" style="stroke-width:1.2" d="M2 -3 L4.6 -2.4 M2.4 0 L5 0.4 M2 3 L4.4 3.4"/>
  </g>
</svg>
