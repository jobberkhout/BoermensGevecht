  <!-- (0,0) is the foot of the doorway: a container standing on end with its doors open. The tower stands behind it, to the left, on a pontoon. -->
  <g id="building" transform="translate(0 0)">
    <!-- the flagpole, on the roof -->
    <path class="t" style="stroke-width:5" d="M-288 -446 L-288 -552"/>
    <circle class="o" fill="#ffd21f" cx="-288" cy="-555" r="4.5"/>

