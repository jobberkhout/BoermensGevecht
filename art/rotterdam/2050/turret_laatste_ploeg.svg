<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -122 224 126" data-rig="static">
  <title>De Laatste Ploeg: de laatste drie mensen van de haven, in een bedieningshuisje met schermen. Ze gooien met joysticks en koffiebekers</title>
  <style>
    .o { stroke: #2b1b16; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2b1b16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .n { stroke: none; }
  </style>

  <!-- B: the operator with the headset, behind the end of the desk. Joint at her hips. -->
  <g id="b_body" transform="translate(33 -40)">
    <g transform="translate(-33 40)">
      <path class="o" fill="#2b2b2b" d="M26 -5 L26 0 L36 0 Q37 -4 33 -5 Z M34 -5 L34 0 L44 0 Q45 -4 41 -5 Z"/>
      <path class="o" fill="#2c3e66" d="M25 -42 L43 -42 L42 -5 L35 -5 L34 -30 L33 -5 L26 -5 Z"/>
      <path class="o" fill="#1f8a4c" d="M22.6 -40 Q21 -60 25 -68 Q33 -72 41 -68 Q45 -60 43.4 -40 Z"/>
      <path class="n" fill="#13603a" d="M23.4 -42 Q22 -58 25 -66 Q27 -56 27 -42 Z"/>
      <path class="o" style="stroke-width:1.8" fill="#f4f4f0" d="M29 -69.6 L33 -63 L37 -69.6 Z"/>
      <!-- a lanyard with a pass -->
      <path class="t" style="stroke:#e8731c;stroke-width:1.4" d="M30 -68 L32 -54 L36 -68"/>
      <rect class="o" style="stroke-width:1.4" fill="#f4f4f0" x="29.6" y="-55" width="5" height="6.4" rx="0.8"/>
    </g>
  </g>

  <g id="b_head" data-parent="b_body" transform="translate(33 -70)">
    <g transform="translate(-33 70)">
      <rect class="o" style="stroke-width:2" fill="#c98a62" x="30" y="-74" width="7" height="6" rx="1.5"/>
      <!-- her bun -->
      <circle class="o" fill="#4a2e22" cx="25" cy="-91" r="5.4"/>
      <circle class="o" fill="#d9a07a" cx="34" cy="-82" r="11.6"/>
      <path class="o" fill="#4a2e22" d="M22.6 -84 Q22 -95 34 -95 Q44 -95 45.6 -86 Q38 -90 30 -86 Q27 -84 26 -78 Q23 -80 22.6 -84 Z"/>
      <!-- the headset: band, ear cup, a microphone at her mouth -->
      <path class="t" style="stroke-width:2.6" d="M25 -86 Q31 -98 40 -94"/>
      <rect class="o" style="stroke-width:1.8" fill="#3b4656" x="22.4" y="-86" width="6.4" height="8.4" rx="2.4"/>
      <path class="t" style="stroke-width:1.8" d="M27 -78 Q32 -72 40 -74"/>
      <circle class="o" style="stroke-width:1.4" fill="#3b4656" cx="41" cy="-74.4" r="1.8"/>
      <!-- glasses and a raised eyebrow -->
      <circle class="o" style="stroke-width:1.6" fill="#ffffff" cx="40" cy="-83" r="3.4"/>
      <circle class="n" fill="#2b1b16" cx="41.2" cy="-83" r="1.4"/>
      <path class="t" style="stroke-width:1.6" d="M36.6 -83 L33 -84 M37 -89.4 Q40.4 -91.6 44 -89"/>
      <path class="o" style="stroke-width:1.8" fill="#d9a07a" d="M44.6 -82 Q48.4 -78.4 45 -76.6"/>
      <path class="t" style="stroke-width:1.6" d="M38.6 -76 Q41.4 -74.6 43.6 -76.4"/>
    </g>
  </g>

  <!-- Her thumb over her shoulder at the graph: "Das gers." Joint at the shoulder. -->
  <g id="b_arm" data-parent="b_body" transform="translate(27 -65)">
    <g transform="translate(-27 65)">
      <path class="o" fill="#1f8a4c" d="M23 -68 Q30 -70 31 -63 L24 -58 Q20 -62 23 -68 Z"/>
      <path class="o" fill="#d9a07a" d="M24.4 -60.6 L17 -70.6 L21.4 -74 L29 -64 Z"/>
      <ellipse class="o" style="stroke-width:2" fill="#d9a07a" cx="18.6" cy="-73.4" rx="3.6" ry="3.4"/>
      <path class="o" style="stroke-width:1.8" fill="#d9a07a" d="M17 -75 L11.6 -77 L12.4 -79.4 L18.6 -77 Z"/>
    </g>
  </g>

  <!-- The control desk: steel console, buttons, the shipping line's wave-and-anchor, and two screens. Origin = middle of the floor. -->
  <g id="desk" transform="translate(0 0)">
    <!-- screen 1: the stacks on the quay, the cranes doing it all -->
    <rect class="o" fill="#5d7487" x="-41" y="-48" width="8" height="9"/>
    <rect class="o" fill="#1d2a3a" x="-56" y="-78" width="38" height="31" rx="3"/>
    <rect class="n" fill="#2f5d73" x="-53" y="-75" width="32" height="25" rx="1.6"/>
    <path class="n" fill="#e8731c" d="M-50 -52 L-42 -52 L-42 -56 L-50 -56 Z M-50 -57 L-42 -57 L-42 -61 L-50 -61 Z"/>
    <path class="n" fill="#3fae6a" d="M-41 -52 L-33 -52 L-33 -56 L-41 -56 Z M-41 -57 L-33 -57 L-33 -61 L-41 -61 Z M-41 -62 L-33 -62 L-33 -66 L-41 -66 Z"/>
    <path class="n" fill="#8fd3e8" d="M-32 -52 L-24 -52 L-24 -56 L-32 -56 Z"/>
    <path fill="none" stroke="#d6eef8" stroke-width="1.4" stroke-linecap="round" d="M-27 -56 L-27 -72 L-44 -72 M-36 -72 L-36 -68"/>
    <!-- screen 2: the graph, which only goes up -->
    <rect class="o" fill="#5d7487" x="-4" y="-48" width="8" height="9"/>
    <rect class="o" fill="#1d2a3a" x="-16" y="-80" width="32" height="33" rx="3"/>
    <rect class="n" fill="#16303c" x="-13" y="-77" width="26" height="27" rx="1.6"/>
    <path fill="none" stroke="#2f5d73" stroke-width="1" d="M-13 -57 L13 -57 M-13 -64 L13 -64 M-13 -71 L13 -71"/>

    <!-- the console -->
    <path class="o" fill="#8fa3b3" d="M-70 -30 L34 -30 L28 -41 L-64 -41 Z"/>
    <rect class="o" fill="#5d7487" x="-68" y="-31" width="100" height="31"/>
    <path class="n" fill="#4a5d70" d="M-66.6 -6 L30.6 -6 L30.6 -1.4 L-66.6 -1.4 Z"/>
    <path class="t" style="stroke:#4a5d70;stroke-width:1.4" d="M-46 -27 L-46 -8 M-8 -27 L-8 -8"/>
    <!-- buttons on the sloping top -->
    <circle class="o" style="stroke-width:1.4" fill="#3fae6a" cx="-54" cy="-35.4" r="2.2"/>
    <circle class="o" style="stroke-width:1.4" fill="#e8731c" cx="-47" cy="-35.4" r="2.2"/>
    <circle class="o" style="stroke-width:1.4" fill="#f4f4f0" cx="-40" cy="-35.4" r="2.2"/>
    <rect class="o" style="stroke-width:1.4" fill="#ffd21f" x="-26" y="-37.6" width="10" height="4" rx="1"/>
    <rect class="o" style="stroke-width:1.4" fill="#1d2a3a" x="8" y="-37.6" width="12" height="4" rx="1"/>
    <!-- the empty socket where the joystick was, a torn wire sticking out -->
    <ellipse class="o" style="stroke-width:1.6" fill="#2b2b2b" cx="24" cy="-35.4" rx="3.4" ry="1.6"/>
    <path class="t" style="stroke:#e8731c;stroke-width:1.4" d="M24 -36 Q26 -40 24.6 -43"/>
    <!-- the emblem on the front: a wave with a small anchor -->
    <path class="t" style="stroke:#f4f4f0;stroke-width:2" d="M-27 -26 L-27 -16 M-30.6 -23 L-23.4 -23 M-31.6 -18.6 Q-27 -14 -22.4 -18.6"/>
    <path class="t" style="stroke:#f4f4f0;stroke-width:2" d="M-36 -11 Q-32 -14 -28 -11 Q-24 -8 -20 -11 Q-16 -14 -12 -11"/>
    <!-- a coffee cup somebody left, with a ring under it -->
    <path class="o" style="stroke-width:1.8" fill="#f4f4f0" d="M-2 -46 L6 -46 L5 -39.6 L-1 -39.6 Z"/>
    <path class="n" fill="#1f8a4c" d="M-1.6 -44 L5.6 -44 L5.4 -42.4 L-1.4 -42.4 Z"/>
  </g>

  <!-- The line on the graph: it grows, and it only goes up. Joint at its left end. -->
  <g id="graph" data-parent="desk" transform="translate(-11 -53)">
    <g transform="translate(11 53)">
      <path fill="none" stroke="#7ad65a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M-11 -53 L-5 -58 L0 -56 L5 -65 L10 -72"/>
      <path class="n" fill="#7ad65a" d="M7.6 -73.6 L11.6 -74 L11 -70 Z"/>
    </g>
  </g>

  <!-- A: in the office chair, feet up on the desk, a mug of bakkie pleur. Joint at the seat. -->
  <g id="a_body" transform="translate(-86 -36)">
    <g transform="translate(86 36)">
      <!-- the chair: five-star base on castors, seat, a backrest tipped back -->
      <path class="t" style="stroke-width:3" d="M-100 -4 L-72 -4 M-86 -4 L-86 -30"/>
      <circle class="o" style="stroke-width:1.6" fill="#2b2b2b" cx="-99" cy="-2.6" r="2.6"/>
      <circle class="o" style="stroke-width:1.6" fill="#2b2b2b" cx="-86" cy="-2.6" r="2.6"/>
      <circle class="o" style="stroke-width:1.6" fill="#2b2b2b" cx="-73" cy="-2.6" r="2.6"/>
      <path class="o" fill="#2b2b2b" d="M-106 -76 Q-112 -74 -110 -66 L-100 -36 L-92 -38 L-100 -72 Q-101 -78 -106 -76 Z"/>
      <rect class="o" fill="#3b3b3b" x="-100" y="-38" width="28" height="7" rx="2.6"/>
      <!-- the legs, out along the desk, boots up on it -->
      <path class="o" fill="#2c3e66" d="M-90 -34 L-66 -42 L-62 -50 L-86 -48 Z"/>
      <path class="o" fill="#2c3e66" d="M-68 -50 L-48 -50 L-48 -42 L-66 -42 Z"/>
      <!-- the boot, heel on the desk, toe up, the sole to us -->
      <path class="o" fill="#3a3a3a" d="M-52 -42 L-50 -54 Q-49 -60 -44 -60 L-41 -60 L-40 -42 Z"/>
      <path class="o" style="stroke-width:2" fill="#c9934f" d="M-41 -61 L-37 -61 Q-36 -52 -37 -42 L-41 -42 Z"/>
      <path class="t" style="stroke:#8a5a2e;stroke-width:1.2" d="M-40.6 -57 L-37.2 -57 M-40.6 -53 L-37 -53 M-40.6 -49 L-37 -49 M-40.6 -45 L-37.2 -45"/>
      <path class="t" style="stroke:#9aa4b2;stroke-width:1.1" d="M-47 -56 L-43 -55 M-48 -52 L-43.6 -51"/>
      <!-- the body, leaning back: navy shirt, sleeves rolled, a belly -->
      <path class="o" fill="#2c3e66" d="M-98 -36 Q-104 -54 -102 -66 Q-96 -74 -86 -72 Q-74 -66 -72 -50 Q-72 -40 -80 -36 Z"/>
      <path class="n" fill="#3d5288" d="M-80 -38 Q-74 -44 -75 -54 Q-72 -46 -74 -40 Z"/>
      <path class="o" style="stroke-width:1.6" fill="#f4f4f0" d="M-93 -72 L-88 -64 L-84 -71.4 Z"/>
      <circle class="n" fill="#f4f4f0" cx="-80" cy="-56" r="1.2"/>
      <circle class="n" fill="#f4f4f0" cx="-78" cy="-48" r="1.2"/>
    </g>
  </g>

  <g id="a_head" data-parent="a_body" transform="translate(-91 -72)">
    <g transform="translate(91 72)">
      <rect class="o" style="stroke-width:2" fill="#e0a07c" x="-95" y="-76" width="8" height="6" rx="1.5"/>
      <circle class="o" fill="#efc09a" cx="-91" cy="-86" r="12.4"/>
      <!-- bald on top, a grey horseshoe round the back -->
      <path class="o" style="stroke-width:2" fill="#c9c4b8" d="M-103.4 -84 Q-104 -94 -99 -96 Q-98 -88 -96 -82 Q-98 -78 -103.4 -84 Z"/>
      <path class="n" fill="#ffffff" d="M-92 -96.6 Q-86 -98 -82 -94 Q-87 -95 -91 -94.4 Z"/>
      <ellipse class="o" style="stroke-width:1.8" fill="#efc09a" cx="-98" cy="-85" rx="2.6" ry="3.6"/>
      <!-- eyes shut, content -->
      <path class="t" style="stroke-width:1.8" d="M-87 -88 Q-84.6 -86 -82 -88"/>
      <ellipse class="o" style="stroke-width:1.8" fill="#e0866a" cx="-78.6" cy="-83.4" rx="3" ry="2.6"/>
      <!-- the moustache -->
      <path class="o" style="stroke-width:1.8" fill="#c9c4b8" d="M-88 -80 Q-84 -83 -78 -80 Q-77 -76 -81 -77 Q-84 -78 -86 -76 Q-89 -76 -88 -80 Z"/>
    </g>
  </g>

  <!-- His arm with the mug. Joint at the shoulder. -->
  <g id="a_arm" data-parent="a_body" transform="translate(-90 -66)">
    <g transform="translate(90 66)">
      <path class="o" fill="#2c3e66" d="M-94 -69 Q-87 -72 -85 -66 L-88 -58 L-95 -61 Q-97 -66 -94 -69 Z"/>
      <path class="o" fill="#3d5288" d="M-96 -61.4 L-87.4 -58.4 L-89.4 -53.4 L-97.6 -56.6 Z"/>
      <path class="o" fill="#efc09a" d="M-96 -55 L-89 -54 L-80 -62 L-84 -66 Z"/>
      <!-- the mug, white with a green band, steaming -->
      <path class="o" style="stroke-width:2" fill="none" d="M-74 -70 Q-70 -70 -70 -66 Q-70 -62 -74 -62"/>
      <path class="o" style="stroke-width:2" fill="#f4f4f0" d="M-84 -73 L-74 -73 L-75 -60 L-83 -60 Z"/>
      <path class="n" fill="#1f8a4c" d="M-83.4 -68 L-74.4 -68 L-74.6 -65.4 L-83.2 -65.4 Z"/>
      <ellipse class="o" style="stroke-width:1.8" fill="#efc09a" cx="-83" cy="-64" rx="3.4" ry="3.4"/>
      <path fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" d="M-80 -76 Q-82 -79 -80 -82 M-77 -77 Q-75 -80 -77 -83"/>
    </g>
  </g>

  <!-- C: the young one in hi-vis, standing, the joystick he just pulled out of the desk. Joint at his feet. -->
  <g id="c_body" transform="translate(66 0)">
    <g transform="translate(-66 0)">
      <path class="o" fill="#2b2b2b" d="M57 -5 L57 0 L68 0 Q69 -4 65 -5 Z M66 -5 L66 0 L77 0 Q78 -4 74 -5 Z"/>
      <path class="n" fill="#c9934f" d="M64 -4.4 Q67.6 -3.8 67.8 -1 L64 -1 Z M73 -4.4 Q76.6 -3.8 76.8 -1 L73 -1 Z"/>
      <path class="o" fill="#2c3e66" d="M57 -42 L75 -42 L74 -5 L67 -5 L66 -30 L65 -5 L58 -5 Z"/>
      <path class="o" fill="#2c3e66" d="M55 -40 Q53 -60 57 -68 Q65 -72 73 -68 Q77 -60 75.4 -40 Z"/>
      <path class="o" fill="#e3ec3a" d="M56 -41 Q54.6 -58 57.6 -66 L62 -68 L66 -58 L70 -68 L73 -66 Q76 -58 74.6 -41 Z"/>
      <path class="o" style="stroke-width:1.4" fill="#e6ecef" d="M55.6 -52 L75 -52 L75 -49 L55.6 -49 Z"/>
    </g>
  </g>

  <g id="c_head" data-parent="c_body" transform="translate(66 -70)">
    <g transform="translate(-66 70)">
      <rect class="o" style="stroke-width:2" fill="#e0a07c" x="62.6" y="-74" width="7" height="6" rx="1.5"/>
      <circle class="o" fill="#f2c4a4" cx="66" cy="-83" r="11.6"/>
      <ellipse class="o" style="stroke-width:1.8" fill="#f2c4a4" cx="58.6" cy="-82" rx="2.6" ry="3.6"/>
      <!-- a green cap, worn backwards -->
      <path class="o" fill="#1f8a4c" d="M54.6 -86 Q54 -97 66 -97 Q77.6 -97 77.6 -87 Q66 -90 54.6 -86 Z"/>
      <path class="o" style="stroke-width:2" fill="#13603a" d="M55.4 -88 L47 -86 Q46 -84 48 -83.4 L55 -85 Z"/>
      <!-- wide eyes, tongue out with effort -->
      <circle class="o" style="stroke-width:1.4" fill="#ffffff" cx="72" cy="-83" r="3.2"/>
      <circle class="n" fill="#2b1b16" cx="73.4" cy="-82.6" r="1.5"/>
      <path class="t" style="stroke-width:1.8" d="M69 -88.6 L75 -89.6"/>
      <path class="o" style="stroke-width:1.8" fill="#f2c4a4" d="M76.6 -82 Q80.6 -78.4 77 -76.6"/>
      <path class="o" style="stroke-width:1.6" fill="#7a2a20" d="M69 -75.6 Q73 -73 77 -76 Q73 -76.6 69 -75.6 Z"/>
      <path class="o" style="stroke-width:1.2" fill="#e8786a" d="M73 -75.4 Q74.6 -71.6 76.4 -74.4 Z"/>
    </g>
  </g>

  <!-- His throwing arm, sleeve rolled up. Joint at the shoulder. -->
  <g id="c_arm" data-parent="c_body" transform="translate(73 -64)">
    <g transform="translate(-73 64)">
      <path class="o" fill="#2c3e66" d="M70 -68 Q77 -71 79 -64 L80 -58 L72 -56 Q68 -62 70 -68 Z"/>
      <path class="o" fill="#4b64a0" d="M71 -58.6 L80.6 -60.4 L81.6 -54.4 L72 -52.6 Z"/>
      <path class="o" fill="#f2c4a4" d="M74 -54 L81 -55.4 L89 -62 L86 -66.6 Z"/>
    </g>
    <circle data-mount="muzzle" fill="none" cx="18" cy="-10" r="1"/>
  </g>

  <!-- The joystick in his fist, its cable torn off. Joint at his fist. -->
  <g id="c_stick" data-parent="c_arm" transform="translate(88 -64)">
    <g transform="translate(-88 64)">
      <path class="t" style="stroke-width:3.2" d="M83 -60 Q80 -56 82 -52"/>
      <path fill="none" stroke="#3b4656" stroke-width="1.4" stroke-linecap="round" d="M83 -60 Q80 -56 82 -52"/>
      <path class="o" style="stroke-width:2" fill="#3b4656" d="M82 -63 L95 -63 L96 -58 L81 -58 Z"/>
      <path class="t" style="stroke-width:4.4" d="M89 -63 L91 -72"/>
      <path fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" d="M89 -63 L91 -72"/>
      <path class="o" style="stroke-width:2" fill="#1d2a3a" d="M87.6 -71 Q87 -78.6 91.6 -78.6 Q96 -78.4 95 -71.4 Q91.4 -69.8 87.6 -71 Z"/>
      <ellipse class="o" style="stroke-width:1.2" fill="#e8731c" cx="91.4" cy="-78" rx="2" ry="1.1"/>
      <!-- his fist round the base -->
      <ellipse class="o" style="stroke-width:2" fill="#f2c4a4" cx="88" cy="-62" rx="4.4" ry="4"/>
    </g>
  </g>

  <!-- B's other hand, a paper cup of coffee. Joint at her shoulder. -->
  <g id="b_cup" data-parent="b_body" transform="translate(40 -65)">
    <g transform="translate(-40 65)">
      <path class="o" fill="#1f8a4c" d="M37 -68 Q44 -70 45 -63 L45 -59 L38 -58 Q35 -63 37 -68 Z"/>
      <path class="o" fill="#d9a07a" d="M39 -59 L45 -60 L49 -52 L44 -50 Z"/>
      <path class="o" style="stroke-width:2" fill="#f4f4f0" d="M43 -63 L52 -63 L51 -52 L44 -52 Z"/>
      <path class="o" style="stroke-width:1.6" fill="#3b4656" d="M42.4 -65.6 L52.6 -65.6 L52.6 -63 L42.4 -63 Z"/>
      <path class="n" fill="#e8731c" d="M43.8 -59 L51.4 -59 L51.2 -56.4 L44 -56.4 Z"/>
      <ellipse class="o" style="stroke-width:1.8" fill="#d9a07a" cx="46" cy="-53.6" rx="3.4" ry="3"/>
    </g>
  </g>
</svg>
