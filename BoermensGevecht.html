ren.`,"ah.1975.special":`Boerenrock op de platte wagen: zeven tellen lang slaat en loopt alles harder.`,"ah.2025.light":`Snel, goedkoop, rijdt je zo van de sokken.`,"ah.2025.ranged":`Stuurt zijn spuitdrone eropaf.`,"ah.2025.heavy":`Megatrekker met giertank. Raakt alles wat in de weg staat.`,"ah.2025.turret":`Opa, moeke en de jongste. Overal tegen, en ze gooien met eieren.`,"ah.2025.special":`Een stoet trekkers dendert over de baan en raakt iedereen.`,"ah.2050.light":`Zelf gelast exoskelet van trekkeronderdelen. Mept voor tien.`,"ah.2050.ranged":`Vogelverschrikker met laserogen. Geen kraai die nog durft.`,"ah.2050.heavy":`Zelfrijdende combine. Vreet alles op wat voor de haspel komt.`,"ah.2050.turret":`Robotkoe in de melkstal. Spuit melk onder hoge druk.`,"ah.2050.special":`Tien drones duiken een voor een op de voorste vijand.`},era:{"hm.1975":`Jaren '70`,"ah.1975":`Jaren '70`,"hm.2025":`Jaren '20`,"ah.2025":`Jaren '20`,"hm.2050":`De toekomst`,"ah.2050":`De toekomst`},hud:{special:`Speciaal`,eraUp:`Moderniseren`,subsidy:`Subsidie`,perSecond:`/s`,subsidyMax:`meer zit er niet in`,turretHow:{build:`bouwen`,replace:`oude vervangen`,upgrade:`verbeteren`},turretMax:`beter wordt het niet`,paused:`Pauze`,resume:`Spatie om verder te gaan`,overtime:`Overtijd! Beide bases brokkelen af`},shout:{subsidy:`Subsidie toegekend!`,upgraded:`Verbeterd!`,cancelled:`Gecanceld!`,healed:`Opgeknapt!`,modern:`Gemoderniseerd:`},sound:{all:`Muziek en geluid aan (M)`,effects:`Alleen geluidseffecten (M)`,off:`Geluid uit (M)`},refuse:{gold:`Te weinig subsidie`,queue:`Opleiding zit vol`,turret:`Beter wordt het niet`,special:`Nog niet klaar`,progress:`Nog niet genoeg vooruitgang`,subsidy:`Meer subsidie zit er niet in`,lastEra:`Moderner bestaat niet`},start:{go:`Druk op Enter om te beginnen`,left:`Linker speler`,right:`Rechter speler`,pause:`Spatie = pauze, M = muziek of geluid uit`,goal:`Sloop de basis van de ander. Wie in de overtijd de minste schade heeft, wint.`,subsidy:{name:`Subsidie aanvragen`,
