# Puts the game online at https://jobberkhout.github.io/BoermensGevecht/ on every push to main.
# The site is the committed single file, BoermensGevecht.html, as its front page, plus what makes
# it an app on a phone (pages/). Nothing is built here: `npm test` already makes sure the single
# file on main is up to date with the source.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Put the site together
        run: |
          mkdir site
          cp BoermensGevecht.html site/index.html
          cp pages/manifest.webmanifest pages/sw.js pages/icon-192.png pages/icon-512.png pages/icon.svg site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
